# Every test in the repo (tools/run_tests.py) on every push and pull
# request -- on Windows with Python 3.12, as the broadcast PC runs them.
#
# This reports; it does not yet hold a deploy back. The relay's deploy
# webhook still pulls main on every push. Gating that on this job is the
# next step (see docs/ROADMAP.md).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ocr/requirements.txt
            ocr/relay/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python packages (pinned)
        run: pip install -r ocr/requirements.txt -r ocr/relay/requirements.txt
      - name: jsdom, for the dashboard's navigation test
        run: npm install --no-save --no-audit --no-fund jsdom@24.1.0
      - name: All tests
        run: python tools/run_tests.py

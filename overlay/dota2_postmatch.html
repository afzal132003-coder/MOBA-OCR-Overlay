<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dota 2 Post Match Overlay</title>
<style>
  /*
    Background is assets/dota2_postmatch_blank.png, exported straight from
    the postmach-dota2.psd the operator supplied -- a 10-row grid (5 per
    team), each row already carrying baked "KDA / NET WORTH / DAMAGE"
    caption labels at exact positions measured out of that PSD (see the
    ROWS table below, values are the PSD's own layer bboxes, not guesses).
    Only the header (team logo/name/score/duration) and the character-photo
    slots are NOT in the PSD -- those positions are this file's own design
    choice, flagged in the Graphic Fixing tab as needing nudging more than
    the PSD-exact grid does.

    Row layout, left-to-right within each row's own 902px-wide box:
      team1 (left col):  [photo+IGN 288px] [KDA] [NET WORTH] [DAMAGE]
      team2 (right col): [KDA] [NET WORTH] [DAMAGE] [photo+IGN 283px]
    -- mirrored so each team's own portrait sits at the OUTER edge of the
    canvas, stats toward the center, matching the operator's own layout
    description.
  */
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-ExtraBold.ttf') format('truetype');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Black.ttf') format('truetype');
    font-weight: 900; font-style: normal;
  }

  :root{ --gold:#f3cd93; --white:#ffffff; }
  html,body{ margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px; font-family:'TT Supermolot Neue Trial', Arial, sans-serif; }

  #stage{ position:relative; width:1920px; height:1080px; opacity:0;
    transform:translateY(16px); animation: enter 0.6s ease forwards; }
  @keyframes enter{ to{ opacity:1; transform:translateY(0);} }

  .bg-frame{ position:absolute; top:0; left:0; width:1920px; height:1080px; pointer-events:none; }

  /* ---- header (this file's own design -- not in the PSD) ---- */
  .header-logo{ position:absolute; top:73px; width:140px; height:129px;
    object-fit:contain; display:none; }
  #logo-left{ left:62px; }
  #logo-right{ left:1718px; }

  .team-name{ position:absolute; top:110px; width:400px; height:30px;
    display:flex; align-items:center; color:var(--white); font-weight:800;
    font-size:22px; text-transform:uppercase; letter-spacing:0.4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #name-left{ left:240px; justify-content:flex-start; }
  #name-right{ left:1280px; justify-content:flex-end; }

  .team-score{ position:absolute; top:95px; width:110px; height:52px;
    display:flex; align-items:center; color:var(--gold); font-weight:900; font-size:42px; }
  #score-left{ left:790px; justify-content:flex-end; }
  #score-right{ left:1020px; justify-content:flex-start; }

  #pom-duration{ position:absolute; left:900px; top:155px; width:120px; height:20px;
    display:flex; align-items:center; justify-content:center;
    color:var(--white); opacity:0.75; font-weight:700; font-size:13px; letter-spacing:0.5px; }

  /* ---- the 10-row grid (PSD-exact) ---- */
  .d2-row{ position:absolute; width:902px; height:145px; }
  #team1-rows{ position:absolute; top:0; left:53px; }
  #team2-rows{ position:absolute; top:0; left:968px; }

  .d2-val{ position:absolute; top:95px; height:40px;
    display:flex; align-items:center; color:var(--white); font-weight:800; font-size:24px; }
  .d2-kda{ left:288px; width:90px; }
  .d2-networth{ left:380px; width:155px; }
  .d2-damage.team1{ left:537px; width:200px; }
  .d2-damage.team2{ left:537px; width:82px; }

  /* ---- character photo + IGN caption (this file's own design) ----
     Photo fills the row's full height; the IGN caption is a bar overlaid
     at the TOP of the photo (not the bottom, per the operator's layout),
     semi-transparent so it reads over any portrait. object-position/scale
     defaults below are tuned against the steamstatic hero renders actually
     in overlay/assets/dota2_heroes/ (consistent square, full-body, head in
     the upper third) -- same "default framing + per-element override via
     Graphic Fixing" approach Valorant's own character slots use, rather
     than hand-pre-cropping each of the 127 portraits. */
  .d2-photo-wrap{ position:absolute; top:0; width:288px; height:145px; overflow:hidden; }
  #team1-rows .d2-photo-wrap{ left:0; }
  #team2-rows .d2-photo-wrap{ left:619px; width:283px; }
  .d2-photo-wrap img{ width:100%; height:100%; object-fit:cover; object-position:50% 8%;
    display:none; transform-origin:center 8%; animation:d2PhotoFloat 5s ease-in-out infinite; }
  @keyframes d2PhotoFloat{
    0%,100%{ transform:scale(1.18) translateY(2px) rotate(-0.4deg); }
    50%{ transform:scale(1.18) translateY(-2px) rotate(0.4deg); }
  }
  .d2-ign{ position:absolute; top:0; left:0; right:0; padding:5px 8px;
    background:rgba(6,9,22,0.72); color:var(--white); font-weight:700; font-size:13px;
    text-transform:uppercase; letter-spacing:0.3px; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; display:none; }
</style>
</head>
<body>
<div id="stage">
  <img class="bg-frame" src="assets/dota2_postmatch_blank.png" alt="">

  <img class="header-logo" id="logo-left" alt="">
  <img class="header-logo" id="logo-right" alt="">
  <div class="team-name" id="name-left"></div>
  <div class="team-name" id="name-right"></div>
  <div class="team-score" id="score-left">0</div>
  <div class="team-score" id="score-right">0</div>
  <div id="pom-duration">00:00</div>

  <div id="team1-rows"></div>
  <div id="team2-rows"></div>
</div>

<script>
const ROW_Y = [223, 377, 529, 684, 836];

const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("dota2_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("dota2_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("dota2_relay") || "";
const _token = _params.get("token") || localStorage.getItem("dota2_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=dota2_postmatch"
  : "ws://localhost:8766";
let ws;

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") applyState(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function setText(id, value){
  const el = document.getElementById(id);
  if(el && el.textContent !== String(value)) el.textContent = value;
}

function fmt(n){
  return n == null ? "0" : Number(n).toLocaleString();
}

function buildRows(containerId, side){
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  for(let i=0;i<5;i++){
    const row = document.createElement("div");
    row.className = "d2-row";
    row.style.top = ROW_Y[i] + "px";
    row.innerHTML = `
      <div class="d2-photo-wrap">
        <img id="${side}-${i}-photo" alt="">
        <div class="d2-ign" id="${side}-${i}-ign"></div>
      </div>
      <div class="d2-val d2-kda" id="${side}-${i}-kda">—</div>
      <div class="d2-val d2-networth" id="${side}-${i}-networth">—</div>
      <div class="d2-val d2-damage ${side === "team1" ? "team1" : "team2"}" id="${side}-${i}-damage">—</div>
    `;
    container.appendChild(row);
  }
}

function renderTeamRows(team, roster, pomPlayers){
  const heroes = (roster && roster.heroes) || [];
  const players = (roster && roster.players) || [];
  for(let i=0;i<5;i++){
    const prefix = `${team}-${i}`;
    const p = (pomPlayers && pomPlayers[i]) || {};

    setText(`${prefix}-kda`, p.kdaText || "—");
    setText(`${prefix}-networth`, p.networth != null ? fmt(p.networth) : "—");
    setText(`${prefix}-damage`, p.damage != null ? fmt(p.damage) : "—");

    const photo = document.getElementById(`${prefix}-photo`);
    const ign = document.getElementById(`${prefix}-ign`);
    const slug = heroes[i];
    if(slug){
      photo.src = `assets/dota2_heroes/${encodeURIComponent(slug)}.png`;
      photo.style.display = "block";
      photo.onerror = () => { photo.style.display = "none"; };
    } else {
      photo.style.display = "none";
    }
    const name = (p.name || players[i] || "");
    setText(`${prefix}-ign`, name);
    ign.style.display = name ? "block" : "none";
  }
}

function applyState(state){
  const pom = state.postMatch;

  setText("name-left", (state.team1 && state.team1.name) || "TEAM 1");
  setText("name-right", (state.team2 && state.team2.name) || "TEAM 2");
  setText("score-left", pom ? (pom.team1Score ?? 0) : 0);
  setText("score-right", pom ? (pom.team2Score ?? 0) : 0);
  setText("pom-duration", (pom && pom.duration) || "00:00");

  const logoLeft = document.getElementById("logo-left");
  const logoRight = document.getElementById("logo-right");
  if(state.team1 && state.team1.logo){ logoLeft.src = state.team1.logo; logoLeft.style.display = "block"; }
  else logoLeft.style.display = "none";
  if(state.team2 && state.team2.logo){ logoRight.src = state.team2.logo; logoRight.style.display = "block"; }
  else logoRight.style.display = "none";

  const pomPlayers = pom && pom.players ? pom.players : {team1: [], team2: []};
  renderTeamRows("team1", state.team1, pomPlayers.team1);
  renderTeamRows("team2", state.team2, pomPlayers.team2);

  applyGraphicOverrides(state.graphicOverrides && state.graphicOverrides.postmatch, DOTA2_GFX_ELEMENT_IDS);
}

// Per-element position/scale nudges saved from the dashboard's Graphic
// tab -- purely additive on top of each element's base CSS position/size.
function applyGraphicOverrides(overrides, elementIds){
  (elementIds || []).forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const o = (overrides && overrides[id]) || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    el.style.transformOrigin = "top left";
  });
}

const DOTA2_GFX_ELEMENT_IDS = [
  "logo-left", "logo-right", "name-left", "name-right",
  "score-left", "score-right", "pom-duration",
];

buildRows("team1-rows", "team1");
buildRows("team2-rows", "team2");
connect();
</script>
</body>
</html>

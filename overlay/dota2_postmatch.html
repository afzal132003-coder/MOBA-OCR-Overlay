<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dota 2 Post Match Overlay</title>
<style>
  /*
    Background is assets/dota2_postmatch_blank.png -- the operator's own
    "post match_gt - BLANK.png" (truly transparent, RGBA alpha=0 outside
    the cards, ~38% black on the row cards themselves), replacing the
    earlier opaque navy export. Row geometry is IDENTICAL to that earlier
    PSD (measured again directly off this file's alpha channel to confirm:
    same 63-212 header band, same 5 rows at y=223/377/529/684/836) -- only
    the fill became transparent, so the ROW_Y table and the KDA/NET
    WORTH/DAMAGE label x-positions below still apply unchanged.

    Per-row content, measured off "post match_gt - REFRENCE.png" (the
    operator's filled-in mock): value sits ABOVE its caption (not below,
    which is what the very first version of this file did), and PLAYER
    NAME is its own line below the caption row, left-aligned under KDA --
    not a caption overlaid on the photo. The character render is NOT
    cropped to a headshot here -- object-fit:contain shows the whole
    figure, in a box a little taller than the row so it can overflow
    slightly top/bottom the way the reference mock shows.

    Row layout, left-to-right within each row's own 902px-wide box:
      team1 (left col):  [photo 220px] [KDA] [NET WORTH] [DAMAGE]
      team2 (right col): [KDA] [NET WORTH] [DAMAGE] [photo 220px]
    -- mirrored so each team's own portrait sits at the OUTER edge of the
    canvas, stats toward the center.

    Header: team logo/name are this file's own design (not in the
    template). Two separate scores -- pom-score-small is the OCR'd
    per-game score (team1Score/team2Score, small text above), match-score
    is a manually-typed Bo3/Bo5 series tally (no OCR source for it at all,
    entered in the dashboard's Post-Match tab) shown big and central,
    matching the reference mock's "13-26" small / "2 - 0" big pairing.
  */
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-ExtraBold.ttf') format('truetype');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Black.ttf') format('truetype');
    font-weight: 900; font-style: normal;
  }

  :root{ --gold:#f3cd93; --white:#ffffff; }
  html,body{ margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px; font-family:'TT Supermolot Neue Trial', Arial, sans-serif; }

  #stage{ position:relative; width:1920px; height:1080px; opacity:0;
    transform:translateY(16px); animation: enter 0.6s ease forwards; }
  @keyframes enter{ to{ opacity:1; transform:translateY(0);} }

  .bg-frame{ position:absolute; top:0; left:0; width:1920px; height:1080px; pointer-events:none; }

  /* ---- header (this file's own design -- not in the template) ---- */
  .header-logo{ position:absolute; top:73px; width:140px; height:129px;
    object-fit:contain; display:none; }
  #logo-left{ left:62px; }
  #logo-right{ left:1718px; }

  .team-name{ position:absolute; top:108px; width:400px; height:56px;
    display:flex; align-items:center; color:var(--gold); font-weight:900;
    font-style:italic; font-size:40px; text-transform:uppercase; letter-spacing:0.4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #name-left{ left:243px; justify-content:flex-start; }
  #name-right{ left:1275px; justify-content:flex-end; }

  #pom-score-small{ position:absolute; left:900px; top:76px; width:120px; height:20px;
    display:flex; align-items:center; justify-content:center;
    color:var(--white); opacity:0.8; font-weight:700; font-style:italic; font-size:15px; letter-spacing:0.5px; }

  #match-score{ position:absolute; left:833px; top:100px; width:252px; height:56px;
    display:flex; align-items:center; justify-content:center;
    color:var(--gold); font-weight:900; font-style:italic; font-size:46px; letter-spacing:1px; }

  #pom-duration{ position:absolute; left:900px; top:170px; width:120px; height:20px;
    display:flex; align-items:center; justify-content:center;
    color:var(--white); opacity:0.75; font-weight:700; font-size:13px; letter-spacing:0.5px; }

  /* ---- the 10-row grid (positions measured off the template's alpha
     channel -- unchanged from the earlier PSD) ---- */
  .d2-row{ position:absolute; width:902px; height:145px; }
  #team1-rows{ position:absolute; top:0; left:53px; }
  #team2-rows{ position:absolute; top:0; left:968px; }

  /* Value sits ABOVE the baked caption (caption band is relative y77-90);
     player name sits BELOW it. */
  .d2-val{ position:absolute; top:38px; height:36px;
    display:flex; align-items:center; color:var(--white); font-weight:800; font-size:26px; }
  .d2-kda{ left:288px; width:100px; }
  .d2-networth{ left:380px; width:155px; }
  .d2-damage.team1{ left:537px; width:200px; }
  .d2-damage.team2{ left:537px; width:82px; }

  .d2-playername{ position:absolute; top:92px; left:288px; width:270px; height:36px;
    display:flex; align-items:center; color:var(--gold); font-weight:700; font-style:italic;
    font-size:19px; text-transform:uppercase; letter-spacing:0.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---- character render (this file's own design) ----
     Shown whole via object-fit:contain (not a headshot crop) -- the
     reference mock shows the full creature/mount, not a cropped face --
     in a box a little taller than the row so it can bleed past the row's
     own top/bottom edge the way that mock does. */
  .d2-photo-wrap{ position:absolute; top:-14px; width:220px; height:173px; overflow:visible; }
  #team1-rows .d2-photo-wrap{ left:-6px; }
  #team2-rows .d2-photo-wrap{ left:668px; }
  .d2-photo-wrap img{ width:100%; height:100%; object-fit:contain; object-position:50% 100%;
    display:none; transform-origin:center bottom; animation:d2PhotoFloat 5s ease-in-out infinite; }
  @keyframes d2PhotoFloat{
    0%,100%{ transform:translateY(2px) rotate(-0.4deg); }
    50%{ transform:translateY(-2px) rotate(0.4deg); }
  }
</style>
</head>
<body>
<div id="stage">
  <img class="bg-frame" src="assets/dota2_postmatch_blank.png" alt="">

  <img class="header-logo" id="logo-left" alt="">
  <img class="header-logo" id="logo-right" alt="">
  <div class="team-name" id="name-left"></div>
  <div class="team-name" id="name-right"></div>
  <div id="pom-score-small">0 - 0</div>
  <div id="match-score"></div>
  <div id="pom-duration">00:00</div>

  <div id="team1-rows"></div>
  <div id="team2-rows"></div>
</div>

<script>
const ROW_Y = [223, 377, 529, 684, 836];

const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("dota2_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("dota2_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("dota2_relay") || "";
const _token = _params.get("token") || localStorage.getItem("dota2_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=dota2_postmatch"
  : "ws://localhost:8766";
let ws;

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") applyState(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function setText(id, value){
  const el = document.getElementById(id);
  if(el && el.textContent !== String(value)) el.textContent = value;
}

function fmt(n){
  return n == null ? "0" : Number(n).toLocaleString();
}

function buildRows(containerId, side){
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  for(let i=0;i<5;i++){
    const row = document.createElement("div");
    row.className = "d2-row";
    row.style.top = ROW_Y[i] + "px";
    row.innerHTML = `
      <div class="d2-photo-wrap">
        <img id="${side}-${i}-photo" alt="">
      </div>
      <div class="d2-val d2-kda" id="${side}-${i}-kda">—</div>
      <div class="d2-val d2-networth" id="${side}-${i}-networth">—</div>
      <div class="d2-val d2-damage ${side === "team1" ? "team1" : "team2"}" id="${side}-${i}-damage">—</div>
      <div class="d2-playername" id="${side}-${i}-ign"></div>
    `;
    container.appendChild(row);
  }
}

function renderTeamRows(team, roster, pomPlayers){
  const heroes = (roster && roster.heroes) || [];
  const players = (roster && roster.players) || [];
  for(let i=0;i<5;i++){
    const prefix = `${team}-${i}`;
    const p = (pomPlayers && pomPlayers[i]) || {};

    setText(`${prefix}-kda`, p.kdaText || "—");
    setText(`${prefix}-networth`, p.networth != null ? fmt(p.networth) : "—");
    setText(`${prefix}-damage`, p.damage != null ? fmt(p.damage) : "—");

    const photo = document.getElementById(`${prefix}-photo`);
    const slug = heroes[i];
    if(slug){
      photo.src = `assets/dota2_heroes/${encodeURIComponent(slug)}.png`;
      photo.style.display = "block";
      photo.onerror = () => { photo.style.display = "none"; };
    } else {
      photo.style.display = "none";
    }
    setText(`${prefix}-ign`, p.name || players[i] || "");
  }
}

function applyState(state){
  const pom = state.postMatch;

  setText("name-left", (state.team1 && state.team1.name) || "TEAM 1");
  setText("name-right", (state.team2 && state.team2.name) || "TEAM 2");
  setText("pom-score-small", `${pom ? (pom.team1Score ?? 0) : 0} - ${pom ? (pom.team2Score ?? 0) : 0}`);
  setText("match-score", state.matchScore || "");
  setText("pom-duration", (pom && pom.duration) || "00:00");

  const logoLeft = document.getElementById("logo-left");
  const logoRight = document.getElementById("logo-right");
  if(state.team1 && state.team1.logo){ logoLeft.src = state.team1.logo; logoLeft.style.display = "block"; }
  else logoLeft.style.display = "none";
  if(state.team2 && state.team2.logo){ logoRight.src = state.team2.logo; logoRight.style.display = "block"; }
  else logoRight.style.display = "none";

  const pomPlayers = pom && pom.players ? pom.players : {team1: [], team2: []};
  renderTeamRows("team1", state.team1, pomPlayers.team1);
  renderTeamRows("team2", state.team2, pomPlayers.team2);

  applyGraphicOverrides(state.graphicOverrides && state.graphicOverrides.postmatch, DOTA2_GFX_ELEMENT_IDS);
}

// Per-element position/scale nudges saved from the dashboard's Graphic
// tab -- purely additive on top of each element's base CSS position/size.
// A handful of ids (logo/name/score/duration) are single elements; the
// stat grid instead uses GROUP keys ("team1-kda" etc.) that fan out to all
// 5 rows at once, since the grid repeats identically per row and nudging
// one row at a time isn't what an operator actually wants -- moving "the
// KDA column" should move all 5 KDA cells together.
const DOTA2_GFX_GROUPS = {};
["team1", "team2"].forEach(team => {
  ["kda", "networth", "damage", "photo", "ign"].forEach(field => {
    DOTA2_GFX_GROUPS[`${team}-${field}`] = [0, 1, 2, 3, 4].map(i => `${team}-${i}-${field}`);
  });
});

function applyGraphicOverrides(overrides, elementIds){
  (elementIds || []).forEach(key => {
    const o = (overrides && overrides[key]) || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    const targets = DOTA2_GFX_GROUPS[key] || [key];
    targets.forEach(id => {
      const el = document.getElementById(id);
      if(!el) return;
      el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
      el.style.transformOrigin = "top left";
    });
  });
}

const DOTA2_GFX_ELEMENT_IDS = [
  "logo-left", "logo-right", "name-left", "name-right",
  "pom-score-small", "match-score", "pom-duration",
  ...Object.keys(DOTA2_GFX_GROUPS),
];

buildRows("team1-rows", "team1");
buildRows("team2-rows", "team2");
connect();
</script>
</body>
</html>

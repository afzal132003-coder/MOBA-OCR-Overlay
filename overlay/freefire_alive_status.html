<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Fire Alive Status</title>
<style>
  /* The 12-team live side table.
     ---------------------------------------------------------------
     Every number on this graphic comes from the game client's own
     debugger log, not from OCR of the in-game table (or, once
     calibrated, the alive grid's own colour/digit read -- see
     link_live_teams()/apply_alive_grid_identities() in
     freefire_engine.py; both feed liveOps.sidetableRows in the same
     shape, so this page doesn't care which one supplied a given row).

     Geometry below is measured from the CURRENT artwork
     (assets/freefire/<event>/ALIVE STATUS.png, the TEAM/KILLS/STATUS
     design), not eyeballed -- sampled directly from the PNG's own
     pixels. At 1920x1080 the table occupies x 1512..1920, a header
     band, twelve 44px-tall rows on a ~49.3px pitch, and a legend
     footer explaining the STATUS icon (this is the SAME icon set the
     old design used -- Dead.png / 1_alive.png.. 4_alive.png -- just
     moved to sit under the STATUS column instead of a dedicated ALIVE
     column). Row tops are listed exactly as measured rather than
     computed from a pitch, matching the old design's own reasoning:
     the artwork's spacing is not perfectly uniform and drift would
     show by row twelve.

     Font is Gotham, per the graphic package -- not bundled here (no
     @font-face): it's expected to already be installed on the
     machine running the browser source, the same way a licensed font
     normally reaches a design tool without redistributing the file.
     Falls back to Arial if it isn't. */

  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    width: 1920px; height: 1080px;
    font-family: 'Gotham', Arial, sans-serif;
  }

  /* Flies in from off the right edge rather than snapping on.
     ---------------------------------------------------------------
     The table lives at x 1512..1920, hard against the right side, so
     that's the direction it belongs coming from -- anything else reads
     as the panel arriving from nowhere.

     display:none can't be animated, which is why this parks the stage
     OFF-CANVAS instead of hiding it: the default 470px clears the
     table's full 408px width plus the flame overhang, and body already
     has overflow:hidden so nothing of it shows while it's out there.

     The distance is a variable because the panel can now be moved and
     resized (see #frame): a table dragged left of its home position
     needs further to travel, and a fixed 470 would leave part of it
     parked in shot. applyPanelOverride() recomputes it.

     Different easing each way, on purpose. Coming in it overshoots
     very slightly and settles, which reads as deliberate; going out it
     accelerates away without the overshoot, because a graphic being
     pulled should leave promptly rather than linger. Opacity is
     quicker than the slide in both directions so it's never a
     half-faded rectangle mid-travel. */
  #stage {
    position: absolute; inset: 0;
    opacity: 0;
    transform: translateX(var(--ff-fly-out, 470px));
    transition: transform 420ms cubic-bezier(0.55, 0, 0.85, 0.4),
                opacity   260ms ease-in;
    will-change: transform, opacity;
  }
  #stage.show {
    opacity: 1;
    transform: translateX(0);
    transition: transform 640ms cubic-bezier(0.18, 0.96, 0.32, 1),
                opacity   300ms ease-out;
  }

  /* Whole-panel size and placement, set from the dashboard's Graphic
     Fixing tab (Alive: Whole Panel).
     ---------------------------------------------------------------
     It rides on its own wrapper rather than on #stage, because #stage's
     transform is already spoken for by the fly-in/fly-out -- an element
     only gets one transform, and these two change for entirely
     different reasons at entirely different moments.

     The origin is the panel's own right edge and vertical centre
     (1920, 576), taken from the artwork's real bounds: ALIVE STATUS.png
     is a full-frame image whose non-transparent box is x 1512..1920,
     y 247..905. The table lives hard against the right side of frame,
     so making it smaller should keep it pinned there and at the same
     height, not walk it toward the middle of the screen. */
  #frame {
    position: absolute; inset: 0;
    transform-origin: 1920px var(--panel-origin-y);
    will-change: transform;
  }

  #backdrop { position: absolute; inset: 0; width: 1920px; height: 1080px; }

  /* Rows sit above the backdrop image in their own layer. */
  #rows { position: absolute; inset: 0; z-index: 1; }

  /* Each row carries its OWN copy of the box, cropped live out of the
     backdrop artwork (see ROW_STRIP in the script). The boxes are drawn
     into ALIVE STATUS.png, so without this only the text and icons slid
     while the boxes stayed put -- the contents appeared to crawl
     between stationary frames. Painting an identical strip onto the
     moving row covers the static one beneath it exactly, so the whole
     box travels. Needs no new artwork: every row in that PNG is the
     same, so one strip serves all twelve. */
  .row {
    position: absolute;
    height: var(--row-h); left: var(--row-x); width: var(--row-w);
    background-repeat: no-repeat;
    /* Contains the fire overlay's screen blend to THIS row. Without it
       the blend reaches past the row into whatever is painted behind
       it, so the flame would brighten the backdrop and its neighbours
       instead of only the box it belongs to. */
    isolation: isolate;
  }

  /* The slot number. Hidden on a package whose artwork already prints
     01..12 into the box (CLT does; GC leaves the column empty), which is
     what --rank-display carries. */
  .rank {
    position: absolute; display: var(--rank-display);
    left: var(--rank-x); top: 0; width: var(--rank-w); height: var(--row-h);
    align-items: center; justify-content: center;
    color: var(--ink); font-weight: 800; font-size: var(--rank-size);
    font-variant-numeric: tabular-nums;
  }
  .logo {
    position: absolute; left: var(--logo-x); top: 0;
    width: var(--logo-w); height: var(--row-h);
    display: flex; align-items: center; justify-content: center;
  }
  .logo img {
    max-width: var(--logo-img); max-height: var(--logo-img); object-fit: contain;
  }

  .name {
    position: absolute; left: var(--name-x); top: 0;
    width: var(--name-w); height: var(--row-h);
    display: flex; align-items: center; justify-content: var(--name-align);
    color: var(--ink); font-weight: 700; font-size: var(--name-size);
    letter-spacing: 0.2px;
    text-transform: uppercase; white-space: nowrap; overflow: hidden;
  }

  /* Points: total carried in from earlier games plus this game's own
     score. Only the packages that have a PTS. column show it. */
  .points {
    position: absolute; display: var(--points-display);
    left: var(--points-x); top: 0; width: var(--points-w); height: var(--row-h);
    align-items: center; justify-content: center;
    color: var(--ink); font-weight: 800; font-size: var(--num-size);
    font-variant-numeric: tabular-nums;
  }

  .kills {
    position: absolute; left: var(--kills-x); top: 0;
    width: var(--kills-w); height: var(--row-h);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink); font-weight: 800; font-size: var(--num-size);
    font-variant-numeric: tabular-nums;
  }

  /* The STATUS pip -- YOUR artwork, unmodified (Dead.png /
     1..4_alive.png), picked by alive count. Nothing is drawn here; this
     only crops the supplied PNG down to its own content.

     Measured from the files themselves: all five are a 500x500 canvas
     whose visible content sits at x 11..487, y 140..359 -- 477x220,
     so 2.17:1. The scale is UNIFORM on both axes, unlike the old
     design's (which stretched each axis independently to fill a slot
     that happened to be nearly the same ratio). Stretching into this
     design's wider STATUS column turned the bars into fat squares --
     they're meant to stay the proportions they were drawn at:

       factor = 36/220 = 0.163636
       background-size  = 500 x factor        -> 81.8px
       background-position = -11 x f, -140 x f -> -1.8px, -22.9px
       displayed content   = 477 x f = 78px wide, 36px tall */
  .status-pip {
    position: absolute;
    left: var(--pip-x); top: var(--pip-y);
    width: var(--pip-w); height: var(--pip-h);
    background-repeat: no-repeat;
    background-size: var(--pip-size) var(--pip-size);
    background-position: var(--pip-px) var(--pip-py);
  }

  /* A wiped squad's whole row dims, so "who is still in" reads at a
     glance rather than needing the pip alone to carry it. */
  .row.out .name { opacity: 0.55; }
  .row.out .logo img { filter: grayscale(1); opacity: 0.5; }

  /* Operator-set markers -- in the zone, or on a run. Both breathe
     rather than sit still, because a static tint on a dark red box
     reads as a rendering artefact; movement is what says "this is
     deliberate". Kept low: these mark a squad, they don't announce
     themselves over the name and numbers sitting on top of them.
     Painted with an inset shadow so the glow follows the box's own
     edges, including the notch cut out of its left side. */
  .row.zone { animation: ff-zone-glow 2.4s ease-in-out infinite; }
  @keyframes ff-zone-glow {
    0%, 100% { box-shadow: inset 0 0 14px 2px rgba(40, 140, 255, 0.20); }
    50%      { box-shadow: inset 0 0 22px 5px rgba(60, 170, 255, 0.42); }
  }

  /* Fire flowing ACROSS the box, like wind carrying it.
     ---------------------------------------------------------------
     The previous attempt used discrete radial blobs, which is exactly
     why it read as dots travelling around rather than as fire: separate
     shapes stay separate no matter how they move. Flame is continuous,
     so this is continuous -- wide soft bands that overlap into one
     sheet, all drifting the SAME way at different speeds. The speed
     difference is what makes the sheet churn instead of sliding as a
     single rigid texture.

     mix-blend-mode: screen is what sells it. Screen only ever
     brightens, so the flame LIGHTS the box it passes over rather than
     painting a coloured rectangle on top of it -- dark parts of the
     gradient vanish entirely instead of greying the artwork, which is
     what makes it look like fire on the box rather than over it.

     Sits above the box but below the text (z-index 0, contents at 1):
     the name and numbers have to stay readable through it. */
  .row.fire::before {
    content: ""; position: absolute; inset: 0; z-index: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    background:
      linear-gradient(101deg,
        transparent 0%, rgba(255,104,0,.50) 9%, rgba(255,182,46,.92) 19%,
        rgba(255,236,150,.98) 25%, rgba(255,150,20,.72) 33%,
        rgba(255,88,0,.36) 42%, transparent 52%),
      linear-gradient(94deg,
        transparent 0%, rgba(255,80,0,.34) 14%, rgba(255,208,86,.80) 27%,
        rgba(255,120,0,.46) 38%, transparent 50%),
      linear-gradient(110deg,
        transparent 0%, rgba(255,140,10,.42) 12%, rgba(255,246,190,.70) 21%,
        rgba(255,110,0,.34) 30%, transparent 44%);
    background-size: 58% 260%, 82% 240%, 44% 280%;
    background-repeat: repeat;
    filter: blur(6px) saturate(1.5) brightness(1.12);
    animation: ff-fire-flow 1.45s linear infinite,
               ff-fire-breathe 0.53s ease-in-out infinite alternate;
  }
  /* All three travel left-to-right -- one direction, like airflow.
     Different distances per cycle give the parallax that makes it
     churn. */
  @keyframes ff-fire-flow {
    from { background-position:   0% 50%,   0% 40%,   0% 60%; }
    to   { background-position: 116% 50%, 164% 40%,  88% 60%; }
  }
  @keyframes ff-fire-breathe {
    from { opacity: .72; }
    to   { opacity: 1; }
  }

  /* Keeps the text above the flame sheet. */
  .row .logo, .row .name, .row .kills, .row .status-pip { z-index: 1; }

  /* A squad can be in the zone AND on a run. These no longer fight:
     the zone tints the inside via box-shadow, fire rings the outside
     via ::before, so both simply show. */

  /* Rows slide to their new slot instead of snapping. This only works
     because a row's element PERSISTS between updates (see rowEls in the
     script) -- the old version rebuilt all twelve from scratch on every
     change, so there was never an old position to animate from.

     Slow enough to read as travel: a squad eliminated out of row 1 has
     eleven rows to cross, and at a snappier duration that reads as a
     jump rather than a fall. The ease-in-out start and finish are what
     make a long move look deliberate instead of thrown. */
  .row { transition: top 900ms cubic-bezier(0.65, 0, 0.35, 1); }
  .row.no-anim { transition: none; }

  /* ---- the elimination flyby ----------------------------------------
     Runs on the row that just went out, BEFORE anything re-sorts: the
     word sweeps across, and only once it's gone does the table reorder
     (see the hold in applyRows). Two copies of the text, the back one
     offset and dimmed, give the motion-trail look without needing a
     video or sprite sheet. Clipped to the row so it never bleeds into
     the rows above and below while it travels. */
  .flyby {
    position: absolute; inset: 0; overflow: hidden;
    pointer-events: none; display: none;
  }
  .flyby.on { display: block; }
  .flyby .word {
    position: absolute; top: 50%; left: 0;
    transform: translate(-120%, -50%);
    font-style: italic; font-weight: 900; font-size: 26px;
    letter-spacing: 1px; white-space: nowrap;
    color: #ffffff; text-shadow: 0 0 18px rgba(255, 120, 0, 0.9);
  }
  .flyby .word.trail {
    color: #ff7a00; opacity: 0.55; filter: blur(1px);
  }
  .flyby.on .word       { animation: ff-flyby 1150ms cubic-bezier(0.16, 0.84, 0.3, 1) both; }
  .flyby.on .word.trail { animation: ff-flyby 1150ms cubic-bezier(0.16, 0.84, 0.3, 1) both;
                          animation-delay: 55ms; }
  @keyframes ff-flyby {
    0%   { transform: translate(-130%, -50%) skewX(-12deg); opacity: 0; }
    18%  { opacity: 1; }
    55%  { transform: translate(28%, -50%) skewX(-12deg); opacity: 1; }
    100% { transform: translate(150%, -50%) skewX(-12deg); opacity: 0; }
  }

  /* The row itself flares red under the flyby, then settles into the
     permanent dim above. */
  @keyframes ff-elim-flash {
    0%   { box-shadow: inset 0 0 0 999px rgba(220, 4, 7, 0); }
    20%  { box-shadow: inset 0 0 0 999px rgba(220, 4, 7, 0.5); }
    100% { box-shadow: inset 0 0 0 999px rgba(220, 4, 7, 0); }
  }
  .row.just-eliminated { animation: ff-elim-flash 1150ms ease-out; }
</style>
</head>
<body>

<div id="frame">
  <div id="stage">
    <img id="backdrop" alt="">
    <div id="rows"></div>
  </div>
</div>

<script>
const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=freefire_alive_status"
  : "ws://localhost:8765?page=freefire_alive_status";

// Set only by the dashboard's own preview frames -- see apply().
const PREVIEW_MODE = _params.get("preview") === "1";

// Measured from ALIVE STATUS.png -- see the note at the top.
/* ---- Per-package layout ------------------------------------------------
   Two graphics packages now draw this table and they agree about
   nothing: different panel bounds, different row pitch, different
   columns, different pip artwork. Rather than fork the page, every
   number that differs lives here and is applied as CSS custom
   properties, so the rules above stay put and only the values move.

   Each package's numbers were MEASURED from its own artwork, never
   eyeballed: the row boxes by scanning the PNG's alpha, and the text
   and pip columns by diffing the designer's reference render (the one
   with sample names and scores) against the blank one, which leaves
   exactly the cells we are expected to fill.

   `pip` is the same uniform-scale crop both packages need: their icons
   are 500x500 canvases with the drawing off in one corner, so the box
   shows one window onto the canvas and the scale is equal on both axes.
   Deriving it from the content's own box is what keeps the shapes the
   proportions they were drawn at -- stretching each axis to fill the
   column is what once turned CLT's bars into fat squares. */
const LAYOUTS = {
  // The TEAM / KILLS / STATUS design. Row numbers are printed into the
  // artwork, so there is no rank element and no points column.
  CLT: {
    bg: "ALIVE STATUS.png",
    pipBase: "",
    rowTops: [286, 335, 384, 434, 483, 532, 582, 631, 680, 730, 779, 828],
    row: { x: 1512, w: 408, h: 44 },
    ink: "#f2e9e6",
    rank: null,
    logo: { x: 8, w: 40, img: 34 },
    name: { x: 54, w: 150, size: 17, align: "flex-start" },
    points: null,
    kills: { x: 208, w: 74, size: 18 },
    // content x 11..487, y 140..359 of a 500 canvas, shown 78px wide
    pip: { x: 304, y: 4, w: 78, h: 36, size: 81.8, px: -1.8, py: -22.9 },
    originY: 576,          // centre of y 247..905
  },

  // The # / TEAM / ALIVE / PTS. / ELIMS. design. Panel x 1455..1920,
  // y 254..818; header 254..288; twelve 43px rows from 291 on a 44px
  // pitch. The slot number is NOT printed in this artwork, so this one
  // draws it. The logo sits in the white diagonal band the design
  // leaves between the number block and the name block -- measured at
  // x 1520..1587, the full height of the row, identical on all twelve.
  GC: {
    bg: "Alive Status without pt.png",
    bgPoints: "Alive Status.png",
    pipBase: "Live Stats/",
    rowTops: [291, 335, 379, 423, 467, 511, 555, 599, 643, 687, 731, 775],
    row: { x: 1455, w: 465, h: 43 },
    ink: "#ffffff",
    rank: { x: 0, w: 52, size: 19 },          // digits centre on x 1481
    logo: { x: 65, w: 68, img: 36 },
    name: { x: 156, w: 112, size: 19, align: "flex-start" },
    points: { x: 353, w: 40, size: 19 },       // "00" centres on x 1828
    kills: { x: 412, w: 40, size: 19 },        // "00" centres on x 1887
    // content x 25..475, y 184..316 of a 500 canvas, shown 59px wide:
    // scale 59/451 = 0.13082, so the canvas renders at 65.41 and the
    // window starts at -25*s, -184*s.
    pip: { x: 271, y: 13, w: 59, h: 17.4, size: 65.41, px: -3.27, py: -24.07 },
    originY: 536,          // centre of y 254..818
  },
};

// Which package's artwork is on disk decides which layout is used, so
// switching graphics packages on the dashboard switches this too with
// nothing else to remember.
function layoutFor(state){
  const folder = (state && state.event && state.event.assetFolder) || "CLT";
  return LAYOUTS[folder] || LAYOUTS.CLT;
}

let activeLayout = null;

/* Writes the layout into CSS custom properties. Only on a real change:
   this runs on every sync, and rewriting a dozen properties on the root
   element four times a second invalidates style for the whole page. */
function applyLayout(L, showPoints){
  const sig = JSON.stringify([L.row, showPoints]);
  if(activeLayout === sig) return;
  activeLayout = sig;
  const r = document.documentElement.style;
  r.setProperty("--row-x", L.row.x + "px");
  r.setProperty("--row-w", L.row.w + "px");
  r.setProperty("--row-h", L.row.h + "px");
  r.setProperty("--ink", L.ink);
  r.setProperty("--rank-display", L.rank ? "flex" : "none");
  r.setProperty("--rank-x", ((L.rank && L.rank.x) || 0) + "px");
  r.setProperty("--rank-w", ((L.rank && L.rank.w) || 0) + "px");
  r.setProperty("--rank-size", ((L.rank && L.rank.size) || 16) + "px");
  r.setProperty("--logo-x", L.logo.x + "px");
  r.setProperty("--logo-w", L.logo.w + "px");
  r.setProperty("--logo-img", L.logo.img + "px");
  r.setProperty("--name-x", L.name.x + "px");
  r.setProperty("--name-w", L.name.w + "px");
  r.setProperty("--name-size", L.name.size + "px");
  r.setProperty("--name-align", L.name.align);
  // The points column exists only where the package HAS one and the
  // operator is running the variant that shows it.
  const pts = L.points && showPoints;
  r.setProperty("--points-display", pts ? "flex" : "none");
  r.setProperty("--points-x", ((L.points && L.points.x) || 0) + "px");
  r.setProperty("--points-w", ((L.points && L.points.w) || 0) + "px");
  r.setProperty("--kills-x", L.kills.x + "px");
  r.setProperty("--kills-w", L.kills.w + "px");
  r.setProperty("--num-size", L.kills.size + "px");
  r.setProperty("--pip-x", L.pip.x + "px");
  r.setProperty("--pip-y", L.pip.y + "px");
  r.setProperty("--pip-w", L.pip.w + "px");
  r.setProperty("--pip-h", L.pip.h + "px");
  r.setProperty("--pip-size", L.pip.size + "px");
  r.setProperty("--pip-px", L.pip.px + "px");
  r.setProperty("--pip-py", L.pip.py + "px");
  // Shrinking anchors to the panel's own vertical centre, which differs
  // per package: CLT's box runs y 247..905, GC's 254..818.
  r.setProperty("--panel-origin-y", L.originY + "px");
}

// Set from the active layout on every apply(). The strip each moving row
// wears is cropped from row 1's own box, so it travels with its contents.
let ROW_TOPS = LAYOUTS.CLT.rowTops;
let ROW_BLOCK = { x: LAYOUTS.CLT.row.x, y: ROW_TOPS[0] };

let ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") apply(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function assetBase(state){
  const folder = (state.event && state.event.assetFolder) || "CLT";
  return "assets/freefire/" + folder + "/";
}

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

/* Order, in two blocks.

   STILL ALIVE, at the top: most kills first, teams level on kills split
   by who has more players still up.

   ELIMINATED, below them: stacked from the bottom in the order they
   went out. The first squad wiped sits on the very last row and stays
   there; each one after it lands directly above the previous casualty.
   So a team leaving row 1 travels all the way down on the first
   elimination, and only as far as the row above the last casualty
   later on -- which is also its real placement.

   Elimination order is observed here rather than taken from the data:
   link_live_teams() supplies a placement the moment it sees a wipe, but
   the alive grid doesn't, and a row can come from either. Counting the
   transitions as they happen works the same for both. placement is
   still used as the seed for anything already eliminated before this
   page loaded, so a mid-match refresh doesn't lose the stack. */
let elimSeq = new Map();     // team key -> when it went out (higher = later)
let elimCounter = 0;

function noteElimination(key, row){
  if(elimSeq.has(key)) return;
  // placement counts DOWN as teams survive longer (first out = 12), so a
  // bigger placement is an earlier exit -- negate it to match the
  // counter's "higher is later" ordering, and keep it below any
  // elimination this page actually witnessed.
  elimSeq.set(key, row && row.placement != null
    ? -row.placement
    : ++elimCounter);
}

/* A kill count can be momentarily unknown -- an unreadable frame, or a
   row whose source went quiet -- and treating that as "no kills" was
   doing real damage on air:

     - the number blanked out, then reappeared
     - the row sank to the bottom of its block and climbed back

   Both happened on any unrelated redraw, which is why editing a field
   or ticking zone/fire appeared to make the table jump around: the
   redraw simply made an already-unknown value visible.

   The last count actually seen for that team stands in until a real one
   arrives. A kill count doesn't become unknown because the squad lost
   kills -- it becomes unknown because we couldn't read it this instant,
   and the last thing we knew is a far better answer than zero. */
const ffLastKnownKills = new Map();

function effectiveKills(row){
  const key = rowKeyOf(row);
  if(row.elims != null){
    ffLastKnownKills.set(key, row.elims);
    return row.elims;
  }
  const remembered = ffLastKnownKills.get(key);
  return remembered == null ? -1 : remembered;
}

function orderRows(rows){
  const killsOf = (r) => effectiveKills(r);
  const aliveOf = (r) => (r.aliveCount == null ? 0 : r.aliveCount);
  return rows.map((r, i) => ({ r, i })).sort((A, B) => {
    const a = A.r, b = B.r;
    const aOut = !!a.eliminated, bOut = !!b.eliminated;
    if(aOut !== bOut) return aOut ? 1 : -1;      // alive block on top

    if(!aOut){
      const dk = killsOf(b) - killsOf(a);
      if(dk) return dk;
      const da = aliveOf(b) - aliveOf(a);
      if(da) return da;
      // Team name, NOT the incoming array position: the engine's
      // publish order isn't fixed (a grid-only row gets appended,
      // the merge can reorder), so index-based tiebreaks let two
      // genuinely tied rows swap places on an unrelated update.
      // Comparing names gives the same answer every time.
      return rowKeyOf(a) < rowKeyOf(b) ? -1 : 1;
    }

    // Both out: most recently eliminated sits highest, so the first
    // casualty ends up on the bottom row.
    const sa = elimSeq.has(rowKeyOf(a)) ? elimSeq.get(rowKeyOf(a)) : 0;
    const sb = elimSeq.has(rowKeyOf(b)) ? elimSeq.get(rowKeyOf(b)) : 0;
    if(sa !== sb) return sb - sa;
    return rowKeyOf(a) < rowKeyOf(b) ? -1 : 1;
  }).map(x => x.r);
}

function logoFor(teamName, roster){
  const want = (teamName || "").trim().toUpperCase();
  const team = ((roster && roster.teams) || []).find(
    t => (t.name || "").trim().toUpperCase() === want);
  return team || null;
}

/* ---- persistent rows -------------------------------------------------
   A row's element is created ONCE and then updated in place, keyed by
   team. That's what makes the slide possible at all: the old version
   rebuilt all twelve on every update, so each "new" element was born at
   its final position with nothing to animate from. It also ends the
   repaint flicker the old innerHTML swap caused, which is why the
   change-detection guard it needed is gone -- updating a text node
   that already holds the same string costs nothing and shows nothing. */
const FLYBY_MS = 1150;
const rowEls = new Map();        // team key -> row element
let displayOrder = [];           // team keys, in the order currently on screen
let holdOrderUntil = 0;          // while in the future, don't re-sort
let previouslyEliminated = new Set();
// Teams this page has rendered at least once. A squad has to have been
// SEEN before its death counts as something that just happened.
let ffSeenTeams = new Set();
let lastState = null;

function rowKeyOf(row){ return (row.teamName || "").trim().toUpperCase(); }

function makeRowEl(){
  const el = document.createElement("div");
  el.className = "row no-anim";
  el.innerHTML =
    '<div class="rank"></div>' +
    '<div class="logo"><img alt="" style="display:none"></div>' +
    '<div class="name"></div>' +
    '<div class="points"></div>' +
    '<div class="kills"></div>' +
    '<div class="status-pip"></div>' +
    '<div class="flyby"><span class="word trail">ELIMINATED</span>' +
    '<span class="word">ELIMINATED</span></div>';
  return el;
}

function playFlyby(el){
  const fly = el.querySelector(".flyby");
  fly.classList.remove("on");
  el.classList.remove("just-eliminated");
  void el.offsetWidth;              // restart both animations from zero
  fly.classList.add("on");
  el.classList.add("just-eliminated");
  setTimeout(() => fly.classList.remove("on"), FLYBY_MS + 60);
}

function apply(state){
  lastState = state;
  const live = state.liveOps || {};
  const source = (live.sidetableRows || []).slice(0, 12);
  const base = assetBase(state);
  // ?preview=1 draws regardless of whether the graphic is on air. A
  // preview that only works once something is already live isn't a
  // preview -- it can't be used to check a graphic BEFORE showing it,
  // which is the entire reason to have one. OBS sources never pass it,
  // so nothing reaches air from this.
  const visible = PREVIEW_MODE || (state.display && state.display.aliveStatusVisible);

  document.getElementById("stage").classList.toggle("show", !!visible && source.length > 0);
  if(!visible || !source.length) return;

  const L = layoutFor(state);
  // The PTS. column only exists in some packages, and even there it is a
  // separate backdrop -- so the operator's choice picks the artwork and
  // the column together, never one without the other.
  const showPoints = !!(L.points && state.display && state.display.aliveStatusPoints);
  applyLayout(L, showPoints);
  ROW_TOPS = L.rowTops;
  ROW_BLOCK = { x: L.row.x, y: L.rowTops[0] };

  const backdrop = document.getElementById("backdrop");
  const bgSrc = base + ((showPoints && L.bgPoints) ? L.bgPoints : L.bg);
  if(backdrop.getAttribute("src") !== bgSrc) backdrop.src = bgSrc;
  // The strip every row wears as its own box -- row 1's, since they're
  // all identical in the artwork. Offset by the row block's own origin
  // so the crop lands on the box and nothing either side of it.
  const rowStrip = `url('${bgSrc}')`;
  const rowStripPos = `-${ROW_BLOCK.x}px -${ROW_BLOCK.y}px`;

  const container = document.getElementById("rows");
  const byKey = new Map(source.map(r => [rowKeyOf(r), r]));

  // Content first, order second -- a row that just went out has to be
  // showing its eliminated state BEFORE the flyby runs over it.
  const nowEliminated = new Set();
  const newlyOut = [];
  source.forEach(row => {
    const key = rowKeyOf(row);
    let el = rowEls.get(key);
    if(!el){
      el = makeRowEl();
      rowEls.set(key, el);
      container.appendChild(el);
    }
    // Set once per row, and again only if the graphics package changes.
    if(el.style.backgroundImage !== rowStrip){
      el.style.backgroundImage = rowStrip;
      el.style.backgroundPosition = rowStripPos;
    }
    const team = logoFor(row.teamName, state.roster);
    const label = (team && team.shortName) || row.teamName || "";
    // aliveCount is null when the squad could not be linked to the roster
    // (that link is what turns the client's squad number into a team).
    // Showing a full-alive pip would be a confident lie, so an unknown
    // count falls back to the empty/dead indicator.
    const alive = row.eliminated ? 0
      : (row.aliveCount == null ? 0 : Math.max(0, Math.min(4, row.aliveCount)));
    // GC keeps its indicator art in a "Live Stats" subfolder; CLT keeps
    // it beside the backdrop. pipBase is whichever.
    const art = L.pipBase + (alive === 0 ? "Dead.png" : alive + "_alive.png");

    const nameEl = el.querySelector(".name");
    if(nameEl.textContent !== label) nameEl.textContent = label;
    // Shows the last count actually seen when this frame has none, so
    // the number doesn't blink out and back on every redraw. Still
    // blank if nothing has ever been read for this team -- that's a
    // genuine gap, not a momentary one.
    const effective = effectiveKills(row);
    const kills = effective < 0 ? "" : String(effective);
    const killsEl = el.querySelector(".kills");
    if(killsEl.textContent !== kills) killsEl.textContent = kills;

    const img = el.querySelector(".logo img");
    const logoSrc = (team && team.logo) || "";
    if(img.getAttribute("src") !== logoSrc){
      if(logoSrc){ img.src = logoSrc; img.style.display = ""; }
      else { img.removeAttribute("src"); img.style.display = "none"; }
    }
    const pip = el.querySelector(".status-pip");
    const pipSrc = `url('${base}${art}')`;
    if(pip.style.backgroundImage !== pipSrc) pip.style.backgroundImage = pipSrc;

    el.classList.toggle("out", !!row.eliminated);
    el.classList.toggle("zone", !!row.inZone);
    el.classList.toggle("fire", !!row.onFire);
    if(row.eliminated){
      nowEliminated.add(key);
      noteElimination(key, row);
      // Only a team we have actually WATCHED go down gets the animation.
      // Without the seenTeams check, any team appearing for the first
      // time while already eliminated counted as a fresh kill -- so
      // reassigning a row in the dashboard introduced "new" names and
      // fired the flyby for several already-dead squads at once, which
      // is exactly the random multi-fire that was reported.
      if(ffSeenTeams.has(key) && !previouslyEliminated.has(key)) newlyOut.push(el);
    }
    ffSeenTeams.add(key);
  });

  // A fresh match: everyone is back up, so last game's elimination
  // stack has to go or it would still be dictating where teams land.
  if(!nowEliminated.size && elimSeq.size){
    elimSeq = new Map();
    elimCounter = 0;
  }

  // Anything no longer in the table (roster changed, new match) goes.
  Array.from(rowEls.keys()).forEach(key => {
    if(!byKey.has(key)){
      const el = rowEls.get(key);
      if(el && el.parentNode) el.parentNode.removeChild(el);
      rowEls.delete(key);
    }
  });

  // A squad just went out: run the flyby on its row and freeze the order
  // until it finishes, so the word plays over the row where the viewer
  // last saw that team -- THEN everything slides. Re-applied on a timer
  // because the next state_sync may not land on its own in time.
  if(newlyOut.length){
    newlyOut.forEach(playFlyby);
    holdOrderUntil = Date.now() + FLYBY_MS;
    setTimeout(() => { if(lastState) apply(lastState); }, FLYBY_MS + 40);
  }
  previouslyEliminated = nowEliminated;

  // Deduplicated, because a repeated key here is what put two team
  // names on top of each other with a blank row underneath: rows are
  // elements keyed by team, so the same key twice means two slots
  // pointing at ONE element (it takes the last slot's position), the
  // other slot left empty, and whatever got pushed past the twelfth
  // slot stranded at its old position with nothing to move it. The
  // duplicate itself is an upstream problem, but the table should
  // degrade by showing that team once, not by scrambling the layout.
  const targetOrder = [];
  orderRows(source).forEach(r => {
    const k = rowKeyOf(r);
    if(k && !targetOrder.includes(k)) targetOrder.push(k);
  });

  if(Date.now() < holdOrderUntil){
    // Hold the order, but still place any row that has no slot yet
    // (a team appearing mid-flyby would otherwise sit at top:0).
    targetOrder.forEach(k => { if(!displayOrder.includes(k)) displayOrder.push(k); });
    displayOrder = displayOrder.filter(k => rowEls.has(k));
  } else {
    displayOrder = targetOrder;
  }

  const placed = new Set();
  displayOrder.forEach((key, i) => {
    const el = rowEls.get(key);
    if(!el || i >= ROW_TOPS.length) return;
    placed.add(key);
    el.style.display = "";
    const top = ROW_TOPS[i] + "px";
    if(el.style.top !== top) el.style.top = top;
    // The slot number, on the packages that don't print it into the
    // artwork. Written here rather than with the row's other content
    // because it belongs to the SLOT, not the team -- a squad that
    // climbs the table takes its neighbour's number, not its own.
    const rankEl = el.querySelector(".rank");
    const rank = String(i + 1);
    if(rankEl && rankEl.textContent !== rank) rankEl.textContent = rank;
    // First placement lands instantly; every move after that animates.
    if(el.classList.contains("no-anim")){
      void el.offsetWidth;
      el.classList.remove("no-anim");
    }
  });

  // Anything that didn't get a slot is HIDDEN rather than left sitting
  // at whatever position it last held -- a stranded row is exactly what
  // renders as an overlap.
  rowEls.forEach((el, key) => {
    if(!placed.has(key)) el.style.display = "none";
  });

  applyElementOverrides(state);
}

/* Per-element nudges from the dashboard's Graphic Fixing tab (Alive:
   Logo / Name / Kills / Status). Each is one {dx, dy, scale} applied on
   top of the element's own CSS position -- every row shares the offset,
   since the whole point is lining a COLUMN up with the artwork, not
   moving one row independently. Same transform trick the scoreboard and
   points table already use for their logo columns. */
const OVERRIDE_TARGETS = {
  aliveStatusLogo: ".logo",
  aliveStatusName: ".name",
  aliveStatusKills: ".kills",
  aliveStatusPip: ".status-pip",
};

/* The whole panel, as opposed to one column within it -- the same
   {dx, dy, scale}, applied to #frame. Written only when it actually
   changes: this runs on every sync, and reassigning an identical
   transform on a scaled layer is work the compositor doesn't need
   mid-animation. */
function applyPanelOverride(all){
  const frame = document.getElementById("frame");
  if(!frame) return;
  const o = all.aliveStatusPanel || {};
  const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
  const want = (dx || dy || scale !== 1)
    ? `translate(${dx}px, ${dy}px) scale(${scale})`
    : "";
  if(frame.style.transform !== want) frame.style.transform = want;

  /* How far the stage has to travel to clear frame on the way out.
     That translate happens INSIDE #frame, so it is in unscaled units:
     the panel is as wide as the package's own row (408 for CLT, 465 for
     GC) with its right edge on frame's right edge, so that width just
     clears it when nothing has been moved, and a panel dragged
     left (dx < 0) needs exactly that much more -- divided by scale,
     because dx is measured in screen pixels while this is not. The
     extra 62 is the flame overhang, the same margin the original fixed
     470 carried. */
  const panelWidth = (activeLayout && lastState ? layoutFor(lastState) : LAYOUTS.CLT).row.w;
  const clear = Math.round(panelWidth - dx / (scale || 1) + 62);
  frame.style.setProperty("--ff-fly-out", clear + "px");
}

function applyElementOverrides(state){
  const all = state.graphicOverrides || {};
  applyPanelOverride(all);
  Object.entries(OVERRIDE_TARGETS).forEach(([key, selector]) => {
    const o = all[key] || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    if(!dx && !dy && scale === 1) return;
    document.querySelectorAll("#rows " + selector).forEach(el => {
      el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
      el.style.transformOrigin = "left center";
    });
  });
}

connect();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="ff_embed.js"></script>
<title>Free Fire Alive Status</title>
<style>
  /* The 12-team live side table.
     ---------------------------------------------------------------
     Every number on this graphic comes from the game client's own
     debugger log, not from OCR of the in-game table (or, once
     calibrated, the alive grid's own colour/digit read -- see
     link_live_teams()/apply_alive_grid_identities() in
     freefire_engine.py; both feed liveOps.sidetableRows in the same
     shape, so this page doesn't care which one supplied a given row).

     Geometry below is measured from the CURRENT artwork
     (assets/freefire/<event>/ALIVE STATUS.png, the TEAM/KILLS/STATUS
     design), not eyeballed -- sampled directly from the PNG's own
     pixels. At 1920x1080 the table occupies x 1512..1920, a header
     band, twelve 44px-tall rows on a ~49.3px pitch, and a legend
     footer explaining the STATUS icon (this is the SAME icon set the
     old design used -- Dead.png / 1_alive.png.. 4_alive.png -- just
     moved to sit under the STATUS column instead of a dedicated ALIVE
     column). Row tops are listed exactly as measured rather than
     computed from a pitch, matching the old design's own reasoning:
     the artwork's spacing is not perfectly uniform and drift would
     show by row twelve.

     Font is Gotham, per the graphic package -- not bundled here (no
     @font-face): it's expected to already be installed on the
     machine running the browser source, the same way a licensed font
     normally reaches a design tool without redistributing the file.
     Falls back to Arial if it isn't. */

  /* Nippo, bundled rather than installed.
     ---------------------------------------------------------------
     The package ships the web fonts, so the page carries them itself
     instead of trusting that whoever set up the browser source also
     installed the family. A missing font is not a visible error -- it
     falls silently back to Arial, and nobody notices until the graphic
     is already on air looking wrong. The variable face covers every
     weight in one file; the two static faces are a fallback for a
     renderer that won't do variable fonts.

     One family name for all three, so `font-weight` picks between them
     the way it does for any other font. */
  /* PRG ARROW's face -- TT Supermolot Black Italic, the same file the
     lobby strip uses for the ARROW SHOWDOWN theme. */
  /* SS3's face -- Tactic Sans Bold Italic, shipped in the package. */
  @font-face {
    font-family: 'TacticSans';
    src: url('assets/freefire/ss3/TacticSans-BldIt.otf') format('opentype');
    font-weight: 100 900; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Supermolot';
    src: url('assets/fonts/TT Supermolot Neue Trial Black Italic.ttf') format('truetype');
    font-weight: 400 900; font-style: normal; font-display: block;
  }
  /* Upright, for the Top 4 win rate -- the demo sets it straight, and
     'Supermolot' above is the italic cut. */
  @font-face {
    font-family: 'SMBI';
    src: url('assets/fonts/TT Supermolot Neue Trial Black Italic.ttf') format('truetype');
    font-weight: 400 900; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Supermolot Black';
    src: url('assets/fonts/TTSupermolotNeueTrial-Black.ttf') format('truetype');
    font-weight: 400 900; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Supermolot Upright';
    src: url('assets/fonts/TT Supermolot Neue Trial ExtraBold.ttf') format('truetype');
    font-weight: 400 900; font-style: normal; font-display: block;
  }
  /* GNG's faces, shipped in its package: Moanslight Bold for the table (the
     demo's TEAM NAME / 00 / 1.), the distressed display face for titles. */
  @font-face {
    font-family: 'Moanslight';
    src: url('assets/freefire/gng/font/MOANSLIGHT-BOLD.OTF') format('opentype');
    font-weight: 100 900; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'GNG Display';
    src: url('assets/freefire/gng/font/Sddystopiandemo-GO7xa.otf') format('opentype');
    font-weight: 100 900; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Nippo';
    src: url('assets/freefire/GC/fonts/Nippo-Variable.woff2') format('woff2-variations'),
         url('assets/freefire/GC/fonts/Nippo-Variable.woff2') format('woff2');
    font-weight: 200 700; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Nippo Static';
    src: url('assets/freefire/GC/fonts/Nippo-Medium.woff2') format('woff2');
    font-weight: 500; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Nippo Static';
    src: url('assets/freefire/GC/fonts/Nippo-Bold.woff2') format('woff2');
    font-weight: 700; font-style: normal; font-display: block;
  }

  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    width: 1920px; height: 1080px;
    /* Per package -- see LAYOUTS. Neither face is bundled: both are
       expected to be installed on the machine running the browser
       source, the way a licensed font normally reaches a design tool
       without redistributing the file. Falls back to Arial. */
    font-family: var(--face, 'Gotham'), Arial, sans-serif;
  }

  /* Flies in from off the right edge rather than snapping on.
     ---------------------------------------------------------------
     The table lives at x 1512..1920, hard against the right side, so
     that's the direction it belongs coming from -- anything else reads
     as the panel arriving from nowhere.

     display:none can't be animated, which is why this parks the stage
     OFF-CANVAS instead of hiding it: the default 470px clears the
     table's full 408px width plus the flame overhang, and body already
     has overflow:hidden so nothing of it shows while it's out there.

     The distance is a variable because the panel can now be moved and
     resized (see #frame): a table dragged left of its home position
     needs further to travel, and a fixed 470 would leave part of it
     parked in shot. applyPanelOverride() recomputes it.

     Different easing each way, on purpose. Coming in it overshoots
     very slightly and settles, which reads as deliberate; going out it
     accelerates away without the overshoot, because a graphic being
     pulled should leave promptly rather than linger. Opacity is
     quicker than the slide in both directions so it's never a
     half-faded rectangle mid-travel. */
  #stage {
    position: absolute; inset: 0;
    opacity: 0;
    transform: translateX(var(--ff-fly-out, 470px));
    transition: transform 420ms cubic-bezier(0.55, 0, 0.85, 0.4),
                opacity   260ms ease-in;
    will-change: transform, opacity;
  }
  #stage.show {
    opacity: 1;
    transform: translateX(0);
    transition: transform 640ms cubic-bezier(0.18, 0.96, 0.32, 1),
                opacity   300ms ease-out;
  }

  /* Whole-panel size and placement, set from the dashboard's Graphic
     Fixing tab (Alive: Whole Panel).
     ---------------------------------------------------------------
     It rides on its own wrapper rather than on #stage, because #stage's
     transform is already spoken for by the fly-in/fly-out -- an element
     only gets one transform, and these two change for entirely
     different reasons at entirely different moments.

     The origin is the panel's own right edge and vertical centre
     (1920, 576), taken from the artwork's real bounds: ALIVE STATUS.png
     is a full-frame image whose non-transparent box is x 1512..1920,
     y 247..905. The table lives hard against the right side of frame,
     so making it smaller should keep it pinned there and at the same
     height, not walk it toward the middle of the screen. */
  #frame {
    position: absolute; inset: 0;
    transform-origin: 1920px var(--panel-origin-y);
    will-change: transform;
  }

  /* Winner Sans, the face of RNX and ENFEA STAN (one designer's kit):
     Medium for the text ('Winner Sans M'), Medium made bold by the browser
     for the heavy text ('Winner Sans B' -- declared at 500, so any weight
     from 600 is drawn bold from it; the kit has no non-condensed bold).
     Where it is installed, else its file in assets/fonts/winner-sans (a
     paid face: on this machine, not in this public repo), else TT
     Supermolot Neue, the closest to it. Each source is tried in turn. */
  @font-face{font-family:'Winner Sans M';src:local('WinnerSans-Medium'),local('WinnerSans Medium'),local('Winner Sans Medium'),url('assets/fonts/winner-sans/WinnerSans-Medium.otf') format('opentype'),url('assets/fonts/TTSupermolotNeueTrial-Medium.ttf') format('truetype');font-weight:100 900;font-display:block;}
  @font-face{font-family:'Winner Sans B';src:local('WinnerSans-Medium'),local('WinnerSans Medium'),local('Winner Sans Medium'),url('assets/fonts/winner-sans/WinnerSans-Medium.otf') format('opentype'),url('assets/fonts/TTSupermolotNeueTrial-Medium.ttf') format('truetype');font-weight:500;font-display:block;}
  /* GamerCult's face, Bricolage Grotesque (SIL OFL -- bundled, served with
     the pages): the 24pt SemiBold its table is set in, the 48pt ExtraBold
     of its heavy lettering (leaned by the browser where the art leans). */
  @font-face{font-family:'GC Sans';src:url('assets/fonts/bricolage-grotesque/BricolageGrotesque_24pt-SemiBold.ttf') format('truetype');font-weight:100 900;font-display:block;}
  @font-face{font-family:'GC Black';src:url('assets/fonts/bricolage-grotesque/BricolageGrotesque_48pt-ExtraBold.ttf') format('truetype');font-weight:100 900;font-display:block;}
  #backdrop, #backdropFoot { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #backdropFoot { display: none; }

  /* The elimination card, in THIS page rather than a source of its own.
     ---------------------------------------------------------------
     It belongs here because it fires off the same event as the row
     animation: one squad going out. Two browser sources meant two things
     that could disagree, and one of them could be missing from the scene
     without anything saying so. Here they cannot come apart -- the card
     and the flyby are triggered by the same line of code.

     Outside #stage on purpose: the table flies in and out on its own
     schedule and the card must not travel with it. */

  /* THE ELIMINATION RACE: this match's top three fraggers, live, top left
     -- clear of the table (right), the elimination card (top centre) and
     the side pop-ups (lower left). Up and down from the dashboard. A photo
     where the player has one of their own, else the team's logo; rows
     slide into their new order and a rising count pops. */
  #race{position:absolute;left:24px;top:140px;width:420px;opacity:0;transform:translateX(-40px);pointer-events:none;
        transition:opacity .35s ease, transform .5s cubic-bezier(.16,.84,.34,1);z-index:6;
        font-family:'Supermolot Black','Supermolot',Arial,sans-serif;font-style:italic;text-transform:uppercase;}
  #race.on{opacity:1;transform:none;}
  #race .rh{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  #race .rt{font-size:22px;letter-spacing:.02em;color:#111;background:var(--race-acc,#f7941d);
            padding:6px 20px 4px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 11px) 100%,0 100%);}
  #race .rl{font-family:Arial,sans-serif;font-style:normal;font-weight:800;font-size:12px;letter-spacing:.14em;color:#fff;
            background:#e5262b;padding:3px 8px;border-radius:3px;animation:livepulse 1.4s ease-in-out infinite;}
  @keyframes livepulse{50%{opacity:.5}}
  #race .rows{position:relative;height:234px;}
  #race .rr{position:absolute;left:0;right:0;height:70px;display:flex;align-items:center;gap:10px;padding:0 18px 0 0;
            background:rgba(10,13,20,.92);clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);
            transition:top .55s cubic-bezier(.2,.8,.3,1);}
  #race .rr .rk{width:38px;align-self:stretch;display:flex;align-items:center;justify-content:center;font-size:26px;
                color:#fff;background:rgba(255,255,255,.08);}
  #race .rr.r1 .rk{background:var(--race-acc,#f7941d);color:#111;}
  #race .rr .ph{width:54px;height:54px;border-radius:50%;overflow:hidden;flex:0 0 54px;background:#0b0f14;
                box-shadow:0 0 0 3px rgba(255,255,255,.25);}
  #race .rr.r1 .ph{box-shadow:0 0 0 3px var(--race-acc,#f7941d);}
  #race .rr .ph img{width:100%;height:100%;object-fit:cover;display:block;}
  #race .rr .ph img.rlogo{object-fit:contain;padding:7px;box-sizing:border-box;}
  #race .rr .who{flex:1;min-width:0;}
  #race .rr .ign{font-size:21px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;}
  #race .rr .tm{display:flex;align-items:center;gap:6px;font-size:13px;color:#b9c2d0;}
  #race .rr .tm img{width:18px;height:18px;object-fit:contain;}
  #race .rr .k{text-align:center;min-width:56px;}
  #race .rr .k b{display:block;font-weight:400;font-size:36px;line-height:1;color:#fff;}
  #race .rr.r1 .k b{color:var(--race-acc,#f7941d);}
  #race .rr .k small{font-family:Arial,sans-serif;font-style:normal;font-weight:800;font-size:10px;letter-spacing:.12em;color:#8e99ab;}
  #race .rr.out{filter:grayscale(1) brightness(.62);}
  #race .rr .k b.pop{animation:kpop .7s cubic-bezier(.2,.9,.3,1.3);}
  @keyframes kpop{0%{transform:scale(1.7);color:#ffe97a;}100%{transform:none;}}
  #race.on .rr.enter{animation:rrin .45s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes rrin{from{opacity:0;transform:translateX(-30px);}to{opacity:1;transform:none;}}
  #race .empty{font-size:16px;color:#b9c2d0;padding:14px 16px;background:rgba(10,13,20,.85);letter-spacing:.06em;}

  /* THE WIPE BANNER: "TSG WIPED NG" -- the squad that took the last life,
     WIPED, the squad that is out -- across the top, where the elimination
     card is about to land, for a beat before it. */
  #wipeBanner{position:absolute;left:0;right:0;top:132px;display:none;justify-content:center;
              pointer-events:none;z-index:8;}
  #wipeBanner.show{display:flex;}
  #wipeBanner .wb{display:flex;align-items:center;gap:18px;height:92px;padding:0 64px;
                  background:linear-gradient(90deg,rgba(8,10,14,0),rgba(8,10,14,.93) 14%,rgba(8,10,14,.93) 86%,rgba(8,10,14,0));
                  font-family:'Supermolot Black','Supermolot',Arial,sans-serif;font-style:italic;text-transform:uppercase;}
  #wipeBanner img{width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));}
  #wipeBanner .na,#wipeBanner .nb{font-size:46px;color:#fff;white-space:nowrap;letter-spacing:.01em;}
  #wipeBanner .nb{color:#c8ceda;}
  #wipeBanner .w{font-size:28px;padding:6px 16px 4px;color:#0b0b0b;background:var(--wb-acc,#f7941d);
                 transform:skewX(-12deg);letter-spacing:.08em;}
  #wipeBanner.show.in .wb{animation:wbin .5s cubic-bezier(.2,.9,.3,1.15) both;}
  #wipeBanner.show.in .w{animation:wbflash .9s ease .25s both;}
  #wipeBanner.show.out .wb{animation:wbout .32s cubic-bezier(.55,0,.85,.35) both;}
  @keyframes wbin{from{opacity:0;transform:scale(.8) translateY(-14px);}to{opacity:1;transform:none;}}
  @keyframes wbout{to{opacity:0;transform:translateY(-12px) scale(.96);}}
  @keyframes wbflash{0%{filter:brightness(2.2);}100%{filter:none;}}

  #elimCard {
    position: absolute; inset: 0; display: none; z-index: 3;
    pointer-events: none;
  }
  #elimCard.show { display: block; }

  /* Its own layer for placement, because #elimInner's transform is
     spoken for by the fly-in and an element only gets one. */
  #elimPlace {
    position: absolute; inset: 0;
    transform-origin: var(--elim-cx, 960px) var(--elim-cy, 540px);
  }
  #elimInner { position: absolute; inset: 0; top: var(--top4-clear, 0px); transition: top .35s ease; }

  @keyframes ff-elim-in  { from { opacity: 0; transform: translate(var(--elim-travel-x, 0px), var(--elim-travel, -520px)); }
                           to   { opacity: 1; transform: translate(0, 0); } }
  @keyframes ff-elim-out { from { opacity: 1; transform: translate(0, 0); }
                           to   { opacity: 0; transform: translate(var(--elim-travel-x-out, 0px), var(--elim-travel, -520px)); } }
  /* The team's group photo, between the artwork and the text -- in front
     of the package's lettering, the way its demo has it. */
  /* The whole photo, always: fitted INSIDE its box, never filled and
     trimmed. The team photos are 832 x 274 strips; a box of another shape
     trimmed their ends, and the players standing there lost their faces. */
  #elimPhoto { position: absolute; display: none; object-fit: contain; object-position: center bottom; }
  /* In it overshoots very slightly and settles; out it accelerates away,
     because a graphic being pulled should leave rather than drift. */
  #elimCard.in  #elimInner { animation: ff-elim-in  620ms cubic-bezier(0.18, 0.96, 0.32, 1) both; }
  #elimCard.out #elimInner { animation: ff-elim-out 420ms cubic-bezier(0.55, 0, 0.85, 0.35) both; }

  #elimArt { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  /* The card's art again, in front of the photo, cut to the parts the
     photo stands behind (C.over: GamerCult's bars and logo box). */
  #elimOver { position: absolute; inset: 0; width: 1920px; height: 1080px; display: none; }
  #elimLogo {
    position: absolute;
    left: var(--elim-logo-x); top: var(--elim-logo-y);
    width: var(--elim-logo-w); height: var(--elim-logo-h);
    display: flex; align-items: center; justify-content: center;
  }
  #elimLogo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #elimName {
    position: absolute;
    left: var(--elim-name-x); top: var(--elim-name-y);
    width: var(--elim-name-w); height: var(--elim-name-h);
    display: flex; align-items: center; justify-content: center;
    color: var(--elim-name-ink, #ffffff); font-weight: 700; font-size: var(--elim-name-size);
    letter-spacing: 0.5px; text-transform: uppercase;
    white-space: nowrap; overflow: hidden;
  }
  #elimRank {
    position: absolute;
    left: var(--elim-rank-x); top: var(--elim-rank-y);
    width: var(--elim-rank-w); height: var(--elim-rank-h);
    display: flex; align-items: center; justify-content: center;
    /* NOT white: this label sits on the card's white corner, so white on
       white is invisible -- which is why the position never appeared. The
       designer's own reference draws it in the deep violet below. */
    color: var(--elim-rank-ink, #351590);
    font-weight: 700; font-size: var(--elim-rank-size);
  }

  /* Rows sit above the backdrop image in their own layer. */
  #rows { position: absolute; inset: 0; z-index: 1; }

  /* Each row carries its OWN copy of the box, cropped live out of the
     backdrop artwork (see ROW_STRIP in the script). The boxes are drawn
     into ALIVE STATUS.png, so without this only the text and icons slid
     while the boxes stayed put -- the contents appeared to crawl
     between stationary frames. Painting an identical strip onto the
     moving row covers the static one beneath it exactly, so the whole
     box travels. Needs no new artwork: every row in that PNG is the
     same, so one strip serves all twelve. */
  .row {
    position: absolute;
    height: var(--row-h); left: var(--row-x); width: var(--row-w);
    background-repeat: no-repeat;
    /* Contains the fire overlay's screen blend to THIS row. Without it
       the blend reaches past the row into whatever is painted behind
       it, so the flame would brighten the backdrop and its neighbours
       instead of only the box it belongs to. */
    isolation: isolate;
  }

  /* The slot number. Hidden on a package whose artwork already prints
     01..12 into the box (CLT does; GC leaves the column empty), which is
     what --rank-display carries. */
  .rank {
    position: absolute; display: var(--rank-display);
    left: var(--rank-x); top: 0; width: var(--rank-w); height: var(--row-h);
    align-items: center; justify-content: var(--rank-align, center);
    color: var(--rank-ink, var(--ink)); font-weight: 800; font-size: var(--rank-size);
    font-variant-numeric: tabular-nums;
  }
  .logo {
    position: absolute; left: var(--logo-x); top: 0;
    width: var(--logo-w); height: var(--row-h);
    display: var(--logo-display, flex); align-items: center; justify-content: center;
  }
  .logo img {
    max-width: var(--logo-img); max-height: var(--logo-img); object-fit: contain;
  }

  .name {
    position: absolute; left: var(--name-x); top: 0;
    width: var(--name-w); height: var(--row-h);
    display: flex; align-items: center; justify-content: var(--name-align);
    color: var(--name-ink, var(--ink)); font-weight: var(--name-weight, 700); font-size: var(--name-size);
    letter-spacing: 0.2px;
    text-transform: uppercase; white-space: nowrap; overflow: hidden;
  }

  /* Points: total carried in from earlier games plus this game's own
     score. Only the packages that have a PTS. column show it. */
  .points {
    position: absolute; display: var(--points-display);
    left: var(--points-x); top: 0; width: var(--points-w); height: var(--row-h);
    align-items: center; justify-content: center;
    color: var(--ink); font-weight: 800; font-size: var(--num-size);
    font-variant-numeric: tabular-nums;
  }

  .kills {
    position: absolute; left: var(--kills-x); top: 0;
    width: var(--kills-w); height: var(--row-h);
    display: flex; align-items: center; justify-content: center;
    color: var(--kills-ink, var(--ink)); font-weight: 800; font-size: var(--num-size);
    font-variant-numeric: tabular-nums;
  }

  /* The STATUS pip -- YOUR artwork, unmodified (Dead.png /
     1..4_alive.png), picked by alive count. Nothing is drawn here; this
     only crops the supplied PNG down to its own content.

     Measured from the files themselves: all five are a 500x500 canvas
     whose visible content sits at x 11..487, y 140..359 -- 477x220,
     so 2.17:1. The scale is UNIFORM on both axes, unlike the old
     design's (which stretched each axis independently to fill a slot
     that happened to be nearly the same ratio). Stretching into this
     design's wider STATUS column turned the bars into fat squares --
     they're meant to stay the proportions they were drawn at:

       factor = 36/220 = 0.163636
       background-size  = 500 x factor        -> 81.8px
       background-position = -11 x f, -140 x f -> -1.8px, -22.9px
       displayed content   = 477 x f = 78px wide, 36px tall */
  .status-pip {
    position: absolute;
    left: var(--pip-x); top: var(--pip-y);
    width: var(--pip-w); height: var(--pip-h);
    background-repeat: no-repeat;
    background-size: var(--pip-size) var(--pip-size);
    background-position: var(--pip-px) var(--pip-py);
  }

  /* A wiped squad's whole row dims, so "who is still in" reads at a
     glance rather than needing the pip alone to carry it. */
  .row.out .name { opacity: 0.55; }
  .row.out .logo img { filter: grayscale(1); opacity: 0.5; }

  /* Operator-set markers -- in the zone, or on a run. Both breathe
     rather than sit still, because a static tint on a dark red box
     reads as a rendering artefact; movement is what says "this is
     deliberate". Kept low: these mark a squad, they don't announce
     themselves over the name and numbers sitting on top of them.
     Painted with an inset shadow so the glow follows the box's own
     edges, including the notch cut out of its left side. */
  .row.zone { animation: ff-zone-glow 2.4s ease-in-out infinite; }
  @keyframes ff-zone-glow {
    0%, 100% { box-shadow: inset 0 0 14px 2px rgba(40, 140, 255, 0.20); }
    50%      { box-shadow: inset 0 0 22px 5px rgba(60, 170, 255, 0.42); }
  }

  /* A squad on a run: the box glowing, and nothing else.

     It has been two other things. Flame drifting across the row, which
     moved over the name and the numbers and made them hard to read; and
     then a frame of fire around the edge, which was legible but busy on
     a box 43px tall sitting 1px from its neighbours. This is what is
     wanted on air -- the box lit from its rim inward, weighted from
     below, breathing. Nothing travels, and nothing crosses the text.

     Screen only ever brightens, so it LIGHTS the artwork rather than
     laying orange over it: the dark part of the glow disappears instead
     of greying the box. */
  .row.fire::before {
    content: ""; position: absolute; inset: 0; z-index: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    box-shadow:
      inset 0  0 15px  2px rgba(255,142,22,.62),
      inset 0  0 40px 10px rgba(255,70,0,.30),
      /* Weighted from below, the way a fire lights a thing standing in
         it -- an even rim glow reads as a selection highlight. */
      inset 0 -8px 18px -5px rgba(255,100,0,.26);
    animation: ff-fire-glow 1.45s ease-in-out infinite alternate;
  }
  @keyframes ff-fire-glow {
    from { opacity: .62; }
    to   { opacity: .95; }
  }

  /* Keeps the text above the glow. */
  .row .rank, .row .points,
  .row .logo, .row .name, .row .kills, .row .status-pip { z-index: 1; }
  /* A face whose own spacing sits it off the row's centre (GNG's Moanslight
     rides 5px high) is put back where the package's demo has it. */
  .row .rank, .row .name, .row .kills, .row .points { transform: translateY(var(--text-dy, 0px)); }
  .row .logo { transform: translateY(var(--logo-dy, 0px)); }

  /* A squad can be in the zone AND on a run. These no longer fight:
     the zone tints the inside via box-shadow, fire rings the outside
     via ::before, so both simply show. */

  /* Rows slide to their new slot instead of snapping. This only works
     because a row's element PERSISTS between updates (see rowEls in the
     script) -- the old version rebuilt all twelve from scratch on every
     change, so there was never an old position to animate from.

     Slow enough to read as travel: a squad eliminated out of row 1 has
     eleven rows to cross, and at a snappier duration that reads as a
     jump rather than a fall. The ease-in-out start and finish are what
     make a long move look deliberate instead of thrown. */
  /* Champion Rush: the package's crown tile just outside the row, for a
     team that has activated -- only where the package has a tile, and
     only while the emblem is switched on. */
  .crtile {
    position: absolute; top: 0; left: var(--cr-x, -47px); width: var(--cr-w, 45px);
    height: var(--row-h); background-size: 100% 100%; background-repeat: no-repeat;
    opacity: 0; transform: translateX(14px);
    transition: opacity .4s ease, transform .5s cubic-bezier(.2,.9,.3,1);
  }
  .row.cr .crtile { opacity: 1; transform: none; }
  .row { transition: top 900ms cubic-bezier(0.65, 0, 0.35, 1); }
  .row.no-anim { transition: none; }

  /* ---- the elimination flyby ----------------------------------------
     Runs on the row that just went out, BEFORE anything re-sorts: the
     word sweeps across, and only once it's gone does the table reorder
     (see the hold in applyRows). Two copies of the text, the back one
     offset and dimmed, give the motion-trail look without needing a
     video or sprite sheet. Clipped to the row so it never bleeds into
     the rows above and below while it travels. */
  .flyby {
    position: absolute; inset: 0; overflow: hidden;
    pointer-events: none; display: none;
  }
  .flyby.on { display: block; }
  .flyby .word {
    position: absolute; top: 50%; left: 0;
    transform: translate(-120%, -50%);
    font-style: italic; font-weight: 900; font-size: 26px;
    letter-spacing: 1px; white-space: nowrap;
    /* White word, glowing and trailing in the package's own accent --
       a graphic's alert should read as part of its design rather than
       as a colour borrowed from somewhere else. */
    color: #ffffff; text-shadow: 0 0 18px var(--accent-glow);
  }
  .flyby .word.trail {
    color: var(--accent); opacity: 0.55; filter: blur(1px);
  }
  .flyby.on .word       { animation: ff-flyby 1150ms cubic-bezier(0.16, 0.84, 0.3, 1) both; }
  .flyby.on .word.trail { animation: ff-flyby 1150ms cubic-bezier(0.16, 0.84, 0.3, 1) both;
                          animation-delay: 55ms; }
  @keyframes ff-flyby {
    0%   { transform: translate(-130%, -50%) skewX(-12deg); opacity: 0; }
    18%  { opacity: 1; }
    55%  { transform: translate(28%, -50%) skewX(-12deg); opacity: 1; }
    100% { transform: translate(150%, -50%) skewX(-12deg); opacity: 0; }
  }

  /* The row itself flares in the package's accent under the flyby,
     then settles into the
     permanent dim above. */
  @keyframes ff-elim-flash {
    0%   { box-shadow: inset 0 0 0 999px var(--accent-flash-0); }
    20%  { box-shadow: inset 0 0 0 999px var(--accent-flash-1); }
    100% { box-shadow: inset 0 0 0 999px var(--accent-flash-0); }
  }
  .row.just-eliminated { animation: ff-elim-flash 1150ms ease-out; }
  /* A REVIVE: the player's name and REVIVED across the row in green, the
     row flaring green under it. Slower than ELIMINATED -- there is a name
     to read: it slides in, holds centred on the row (drifting a touch),
     then slides out (REVIVE_MS). The trail shows only while it moves. */
  /* centred left of the status bars, which stay in view: the bar coming
     back is half of what a revive is */
  .flyby.rev .word { left: 37%; font-size: 22px; text-shadow: 0 0 18px rgba(46, 230, 120, .95); }
  .flyby.rev .word.trail { color: #2ee678; }
  .flyby.rev.on .word       { animation: ff-revive 3200ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }
  .flyby.rev.on .word.trail { animation: ff-revive-trail 3200ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
                              animation-delay: 70ms; }
  @keyframes ff-revive {
    0%   { transform: translate(-250%, -50%) skewX(-12deg); opacity: 0; }
    12%  { transform: translate(-50%, -50%) skewX(-12deg); opacity: 1; }
    84%  { transform: translate(-43%, -50%) skewX(-12deg); opacity: 1; }
    100% { transform: translate(150%, -50%) skewX(-12deg); opacity: 0; }
  }
  @keyframes ff-revive-trail {
    0%   { transform: translate(-250%, -50%) skewX(-12deg); opacity: 0; }
    12%  { transform: translate(-50%, -50%) skewX(-12deg); opacity: .55; }
    18%  { transform: translate(-49%, -50%) skewX(-12deg); opacity: 0; }
    80%  { transform: translate(-44%, -50%) skewX(-12deg); opacity: 0; }
    86%  { transform: translate(-40%, -50%) skewX(-12deg); opacity: .55; }
    100% { transform: translate(150%, -50%) skewX(-12deg); opacity: 0; }
  }
  @keyframes ff-rev-flash {
    0%   { box-shadow: inset 0 0 0 999px rgba(46, 230, 120, 0); }
    10%  { box-shadow: inset 0 0 0 999px rgba(46, 230, 120, .42); }
    80%  { box-shadow: inset 0 0 0 999px rgba(46, 230, 120, .28); }
    100% { box-shadow: inset 0 0 0 999px rgba(46, 230, 120, 0); }
  }
  .row.just-revived { animation: ff-rev-flash 3200ms ease-out; }
  /* the row's own rank, logo, name and kills fade out under the words
     while they hold, so the player's name reads clean */
  @keyframes ff-rev-dim {
    0%, 100% { opacity: 1; }
    10%, 82% { opacity: 0.08; }
  }
  .row.just-revived .rank, .row.just-revived .logo, .row.just-revived .name,
  .row.just-revived .kills, .row.just-revived .points { animation: ff-rev-dim 3200ms ease-in-out both; }
  /* ---- TOP 4: the final squads across the top, pushed on its own ----
     Separate from the side table so the operator can pull the table down
     once four remain and keep this up. Drawn from the package's artwork
     (cards, the WIN RATE tab and its label are all in it); the logo, the
     four alive bars and the percentage are filled in. */
  /* Above the elimination card (z 3): lifted clear of it (see lift), and
     where the two still touch, the bar stays readable. */
  #top4 { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
          pointer-events: none; z-index: 5; }
  #top4 .t4bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
                opacity: 0; transition: opacity .35s ease; }
  #top4.show .t4bg { opacity: 1; }
  /* One card per team, each its own piece of the art (or, for ARROW,
     drawn), so a card can leave and the rest close up. They glide to their
     new places once a leaving card has gone (--slide). */
  #top4 .t4card { position: absolute; top: 0; width: 252px; height: 131px;
                  background-repeat: no-repeat; background-size: 1920px 1080px;
                  opacity: 0; transform: translateY(-120px);
                  transition: opacity .35s ease var(--enter, 0s),
                              transform .6s cubic-bezier(.2,.9,.3,1.1) var(--enter, 0s),
                              left .75s cubic-bezier(.45,0,.2,1) var(--slide, 0s); }
  #top4.show .t4card { opacity: 1; transform: none; }
  #top4 .t4card.leaving { opacity: 0 !important; transform: translateY(-34px) scale(.9) !important;
                          transition: opacity .45s ease, transform .45s ease !important; }
  /* ARROW: no art for this bar -- each card drawn from the kit. */
  #top4 .t4card.kit .t4panel { position: absolute; left: 0; top: 32px; width: 252px; height: 66px;
      background: linear-gradient(115deg,rgba(255,255,255,.07) 0 30%,transparent 30%), linear-gradient(180deg,#1d4720,#0f2711);
      box-shadow: inset 0 0 0 2px #f2f2f2; }
  #top4 .t4card.kit .t4plate { position: absolute; left: 60px; top: 98px; width: 192px; height: 32px;
      background: url('assets/freefire/kit/arrow_satin.png') center/cover, #f2f2f2;
      clip-path: polygon(10px 0,100% 0,100% 100%,0 100%); }
  #top4 .t4card.kit .t4lab { position: absolute; left: 76px; top: 98px; height: 32px; display: flex; align-items: center;
      font-family: 'SMBI', Arial, sans-serif; font-size: 15px; color: #151515; }
  #top4 .t4logo { position: absolute; display: flex; align-items: center; justify-content: center; }
  #top4 .t4logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #top4 .t4bar { position: absolute; background: var(--t4-alive, #ffffff); border-radius: 1px;
                 transition: background .3s ease, opacity .3s ease; }
  #top4 .t4bar.down { background: var(--t4-dead, rgba(0, 0, 0, .38)); }
  /* GNG: the team's tag in the card where other packages put the logo. */
  #top4 .t4name { position: absolute; display: flex; align-items: center; white-space: nowrap;
                  overflow: hidden; text-transform: uppercase; line-height: 1; }
  #top4 .t4win { position: absolute; text-align: right; font-family: var(--top4-face, var(--face));
                 font-weight: 900; line-height: 1; white-space: nowrap; }
  /* ---- SIDE POP-UPS: first blood, kill leader, rampage... ----
     One card at a time, in from the side and back out, from the package's
     achievement artwork; the title, number, label, player, team and photo
     are filled in. Queued: two firing together play one after the other. */
  #popCard { position: absolute; inset: 0; pointer-events: none; z-index: 4; display: none; }
  #popCard.show { display: block; }
  #popInner { position: absolute; inset: 0; }
  #popCard.in  #popInner { animation: ff-pop-in 560ms cubic-bezier(.18,.96,.32,1) both; }
  #popCard.out #popInner { animation: ff-pop-out 380ms cubic-bezier(.55,0,.85,.35) both; }
  @keyframes ff-pop-in  { from { opacity: 0; transform: translateX(var(--pop-travel, -360px)); }
                          to   { opacity: 1; transform: none; } }
  @keyframes ff-pop-out { from { opacity: 1; transform: none; }
                          to   { opacity: 0; transform: translateX(var(--pop-travel, -360px)); } }
  #popArt { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #popInner .pp { position: absolute; display: flex; align-items: center; justify-content: center;
                  text-align: center; white-space: nowrap; overflow: hidden;
                  font-family: var(--face); font-weight: 900; line-height: 1.02; }
  #popTitle { white-space: normal !important; text-transform: uppercase; }
  /* The photo sits whole in its box, feet on the strip (the folder's
     photos are cut out, so the box shows round them)... */
  #popPhoto { position: absolute; object-fit: contain; object-position: center bottom; }
  /* ...and the strip in front of it: the same art again, clipped to the
     ribbon, the logo box and the name bar (A.over), so the player stands
     behind them as the design has it rather than pasted over the top. */
  /* ---- THE ZONE TIMER BUG ------------------------------------------
     The zone's countdown -- ZONE SHRINKS IN 0:40, then ZONE SHRINKING
     while it closes -- with the squads still standing under it, logo and
     tag. Where the elimination card goes (#zonePlace; moved from Graphic
     Fixing as "zoneBug"), stepping aside while a card or a wipe banner is
     up. Drawn here, in the package's own colours (ZB_THEMES), rather than
     baked into an image: the squad list changes length all match. */
  #zonePlace { position: absolute; left: 746px; top: 101px; width: 428px;
               transform-origin: center top; z-index: 2; pointer-events: none; }
  #zoneBug { margin-top: var(--top4-clear, 0px); }
  #zoneBug { position: relative; width: 428px; display: none;
             font-family: var(--zb-face, Arial), Arial, sans-serif;
             transition: opacity .25s ease, transform .25s ease; }
  #zoneBug.show { display: block; }
  #zoneBug.yield { opacity: 0; transform: translateY(-10px); }
  .zb-head { position: relative; height: 66px; overflow: hidden;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.045) 0 2px, transparent 2px 20px),
                linear-gradient(120deg, var(--zb-a, #262626) 0%, var(--zb-b, #0e0e0e) 100%);
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); }
  .zb-stage { position: absolute; left: 0; top: 0; height: 22px; padding: 0 16px 0 12px;
    display: flex; align-items: center; background: var(--zb-acc, #f7941d); color: var(--zb-dark, #111);
    font-size: 13px; font-weight: 800; letter-spacing: 1.5px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .zb-label { position: absolute; left: 14px; top: 29px; font-size: 22px; font-weight: 800;
    letter-spacing: 1px; color: var(--zb-ink, #f2f2f2); white-space: nowrap; }
  .zb-time { position: absolute; right: 20px; top: 5px; height: 56px; display: flex; align-items: center;
    font-size: 46px; font-weight: 800; color: var(--zb-acc, #f7941d); letter-spacing: 1px;
    font-variant-numeric: tabular-nums; }
  .zb-time span { display: inline-block; }
  .zb-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.08); }
  .zb-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--zb-frac, 100%);
    background: var(--zb-acc, #f7941d); box-shadow: 0 0 10px var(--zb-acc, #f7941d); transition: width .95s linear; }
  #zoneBug.untimed .zb-time, #zoneBug.untimed .zb-bar { display: none; }
  .zb-teams { position: relative; margin-top: 4px; padding: 8px 10px 10px; transform-origin: top center;
    background: linear-gradient(180deg, var(--zb-b, #0e0e0e) 0%, rgba(0,0,0,.84) 100%);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
  .zb-count { font-size: 12px; letter-spacing: 2px; color: var(--zb-acc, #f7941d); font-weight: 800; margin: 0 0 7px 2px; }
  .zb-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px 4px; }
  .zb-team { display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: opacity .4s ease, transform .4s ease, filter .4s ease; }
  .zb-team .lg { width: 40px; height: 34px; display: flex; align-items: center; justify-content: center; }
  .zb-team .lg img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .zb-team .sn { font-size: 13px; font-weight: 800; color: var(--zb-ink, #f2f2f2); letter-spacing: .5px;
    white-space: nowrap; max-width: 66px; overflow: hidden; }
  .zb-team.gone { opacity: 0; transform: scale(.55); filter: grayscale(1); }

  /* In: the head wipes open from the left, the squads unfold under it and
     pop in one after another. Out: it lifts away. */
  #zoneBug.in .zb-head { animation: zb-wipe .5s cubic-bezier(.2,.8,.25,1) both; }
  #zoneBug.in .zb-teams { animation: zb-unfold .36s cubic-bezier(.2,.8,.25,1) .24s both; }
  #zoneBug.in .zb-team, .zb-team.new { animation: zb-pop .32s ease-out both;
    animation-delay: calc(.38s + var(--i, 0) * 40ms); }
  .zb-team.new { animation-delay: 0s; }
  #zoneBug.out { animation: zb-out .3s cubic-bezier(.55,0,.85,.35) both; }
  @keyframes zb-wipe {
    from { clip-path: polygon(0 0, 0 0, 0 18px, 0 100%, 0 100%, 0 calc(100% - 16px)); }
    to   { clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); }
  }
  @keyframes zb-unfold { from { transform: scaleY(0); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes zb-pop { from { opacity: 0; transform: translateY(7px) scale(.88); } to { opacity: 1; transform: none; } }
  @keyframes zb-out { to { opacity: 0; transform: translateY(-14px); } }
  /* every second the figure drops in; in the last ten it pulses and the
     head is ringed in the accent */
  .zb-time span.tick { animation: zb-tick .24s ease-out; }
  @keyframes zb-tick { from { transform: translateY(-5px) scale(1.08); opacity: .55; } to { transform: none; opacity: 1; } }
  #zoneBug.urgent .zb-time { animation: zb-urgent 1s ease-in-out infinite; }
  @keyframes zb-urgent { 0%, 100% { color: var(--zb-acc, #f7941d); text-shadow: none; }
                         50% { color: #fff; text-shadow: 0 0 18px var(--zb-acc, #f7941d); } }
  #zoneBug.urgent .zb-head::before { content: ""; position: absolute; inset: 0; z-index: 1;
    box-shadow: inset 0 0 0 2px var(--zb-acc, #f7941d); animation: zb-ring 1s ease-in-out infinite; }
  @keyframes zb-ring { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  /* a new phase: the words slide in, a shine crosses the head */
  .zb-label.swap { animation: zb-swap .4s cubic-bezier(.2,.8,.25,1) both; }
  @keyframes zb-swap { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
  .zb-head.shine::after { content: ""; position: absolute; top: 0; bottom: 0; left: -120px; width: 90px; z-index: 2;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.26), transparent);
    animation: zb-shine .9s ease-out both; }
  @keyframes zb-shine { to { left: 470px; } }
  #popOver { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
  #popLogo img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* ---- TOP 5 ELIMINATION LEADERS -------------------------------------
     Pushed from the In-Game tab (settings.killLeadersUp): the five with
     the most eliminations this match, where the side table stands -- the
     table steps down while it is up and comes back when it is pulled.
     The package's own colours (ZB_THEMES) and faces, like the zone bug. */
  #leaders { position: absolute; left: 1530px; top: 250px; width: 380px; z-index: 3; pointer-events: none;
             display: none; color: var(--zb-ink, #f2f2f2); font-family: var(--ld-bold, Arial), Arial, sans-serif; }
  #leaders.show { display: block; }
  .ld-head { position: relative; height: 62px; overflow: hidden;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 20px),
                linear-gradient(120deg, var(--zb-a, #262626) 0%, var(--zb-b, #0e0e0e) 100%);
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); }
  .ld-head::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--zb-acc, #f7941d); }
  .ld-head .k { position: absolute; left: 22px; top: 8px; font-size: 14px; letter-spacing: 4px; color: var(--zb-acc, #f7941d); }
  .ld-head .t { position: absolute; left: 22px; top: 26px; font-size: 25px; letter-spacing: .5px; white-space: nowrap; }
  .ld-rows { position: relative; margin-top: 8px; }
  .ld-row { position: absolute; left: 0; right: 0; height: 76px; transition: top .45s cubic-bezier(.2,.8,.25,1), opacity .4s, filter .4s; }
  .ld-row .bg { position: absolute; inset: 0;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 2px, transparent 2px 18px),
                linear-gradient(100deg, var(--zb-a, #262626) 0%, var(--zb-b, #0e0e0e) 100%);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
  .ld-row.r1 .bg::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--zb-acc, #f7941d); }
  .ld-row .rk { position: absolute; left: 0; top: 0; width: 46px; height: 28px; z-index: 2;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    background: var(--zb-acc, #f7941d); color: var(--zb-dark, #111);
    clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
  .ld-row .ph { position: absolute; left: 50px; bottom: 0; width: 80px; height: 76px; z-index: 1;
    display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .ld-row .ph img { max-width: 100%; max-height: 100%; object-fit: contain; object-position: center bottom; }
  .ld-row .ph img.logo { max-width: 50px; max-height: 50px; margin-bottom: 13px; }
  .ld-row .who { position: absolute; left: 138px; right: 100px; top: 13px; }
  .ld-row.bare .who { left: 58px; top: 22px; }
  .ld-row .ign { font-size: 21px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-transform: uppercase; }
  .ld-row .tm { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 13px; letter-spacing: 1px;
    color: var(--zb-acc, #f7941d); white-space: nowrap; overflow: hidden; font-family: var(--ld-face, Arial), Arial, sans-serif; }
  .ld-row .tm img { width: 20px; height: 20px; object-fit: contain; }
  .ld-row .val { position: absolute; right: 0; top: 11px; bottom: 11px; width: 94px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    background: var(--zb-acc, #f7941d); color: var(--zb-dark, #111);
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%); }
  .ld-row .val b { font-size: 31px; font-weight: 400; line-height: 1; display: inline-block; }
  .ld-row .val small { font-size: 11px; letter-spacing: 1px; }
  .ld-row.out { opacity: .62; filter: grayscale(.85); }
  .ld-empty { position: relative; height: 54px; display: flex; align-items: center; justify-content: center; font-size: 16px;
    letter-spacing: 2px; background: linear-gradient(100deg, var(--zb-a, #262626), var(--zb-b, #0e0e0e)); }
  /* In: the head wipes open, the five slide in one after another. Out: it lifts away. */

   tab has to carry ?relay=wss://... forever, and one that is missing it

function aliveFolder(state){
  const ev = (state && state.event) || {};
  return ev.aliveAssetFolder || ev.assetFolder || "CLT";
}

function layoutFor(state){
  return LAYOUTS[aliveFolder(state)] || LAYOUTS.CLT;
}

let activeLayout = null;

/* Writes the layout into CSS custom properties. Only on a real change:
   this runs on every sync, and rewriting a dozen properties on the root
   element four times a second invalidates style for the whole page. */
// The operator's text size for the table (settings.aliveTextScale, the
// in-game tab's - / +): the rank, the name and the kills, together.
let textScale = 1;
function applyLayout(L, showPoints){
  const sig = JSON.stringify([L.row, L.ink, L.nameInk, L.killsInk, L.face, L.rank, L.logo, L.name, L.kills, L.pip, L.textDy, showPoints, textScale]);
  if(activeLayout === sig) return;
  activeLayout = sig;
  const r = document.documentElement.style;
  r.setProperty("--row-x", L.row.x + "px");
  r.setProperty("--row-w", L.row.w + "px");
  r.setProperty("--row-h", L.row.h + "px");
  r.setProperty("--ink", L.ink);
  // Per-column ink where a package needs it (PRG ARROW: dark names on its
  // light band, light numbers on its green); otherwise every cell is --ink.
  r.setProperty("--rank-ink", L.rankInk || L.ink);
  r.setProperty("--name-ink", L.nameInk || L.ink);
  r.setProperty("--kills-ink", L.killsInk || L.ink);
  r.setProperty("--rank-display", L.rank ? "flex" : "none");
  r.setProperty("--rank-x", ((L.rank && L.rank.x) || 0) + "px");
  r.setProperty("--rank-w", ((L.rank && L.rank.w) || 0) + "px");
  r.setProperty("--rank-size", ((L.rank && L.rank.size) || 16) * textScale + "px");
  r.setProperty("--rank-align", (L.rank && L.rank.align) || "center");
  r.setProperty("--text-dy", (L.textDy || 0) + "px");
  // A package whose table has no logo column passes logo: null.
  r.setProperty("--logo-display", L.logo ? "flex" : "none");
  r.setProperty("--logo-x", ((L.logo && L.logo.x) || 0) + "px");
  r.setProperty("--logo-w", ((L.logo && L.logo.w) || 0) + "px");
  r.setProperty("--logo-img", ((L.logo && L.logo.img) || 0) + "px");
  r.setProperty("--logo-dy", ((L.logo && L.logo.dy) || 0) + "px");
  // bigger text: the name steps right as far as the rank grew, so "10"
  // does not run into it
  const grow = (textScale > 1 && L.rank) ? Math.round((L.rank.w || 0) * (textScale - 1)) : 0;
  r.setProperty("--name-x", L.name.x + grow + "px");
  r.setProperty("--name-w", L.name.w - grow + "px");
  r.setProperty("--name-size", L.name.size * textScale + "px");
  r.setProperty("--name-align", L.name.align);
  r.setProperty("--name-weight", String(L.name.weight || 700));
  // The points column exists only where the package HAS one and the
  // operator is running the variant that shows it.
  const pts = L.points && showPoints;
  r.setProperty("--points-display", pts ? "flex" : "none");
  r.setProperty("--points-x", ((L.points && L.points.x) || 0) + "px");
  r.setProperty("--points-w", ((L.points && L.points.w) || 0) + "px");
  r.setProperty("--kills-x", L.kills.x + "px");
  r.setProperty("--kills-w", L.kills.w + "px");
  r.setProperty("--num-size", L.kills.size * textScale + "px");
  r.setProperty("--pip-x", L.pip.x + "px");
  r.setProperty("--pip-y", L.pip.y + "px");
  r.setProperty("--pip-w", L.pip.w + "px");
  r.setProperty("--pip-h", L.pip.h + "px");
  r.setProperty("--pip-size", L.pip.size + "px");
  r.setProperty("--pip-px", L.pip.px + "px");
  r.setProperty("--pip-py", L.pip.py + "px");
  // Shrinking anchors to the panel's own vertical centre, which differs
  // per package: CLT's box runs y 247..905, GC's 254..818.
  r.setProperty("--panel-origin-y", L.originY + "px");
  r.setProperty("--face", L.face);
  r.setProperty("--top4-face", L.face);
  r.setProperty("--accent", L.accent);
  r.setProperty("--accent-glow", L.accentGlow);
  r.setProperty("--accent-flash-0", L.accentFlash[0]);
  r.setProperty("--accent-flash-1", L.accentFlash[1]);
}

// Set from the active layout on every apply(). The strip each moving row
// wears is cropped from row 1's own box, so it travels with its contents.
let ROW_TOPS = LAYOUTS.CLT.rowTops;
let ROW_BLOCK = { x: LAYOUTS.CLT.row.x, y: ROW_TOPS[0] };
// What goes before the slot number: "#" for a package whose reference
// render reads "#1", nothing for one that prints a bare "01".
let RANK_PREFIX = "";
// ...and after it: "." for GNG, which prints "1." .. "12.".
let RANK_SUFFIX = "";

let _lastRoster = null;
// Each squad's Team_Photo from the engine's photo folder, by roster team
// name ("__default__" for one without), sent on their own message.
const teamPhotoCache = {};
let ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "side_popup"){
      queuePopup(msg.popup);
      return;
    }
    if(msg.type === "row_revive"){
      reviveRow(msg);
      return;
    }
    if(msg.type === "zone_clock"){
      zoneClock(msg.clock);
      return;
    }
    if(msg.type === "race_photos"){
      Object.assign(racePhotos, msg.photos || {});
      if(lastState) renderRace(lastState);
      return;
    }
    if(msg.type === "team_photos"){
      Object.assign(teamPhotoCache, msg.photos || {});
      const card = document.getElementById("elimCard");
      if(lastState && currentElimRow && card.classList.contains("show")){
        const C = layoutFor(lastState).elimCard;
        if(C) setElimPhoto(lastState, currentElimRow, C);
      }
      return;
    }
    if(msg.type === "state_sync"){
      /* The engine leaves `roster` out of a state_sync when it has not
         changed since the last one. It is 220KB of team logos and it is
         the same all match, and re-sending it three times a second was
         saturating the uplink to the relay -- which showed up as this
         graphic trailing the game while the dashboard looked instant.
         Every client is sent a complete state on connect, so holding the
         last roster we were given and putting it back keeps everything
         below here working on a whole state, exactly as before. */
      if(msg.data){
        if(msg.data.roster) _lastRoster = msg.data.roster;
        else if(_lastRoster) msg.data.roster = _lastRoster;
      }
      apply(msg.data);
      try { renderRace(msg.data); } catch(e){ console.error("race:", e); }
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function assetBase(state){
  // Encoded: "PRG ARROW" has a space, and its files do too.
  return "assets/freefire/" + encodeURIComponent(aliveFolder(state)) + "/";
}

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

/* Order, in two blocks.

   STILL ALIVE, at the top: most kills first, teams level on kills split
   by who has more players still up.

   ELIMINATED, below them: stacked from the bottom in the order they
   went out. The first squad wiped sits on the very last row and stays
   there; each one after it lands directly above the previous casualty.
   So a team leaving row 1 travels all the way down on the first
   elimination, and only as far as the row above the last casualty
   later on -- which is also its real placement.

   Elimination order is observed here rather than taken from the data:
   link_live_teams() supplies a placement the moment it sees a wipe, but
   the alive grid doesn't, and a row can come from either. Counting the
   transitions as they happen works the same for both. placement is
   still used as the seed for anything already eliminated before this
   page loaded, so a mid-match refresh doesn't lose the stack. */
let elimSeq = new Map();     // team key -> when it went out (higher = later)
let elimCounter = 0;

function forgetHeldStatus(){ lastKnownStatus.clear(); }

function noteElimination(key, row){
  /* Where this squad finished, which is what decides its slot once it is
     out. finishRank is the engine's own answer -- 12 for the first
     casualty, 1 for the winner -- and it is the same number the
     elimination card prints, so the table and the card cannot disagree.

     A real position ALWAYS wins, even if a provisional counter value was
     recorded first. The counter only records the order this page happened
     to notice a squad was out, and a reload, a row reassignment or a
     name resolving late scrambles that: a squad that went out first could
     be noticed last and land at the top of the table. That is the row
     jumping to slot 1 on an unrelated update.

     placement is still read because the log path supplies it; the grid
     path never did, which is why the counter was doing all the work. */
  const rank = row && row.finishRank != null ? row.finishRank
             : row && row.placement != null ? row.placement
             : null;
  if(rank != null){
    const want = -rank;     // negated: higher sorts first, and 1st beats 12th
    if(elimSeq.get(key) !== want) elimSeq.set(key, want);
    return;
  }
  if(!elimSeq.has(key)) elimSeq.set(key, ++elimCounter);
}

/* A kill count can be momentarily unknown -- an unreadable frame, or a
   row whose source went quiet -- and treating that as "no kills" was
   doing real damage on air:

     - the number blanked out, then reappeared
     - the row sank to the bottom of its block and climbed back

   Both happened on any unrelated redraw, which is why editing a field
   or ticking zone/fire appeared to make the table jump around: the
   redraw simply made an already-unknown value visible.

   The last count actually seen for that team stands in until a real one
   arrives. A kill count doesn't become unknown because the squad lost
   kills -- it becomes unknown because we couldn't read it this instant,
   and the last thing we knew is a far better answer than zero. */
const ffLastKnownKills = new Map();

function effectiveKills(row){
  const key = rowKeyOf(row);
  if(row.elims != null){
    ffLastKnownKills.set(key, row.elims);
    return row.elims;
  }
  const remembered = ffLastKnownKills.get(key);
  return remembered == null ? -1 : remembered;
}

function orderRows(rows, byPoints){
  const killsOf = (r) => effectiveKills(r);
  const aliveOf = (r) => (r.aliveCount == null ? 0 : r.aliveCount);
  const ptsOf = (r) => (r.livePoints == null ? -1 : r.livePoints);

  /* With the PTS. column showing, this graphic stops being a picture of
     the lobby and becomes the scoreboard: 1st to 12th by total points,
     whether a squad is still in or not. A squad that is out with 40
     points outranks one still playing on 12, because that is what the
     standing IS -- sinking it to the bottom for being dead would be
     answering a different question from the one the column asks.

     Ties fall to this match's kills and then to the name, so two squads
     level on points hold the same order poll after poll rather than
     trading places on an unrelated update. */
  if(byPoints){
    return rows.slice().sort((a, b) => {
      const dp = ptsOf(b) - ptsOf(a);
      if(dp) return dp;
      const dk = killsOf(b) - killsOf(a);
      if(dk) return dk;
      return rowKeyOf(a) < rowKeyOf(b) ? -1 : 1;
    });
  }

  return rows.map((r, i) => ({ r, i })).sort((A, B) => {
    const a = A.r, b = B.r;
    const aOut = !!a.eliminated, bOut = !!b.eliminated;
    if(aOut !== bOut) return aOut ? 1 : -1;      // alive block on top

    if(!aOut){
      const dk = killsOf(b) - killsOf(a);
      if(dk) return dk;
      const da = aliveOf(b) - aliveOf(a);
      if(da) return da;
      // Team name, NOT the incoming array position: the engine's
      // publish order isn't fixed (a grid-only row gets appended,
      // the merge can reorder), so index-based tiebreaks let two
      // genuinely tied rows swap places on an unrelated update.
      // Comparing names gives the same answer every time.
      return rowKeyOf(a) < rowKeyOf(b) ? -1 : 1;
    }

    // Both out: ordered by where they finished, so 1st place sits
    // directly under the alive block and the first casualty ends up on
    // the bottom row. A squad with no position yet falls back to the
    // order this page saw it go -- see noteElimination.
    const sa = elimSeq.has(rowKeyOf(a)) ? elimSeq.get(rowKeyOf(a)) : 0;
    const sb = elimSeq.has(rowKeyOf(b)) ? elimSeq.get(rowKeyOf(b)) : 0;
    if(sa !== sb) return sb - sa;
    return rowKeyOf(a) < rowKeyOf(b) ? -1 : 1;
  }).map(x => x.r);
}

/* The roster team a row belongs to.

   Was an exact, case-folded name comparison, which is one character away
   from failing at any moment -- and did: the roster said DESI GAMERS and
   the client's own table says DESI GAMER, so that row got no logo and
   fell back to printing its full name where every other row showed a
   short one. One letter.

   Now the same ladder the engine uses on every other name in this
   project (match_roster_team in freefire_engine.py): exact on the full
   name, then exact on the short one, then containment either way, then
   closest match -- with a floor, so a miss stays a miss rather than
   being handed the least-bad team. */
function normaliseTeamKey(value){
  return (value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

function logoFor(teamName, roster){
  const want = normaliseTeamKey(teamName);
  if(!want) return null;
  const teams = ((roster && roster.teams) || []).filter(t => t && t.name);

  for(const t of teams) if(normaliseTeamKey(t.name) === want) return t;
  for(const t of teams) if(normaliseTeamKey(t.shortName) === want) return t;

  // Containment, but only where both sides are long enough to mean
  // something -- "AE" inside "TEAM APEX" is not evidence.
  for(const t of teams){
    const full = normaliseTeamKey(t.name);
    if(full.length < 4 || want.length < 4) continue;
    if(full.indexOf(want) >= 0 || want.indexOf(full) >= 0) return t;
  }

  // Closest by shared prefix/suffix length, which is all a plural or a
  // dropped word costs. Deliberately strict.
  let best = null, bestScore = 0;
  for(const t of teams){
    const full = normaliseTeamKey(t.name);
    if(!full) continue;
    let i = 0;
    while(i < full.length && i < want.length && full[i] === want[i]) i++;
    const score = (2 * i) / (full.length + want.length);
    if(score > bestScore){ best = t; bestScore = score; }
  }
  return bestScore >= 0.8 ? best : null;
}

/* ---- persistent rows -------------------------------------------------
   A row's element is created ONCE and then updated in place, keyed by
   team. That's what makes the slide possible at all: the old version
   rebuilt all twelve on every update, so each "new" element was born at
   its final position with nothing to animate from. It also ends the
   repaint flicker the old innerHTML swap caused, which is why the
   change-detection guard it needed is gone -- updating a text node
   that already holds the same string costs nothing and shows nothing. */
const FLYBY_MS = 1150;
const REVIVE_MS = 3200;            // the revive's sweep, slower: see .flyby.rev
const rowEls = new Map();        // team key -> row element
let displayOrder = [];           // team keys, in the order currently on screen
let holdOrderUntil = 0;          // while in the future, don't re-sort
// How long to wait for a finishing position before sorting without one.
const RANK_WAIT_MS = 1500;
let awaitingRankSince = 0;
let previouslyEliminated = new Set();
// Teams this page has rendered at least once. A squad has to have been
// SEEN before its death counts as something that just happened.
let ffSeenTeams = new Set();
let lastState = null;

function rowKeyOf(row){ return (row.teamName || "").trim().toUpperCase(); }

/* Every registered squad gets a line, whether or not the table has one
   for it this poll.

   A squad the grid has not resolved yet -- a row waiting to be assigned,
   a name that has not read cleanly -- simply was not in the published
   rows, so its slot showed the backdrop's empty box: a hole in the middle
   of a table of twelve, which reads as a fault rather than as a gap in
   the data.

   What a filled line does NOT do is guess at its status. Its kills show 0,
   the same as any squad yet to get one, and its indicator is left off
   entirely rather than showing four grey bars -- claiming a squad is dead
   because nothing has been read for it would be a confident lie about the
   one thing this graphic exists to say. */
/* The last real reading seen for each squad.

   A row that drops out of one poll -- the grid missing it, two sources
   disagreeing -- comes back through here as statusUnknown, and the
   renderer hides the indicators for it. On air that is a squad's alive
   pips blinking off and on for no reason anyone watching can see.

   Nothing is invented: this is a reading that genuinely went out, held
   until a newer one replaces it. Cleared when the table does. */
const lastKnownStatus = new Map();

/* The five pip pictures, fetched once and kept.

   The indicator is a CSS background-image swapped between Dead.png and
   1..4_alive.png as a squad loses players. Swapped without the file being
   in cache, the browser has to go and get it, and until it arrives the
   pip draws NOTHING -- so the indicator blinks out and back at the exact
   moment it changes, which is the only moment anyone is looking at it.

   It is worst where it matters most. A squad going 4-3-2-1-dead touches
   five different files, each one first used at the instant it is needed,
   and an overlay served over the relay is fetching them across the
   internet. Holding an Image object for each keeps them in cache, so
   every later swap is a repaint rather than a request.

   Keyed by folder because the two layouts keep this art in different
   places (see pipBase), and re-running for a base already done costs
   nothing. */
const pipsPreloaded = new Set();
const pipImages = [];
function preloadPips(base, L){
  // Only what this layout draws: none for drawn bars (SS3, GNG), else its
  // own folder -- asking for both left five failed requests per load.
  if(L && L.pipBars) return;
  [(L && L.pipBase) || ""].forEach(sub => {
    const key = base + sub;
    if(pipsPreloaded.has(key)) return;
    pipsPreloaded.add(key);
    ["Dead.png", "1_alive.png", "2_alive.png", "3_alive.png", "4_alive.png"]
      .forEach(name => {
        const img = new Image();
        img.src = key + name;
        pipImages.push(img);   // held, or the browser may drop it again
      });
  });
}

function rememberStatus(rows){
  rows.forEach(r => {
    if(r && !r.statusUnknown && r.aliveCount != null){
      lastKnownStatus.set(rowKeyOf(r), {
        bars: (r.bars || []).slice(),
        aliveCount: r.aliveCount,
        eliminated: !!r.eliminated,
      });
    }
  });
}

/* Enough published rows to believe the table describes the whole lobby.
   The client narrates every team at match start, so a real table is
   eleven or twelve; anything much shorter is a log still being read. */
const ABSENT_IS_OUT_MIN_ROWS = 8;

function fillFromRoster(rows, state){
  const slots = 12;
  rememberStatus(rows);

  /* Counted by DISTINCT squad, not by how long the list is. A row that
     came back with no name at all, and two rows that read as the same
     squad, both collapse into a single drawn row further down -- so
     twelve rows went in and eleven came out, with a team simply absent.
     Either is an ordinary OCR miss on one row's name. They are dropped
     here, and the slot each one freed fills from the roster like any
     other gap, which puts the missing squad back. */
  const have = new Set();
  const kept = [];
  rows.forEach(r => {
    const key = rowKeyOf(r);
    if(!key || have.has(key)) return;
    have.add(key);
    kept.push(r);
  });
  rows = kept;
  if(rows.length >= slots) return rows;

  /* Two places to find the names, because either can be empty at the
     moment it is needed. The roster is the proper one. The row
     assignments are the operator's own mapping of table row to squad,
     and they are twelve names too -- so a page that arrives before the
     roster has synced, or one pointed at an engine whose roster was
     cleared, still fills its table instead of showing gaps. */
  const roster = ((state.roster || {}).teams) || [];
  const assigned = ((state.liveOps || {}).aliveRowTeams) || [];
  /* The row assignments are a LAST resort, not a second opinion.
     They belong to the alive grid and are not cleared when an event
     changes, so at a new event they still hold the previous one's teams
     -- which arrived on air as two squads from a tournament that had
     finished, sitting in a live table. They are used only when the
     roster has nothing at all to offer. */
  const candidates = (roster.length
      ? roster.map(t => (t.name || "").trim())
      : assigned.map(n => (n || "").trim())
    ).filter(n => n);
  if(!candidates.length) return rows;

  /* A team the client is not narrating is not in this lobby.
     Padding it in as "unknown" left it sitting mid-table with live
     squads, which reads as a team still playing. It is shown as out
     instead, which sorts it to the bottom with the other dead squads.

     Only once the table is substantial: a handful of rows means the log
     is still catching up, and marking every absent team dead on the
     strength of three rows would empty the table on air. */
  const lobbyKnown = rows.length >= ABSENT_IS_OUT_MIN_ROWS;

  const filled = rows.slice();
  candidates.forEach(name => {
    if(filled.length >= slots) return;
    const key = name.toUpperCase();
    if(have.has(key)) return;
    have.add(key);
    // Held over from the last time this squad was actually read, rather
    // than drawn as a blank. A squad we have never seen still shows
    // nothing -- there is genuinely nothing to show.
    const held = lastKnownStatus.get(key);
    if(lobbyKnown){
      /* Not in this lobby at all, so it is not in this match and has no
         business on the table. Drawing it as "out" was better than
         drawing it as alive, but it still took a row and still read as a
         squad that had played and died -- and worse, it made the table
         look twelve teams long when eleven started, which is the number
         finishing positions are counted from.

         An event roster is a list for the whole event. A match uses some
         of it. */
      return;
    }
    filled.push(held ? {
      teamName: name, eliminated: held.eliminated, aliveCount: held.aliveCount,
      bars: held.bars.slice(), elims: null, statusHeld: true,
    } : {
      teamName: name, eliminated: false, aliveCount: null, elims: null,
      statusUnknown: true,
    });
  });
  return filled;
}

function makeRowEl(){
  const el = document.createElement("div");
  el.className = "row no-anim";
  el.innerHTML =
    '<div class="rank"></div>' +
    '<div class="logo"><img alt="" style="display:none"></div>' +
    '<div class="name"></div>' +
    '<div class="points"></div>' +
    '<div class="kills"></div>' +
    '<div class="status-pip"></div>' +
    '<div class="crtile"></div>' +
    '<div class="flyby"><span class="word trail">ELIMINATED</span>' +
    '<span class="word">ELIMINATED</span></div>' +
    '<div class="flyby rev"><span class="word trail"></span><span class="word"></span></div>';
  return el;
}

/* ---- the elimination card ------------------------------------------- */
let currentElimRow = null;       // who the card is showing right now
let elimCardTimer = null;
let elimCardOutTimer = null;

function applyElimCardLayout(C, state){
  const r = document.documentElement.style;
  r.setProperty("--elim-cx", (C.panel.x + C.panel.w / 2) + "px");
  r.setProperty("--elim-cy", (C.panel.y + C.panel.h / 2) + "px");
  r.setProperty("--elim-travel", (C.travel || 0) + "px");
  r.setProperty("--elim-travel-x", (C.travelX || 0) + "px");
  r.setProperty("--elim-travel-x-out", (C.travelXOut != null ? C.travelXOut : (C.travelX || 0)) + "px");
  r.setProperty("--elim-name-ink", (C.name && C.name.ink) || "#ffffff");
  r.setProperty("--elim-logo-x", C.logo.x + "px");
  r.setProperty("--elim-logo-y", C.logo.y + "px");
  r.setProperty("--elim-logo-w", C.logo.w + "px");
  r.setProperty("--elim-logo-h", C.logo.h + "px");
  r.setProperty("--elim-name-x", C.name.x + "px");
  r.setProperty("--elim-name-y", C.name.y + "px");
  r.setProperty("--elim-name-w", C.name.w + "px");
  r.setProperty("--elim-name-h", C.name.h + "px");
  r.setProperty("--elim-name-size", C.name.size + "px");
  r.setProperty("--elim-rank-x", C.rank.x + "px");
  r.setProperty("--elim-rank-y", C.rank.y + "px");
  r.setProperty("--elim-rank-w", C.rank.w + "px");
  r.setProperty("--elim-rank-h", C.rank.h + "px");
  r.setProperty("--elim-rank-size", C.rank.size + "px");
  r.setProperty("--elim-rank-ink", C.rank.ink || "#ffffff");
  const face = f => f ? `'${f}', Arial, sans-serif` : "";
  const nameEl = document.getElementById("elimName");
  nameEl.style.fontFamily = face(C.name.face);
  nameEl.style.justifyContent = C.name.align || "";
  nameEl.style.letterSpacing = C.name.ls != null ? C.name.ls + "px" : "";
  nameEl.style.fontStyle = C.name.italic ? "italic" : "";
  document.getElementById("elimRank").style.fontFamily = face(C.rank.face);
  document.getElementById("elimRank").style.fontStyle = C.rank.italic ? "italic" : "";

  // The same placement keys the dashboard's Graphic Fixing pages save,
  // so dragging the card there moves it here.
  const all = (state && state.graphicOverrides) || {};
  const nudge = (sel, key) => {
    const el = document.querySelector(sel);
    if(!el) return;
    const o = all[key] || {};
    const dx = o.dx || 0, dy = o.dy || 0, sc = o.scale || 1;
    const t = (dx || dy || sc !== 1) ? `translate(${dx}px, ${dy}px) scale(${sc})` : "";
    if(el.style.transform !== t){ el.style.transform = t; el.style.transformOrigin = "center center"; }
  };
  const sfx = C.placementKey ? "@" + C.placementKey : "";
  nudge("#elimPlace", "elimCard" + sfx);
  nudge("#elimLogo", "elimLogo" + sfx);
  nudge("#elimName", "elimName" + sfx);
  nudge("#elimRank", "elimRank" + sfx);
  nudge("#elimPhoto", "elimPhoto" + sfx);
}

/* The engine's own announcement, as a second way in.

   The card has two triggers on purpose. The table's own "this row just
   went out" is the precise one -- it fires with the flyby, so the two
   cannot disagree. But it only fires for a squad this page WATCHED go
   down: one that is first seen already eliminated is deliberately not
   animated, and a page that loaded mid-match sees exactly that. The
   engine knows regardless, because it assigned the finishing position.

   So either can raise the card and neither can raise it twice: each
   announcement is identified by the squad and the moment it fired. */
let lastAnnounceKey = "";

/* ONE CARD PER SQUAD PER MATCH, whichever side raises it. The stamp above
   is the squad AND its hold time, and the engine shortens a card's hold
   the moment another squad queues behind it -- so the same squad came
   back as a "new" announcement and its card played two or three times.
   The table's own trigger and the engine's announcement could each raise
   it too. Every squad that has had its card is kept here, and the list
   empties when a new match starts (no squad out on the table).

   Checked on EVERY sync, from apply(). It used to be checked only as a
   card was about to show -- and a card is only ever due when someone is
   out, so the list never emptied. A page left open from game 1 then
   refused every squad it had carded before: from game 2 on, no
   elimination card at all until the source was refreshed.

   Nobody out for a few syncs AND a few seconds, not one: a single poll
   showing everyone up is what a flicker looks like, and believing it
   would card the last squad out a second time. A real new match stays
   that way for minutes. */
const elimCarded = new Set();
// Squads whose wipe banner has played this match, and whether one is up.
const wipeShown = new Set();
let wipeBusy = false;
const WIPE_MS = 1800;
let wipeTimer = 0, wipeShownAt = 0, wipeNext = null;
const ELIM_CARDED_FRESH_MS = 5000;
let elimCardedFreshRenders = 0;
let elimCardedFreshSince = 0;
function syncElimCarded(state){
  const rows = ((state.liveOps || {}).sidetableRows) || [];
  if(rows.some(r => r.eliminated)){
    elimCardedFreshRenders = 0;
    return;
  }
  if(elimCardedFreshRenders++ === 0) elimCardedFreshSince = Date.now();
  if(elimCarded.size && elimCardedFreshRenders >= FRESH_MATCH_RENDERS
     && Date.now() - elimCardedFreshSince >= ELIM_CARDED_FRESH_MS){
    elimCarded.clear();
    wipeShown.clear();
    pendingElimCards.length = 0;
  }
}

/* Squads whose card arrived while another was still on screen, in the
   order they went out. Near the end of a match two or three go within
   seconds of each other, and the engine hands them over one at a time --
   but it releases the next one the moment its hold is up, while this
   card is still flying out for a beat after that. Dropping it there is
   what left the 11th with no card at all.

   A list rather than one slot: a single slot meant a third card
   overwrote the second, and that one was never seen. */
const pendingElimCards = [];

/* Someone is waiting, so the card on screen gives up the rest of its
   hold and starts leaving. Four seconds each, strictly in turn, is what
   made the tick feel broken -- press, and nothing happens for most of a
   ten-count. 1.2s still felt like waiting, so it is 0.4s: the card in
   front is on its way out before the operator has looked up.

   A card with nobody behind it is untouched and keeps its full hold.
   This only bites when the operator is ticking faster than the graphic
   can play, which is precisely when they want it to hurry. */
const ELIM_CARD_RUSH_MS = 400;
let elimCardShownAt = 0;
let elimCardExitAt = 0;

function rushCurrentElimCard(){
  if(!elimCardTimer) return;                    // already on its way out
  const at = elimCardShownAt + ELIM_CARD_RUSH_MS;
  // Only ever brings the exit FORWARD. An operator who has set a hold
  // shorter than this floor gets the hold they asked for -- hurrying a
  // queue must not be able to keep a card up longer than it was due.
  if(at >= elimCardExitAt) return;
  elimCardExitAt = at;
  clearTimeout(elimCardTimer);
  elimCardTimer = setTimeout(beginElimCardExit, Math.max(0, at - Date.now()));
}

function beginElimCardExit(){
  const card = document.getElementById("elimCard");
  clearTimeout(elimCardTimer);
  elimCardTimer = null;
  card.classList.remove("in");
  card.classList.add("out");
  // Left showing until the exit animation has actually run, or it would
  // vanish instead of leaving.
  clearTimeout(elimCardOutTimer);
  elimCardOutTimer = setTimeout(() => {
    card.classList.remove("show", "out");
    currentElimRow = null;
    const next = pendingElimCards.shift();
    if(next && lastState) showElimCard(lastState, null, layoutFor(lastState), next);
  }, 420);
}

function showAnnouncedElimCard(state, L){
  const te = state.teamEliminated;
  if(!te || te.status !== "shown" || !te.teamName) return;
  if(!te.shownUntil || te.shownUntil <= Date.now()) return;   // already over

  /* The tick, checked again on the side that actually draws the card.
     The engine checks it too, but the engine is not the only thing that
     can leave an announcement standing -- one from before the setting was
     turned on, one an older engine wrote, one still sitting in the state
     a page picks up when it loads. This graphic is the thing the audience
     sees, so it enforces the setting itself rather than trusting that
     whatever handed it an announcement already did. */
  const live = state.liveOps || {};
  if(state.settings && state.settings.eliminationApproval){
    const approved = (live.approvedEliminations || [])
      .map(t => (t || "").trim().toUpperCase());
    if(!approved.includes(te.teamName.trim().toUpperCase())) return;
  }

  const stamp = te.teamName + "@" + te.shownUntil;
  if(stamp === lastAnnounceKey) return;
  lastAnnounceKey = stamp;
  if(elimCarded.has(rowKeyOf({ teamName: te.teamName }))) return;   // already had its card

  // The announcement carries the position, but fall back to the table's
  // own row for it -- a card with a blank corner is worse than one a beat
  // late, and the table always knows where a squad finished.
  const row = (live.sidetableRows || [])
    .find(r => rowKeyOf(r) === te.teamName.trim().toUpperCase());
  const rank = te.rank != null ? te.rank : (row && row.finishRank);
  showElimCard(state, null, L, { teamName: te.teamName, finishRank: rank });
}

/* The squad's group photo uploaded in the roster, else its Team_Photo
   from the photo folder, else the event's default team photo (roster,

   then the folder's DEFAULT), else none. Run again when the folder's
   photos arrive, so a card already up picks its photo up. */
function setElimPhoto(state, row, C){
  const ph = document.getElementById("elimPhoto");
  const team = logoFor(row.teamName, state.roster);
  // a team switched off in the dashboard (roster team.photoOff) goes up
  // with none, not even the default stand-in
  const photo = (C.photo && !(team && team.photoOff)) ? ((team && team.groupPhoto) ||
                           teamPhotoCache[(team && team.name) || row.teamName || ""] ||
                           ((state.roster || {}).defaultTeamPhoto) ||
                           teamPhotoCache.__default__ || "") : "";
  if(photo){
    Object.assign(ph.style, { left: C.photo.x + "px", top: C.photo.y + "px",
                              width: C.photo.w + "px", height: C.photo.h + "px", display: "block",
                              objectPosition: C.photo.pos || "" });
    if(ph.getAttribute("src") !== photo) ph.src = photo;
  } else ph.style.display = "none";
  const over = document.getElementById("elimOver");
  if(photo && C.over){
    const art = assetBase(state) + C.art;
    if(over.getAttribute("src") !== art) over.src = art;
    over.style.clipPath = "polygon(" + C.over.map(([x, y]) => x + "px " + y + "px").join(", ") + ")";
    over.style.display = "block";
  } else over.style.display = "none";
}


/* ---- THE ELIMINATION RACE ------------------------------------------------
   liveOps.fragRace -- the engine's top three this match, from the client's
   own kill feed -- while mapView.raceVisible (Push Race Up / Pull Race Down
   in the dashboard's map card). Photos on their own message (race_photos);
   a player without one of their own shows the team's logo. */
const racePhotos = {};
const raceRows = new Map();
let raceShown = 0;
function renderRace(state){
  const mv = state.mapView || {};
  const box = document.getElementById("race");
  const on = !!mv.raceVisible;
  box.classList.toggle("on", on);
  if(!on) return;
  const pk = String(aliveFolder(state)).toLowerCase();
  box.style.setProperty("--race-acc", pk === "ss3" ? "#ff1e1e" : pk === "chirayu" ? "#e8a33a" : pk === "gng" ? "#ffa976" : pk === "rnx" ? "#fcd02c" : pk.startsWith("enfea") ? "#ffcc00" : pk === "gamercult" ? "#feea3c" : "#f7941d");
  // the engine's list runs to five, for the leaders board; the race is three
  const race = (((state.liveOps || {}).fragRace) || []).slice(0, 3);
  const roster = state.roster || {};
  const rows = box.querySelector(".rows");
  if(mv.raceShownAt && mv.raceShownAt !== raceShown){
    raceShown = mv.raceShownAt;
    raceRows.forEach(el => el.remove()); raceRows.clear();
  }
  let empty = rows.querySelector(".empty");
  if(!race.length){
    if(!empty){ empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "No eliminations yet"; rows.appendChild(empty); }
  } else if(empty) empty.remove();
  const seen = new Set();
  race.forEach((r, i) => {
    const id = r.pid || r.uid || r.ign;
    seen.add(id);
    let el = raceRows.get(id);
    const fresh = !el;
    if(!el){
      el = document.createElement("div");
      el.className = "rr enter";
      el.innerHTML = '<div class="rk"></div><div class="ph"><img alt=""></div>' +
        '<div class="who"><div class="ign"></div><div class="tm"><img alt=""><span></span></div></div>' +
        '<div class="k"><b></b><small>ELIMS</small></div>';
      el.style.top = (i * 78) + "px";
      el.style.animationDelay = (i * .09).toFixed(2) + "s";
      rows.appendChild(el);
      raceRows.set(id, el);
    }
    el.style.top = (i * 78) + "px";
    el.classList.toggle("r1", i === 0);
    el.classList.toggle("out", !!r.teamOut);
    el.querySelector(".rk").textContent = i + 1;
    const team = logoFor(r.teamName, roster);
    const photo = racePhotos[r.uid || r.ign];
    const img = el.querySelector(".ph img"), src = photo || (team && team.logo) || "";
    if(src && img.getAttribute("src") !== src) img.src = src;
    img.style.visibility = src ? "" : "hidden";
    img.classList.toggle("rlogo", !photo);
    el.querySelector(".ign").textContent = cleanName(r.ign) || "?";
    const ti = el.querySelector(".tm img");
    if(team && team.logo){ if(ti.getAttribute("src") !== team.logo) ti.src = team.logo; ti.style.display = ""; }
    else ti.style.display = "none";
    el.querySelector(".tm span").textContent = (team && team.shortName) || r.short || r.teamName || "";
    const kb = el.querySelector(".k b");
    if(kb.textContent !== String(r.kills)){
      const had = kb.textContent;
      kb.textContent = r.kills;
      if(had && !fresh){ kb.classList.remove("pop"); void kb.offsetWidth; kb.classList.add("pop"); }
    }
  });
  raceRows.forEach((el, id) => { if(!seen.has(id)){ el.remove(); raceRows.delete(id); } });
}

/* ---- TOP 5 ELIMINATION LEADERS --------------------------------------
   settings.killLeadersUp (Push / Pull in the In-Game tab; killLeadersAt
   each push, so a second push plays it in again). Everyone with a kill
   from liveOps.headshotBoard, with the team and photo key from
   liveOps.fragRace where the player is in it -- the board is whole even
   while the race is shorter than five. */
const ldRows = new Map();
let ldUp = false, ldShownAt = 0, ldOutTimer = 0;
function leadersList(state){
  const live = state.liveOps || {};
  const by = new Map();
  (live.headshotBoard || []).forEach(p => {
    const id = p.uid || p.ign;
    if(id && Number(p.kills) > 0) by.set(id, { ign: p.ign, uid: p.uid, kills: Number(p.kills), teamName: p.team || "" });
  });
  (live.fragRace || []).forEach(r => {
    const id = r.uid || r.ign;
    if(!id) return;
    const had = by.get(id) || {};
    by.set(id, Object.assign(had, { ign: r.ign || had.ign, uid: r.uid || had.uid, kills: Number(r.kills),
                                    teamName: r.teamName || had.teamName || "", short: r.short, teamOut: r.teamOut }));
  });
  const outTeams = new Set((live.sidetableRows || []).filter(r => r.eliminated)
    .map(r => String(r.teamName || "").trim().toUpperCase()));
  return [...by.values()]
    .map(p => Object.assign(p, { teamOut: p.teamOut != null ? p.teamOut
                                          : outTeams.has(String(p.teamName || "").trim().toUpperCase()) }))
    .sort((a, b) => b.kills - a.kills || String(a.ign).toUpperCase().localeCompare(String(b.ign).toUpperCase()))
    .slice(0, 5);
}
function renderLeaders(state){
  const st = state.settings || {};
  const box = document.getElementById("leaders");
  if(!st.killLeadersUp){
    if(ldUp){
      ldUp = false;
      box.classList.remove("in");
      box.classList.add("out");
      clearTimeout(ldOutTimer);
      ldOutTimer = setTimeout(() => box.classList.remove("show", "out"), 320);
    }
    return false;
  }
  const L = layoutFor(state);
  const T = ZB_THEMES[L.placementKey] || {};
  const bold = (L.elimCard && L.elimCard.name && L.elimCard.name.face) ? `'${L.elimCard.name.face}'` : (L.face || "Arial");
  const vars = { "--zb-acc": T.acc || L.accent || "#f7941d", "--zb-a": T.a || "#262626", "--zb-b": T.b || "#0e0e0e",
                 "--zb-dark": T.dark || "#111111", "--zb-ink": T.ink || "#f2f2f2",
                 "--ld-bold": bold, "--ld-face": L.face || "Arial" };
  Object.entries(vars).forEach(([k, v]) => { if(box.style.getPropertyValue(k) !== v) box.style.setProperty(k, v); });
  // Where the table stands: its art's top, flush to the right edge.
  box.style.top = ((L.artBox && L.artBox.top) || (L.rowTops[0] - 40)) + "px";
  if(!ldUp || (st.killLeadersAt && st.killLeadersAt !== ldShownAt)){
    ldUp = true;
    ldShownAt = st.killLeadersAt || 0;
    clearTimeout(ldOutTimer);
    ldRows.forEach(el => el.remove()); ldRows.clear();
    box.classList.remove("out", "in");
    void box.offsetWidth;                // play the way in from the start
    box.classList.add("show", "in");
  }
  const list = leadersList(state);
  const rowsBox = box.querySelector(".ld-rows");
  let empty = rowsBox.querySelector(".ld-empty");
  if(!list.length){
    if(!empty){ empty = document.createElement("div"); empty.className = "ld-empty"; empty.textContent = "NO ELIMINATIONS YET"; rowsBox.appendChild(empty); }
  } else if(empty) empty.remove();
  rowsBox.style.height = list.length ? (list.length * 83 - 7) + "px" : "";
  const roster = state.roster || {};
  const seen = new Set();
  list.forEach((p, i) => {
    const id = p.uid || p.ign;
    seen.add(id);
    let el = ldRows.get(id);
    const fresh = !el;
    if(!el){
      el = document.createElement("div");
      el.className = "ld-row";
      el.innerHTML = '<div class="bg"></div><div class="rk"></div><div class="ph"><img alt=""></div>' +
        '<div class="who"><div class="ign"></div><div class="tm"><img alt=""><span></span></div></div>' +
        '<div class="val"><b></b><small>ELIMS</small></div>';
      el.style.setProperty("--i", i);
      rowsBox.appendChild(el);
      ldRows.set(id, el);
    }
    el.style.top = (i * 83) + "px";
    el.classList.toggle("r1", i === 0);
    el.classList.toggle("out", !!p.teamOut);
    el.querySelector(".rk").textContent = "#" + (i + 1);
    const team = popTeamFor({ uid: p.uid, ign: p.ign, teamName: p.teamName }, roster);
    const photo = racePhotos[p.uid || p.ign] || "";
    const img = el.querySelector(".ph img"), src = photo || (team && team.logo) || "";
    if(src && img.getAttribute("src") !== src) img.src = src;
    img.style.visibility = src ? "" : "hidden";
    img.classList.toggle("logo", !photo);
    // no photo and no logo: the name takes the empty slot
    if(el.classList.contains("bare") !== !src){ el.classList.toggle("bare", !src); el.querySelector(".ign").textContent = ""; }
    const ign = el.querySelector(".ign");
    const name = cleanName(p.ign) || "?";
    if(ign.textContent !== name){ ign.textContent = name; fitInside(ign, 21, 12); }
    const ti = el.querySelector(".tm img");
    const logo = photo && team && team.logo;
    if(logo){ if(ti.getAttribute("src") !== logo) ti.src = logo; ti.style.display = ""; }
    else ti.style.display = "none";
    el.querySelector(".tm span").textContent = ((team && (team.displayName || team.name)) || p.teamName || "").toUpperCase();
    const kb = el.querySelector(".val b");
    if(kb.textContent !== String(p.kills)){
      const had = kb.textContent;
      kb.textContent = p.kills;
      if(had && !fresh){ kb.classList.remove("pop"); void kb.offsetWidth; kb.classList.add("pop"); }
    }
  });
  ldRows.forEach((el, id) => { if(!seen.has(id)){ el.remove(); ldRows.delete(id); } });
  return true;
}

/* "TSG WIPED NG": the wiping squad's logo and short name, WIPED in the
   package's colour, the wiped squad's; up for WIPE_MS, then `next`. */
function playWipeBanner(state, byName, row, next){
  const el = document.getElementById("wipeBanner");
  const by = logoFor(byName, state.roster), out = logoFor(row.teamName, state.roster);
  const pk = String(aliveFolder(state)).toLowerCase();
  el.style.setProperty("--wb-acc", pk === "ss3" ? "#ff1e1e" : pk === "chirayu" ? "#e8a33a" : pk === "gng" ? "#ffa976" : pk === "rnx" ? "#fcd02c" : pk.startsWith("enfea") ? "#ffcc00" : pk === "gamercult" ? "#feea3c" : "#f7941d");
  const set = (sel, img) => { const i = el.querySelector(sel); if(img){ i.src = img; i.style.display = ""; } else i.style.display = "none"; };
  set("img.a", by && by.logo);
  set("img.b", out && out.logo);
  el.querySelector(".na").textContent = (by && by.shortName) || byName;
  el.querySelector(".nb").textContent = (out && out.shortName) || row.short || row.teamName || "";
  wipeBusy = true;
  wipeShownAt = Date.now();
  wipeNext = next;
  el.classList.remove("out");
  el.classList.add("show", "in");
  clearTimeout(wipeTimer);
  wipeTimer = setTimeout(endWipeBanner, WIPE_MS);
}
function endWipeBanner(){
  const el = document.getElementById("wipeBanner");
  clearTimeout(wipeTimer); wipeTimer = 0;
  el.classList.remove("in"); el.classList.add("out");
  setTimeout(() => {
    el.classList.remove("show", "out"); wipeBusy = false;
    const n = wipeNext; wipeNext = null;
    if(n) n();
  }, 320);
}
// Another squad out while the banner is up: it gives up the rest of its
// time (it has had at least 0.7s to be read) and the cards follow.
function rushWipeBanner(){
  if(!wipeBusy || !wipeTimer) return;
  const left = Math.max(0, wipeShownAt + 700 - Date.now());
  clearTimeout(wipeTimer);
  wipeTimer = setTimeout(endWipeBanner, left);
}

/* SHUTDOWN: the announcer's call as the ELIMINATED card comes up
   (settings.shutdownSound, on unless switched off; shutdownVolume 0..100).
   Loaded up front, so it lands with the card rather than after a fetch
   over the relay. Never from the dashboard's preview frames. In OBS the
   browser source plays it -- "Control audio via OBS" puts it on the mixer. */
const shutdownSfx = new Audio("assets/sfx/shutdown.wav");
shutdownSfx.preload = "auto";
function playShutdown(state){
  const st = (state && state.settings) || {};
  if(PREVIEW_MODE || st.shutdownSound === false) return;
  const vol = st.shutdownVolume == null ? 80 : Number(st.shutdownVolume);
  shutdownSfx.volume = Math.min(1, Math.max(0, (Number.isFinite(vol) ? vol : 80) / 100));
  try { shutdownSfx.currentTime = 0; } catch(e){}
  const p = shutdownSfx.play();
  if(p && p.catch) p.catch(() => {});
}

function showElimCard(state, rowEl, L, forced){
  const C = L.elimCard;
  if(!C) return;                       // this package has no such card
  // The operator's switch for the pop-up, in the alive card.
  if(state.settings && state.settings.elimPopup === false) return;
  const card = document.getElementById("elimCard");

  let row = forced || null;
  if(!row){
    const key = rowEl ? (rowEl.dataset.teamKey || "") : "";
    row = (((state.liveOps || {}).sidetableRows) || [])
      .find(r => rowKeyOf(r) === key);
  }
  if(!row) return;
  if(elimCarded.has(rowKeyOf(row))) return;                 // already had its card
  // Raised by the table, so the announcement must not raise it again for
  // the same squad a moment later.
  const te = state.teamEliminated;
  if(!forced && te && te.teamName && rowKeyOf(row) === rowKeyOf(te)){
    lastAnnounceKey = te.teamName + "@" + te.shownUntil;
  }

  // Never interrupt one already running: a name swapping out from under a
  // card mid-animation reads as a fault, not as a second elimination. The
  // squad is held rather than dropped, and raised the moment this one has
  // finished leaving.
  // THE WIPE BANNER first, when the engine knows who wiped them (not the
  // zone): "TSG WIPED NG", then this same card.
  const wkey = rowKeyOf(row);
  const wb = (((state.liveOps || {}).wipedBy) || {})[wkey];
  // In a burst -- squads already queued behind this one -- the card goes
  // straight up: a banner per squad made the queue trail the game.
  if(wb && wb.by && (state.settings || {}).wipeBanner !== false && !wipeShown.has(wkey)
     && !wipeBusy && !card.classList.contains("show") && !pendingElimCards.length){
    wipeShown.add(wkey);
    playWipeBanner(state, wb.by, row, () => {
      const st = lastState || state;
      showElimCard(st, null, layoutFor(st), row);
    });
    return;
  }
  if(card.classList.contains("show") || wipeBusy){
    const key = rowKeyOf(row);
    if(key !== rowKeyOf(currentElimRow || {})
       && !pendingElimCards.some(r => rowKeyOf(r) === key)){
      pendingElimCards.push(row);
      rushCurrentElimCard();
      rushWipeBanner();
    }
    return;
  }
  currentElimRow = row;
  elimCarded.add(rowKeyOf(row));

  applyElimCardLayout(C, state);

  const base = assetBase(state);
  const art = base + C.art;
  const artEl = document.getElementById("elimArt");
  if(artEl.getAttribute("src") !== art) artEl.src = art;
  // The rank's corner box, painted again from the art ABOVE the team
  // photo: the photo runs under it (to x 1180) and covered the box, so the
  // number sat on the photo instead of on black.
  const rankBox = document.getElementById("elimRank");
  if(C.photo){
    Object.assign(rankBox.style, { backgroundImage: `url("${art}")`, backgroundRepeat: "no-repeat",
      backgroundSize: "1920px 1080px", backgroundPosition: `-${C.rank.x}px -${C.rank.y}px` });
  } else {
    rankBox.style.backgroundImage = "";
  }

  const team = logoFor(row.teamName, state.roster);
  document.getElementById("elimName").textContent = C.name.full
    ? ((team && (team.displayName || team.name)) || row.teamName || "")
    : ((team && team.shortName) || row.teamName || "");
  // In a span, so its own width can be measured and fitted below.
  const rankEl = document.getElementById("elimRank");
  rankEl.innerHTML = "";
  const rankSpan = document.createElement("span");
  const rankNum = row.finishRank == null ? "" : ((C.photo || C.rank.pad === false) ? String(row.finishRank)
                                                         : String(row.finishRank).padStart(2, "0"));
  // The "#" a size down with a hair of space after it: at full weight it
  // runs into the digits once there are two of them.
  if(rankNum){
    // "#" then the digits with clear space between: Supermolot's "#" leans
    // and its "1" is a thin stroke, so at this size they merge unless
    // spaced. Two digits are shrunk to fit below rather than squeezed.
    const hash = document.createElement("span");
    hash.textContent = "#";
    // (a face whose own "#" sits with its digits keeps it: GamerCult's)
    Object.assign(hash.style, C.rank.hash === "own" ? { fontSize: "0.9em" }
      : { fontFamily: "'Arial Black', Arial, sans-serif", fontWeight: 900, fontSize: "0.78em" });
    const num = document.createElement("span");
    num.textContent = rankNum;
    // Two digits: Arial Black, whose thick "1" stays a "1" at this size --
    // Supermolot's thin one merged into the "#" on air.
    Object.assign(num.style, { letterSpacing: rankNum.length > 1 ? "1px" : "0" });
    Object.assign(rankSpan.style, { display: "inline-flex", alignItems: "center", gap: "2px" });
    rankSpan.appendChild(hash);
    rankSpan.appendChild(num);
  }
  rankEl.appendChild(rankSpan);

  setElimPhoto(state, row, C);

  const img = document.getElementById("elimLogoImg");
  const logo = (team && team.logo) || "";
  if(logo){ img.src = logo; img.style.display = ""; }
  else { img.removeAttribute("src"); img.style.display = "none"; }

  // The operator's own figure wins over the package default, so the hold
  // can be tuned mid-event without touching a file.
  const hold = Number((state.settings || {}).elimCardSeconds) || C.seconds;

  clearTimeout(elimCardTimer);
  clearTimeout(elimCardOutTimer);
  card.classList.remove("out");
  card.classList.add("show", "in");
  playShutdown(state);
  if(C.name.full) fitName(document.getElementById("elimName"));
  // "#11" is wider than "#1": shrunk until it sits inside its corner box
  // with a few pixels either side, instead of running out of it.
  rankEl.style.fontSize = "";
  let rankSize = C.rank.size;
  while(rankSpan.offsetWidth > C.rank.w - 7 && rankSize > 12){
    rankSize -= 1;
    rankEl.style.fontSize = rankSize + "px";
  }
  elimCardShownAt = Date.now();
  elimCardExitAt = elimCardShownAt + hold * 1000;
  elimCardTimer = setTimeout(beginElimCardExit, hold * 1000);
  // Already someone behind it, so it does not sit out its full hold.
  if(pendingElimCards.length) rushCurrentElimCard();
}

/* Squads that have already had their ELIMINATED sweep this match.

   Belt and braces over previouslyEliminated, which only remembers the
   LAST render: if the table flickers a squad back to alive for a poll --
   two sources disagreeing, a grid miss -- that set empties, and on the
   next poll every eliminated row looks brand new and they all sweep at
   once. Three at a time was seen on air. A squad going out is a thing
   that happens once. */
let flybyDone = new Set();

// How many renders in a row must show nobody eliminated before this page
// believes a new match has started. See the reset below.
const FRESH_MATCH_RENDERS = 3;
let allAliveRenders = 0;

/* Waiting their turn. Several ticks in a row is normal near the end of a
   match, and playing them together is unreadable -- the words land on top
   of each other and none of them can be read. One at a time, in the order
   they went out. */
let flybyQueue = [];
let flybyTimer = null;

function queueFlyby(el){
  flybyQueue.push(el);
  if(flybyTimer === null) runFlybyQueue();
}

function flybyMs(item){ return (item && item.revive ? REVIVE_MS : FLYBY_MS) + 120; }
let flybyEndsAt = 0;
function runFlybyQueue(){
  const item = flybyQueue.shift();
  if(!item){ flybyTimer = null; return; }
  if(item.revive) playRevive(item.el, item.revive); else playFlyby(item);
  flybyEndsAt = Date.now() + flybyMs(item);
  flybyTimer = setTimeout(runFlybyQueue, flybyMs(item));
}
// How long until everything queued has played -- a revive ahead of an
// elimination is longer than its sweep.
function flybyQueueEndsIn(){
  return Math.max(0, flybyEndsAt - Date.now()) + flybyQueue.reduce((sum, item) => sum + flybyMs(item), 0);
}

/* A REVIVE, across its team's row: "TAG.YASH REVIVED" in the same sweep as
   ELIMINATED, in the same queue -- one at a time, never over each other.
   Sent by the engine as the log reports it (settings.reviveRow). */
const revivesSeen = new Set();
function reviveRow(rv){
  if(!rv || !rv.id || revivesSeen.has(rv.id)) return;
  revivesSeen.add(rv.id);
  const el = rowEls.get(String(rv.teamName || "").trim().toUpperCase());
  if(!el || el.classList.contains("out")) return;     // not on the table, or out
  queueFlyby({ el, revive: (cleanName(rv.ign) + " REVIVED").toUpperCase() });
}
function playRevive(el, text){
  const fly = el.querySelector(".flyby.rev");
  if(!fly) return;
  fly.querySelectorAll(".word").forEach(w => { w.textContent = text; });
  fly.classList.remove("on");
  el.classList.remove("just-revived");
  void el.offsetWidth;              // restart both animations from zero
  fly.classList.add("on");
  el.classList.add("just-revived");
  setTimeout(() => fly.classList.remove("on"), REVIVE_MS + 60);
}

function playFlyby(el){
  const fly = el.querySelector(".flyby");
  fly.classList.remove("on");
  el.classList.remove("just-eliminated");
  void el.offsetWidth;              // restart both animations from zero
  fly.classList.add("on");
  el.classList.add("just-eliminated");
  setTimeout(() => fly.classList.remove("on"), FLYBY_MS + 60);
}

/* FULL OR SHORT, as the operator chose under "Team names shown as".
   That dropdown used to change only the dashboard's own table, so picking
   Full left the graphic on short names with nothing to say why. It now
   sets settings.aliveNameStyle, and this follows it. No setting means
   short, which is what this graphic has always shown. */
function teamLabel(team, row, state){
  const style = (state && state.settings && state.settings.aliveNameStyle) === "full"
    ? "full" : "short";
  if(style === "full"){
    return (team && (team.displayName || team.name)) || row.teamName || row.short || "";
  }
  return (team && team.shortName) || row.short || row.teamName || "";
}

/* A full team name is wider than the column was drawn for, and the cell
   clips -- "MENTALIST ESP" went out as "MENTALIST". So a name that does
   not fit is stepped down in size until it does, to no less than 60% of
   the package's own size; a short name never needs it and is untouched. */
function fitName(el, size0, floor){
  // A size set for this element (the pop-up's) is where fitting starts;
  // resetting it to the stylesheet's dropped the name to a small default.
  el.style.fontSize = size0 ? size0 + "px" : "";
  if(!el.clientWidth) return;
  const base = parseFloat(getComputedStyle(el).fontSize) || 16;
  let size = base;
  while(el.scrollWidth > el.clientWidth + 1 && size > base * (floor || 0.6)){
    size -= 0.5;
    el.style.fontSize = size + "px";
  }
}

/* ---- TOP 4 -----------------------------------------------------------
   WIN RATE is an ESTIMATE: the game publishes none. Weighted on what most
   decides the last four -- players still standing, then kills -- and
   scaled so the four add to 100. Over the replays of this event, the team
   with the most kills among the last four went on to win 35% of the time
   against 13% for the fewest; players alive count for more than that. */
function winRates(rows){
  const w = rows.map(r => {
    const alive = r.eliminated ? 0 : Math.max(0, Number(r.aliveCount != null ? r.aliveCount : 4));
    const kills = Math.max(0, Number(effectiveKills(r)) || 0);
    return alive <= 0 ? 0 : Math.pow(alive, 1.5) * (1 + 0.1 * kills);
  });
  const total = w.reduce((a, b) => a + b, 0);
  if(total <= 0) return w.map(() => null);
  const pct = w.map(v => v / total * 100);
  // whole numbers that still add to 100: largest remainders get the spare
  const floor = pct.map(Math.floor);
  let spare = 100 - floor.reduce((a, b) => a + b, 0);
  pct.map((v, i) => [v - floor[i], i]).sort((a, b) => b[0] - a[0])
     .forEach(([, i]) => { if(spare > 0 && w[i] > 0){ floor[i]++; spare--; } });
  return floor.map((v, i) => w[i] > 0 ? v : null);
}

// Which teams the bar shows, in a fixed order: cards only move when a
// team leaves, not every time the kill counts reorder.
let t4Order = [];

function renderTop4(state, source){
  const box = document.getElementById("top4");
  const L = layoutFor(state);
  const T = L.top4;
  const on = !!(T && ((state.display && state.display.top4Visible) || _params.get("top4") === "1"));
  box.classList.toggle("show", on);
  box.querySelector(".t4bg").style.display = "none";   // each card carries its own slice now
  if(!T){ box.querySelectorAll(".t4card").forEach(c => c.remove()); t4Order = []; return false; }
  if(!on){ t4Order = []; return false; }
  const base = assetBase(state);
  box.style.setProperty("--t4-alive", (T.bars && T.bars.alive) || "#ffffff");
  box.style.setProperty("--t4-dead", (T.bars && T.bars.dead) || "rgba(0, 0, 0, .38)");

  // The standing squads -- four at most, the four with most kills when
  // more than four are still in (the bar pushed early by hand).
  const keyOf = r => rowKeyOf(r);
  const alive = source.filter(r => !r.eliminated);
  const ranked = alive.slice().sort((a, b) => (effectiveKills(b) - effectiveKills(a)) ||
                                              ((b.aliveCount || 0) - (a.aliveCount || 0)));
  const chosen = ranked.slice(0, 4);
  const want = new Set(chosen.map(keyOf));
  // keep the order the cards already have; newcomers join on the right
  t4Order = t4Order.filter(k => want.has(k));
  chosen.forEach(r => { if(!t4Order.includes(keyOf(r))) t4Order.push(keyOf(r)); });
  const rows = t4Order.map(k => chosen.find(r => keyOf(r) === k));
  const rates = winRates(rows);

  // Centred on the bar's own centre: four sit exactly where the art has
  // them, three / two / one close up around the middle.
  const W = T.cardW || 252, pitch = T.pitch || 273;
  const mid = T.cards[0] + (3 * pitch + W) / 2;
  const span = (rows.length - 1) * pitch + W;
  const x0 = mid - span / 2;

  // Cards for teams no longer standing lift away; the rest wait for them.
  let leaving = false;
  box.querySelectorAll(".t4card").forEach(c => {
    if(!want.has(c.dataset.key) && !c.classList.contains("leaving")){
      leaving = true;
      c.classList.add("leaving");
      setTimeout(() => c.remove(), 500);
    }
  });
  box.style.setProperty("--slide", leaving ? ".35s" : "0s");

  rows.forEach((row, i) => {
    const key = keyOf(row);
    let card = [...box.querySelectorAll(".t4card")].find(c => c.dataset.key === key && !c.classList.contains("leaving"));
    const fresh = !card;
    if(fresh){
      card = document.createElement("div");
      card.className = "t4card" + (T.kit ? " kit" : "");
      card.dataset.key = key;
      card.style.setProperty("--enter", (i * 90) + "ms");
      card.innerHTML = (T.kit ? '<div class="t4panel"></div><div class="t4plate"></div><div class="t4lab">WIN RATE</div>' : "") +
        '<div class="t4logo"><img alt=""></div><div class="t4name"></div>' +
        [0, 1, 2, 3].map(k => '<div class="t4bar" data-k="' + k + '"></div>').join("") +
        '<div class="t4win"></div>';
      box.appendChild(card);
      // the drop-in stagger is for arriving only
      setTimeout(() => card.style.setProperty("--enter", "0s"), 1200);
    }
    card.style.left = Math.round(x0 + i * pitch) + "px";
    card.style.width = W + "px";
    if(T.cardH) card.style.height = T.cardH + "px";
    card.style.top = -(T.lift || 0) + "px";
    if(!T.kit){
      const art = `url("${base + encodeURI(T.bg)}")`;
      if(card.style.backgroundImage !== art){
        card.style.backgroundImage = art;
        card.style.backgroundPosition = `-${T.slice || T.cards[0]}px 0px`;
      }
    }
    const team = logoFor(row.teamName, state.roster);
    const lg = card.querySelector(".t4logo");
    const nm = card.querySelector(".t4name");
    lg.style.display = T.logo ? "" : "none";
    nm.style.display = T.name ? "" : "none";
    if(T.logo){
      Object.assign(lg.style, { left: T.logo.dx + "px", top: T.logo.y + "px",
                                width: T.logo.w + "px", height: T.logo.h + "px" });
      const img = lg.querySelector("img");
      const src = (team && team.logo) || "";
      if(img.getAttribute("src") !== src){ if(src) img.src = src; img.style.display = src ? "" : "none"; }
    }
    if(T.name){
      // GNG: the team's tag, as the demo's "AAA", shrunk to its box
      Object.assign(nm.style, { left: T.name.dx + "px", top: T.name.y + "px", width: T.name.w + "px",
                                height: T.name.h + "px", color: T.name.ink, fontSize: T.name.size + "px",
                                letterSpacing: (T.name.ls || 0) + "px", fontWeight: T.name.weight || "",
                                fontStyle: T.name.italic ? "italic" : "", justifyContent: T.name.align || "center",
                                fontFamily: `'${T.name.face}', Arial, sans-serif` });
      const tag = cleanName((team && team.shortName) || row.short || row.teamName || "");
      if(nm.textContent !== tag){
        nm.textContent = tag;
        let size = T.name.size;
        nm.style.fontSize = size + "px";
        while(nm.scrollWidth > nm.clientWidth + 1 && size > T.name.size * 0.5){ size -= 1; nm.style.fontSize = size + "px"; }
      }
    }
    const up = Math.max(0, Math.min(4, row.aliveCount != null ? row.aliveCount : 4));
    card.querySelectorAll(".t4bar").forEach(b => {
      const k = Number(b.dataset.k);
      // whole pixels where the art's bars sit on them (GNG: 0, 17, 35, 53)
      const bx = T.bars.at ? T.bars.at[k] : k * T.bars.pitch;
      Object.assign(b.style, { left: (T.bars.dx + bx) + "px", top: T.bars.y + "px",
                               width: T.bars.w + "px", height: T.bars.h + "px" });
      b.classList.toggle("down", k >= up);
      // as GamerCult's status icons: up, down, up, down, interlocked
      b.style.clipPath = T.bars.shape === "tri"
        ? (k % 2 ? "polygon(0 0, 100% 0, 50% 100%)" : "polygon(50% 0, 100% 100%, 0 100%)") : "";
    });
    const win = card.querySelector(".t4win");
    // right-aligned to `right` (the number alone), or from `x` with its
    // own words in front ("WIN RATE - 74%", ENFEA's)
    Object.assign(win.style, T.win.x != null
      ? { left: T.win.x + "px", width: T.win.w + "px", textAlign: "left" }
      : { left: "0px", width: T.win.right + "px", textAlign: "" });
    Object.assign(win.style, { top: T.win.y + "px",
                               fontSize: T.win.size + "px", color: T.win.ink,
                               fontFamily: T.win.face ? `'${T.win.face}', Arial, sans-serif` : "",
                               fontWeight: T.win.weight || "",
                               fontStyle: T.win.italic ? "italic" : (T.win.face ? "normal" : "") });
    const num = rates[i] == null ? "\u2014" : rates[i] + "%";
    const txt = (T.win.prefix || "") + num;
    if(win.textContent !== txt) win.textContent = txt;
    // "100%" is a digit wider than the box was set for: a size down.
    win.style.fontSize = (!T.win.prefix && num.length > 3 ? T.win.size - 3 : T.win.size) + "px";
  });
  return true;
}

/* ---- SIDE POP-UPS ----------------------------------------------------
   Sent by the engine on their own message, one per moment worth calling
   out, each with the player's photo when the photo folder has one. Shown
   one at a time; a second arriving while the first is up waits its turn. */
const popQueue = [];
let popTimer = null, popBusy = false;

// The title wraps (two lines in the tab); a word too long for the tab
// ("ELIMINATION") steps the size down until every line fits.
function fitTitle(el, T){
  let size = T.size, line = T.line || T.size * 1.25;
  el.style.fontSize = size + "px";
  el.style.lineHeight = line + "px";
  while((el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1) && size > T.size * 0.6){
    size -= 0.5; line = Math.max(size * 1.1, line - 0.5);
    el.style.fontSize = size + "px";
    el.style.lineHeight = line + "px";
  }
}

/* Every line of the pop-up inside its box. Only with the card showing:
   hidden, nothing has a width, so the fitting did nothing at all and
   "SOLO ELIMINATIONS" ran out past both edges of the panel on air. */
function fitPopText(pop, A){
  // A NAME in the number's place (a revive: who brought them back) starts
  // smaller and steps down until it fits the box on one line.
  fitInside(document.getElementById("popValue"), pop.valueIsName ? Math.min(A.value.size, 38) : A.value.size,
            pop.valueIsName ? 10 : A.value.size * 0.6);
  fitInside(document.getElementById("popLabel"), A.label.size, A.label.size * 0.45);
  fitTitle(document.getElementById("popTitle"), A.title);
  fitInside(document.getElementById("popName"), A.name.size, A.name.size * 0.6);
}
// The text's own width, against its box less a margin each side -- a
// line that only just fitted ran edge to edge.
function fitInside(el, size0, min){
  el.style.fontSize = size0 + "px";
  const room = el.clientWidth - 12;
  if(room <= 0) return;
  const text = document.createRange();
  text.selectNodeContents(el);
  let size = size0;
  while(text.getBoundingClientRect().width > room && size > min){
    size = Math.max(min, size - 0.5);
    el.style.fontSize = size + "px";
  }
}

function popPlace(id, box, extra){
  const el = document.getElementById(id);
  Object.assign(el.style, { left: box.x + "px", top: box.y + "px",
                            width: box.w + "px", height: box.h + "px" }, extra || {});
  return el;
}

/* A name as it should be drawn. Free Fire players decorate their names
   with private-use characters (U+F8FF and the rest of U+E000..U+F8FF),
   which the game draws as its own symbols -- but a font is free to put
   anything there, and Supermolot puts its foundry's logo: "Aka\u26abMonster"
   went out as "Aka\u26abMonster TypeType". Dropped here -- the same as
   ffCleanName in ff_theme.js, which this page does not load. The Hangul fillers
   players use as invisible spaces become ordinary spaces. */
function cleanName(s){
  return String(s == null ? "" : s)
    .replace(/[\uE000-\uF8FF]|[\u{F0000}-\u{10FFFF}]/gu, "")
    .replace(/[\u3164\uFFA0\u115F\u1160]/g, " ")
    .replace(/\s{2,}/g, " ").trim();
}

/* The player's own roster team, by UID, then by the team the engine named,
   then by IGN. The engine's team name comes from the table's link to the
   in-game squad, and at the top of a match that link can still be blank
   or last game's -- the pop-up then went up with no logo. The UID cannot
   be wrong about whose player this is. */
function popTeamFor(pop, roster){
  const teams = (roster && roster.teams) || [];
  const uid = String(pop.uid || "").trim();
  const byUid = uid && teams.find(t => (t.players || []).some(p => String(p.uid || "").trim() === uid));
  if(byUid) return byUid;
  const named = pop.teamName ? logoFor(pop.teamName, roster) : null;
  if(named) return named;
  const ign = String(pop.ign || "").trim().toUpperCase();
  return (ign && teams.find(t => (t.players || []).some(p => String(p.ign || "").trim().toUpperCase() === ign))) || null;
}

function showNextPopup(){
  if(popBusy || !popQueue.length || !lastState) return;
  const L = layoutFor(lastState);
  const A = L.achievement;
  if(!A){ popQueue.length = 0; return; }
  const pop = popQueue.shift();
  popBusy = true;
  // One pop-up that fails to draw must not stop every one after it: the
  // queue only moves when this one's timers run, so an error part-way
  // through left it waiting for good -- no pop-ups until a refresh.
  try { drawPopup(pop, A); }
  catch(e){
    console.error("side pop-up:", e);
    document.getElementById("popCard").classList.remove("show", "in", "out");
    popBusy = false;
    setTimeout(showNextPopup, 0);
  }
}

function drawPopup(pop, A){
  const base = assetBase(lastState);
  const art = document.getElementById("popArt");
  if(art.getAttribute("src") !== base + encodeURI(A.art)) art.src = base + encodeURI(A.art);
  document.documentElement.style.setProperty("--pop-travel", (A.travel || -360) + "px");
  const team = popTeamFor(pop, lastState.roster);
  const roster = lastState.roster || {};
  const face = b => (b.face ? { fontFamily: `'${b.face}', Arial, sans-serif`, fontWeight: 400 } : {});
  popPlace("popTitle", A.title, Object.assign({ fontSize: A.title.size + "px", color: A.title.ink,
           lineHeight: A.title.line ? A.title.line + "px" : "" }, face(A.title))).textContent = pop.title || "";
  const pv = popPlace("popValue", A.value, Object.assign({ fontSize: A.value.size + "px", color: A.value.ink }, face(A.value)));
  pv.textContent = pop.value == null ? "" : (pop.valueIsName ? cleanName(pop.value) : String(pop.value));
  popPlace("popLabel", A.label, Object.assign({ fontSize: A.label.size + "px", color: A.label.ink }, face(A.label))).textContent = pop.label || "";
  const name = cleanName(pop.ign) || (team && team.shortName) || pop.teamName || "";
  popPlace("popName", A.name, Object.assign({ fontSize: A.name.size + "px", color: A.name.ink }, face(A.name))).textContent = name;
  const photo = pop.photo || roster.defaultPlayerPhoto || (team && team.groupPhoto) || "";
  const ph = popPlace("popPhoto", A.photo, { display: photo ? "block" : "none" });
  if(photo && ph.getAttribute("src") !== photo) ph.src = photo;
  const over = document.getElementById("popOver");
  if(A.over && photo){
    if(over.getAttribute("src") !== art.getAttribute("src")) over.src = art.getAttribute("src");
    over.style.clipPath = "polygon(" + A.over.map(([x, y]) => x + "px " + y + "px").join(", ") + ")";
    over.style.display = "block";
  } else over.style.display = "none";
  const lg = popPlace("popLogo", A.logo);
  const li = lg.querySelector("img");
  const logo = (team && team.logo) || "";
  li.style.display = logo ? "" : "none";
  if(logo && li.getAttribute("src") !== logo) li.src = logo;

  const card = document.getElementById("popCard");
  card.classList.remove("out");
  card.classList.add("show", "in");
  fitPopText(pop, A);
  // A face still loading measures as its fallback: fitted again once it is in.
  if(document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(() => fitPopText(pop, A));
  const hold = Number((lastState.settings || {}).sidePopupSeconds) || A.seconds || 5;
  clearTimeout(popTimer);
  popTimer = setTimeout(() => {
    card.classList.remove("in");
    card.classList.add("out");
    popTimer = setTimeout(() => {
      card.classList.remove("show", "out");
      popBusy = false;
      showNextPopup();
    }, 400);
  }, (popQueue.length ? Math.min(hold, 2.5) : hold) * 1000);
}

function queuePopup(pop){
  if(!pop || popQueue.some(p => p.id === pop.id)) return;
  popQueue.push(pop);
  showNextPopup();
}

function apply(state){
  lastState = state;
  syncElimCarded(state);
  try { zbApply(state); } catch(e){ console.error("zone bug:", e); }
  const live = state.liveOps || {};
  const source = fillFromRoster((live.sidetableRows || []).slice(0, 12), state);
  const base = assetBase(state);
  preloadPips(base, layoutFor(state));
  // ?preview=1 draws regardless of whether the graphic is on air. A
  // preview that only works once something is already live isn't a
  // preview -- it can't be used to check a graphic BEFORE showing it,
  // which is the entire reason to have one. OBS sources never pass it,
  // so nothing reaches air from this.
  const visible = PREVIEW_MODE || (state.display && state.display.aliveStatusVisible);

  // The top bar has its own switch, so it can stay up with the side table
  // pulled down.
  let top4On = false;
  try { top4On = renderTop4(state, source); } catch(e){ console.error("top4:", e); }
  // The leaders board stands where the side table does: the table steps
  // down while it is up.
  let leadersOn = false;
  try { leadersOn = renderLeaders(state); } catch(e){ console.error("leaders:", e); }
  const clear = (top4On && layoutFor(state).top4Clear) || 0;
  document.documentElement.style.setProperty("--top4-clear", clear + "px");

  // While the Top 4 bar is up (it comes up by itself at four squads left)
  // the side table steps aside: one alive graphic on screen, not two. The
  // rows keep updating underneath, so the table is current the moment the
  // bar goes down, and the elimination card still fires (it is not in
  // #stage).
  document.getElementById("stage").classList.toggle("show", !!visible && source.length > 0 && !top4On && !leadersOn);
  if(!visible || !source.length){
    // SS3's eliminated card is THE elimination graphic for that package
    // (the separate lower third stands down), so it fires on a wipe
    // whether or not the table itself is up.
    const Lq = layoutFor(state);
    if(Lq.elimCard && Lq.elimCard.placementKey){
      try { showAnnouncedElimCard(state, Lq); } catch(e){ console.error("elim card:", e); }
    }
    return;
  }

  const L = layoutFor(state);
  // The PTS. column only exists in some packages, and even there it is a
  // separate backdrop -- so the operator's choice picks the artwork and
  // the column together, never one without the other.
  const showPoints = !!(L.points && state.display && state.display.aliveStatusPoints);
  textScale = Math.min(1.6, Math.max(0.6, Number((state.settings || {}).aliveTextScale) || 1));
  applyLayout(L, showPoints);
  const championTeams = new Set(
    ((state.display || {}).championRushBadgeVisible ? ((state.championRush || {}).totals || []) : [])
      .filter(t => t.activated).map(t => String(t.teamName || "").trim().toUpperCase()));
  // ...and the teams the operator has switched on by hand (In-Game tab).
  ((state.display || {}).crTeams || []).forEach(t => championTeams.add(String(t || "").trim().toUpperCase()));
  ROW_TOPS = L.rowTops;
  ROW_BLOCK = { x: L.row.x, y: L.rowTops[0] };
  RANK_PREFIX = (L.rank && L.rank.prefix) || "";
  RANK_SUFFIX = (L.rank && L.rank.suffix) || "";

  const backdrop = document.getElementById("backdrop");
  const twelve = !!(L.bg12 && source.length > (L.artRows || 12));
  const bgSrc = base + ((showPoints && L.bgPoints) ? L.bgPoints : twelve ? L.bg12 : L.bg);
  if(backdrop.getAttribute("src") !== bgSrc) backdrop.src = bgSrc;
  // CROP (Graphic Fixing -> Alive: crop): pixels cut off the art's top and
  // bottom -- its branding plates -- measured from the art's own edges
  // (artBox; the twelve-row art is one row taller), so one setting holds
  // for both. The rows are drawn over it and are not cut.
  const crop = (state.graphicOverrides || {})["aliveCrop" + (L.placementKey ? "@" + L.placementKey : "")] || {};
  const box = L.artBox || { top: 0, bottom: 1080 };
  const artBottom = box.bottom + (twelve ? (L.rowPitch || 49) : 0);
  const cutTop = Math.max(0, box.top + (Number(crop.top) || 0));
  const cutBottom = Math.max(0, 1080 - (artBottom - (Number(crop.bottom) || 0)));
  const cropped = !!((cutTop > 0 || cutBottom > 0) && (crop.top || crop.bottom));
  let clip = cropped ? `inset(${cutTop}px 0 ${cutBottom}px 0)` : "";
  // FEWER SQUADS than the art has rows (fitRows) -- ten in an eleven-row
  // table: the art ends under the last squad, its empty boxes cut away and
  // what sits under them (the legend, the sponsor plate) drawn that much
  // higher from a second copy of the art. Both cuts fall in the clear gap
  // under a row -- at the top of the first empty one, and a row's pitch
  // under the art's last -- so there is no seam. The crop still trims
  // both ends. Only for art whose legend stands clear of its last row.
  const foot = document.getElementById("backdropFoot");
  const artRowCount = (L.artRows || 12) + (twelve ? 1 : 0);
  const shown = Math.min(source.length, artRowCount);
  const last = L.rowTops[artRowCount - 1];
  const footTop = last + (last - L.rowTops[artRowCount - 2]);
  const cutAt = L.rowTops[shown];
  const lift = L.fitRows && shown > 0 && shown < artRowCount ? footTop - cutAt : 0;
  if(lift){
    clip = `inset(${cropped ? cutTop : 0}px 0 ${1080 - cutAt}px 0)`;
    if(foot.getAttribute("src") !== bgSrc) foot.src = bgSrc;
    foot.style.clipPath = `inset(${footTop}px 0 ${cropped ? cutBottom : 0}px 0)`;
    foot.style.transform = `translateY(-${lift}px)`;
    foot.style.display = "block";
  } else if(foot.style.display !== "none"){
    foot.style.display = "none";
  }
  if(backdrop.style.clipPath !== clip) backdrop.style.clipPath = clip;
  // The strip every row wears as its own box -- row 1's, since they're
  // all identical in the artwork. Offset by the row block's own origin
  // so the crop lands on the box and nothing either side of it.
  const rowStrip = `url('${bgSrc}')`;
  const rowStripPos = `-${ROW_BLOCK.x}px -${ROW_BLOCK.y}px`;

  const container = document.getElementById("rows");
  const byKey = new Map(source.map(r => [rowKeyOf(r), r]));

  // Content first, order second -- a row that just went out has to be
  // showing its eliminated state BEFORE the flyby runs over it.
  const nowEliminated = new Set();
  const newlyOut = [];
  source.forEach(row => {
    const key = rowKeyOf(row);
    let el = rowEls.get(key);
    if(!el){
      el = makeRowEl();
      el.dataset.teamKey = key;
      rowEls.set(key, el);
      container.appendChild(el);
    }
    // Set once per row, and again only if the graphics package changes.
    if(el.style.backgroundImage !== rowStrip){
      el.style.backgroundImage = rowStrip;
      el.style.backgroundPosition = rowStripPos;
    }
    const team = logoFor(row.teamName, state.roster);
    /* Short name, in the order of who knows best: the roster, because an
       operator set it; then the one the engine derives from the client's
       own team name; then the full name, which is what this used to show
       and which a twelve-row table simply truncates -- "MENTALIST ESP"
       arrived on air as "MENTALIST". The client publishes no short name
       of its own, so the derived one is a starting point to overwrite,
       not an answer. */
    const label = teamLabel(team, row, state);
    /* aliveCount is null when nothing has been able to link this squad
       to a team -- no roster entry, no kill to match on, no tag to read.
       That is NOT the same as the squad being dead, and it used to draw
       exactly the same: four dark pips. On air that put teams with all
       four players up next to a squad that really had been wiped, and
       nothing told them apart.

       So an unknown count shows NO indicator at all. A blank reads as
       "we do not know", which is true; four dark pips read as "this
       squad is out", which was a confident lie in the other direction
       from the full-alive one this used to avoid. */
    const aliveUnknown = !row.eliminated && row.aliveCount == null;
    const alive = row.eliminated ? 0
      : (row.aliveCount == null ? 0 : Math.max(0, Math.min(4, row.aliveCount)));
    // GC keeps its indicator art in a "Live Stats" subfolder; CLT keeps
    // it beside the backdrop. pipBase is whichever.
    const artName = alive === 0 ? "Dead.png" : alive + "_alive.png";
    const art = L.pipBase + artName;

    const nameEl = el.querySelector(".name");
    if(nameEl.textContent !== label){
      nameEl.textContent = label;
      fitName(nameEl);
    }
    // Shows the last count actually seen when this frame has none, so the
    // number doesn't blink out and back on every redraw. A team nothing
    // has ever been read for shows 0 rather than an empty cell: every
    // squad starts a match on nought, so 0 is the truth until something
    // says otherwise, and a blank cell in a column of numbers reads as a
    // fault rather than as a score.
    const effective = effectiveKills(row);
    // GNG prints kills in two digits ("05"), as its demo's "00".
    const kills = (effective < 0 ? "0" : String(effective)).padStart((L.kills && L.kills.pad) || 1, "0");
    const killsEl = el.querySelector(".kills");
    if(killsEl.textContent !== kills) killsEl.textContent = kills;

    // What the squad carried in plus what it has earned here, worked out
    // by the engine so this graphic and the sheet can never disagree
    // about it. Blank rather than 0 when nothing is known yet -- a zero
    // reads as a fact, and "no total yet" is not one.
    const ptsEl = el.querySelector(".points");
    const pts = row.livePoints == null ? "" : String(row.livePoints);
    if(ptsEl.textContent !== pts) ptsEl.textContent = pts;

    const img = el.querySelector(".logo img");
    const logoSrc = (team && team.logo) || "";
    if(img.getAttribute("src") !== logoSrc){
      if(logoSrc){ img.src = logoSrc; img.style.display = ""; }
      else { img.removeAttribute("src"); img.style.display = "none"; }
    }
    const pip = el.querySelector(".status-pip");
    // Nothing has been read for this squad, so nothing is claimed about
    // it -- see fillFromRoster, and aliveUnknown above for the row that
    // IS being published but has no count anyone could stand behind.
    const unknownCount = !!(row.statusUnknown || aliveUnknown);
    // Drawn bars (SS3) show an unknown count as four faint bars -- a blank
    // cell beside a team read as the graphic being broken. Packages
    // without an "unknown" colour still show nothing for it.
    pip.style.visibility = (unknownCount && !(L.pipBars && L.pipBars.unknown)) ? "hidden" : "";
    if(L.pipBars){
      const B = L.pipBars;
      if(pip.dataset.bars !== "4"){
        pip.dataset.bars = "4";
        pip.style.backgroundImage = "none";
        pip.innerHTML = [0, 1, 2, 3].map(i =>
          `<i style="position:absolute;top:0;bottom:0;left:${i * (B.w + B.gap)}px;width:${B.w}px;"></i>`).join("");
      }
      const sig = unknownCount ? "?" : String(alive);
      if(pip.dataset.alive !== sig){
        pip.dataset.alive = sig;
        pip.querySelectorAll("i").forEach((bar, i) => {
          bar.style.background = unknownCount ? (B.unknown || B.dead) : (i < alive ? B.alive : B.dead);
        });
      }
    }
    const pipSrc = `url('${base}${art}')`;
    if(!L.pipBars && pip.style.backgroundImage !== pipSrc){
      pip.style.backgroundImage = pipSrc;
      // The crop belongs to the ICON, not the row, so it is set here
      // rather than as a shared custom property -- every row is showing a
      // different one of the five at any moment. Packages whose icons are
      // all framed alike leave this empty and the CSS default applies.
      const crop = L.pipCrops && L.pipCrops[artName];
      if(crop){
        pip.style.backgroundSize = crop.size + "px " + crop.size + "px";
        pip.style.backgroundPosition = crop.px + "px " + crop.py + "px";
      }
    }

    el.classList.toggle("out", !!row.eliminated);
    el.classList.toggle("zone", !!row.inZone);
    el.classList.toggle("fire", !!row.onFire);
    /* Needs no tick: the client publishes every team's kills and this is
       the top of them. Only ever on one row, and only while that row is
       alone at the top -- a shared lead is not a leader. The class is
       set whether or not the package styles it, so adding the look later
       is a stylesheet change and nothing more. */
    el.classList.toggle("killleader", !!row.killLeader);
    // Champion Rush: the scoreboard's rule -- emblem switched on, and the
    // team activated in the committed standings.
    const crTile = el.querySelector(".crtile");
    const crOn = !!(L.crTile && championTeams.has(String(row.teamName || "").trim().toUpperCase()));
    if(crOn && crTile.dataset.src !== base + L.crTile){
      crTile.dataset.src = base + L.crTile;
      crTile.style.backgroundImage = "url('" + base + L.crTile + "')";
    }
    el.classList.toggle("cr", crOn);
    if(row.eliminated){
      nowEliminated.add(key);
      noteElimination(key, row);
      // Only a team we have actually WATCHED go down gets the animation.
      // Without the seenTeams check, any team appearing for the first
      // time while already eliminated counted as a fresh kill -- so
      // reassigning a row in the dashboard introduced "new" names and
      // fired the flyby for several already-dead squads at once, which
      // is exactly the random multi-fire that was reported.
      if(ffSeenTeams.has(key) && !previouslyEliminated.has(key)
         && !flybyDone.has(key)){
        flybyDone.add(key);
        newlyOut.push(el);
      }
    }
    ffSeenTeams.add(key);
  });

  /* A fresh match: everyone is back up, so last game's elimination
     stack has to go or it would still be dictating where teams land.

     Confirmed over several renders rather than believed at once. One
     poll showing nobody eliminated is not a new match -- it is what a
     flicker looks like, and acting on it wiped the record of which
     squads had already had their ELIMINATED sweep, so the next poll
     played it again for every one of them. Three on air at once.

     A real new match stays that way for many polls, so waiting costs
     nothing. */
  allAliveRenders = nowEliminated.size ? 0 : allAliveRenders + 1;
  if(allAliveRenders >= FRESH_MATCH_RENDERS && elimSeq.size){
    elimSeq = new Map();
    elimCounter = 0;
    // Last game's readings go with it -- holding one over into a new
    // match would show a squad as out before a shot was fired.
    forgetHeldStatus();
    flybyDone = new Set();
    flybyQueue = [];
    if(flybyTimer !== null){ clearTimeout(flybyTimer); flybyTimer = null; }
    flybyEndsAt = 0;
  }

  // Anything no longer in the table (roster changed, new match) goes.
  Array.from(rowEls.keys()).forEach(key => {
    if(!byKey.has(key)){
      const el = rowEls.get(key);
      if(el && el.parentNode) el.parentNode.removeChild(el);
      rowEls.delete(key);
    }
  });

  // A squad just went out: run the flyby on its row and freeze the order
  // until it finishes, so the word plays over the row where the viewer
  // last saw that team -- THEN everything slides. Re-applied on a timer
  // because the next state_sync may not land on its own in time.
  if(newlyOut.length){
    newlyOut.forEach(queueFlyby);
    // The card rides the same event as the row animation, so the two can
    // never disagree about who went out. Only the first of a batch gets
    // one: a card per squad back to back would be unreadable, and with
    // the approval gate holding every wipe until it is ticked, a batch
    // means the table catching up rather than four squads dying at once.
    // With "confirm eliminations" on, the card comes from the engine's
    // announcement and nowhere else -- the engine is the only side that
    // knows whether the tick was given. The table's own trigger stays for
    // auto-fire, where there is no tick to wait for.
    if(!(state.settings && state.settings.eliminationApproval)){
      showElimCard(state, newlyOut[0], L);
    }
    // Long enough for the whole queue, not just the first: rows sliding
    // to new places under a word that is still playing is the jumpiness
    // that was reported.
    const span = Math.max((FLYBY_MS + 120) * newlyOut.length, flybyQueueEndsIn());
    holdOrderUntil = Date.now() + span;
    setTimeout(() => { if(lastState) apply(lastState); }, span + 40);
  }
  previouslyEliminated = nowEliminated;

  // Deduplicated, because a repeated key here is what put two team
  // names on top of each other with a blank row underneath: rows are
  // elements keyed by team, so the same key twice means two slots
  // pointing at ONE element (it takes the last slot's position), the
  // other slot left empty, and whatever got pushed past the twelfth
  // slot stranded at its old position with nothing to move it. The
  // duplicate itself is an upstream problem, but the table should
  // degrade by showing that team once, not by scrambling the layout.
  const targetOrder = [];
  orderRows(source, showPoints).forEach(r => {
    const k = rowKeyOf(r);
    if(k && !targetOrder.includes(k)) targetOrder.push(k);
  });

  /* A squad that has just gone out but has no finishing position yet is
     worth waiting a moment for.

     Sorting it now means sorting it by a guess, and then moving it AGAIN
     when the real position lands a poll later -- the row visibly stepping
     through a slot it never belonged in, with whatever it displaced
     stepping back. Holding the order until the position is known makes it
     one move, made with the right answer.

     Bounded, so a position that never arrives -- an older engine, a squad
     the table cannot place -- costs a beat rather than freezing the
     table for the rest of the match. */
  const rankPending = (source || []).some(
    r => r.eliminated && r.finishRank == null && ffSeenTeams.has(rowKeyOf(r)));
  if(rankPending){
    if(!awaitingRankSince) awaitingRankSince = Date.now();
    if(Date.now() - awaitingRankSince < RANK_WAIT_MS){
      holdOrderUntil = Math.max(holdOrderUntil, Date.now() + 120);
      setTimeout(() => { if(lastState) apply(lastState); }, 160);
    }
  } else {
    awaitingRankSince = 0;
  }

  if(Date.now() < holdOrderUntil){
    // Hold the order, but still place any row that has no slot yet
    // (a team appearing mid-flyby would otherwise sit at top:0).
    targetOrder.forEach(k => { if(!displayOrder.includes(k)) displayOrder.push(k); });
    // Keys the table no longer has go, or a squad that has left the
    // lobby holds a slot through the whole freeze and pushes a real one
    // off the bottom.
    displayOrder = displayOrder.filter(k => rowEls.has(k) && targetOrder.includes(k));
  } else {
    displayOrder = targetOrder;
  }

  /* Slots are filled in order and only by rows that are actually going
     to be drawn.

     The slot used to be the entry's index in displayOrder, which meant
     anything skipped -- an entry whose element has gone, a team the
     table dropped mid-order -- left its slot EMPTY while every row below
     kept its own index. One hole in the middle of the table and the rest
     apparently fine, which is exactly how it looked: eleven squads and a
     blank line. A running count cannot leave a gap; if something is
     skipped, everything below simply moves up. */
  const placed = new Set();
  let slot = 0;
  displayOrder.forEach((key) => {
    const el = rowEls.get(key);
    if(!el || slot >= ROW_TOPS.length) return;
    placed.add(key);
    el.style.display = "";
    const top = ROW_TOPS[slot] + "px";
    if(el.style.top !== top) el.style.top = top;
    // The slot number, on the packages that don't print it into the
    // artwork. Written here rather than with the row's other content
    // because it belongs to the SLOT, not the team -- a squad that
    // climbs the table takes its neighbour's number, not its own.
    const rankEl = el.querySelector(".rank");
    const rank = RANK_PREFIX + String(slot + 1) + RANK_SUFFIX;
    if(rankEl && rankEl.textContent !== rank) rankEl.textContent = rank;
    slot++;
    // First placement lands instantly; every move after that animates.
    if(el.classList.contains("no-anim")){
      void el.offsetWidth;
      el.classList.remove("no-anim");
    }
  });

  // Anything that didn't get a slot is HIDDEN rather than left sitting
  // at whatever position it last held -- a stranded row is exactly what
  // renders as an overlap.
  rowEls.forEach((el, key) => {
    if(!placed.has(key)) el.style.display = "none";
  });

  // Checked on every sync, not only when the table noticed a transition,
  // so a card still appears for a squad this page never saw alive.
  showAnnouncedElimCard(state, L);

  applyElementOverrides(state);
}

/* Per-element nudges from the dashboard's Graphic Fixing tab (Alive:
   Logo / Name / Kills / Status). Each is one {dx, dy, scale} applied on
   top of the element's own CSS position -- every row shares the offset,
   since the whole point is lining a COLUMN up with the artwork, not
   moving one row independently. Same transform trick the scoreboard and
   points table already use for their logo columns. */
const OVERRIDE_TARGETS = {
  aliveStatusLogo: ".logo",
  aliveStatusName: ".name",
  aliveStatusKills: ".kills",
  aliveStatusPip: ".status-pip",
};

/* The whole panel, as opposed to one column within it -- the same
   {dx, dy, scale}, applied to #frame. Written only when it actually
   changes: this runs on every sync, and reassigning an identical
   transform on a scaled layer is work the compositor doesn't need
   mid-animation. */
function applyPanelOverride(all, sfx){
  const frame = document.getElementById("frame");
  if(!frame) return;
  const o = all["aliveStatusPanel" + (sfx || "")] || {};
  const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
  const want = (dx || dy || scale !== 1)
    ? `translate(${dx}px, ${dy}px) scale(${scale})`
    : "";
  if(frame.style.transform !== want) frame.style.transform = want;

  /* How far the stage has to travel to clear frame on the way out.
     That translate happens INSIDE #frame, so it is in unscaled units:
     the panel is as wide as the package's own row (408 for CLT, 465 for
     GC) with its right edge on frame's right edge, so that width just
     clears it when nothing has been moved, and a panel dragged
     left (dx < 0) needs exactly that much more -- divided by scale,
     because dx is measured in screen pixels while this is not. The
     extra 62 is the flame overhang, the same margin the original fixed
     470 carried. */
  const panelWidth = (activeLayout && lastState ? layoutFor(lastState) : LAYOUTS.CLT).row.w;
  const clear = Math.round(panelWidth - dx / (scale || 1) + 62);
  frame.style.setProperty("--ff-fly-out", clear + "px");
}

function applyElementOverrides(state){
  const all = state.graphicOverrides || {};
  // Each package keeps its own nudges (see placementKey); packages without
  // one share the original keys, as before.
  const L = layoutFor(state);
  const sfx = L.placementKey ? "@" + L.placementKey : "";
  applyPanelOverride(all, sfx);
  Object.entries(OVERRIDE_TARGETS).forEach(([key, selector]) => {
    const o = all[key + sfx] || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    const t = (dx || dy || scale !== 1) ? `translate(${dx}px, ${dy}px) scale(${scale})` : "";
    // Cleared as well as set: switching package must drop the old nudge.
    document.querySelectorAll("#rows " + selector).forEach(el => {
      if(el.style.transform !== t){ el.style.transform = t; el.style.transformOrigin = "left center"; }
    });
  });
}

/* THE ZONE TIMER BUG (see its CSS). The engine sends its clock on a
   message of its own, once a second while the zone counts (zone_clock,
   with settings.zoneBug on); this counts down smoothly between them and
   draws the squads still standing from the state. The time is the
   engine's estimate from earlier matches -- the client writes no timer. */
const ZB_THEMES = {
  gng:   { acc: "#ffa976", a: "#5c2d12", b: "#2f1307", dark: "#2a1206", ink: "#ece4dc" },
  ss3:   { acc: "#ff1e1e", a: "#3a0808", b: "#0b0b0b", dark: "#fff694", ink: "#f4f4f4" },
  arrow: { a: "#123224", b: "#07120d", dark: "#0b0b0b", ink: "#f2f2f2" },
  rnx:   { acc: "#fcd02c", a: "#6c1694", b: "#3a0852", dark: "#500864", ink: "#ffffff" },
  enfea: { acc: "#ffcc00", a: "#3d0c80", b: "#180044", dark: "#33096b", ink: "#ffffff" },
  gamercult: { acc: "#feea3c", a: "#e30000", b: "#8c0000", dark: "#080808", ink: "#ffffff" },
};
const zb = { clock: null, deadline: 0, key: "", sec: null, shown: false, outTimer: null, inTimer: null,
             tiles: new Map() };
const ZB_DEMO = _params.get("zonedemo") === "1";      // a sample clock, for previews and Graphic Fixing
function zbFmt(sec){ return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
function zoneClock(clock){
  zb.clock = clock || null;
  if(clock && clock.left != null){
    // `left` is whole seconds rounded down: the moment it hits zero is
    // half a second on, on average. Re-anchored only when the page has
    // drifted, so the figure never jitters between ticks.
    const deadline = Date.now() + (clock.left + 0.5) * 1000;
    const key = clock.stage + ":" + clock.phase;
    if(key !== zb.key || Math.abs(deadline - zb.deadline) > 1200) zb.deadline = deadline;
  }
  zbRender();
}
function zbApply(state){
  const place = document.getElementById("zonePlace");
  const L = layoutFor(state);
  const panel = L.elimCard && L.elimCard.panel;
  const at = L.zoneBug || (panel ? { x: Math.round(panel.x + (panel.w - 428) / 2), y: panel.y } : { x: 746, y: 101 });
  place.style.left = at.x + "px";
  place.style.top = at.y + "px";
  const T = ZB_THEMES[L.placementKey] || {};
  const vars = { "--zb-acc": T.acc || L.accent || "#f7941d", "--zb-a": T.a || "#262626", "--zb-b": T.b || "#0e0e0e",
                 "--zb-dark": T.dark || "#111111", "--zb-ink": T.ink || "#f2f2f2",
                 "--zb-face": (L.face || "Arial").split(",")[0] };
  Object.entries(vars).forEach(([k, v]) => { if(place.style.getPropertyValue(k) !== v) place.style.setProperty(k, v); });
  // The Graphic Fixing nudge, the package's own (zoneBug@gng ...)
  const o = (state.graphicOverrides || {})["zoneBug" + (L.placementKey ? "@" + L.placementKey : "")] || {};
  const dx = o.dx || 0, dy = o.dy || 0, sc = o.scale || 1;
  const t = (dx || dy || sc !== 1) ? `translate(${dx}px, ${dy}px) scale(${sc})` : "";
  if(place.style.transform !== t) place.style.transform = t;
  zbTeams(state);
  zbRender();
}
// The squads still standing, most kills first, each by its logo and tag.
// One that goes out greys and shrinks away; one that comes back pops in.
function zbTeams(state){
  const grid = document.querySelector("#zoneBug .zb-grid");
  const rows = ((state.liveOps || {}).sidetableRows || []).filter(r => r && r.teamName);
  const alive = rows.filter(r => !(r.eliminated === true || r.aliveCount === 0))
                    .sort((a, b) => (Number(b.elims) || 0) - (Number(a.elims) || 0));
  const keep = new Set(alive.map(rowKeyOf));
  zb.tiles.forEach((tile, key) => {
    if(keep.has(key) || tile.classList.contains("gone")) return;
    tile.classList.add("gone");
    setTimeout(() => { if(tile.classList.contains("gone")){ tile.remove(); zb.tiles.delete(key); } }, 420);
  });
  alive.forEach((row, i) => {
    const key = rowKeyOf(row);
    let tile = zb.tiles.get(key);
    if(!tile || tile.classList.contains("gone")){
      if(tile) tile.remove();
      tile = document.createElement("div");
      tile.className = "zb-team" + (zb.shown ? " new" : "");
      tile.innerHTML = '<div class="lg"><img alt=""></div><div class="sn"></div>';
      zb.tiles.set(key, tile);
    }
    tile.style.setProperty("--i", i);
    const team = logoFor(row.teamName, state.roster);
    const img = tile.querySelector("img");
    const src = (team && team.logo) || "";
    if(img.getAttribute("src") !== src){ if(src) img.src = src; else img.removeAttribute("src"); }
    img.style.visibility = src ? "" : "hidden";
    const sn = (row.short || (team && team.shortName) || row.teamName || "").toUpperCase();
    const snEl = tile.querySelector(".sn");
    if(snEl.textContent !== sn){ snEl.textContent = sn; snEl.dataset.fit = "1"; }
    if(grid.children[i] !== tile) grid.insertBefore(tile, grid.children[i] || null);
  });
  const n = alive.length;
  document.querySelector("#zoneBug .zb-count").textContent = n + (n === 1 ? " TEAM" : " TEAMS") + " ALIVE";
  zbFitTags();
}
// A long tag shrinks to its tile rather than being cut off. Measured only
// while the bug is drawn -- hidden, every width reads 0 -- so a tag set
// while it was down is fitted when it comes up.
function zbFitTags(){
  if(!document.getElementById("zoneBug").classList.contains("show")) return;
  document.querySelectorAll('#zoneBug .sn[data-fit="1"]').forEach(el => {
    el.style.fontSize = "";
    for(let size = 13; size > 8 && el.scrollWidth > el.clientWidth + 0.5; size--) el.style.fontSize = (size - 1) + "px";
    delete el.dataset.fit;
  });
}
function zbRender(){
  const el = document.getElementById("zoneBug");
  const st = lastState;
  if(ZB_DEMO && !zb.clock){
    zb.clock = { stage: 2, phase: "PRE_SHRINK", label: "ZONE SHRINKS IN", left: 38, expected: 50 };
    zb.deadline = Date.now() + 38500;
  }
  const on = !!(zb.clock && st && (ZB_DEMO || (st.settings || {}).zoneBug));
  if(on && !zb.shown){
    zb.shown = true;
    clearTimeout(zb.outTimer);
    el.classList.remove("out");
    el.classList.add("show", "in");
    zbFitTags();
    clearTimeout(zb.inTimer);
    zb.inTimer = setTimeout(() => el.classList.remove("in"), 1400);
  } else if(!on && zb.shown){
    zb.shown = false;
    el.classList.remove("in");
    el.classList.add("out");
    zb.outTimer = setTimeout(() => el.classList.remove("show", "out"), 320);
  }
  if(!zb.clock) return;
  const c = zb.clock;
  const key = c.stage + ":" + c.phase;
  const label = el.querySelector(".zb-label");
  if(key !== zb.key){
    const fresh = zb.key !== "";
    zb.key = key;
    zb.sec = null;
    el.querySelector(".zb-stage").textContent = "ZONE " + ((Number(c.stage) || 0) + 1);
    label.textContent = c.label || "ZONE";
    if(fresh && zb.shown){
      label.classList.remove("swap"); void label.offsetWidth; label.classList.add("swap");
      const head = el.querySelector(".zb-head");
      head.classList.remove("shine"); void head.offsetWidth; head.classList.add("shine");
    }
  }
  el.classList.toggle("untimed", c.left == null);
  zbTick();
}
function zbTick(){
  if(!zb.clock || zb.clock.left == null) return;
  const el = document.getElementById("zoneBug");
  const sec = Math.max(0, Math.floor((zb.deadline - Date.now()) / 1000));
  if(sec === zb.sec) return;
  zb.sec = sec;
  const span = el.querySelector(".zb-time span");
  span.textContent = zbFmt(sec);
  span.classList.remove("tick"); void span.offsetWidth; span.classList.add("tick");
  el.classList.toggle("urgent", sec <= 10);
  const exp = Number(zb.clock.expected) || 0;
  el.querySelector(".zb-head").style.setProperty("--zb-frac", (exp ? Math.min(100, sec / exp * 100) : 0) + "%");
  // the demo loops
  if(ZB_DEMO && sec === 0) setTimeout(() => { zb.deadline = Date.now() + 38500; }, 900);
}
setInterval(zbTick, 200);
// Out of the way of the elimination card and the wipe banner, which play
// where it sits; back when they have gone.
(function zbYield(){
  const card = document.getElementById("elimCard"), banner = document.getElementById("wipeBanner");
  const check = () => {
    const busy = card.classList.contains("show") || banner.classList.contains("show");
    document.getElementById("zoneBug").classList.toggle("yield", busy);
  };
  [card, banner].forEach(n => new MutationObserver(check).observe(n, { attributes: true, attributeFilter: ["class"] }));
})();

connect();
</script>

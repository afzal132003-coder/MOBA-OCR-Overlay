<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Fire Alive Status</title>
<style>
  /* The 12-team live side table.
     ---------------------------------------------------------------
     Every number on this graphic comes from the game client's own
     debugger log, not from OCR of the in-game table (or, once
     calibrated, the alive grid's own colour/digit read -- see
     link_live_teams()/apply_alive_grid_identities() in
     freefire_engine.py; both feed liveOps.sidetableRows in the same
     shape, so this page doesn't care which one supplied a given row).

     Geometry below is measured from the CURRENT artwork
     (assets/freefire/<event>/ALIVE STATUS.png, the TEAM/KILLS/STATUS
     design), not eyeballed -- sampled directly from the PNG's own
     pixels. At 1920x1080 the table occupies x 1512..1920, a header
     band, twelve 44px-tall rows on a ~49.3px pitch, and a legend
     footer explaining the STATUS icon (this is the SAME icon set the
     old design used -- Dead.png / 1_alive.png.. 4_alive.png -- just
     moved to sit under the STATUS column instead of a dedicated ALIVE
     column). Row tops are listed exactly as measured rather than
     computed from a pitch, matching the old design's own reasoning:
     the artwork's spacing is not perfectly uniform and drift would
     show by row twelve.

     Font is Gotham, per the graphic package -- not bundled here (no
     @font-face): it's expected to already be installed on the
     machine running the browser source, the same way a licensed font
     normally reaches a design tool without redistributing the file.
     Falls back to Arial if it isn't. */

  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    width: 1920px; height: 1080px;
    font-family: 'Gotham', Arial, sans-serif;
  }

  #stage { position: absolute; inset: 0; display: none; }
  #stage.show { display: block; }

  #backdrop { position: absolute; inset: 0; width: 1920px; height: 1080px; }

  .row { position: absolute; height: 44px; left: 1512px; width: 408px; }

  /* No rank element: 01..12 are already printed in the artwork, so a
     row is ranked by which slot it occupies, not by anything drawn
     here. */
  .logo {
    position: absolute; left: 8px; top: 0; width: 40px; height: 44px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo img { max-width: 34px; max-height: 34px; object-fit: contain; }

  .name {
    position: absolute; left: 54px; top: 0; width: 150px; height: 44px;
    display: flex; align-items: center;
    color: #f2e9e6; font-weight: 700; font-size: 17px; letter-spacing: 0.2px;
    text-transform: uppercase; white-space: nowrap; overflow: hidden;
  }
  .kills {
    position: absolute; left: 208px; top: 0; width: 74px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    color: #f2e9e6; font-weight: 800; font-size: 18px;
    font-variant-numeric: tabular-nums;
  }

  /* The STATUS pip -- YOUR artwork, unmodified (Dead.png /
     1..4_alive.png), picked by alive count. Nothing is drawn here; this
     only crops the supplied PNG down to its own content.

     Measured from the files themselves: all five are a 500x500 canvas
     whose visible content sits at x 11..487, y 140..359 -- 477x220,
     so 2.17:1. The scale is UNIFORM on both axes, unlike the old
     design's (which stretched each axis independently to fill a slot
     that happened to be nearly the same ratio). Stretching into this
     design's wider STATUS column turned the bars into fat squares --
     they're meant to stay the proportions they were drawn at:

       factor = 36/220 = 0.163636
       background-size  = 500 x factor        -> 81.8px
       background-position = -11 x f, -140 x f -> -1.8px, -22.9px
       displayed content   = 477 x f = 78px wide, 36px tall */
  .status-pip {
    position: absolute; left: 304px; top: 4px; width: 78px; height: 36px;
    background-repeat: no-repeat;
    background-size: 81.8px 81.8px;
    background-position: -1.8px -22.9px;
  }

  /* A wiped squad's whole row dims, so "who is still in" reads at a
     glance rather than needing the pip alone to carry it. */
  .row.out .name { opacity: 0.55; }
  .row.out .logo img { filter: grayscale(1); opacity: 0.5; }

  /* Rows slide to their new slot instead of snapping. This only works
     because a row's element PERSISTS between updates (see rowEls in the
     script) -- the old version rebuilt all twelve from scratch on every
     change, so there was never an old position to animate from.

     Slow enough to read as travel: a squad eliminated out of row 1 has
     eleven rows to cross, and at a snappier duration that reads as a
     jump rather than a fall. The ease-in-out start and finish are what
     make a long move look deliberate instead of thrown. */
  .row { transition: top 900ms cubic-bezier(0.65, 0, 0.35, 1); }
  .row.no-anim { transition: none; }

  /* ---- the elimination flyby ----------------------------------------
     Runs on the row that just went out, BEFORE anything re-sorts: the
     word sweeps across, and only once it's gone does the table reorder
     (see the hold in applyRows). Two copies of the text, the back one
     offset and dimmed, give the motion-trail look without needing a
     video or sprite sheet. Clipped to the row so it never bleeds into
     the rows above and below while it travels. */
  .flyby {
    position: absolute; inset: 0; overflow: hidden;
    pointer-events: none; display: none;
  }
  .flyby.on { display: block; }
  .flyby .word {
    position: absolute; top: 50%; left: 0;
    transform: translate(-120%, -50%);
    font-style: italic; font-weight: 900; font-size: 26px;
    letter-spacing: 1px; white-space: nowrap;
    color: #ffffff; text-shadow: 0 0 18px rgba(255, 120, 0, 0.9);
  }
  .flyby .word.trail {
    color: #ff7a00; opacity: 0.55; filter: blur(1px);
  }
  .flyby.on .word       { animation: ff-flyby 1150ms cubic-bezier(0.16, 0.84, 0.3, 1) both; }
  .flyby.on .word.trail { animation: ff-flyby 1150ms cubic-bezier(0.16, 0.84, 0.3, 1) both;
                          animation-delay: 55ms; }
  @keyframes ff-flyby {
    0%   { transform: translate(-130%, -50%) skewX(-12deg); opacity: 0; }
    18%  { opacity: 1; }
    55%  { transform: translate(28%, -50%) skewX(-12deg); opacity: 1; }
    100% { transform: translate(150%, -50%) skewX(-12deg); opacity: 0; }
  }

  /* The row itself flares red under the flyby, then settles into the
     permanent dim above. */
  @keyframes ff-elim-flash {
    0%   { box-shadow: inset 0 0 0 999px rgba(220, 4, 7, 0); }
    20%  { box-shadow: inset 0 0 0 999px rgba(220, 4, 7, 0.5); }
    100% { box-shadow: inset 0 0 0 999px rgba(220, 4, 7, 0); }
  }
  .row.just-eliminated { animation: ff-elim-flash 1150ms ease-out; }
</style>
</head>
<body>

<div id="stage">
  <img id="backdrop" alt="">
  <div id="rows"></div>
</div>

<script>
const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=freefire_alive_status"
  : "ws://localhost:8765?page=freefire_alive_status";

// Measured from ALIVE STATUS.png -- see the note at the top.
const ROW_TOPS = [286, 335, 384, 434, 483, 532, 582, 631, 680, 730, 779, 828];

let ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") apply(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function assetBase(state){
  const folder = (state.event && state.event.assetFolder) || "CLT";
  return "assets/freefire/" + folder + "/";
}

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

/* Order, in two blocks.

   STILL ALIVE, at the top: most kills first, teams level on kills split
   by who has more players still up.

   ELIMINATED, below them: stacked from the bottom in the order they
   went out. The first squad wiped sits on the very last row and stays
   there; each one after it lands directly above the previous casualty.
   So a team leaving row 1 travels all the way down on the first
   elimination, and only as far as the row above the last casualty
   later on -- which is also its real placement.

   Elimination order is observed here rather than taken from the data:
   link_live_teams() supplies a placement the moment it sees a wipe, but
   the alive grid doesn't, and a row can come from either. Counting the
   transitions as they happen works the same for both. placement is
   still used as the seed for anything already eliminated before this
   page loaded, so a mid-match refresh doesn't lose the stack. */
let elimSeq = new Map();     // team key -> when it went out (higher = later)
let elimCounter = 0;

function noteElimination(key, row){
  if(elimSeq.has(key)) return;
  // placement counts DOWN as teams survive longer (first out = 12), so a
  // bigger placement is an earlier exit -- negate it to match the
  // counter's "higher is later" ordering, and keep it below any
  // elimination this page actually witnessed.
  elimSeq.set(key, row && row.placement != null
    ? -row.placement
    : ++elimCounter);
}

function orderRows(rows){
  const killsOf = (r) => (r.elims == null ? -1 : r.elims);
  const aliveOf = (r) => (r.aliveCount == null ? 0 : r.aliveCount);
  return rows.map((r, i) => ({ r, i })).sort((A, B) => {
    const a = A.r, b = B.r;
    const aOut = !!a.eliminated, bOut = !!b.eliminated;
    if(aOut !== bOut) return aOut ? 1 : -1;      // alive block on top

    if(!aOut){
      const dk = killsOf(b) - killsOf(a);
      if(dk) return dk;
      const da = aliveOf(b) - aliveOf(a);
      if(da) return da;
      return A.i - B.i;                          // stable on a full tie
    }

    // Both out: most recently eliminated sits highest, so the first
    // casualty ends up on the bottom row.
    const sa = elimSeq.has(rowKeyOf(a)) ? elimSeq.get(rowKeyOf(a)) : 0;
    const sb = elimSeq.has(rowKeyOf(b)) ? elimSeq.get(rowKeyOf(b)) : 0;
    if(sa !== sb) return sb - sa;
    return A.i - B.i;
  }).map(x => x.r);
}

function logoFor(teamName, roster){
  const want = (teamName || "").trim().toUpperCase();
  const team = ((roster && roster.teams) || []).find(
    t => (t.name || "").trim().toUpperCase() === want);
  return team || null;
}

/* ---- persistent rows -------------------------------------------------
   A row's element is created ONCE and then updated in place, keyed by
   team. That's what makes the slide possible at all: the old version
   rebuilt all twelve on every update, so each "new" element was born at
   its final position with nothing to animate from. It also ends the
   repaint flicker the old innerHTML swap caused, which is why the
   change-detection guard it needed is gone -- updating a text node
   that already holds the same string costs nothing and shows nothing. */
const FLYBY_MS = 1150;
const rowEls = new Map();        // team key -> row element
let displayOrder = [];           // team keys, in the order currently on screen
let holdOrderUntil = 0;          // while in the future, don't re-sort
let previouslyEliminated = new Set();
let lastState = null;

function rowKeyOf(row){ return (row.teamName || "").trim().toUpperCase(); }

function makeRowEl(){
  const el = document.createElement("div");
  el.className = "row no-anim";
  el.innerHTML =
    '<div class="logo"><img alt="" style="display:none"></div>' +
    '<div class="name"></div>' +
    '<div class="kills"></div>' +
    '<div class="status-pip"></div>' +
    '<div class="flyby"><span class="word trail">ELIMINATED</span>' +
    '<span class="word">ELIMINATED</span></div>';
  return el;
}

function playFlyby(el){
  const fly = el.querySelector(".flyby");
  fly.classList.remove("on");
  el.classList.remove("just-eliminated");
  void el.offsetWidth;              // restart both animations from zero
  fly.classList.add("on");
  el.classList.add("just-eliminated");
  setTimeout(() => fly.classList.remove("on"), FLYBY_MS + 60);
}

function apply(state){
  lastState = state;
  const live = state.liveOps || {};
  const source = (live.sidetableRows || []).slice(0, 12);
  const base = assetBase(state);
  const visible = state.display && state.display.aliveStatusVisible;

  document.getElementById("stage").classList.toggle("show", !!visible && source.length > 0);
  if(!visible || !source.length) return;

  const backdrop = document.getElementById("backdrop");
  const bgSrc = base + "ALIVE STATUS.png";
  if(backdrop.getAttribute("src") !== bgSrc) backdrop.src = bgSrc;

  const container = document.getElementById("rows");
  const byKey = new Map(source.map(r => [rowKeyOf(r), r]));

  // Content first, order second -- a row that just went out has to be
  // showing its eliminated state BEFORE the flyby runs over it.
  const nowEliminated = new Set();
  const newlyOut = [];
  source.forEach(row => {
    const key = rowKeyOf(row);
    let el = rowEls.get(key);
    if(!el){
      el = makeRowEl();
      rowEls.set(key, el);
      container.appendChild(el);
    }
    const team = logoFor(row.teamName, state.roster);
    const label = (team && team.shortName) || row.teamName || "";
    // aliveCount is null when the squad could not be linked to the roster
    // (that link is what turns the client's squad number into a team).
    // Showing a full-alive pip would be a confident lie, so an unknown
    // count falls back to the empty/dead indicator.
    const alive = row.eliminated ? 0
      : (row.aliveCount == null ? 0 : Math.max(0, Math.min(4, row.aliveCount)));
    const art = alive === 0 ? "Dead.png" : alive + "_alive.png";

    const nameEl = el.querySelector(".name");
    if(nameEl.textContent !== label) nameEl.textContent = label;
    // elims is null once the match has ended (the running score gets
    // placement points folded in at that point and would read as an
    // inflated "kills" number), so a blank cell beats a confidently wrong
    // one -- same rule the rest of this codebase already follows.
    const kills = row.elims == null ? "" : String(row.elims);
    const killsEl = el.querySelector(".kills");
    if(killsEl.textContent !== kills) killsEl.textContent = kills;

    const img = el.querySelector(".logo img");
    const logoSrc = (team && team.logo) || "";
    if(img.getAttribute("src") !== logoSrc){
      if(logoSrc){ img.src = logoSrc; img.style.display = ""; }
      else { img.removeAttribute("src"); img.style.display = "none"; }
    }
    const pip = el.querySelector(".status-pip");
    const pipSrc = `url('${base}${art}')`;
    if(pip.style.backgroundImage !== pipSrc) pip.style.backgroundImage = pipSrc;

    el.classList.toggle("out", !!row.eliminated);
    if(row.eliminated){
      nowEliminated.add(key);
      noteElimination(key, row);
      if(!previouslyEliminated.has(key)) newlyOut.push(el);
    }
  });

  // A fresh match: everyone is back up, so last game's elimination
  // stack has to go or it would still be dictating where teams land.
  if(!nowEliminated.size && elimSeq.size){
    elimSeq = new Map();
    elimCounter = 0;
  }

  // Anything no longer in the table (roster changed, new match) goes.
  Array.from(rowEls.keys()).forEach(key => {
    if(!byKey.has(key)){
      const el = rowEls.get(key);
      if(el && el.parentNode) el.parentNode.removeChild(el);
      rowEls.delete(key);
    }
  });

  // A squad just went out: run the flyby on its row and freeze the order
  // until it finishes, so the word plays over the row where the viewer
  // last saw that team -- THEN everything slides. Re-applied on a timer
  // because the next state_sync may not land on its own in time.
  if(newlyOut.length){
    newlyOut.forEach(playFlyby);
    holdOrderUntil = Date.now() + FLYBY_MS;
    setTimeout(() => { if(lastState) apply(lastState); }, FLYBY_MS + 40);
  }
  previouslyEliminated = nowEliminated;

  // Deduplicated, because a repeated key here is what put two team
  // names on top of each other with a blank row underneath: rows are
  // elements keyed by team, so the same key twice means two slots
  // pointing at ONE element (it takes the last slot's position), the
  // other slot left empty, and whatever got pushed past the twelfth
  // slot stranded at its old position with nothing to move it. The
  // duplicate itself is an upstream problem, but the table should
  // degrade by showing that team once, not by scrambling the layout.
  const targetOrder = [];
  orderRows(source).forEach(r => {
    const k = rowKeyOf(r);
    if(k && !targetOrder.includes(k)) targetOrder.push(k);
  });

  if(Date.now() < holdOrderUntil){
    // Hold the order, but still place any row that has no slot yet
    // (a team appearing mid-flyby would otherwise sit at top:0).
    targetOrder.forEach(k => { if(!displayOrder.includes(k)) displayOrder.push(k); });
    displayOrder = displayOrder.filter(k => rowEls.has(k));
  } else {
    displayOrder = targetOrder;
  }

  const placed = new Set();
  displayOrder.forEach((key, i) => {
    const el = rowEls.get(key);
    if(!el || i >= ROW_TOPS.length) return;
    placed.add(key);
    el.style.display = "";
    const top = ROW_TOPS[i] + "px";
    if(el.style.top !== top) el.style.top = top;
    // First placement lands instantly; every move after that animates.
    if(el.classList.contains("no-anim")){
      void el.offsetWidth;
      el.classList.remove("no-anim");
    }
  });

  // Anything that didn't get a slot is HIDDEN rather than left sitting
  // at whatever position it last held -- a stranded row is exactly what
  // renders as an overlap.
  rowEls.forEach((el, key) => {
    if(!placed.has(key)) el.style.display = "none";
  });

  applyElementOverrides(state);
}

/* Per-element nudges from the dashboard's Graphic Fixing tab (Alive:
   Logo / Name / Kills / Status). Each is one {dx, dy, scale} applied on
   top of the element's own CSS position -- every row shares the offset,
   since the whole point is lining a COLUMN up with the artwork, not
   moving one row independently. Same transform trick the scoreboard and
   points table already use for their logo columns. */
const OVERRIDE_TARGETS = {
  aliveStatusLogo: ".logo",
  aliveStatusName: ".name",
  aliveStatusKills: ".kills",
  aliveStatusPip: ".status-pip",
};

function applyElementOverrides(state){
  const all = state.graphicOverrides || {};
  Object.entries(OVERRIDE_TARGETS).forEach(([key, selector]) => {
    const o = all[key] || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    if(!dx && !dy && scale === 1) return;
    document.querySelectorAll("#rows " + selector).forEach(el => {
      el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
      el.style.transformOrigin = "left center";
    });
  });
}

connect();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Fire Booyah Team Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Booyah team stats -- the winning squad of the most recently COMMITTED
     match, four cards of one player each.
     ---------------------------------------------------------------
     Every number here has a different source, which is worth knowing when
     one of them is missing:

       ELIMINATIONS  the result file's own per-player KILL. Authoritative.
       KNOCKS        counted from the game log's knockdown lines during
                     the match and carried through the match-end fetch.
                     Nothing else records these -- the result file has no
                     knockdown column.
       CONTRIBUTION  derived, see below.
       character     the Num5 loadout capture for that game. This is the
                     one thing the log cannot supply, so a player who was
                     never captured shows an empty portrait rather than a
                     wrong one.

     CONTRIBUTION is (7 x eliminations + 3 x knocks) as a share of the
     squad's total. Those weights were recovered from the design's own
     reference card, which shows 13.21 / 22.50 / 26.43 / 37.86 for players
     on 4+3, 6+7, 8+6 and 10+12 -- all four reproduce to the cent, and
     they sum to 100. If the intended formula is something else, this is
     the line to change.

     The artwork is 1672x941, not 1920x1080, so the whole card is laid out
     in the artwork's own pixels and scaled up as one piece. That keeps
     every measurement below honest to the PNG instead of pre-multiplied
     by a factor that would have to be redone if a package ships a
     different size.

     Measured from BOOYAH TEAM STATS.png: cards at x 134..803 and
     867..1544, rows at y 227..474 and 507..750 (a 277px row pitch);
     portrait box x 144..334 within the first card; name plate x 342..800,
     y 240..294; the ELIMINATIONS and KNOCKS labels centre on x 450 and
     662; CONTRIBUTION's label sits at y 410..430. */

  html, body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px;
    font-family:'Poppins','Segoe UI',Arial,sans-serif;
  }

  #stage{
    position:absolute; top:0; left:0;
    width:1672px; height:941px;
    transform:scale(1.14833);        /* 1920 / 1672 */
    transform-origin:top left;
    opacity:0; transition:opacity .45s ease;
  }
  #stage.visible{ opacity:1; }

  .bg{ position:absolute; top:0; left:0; width:1672px; height:941px; }

  .card{ position:absolute; }

  /* The deep red the reference cards use behind each portrait, sampled
     from it (#6f000c). It has to be painted here rather than left to the
     artwork: the character assets carry transparent margins, and without
     a backing the blank's "PLAYER" placeholder shows through them. */
  .portrait{
    position:absolute; overflow:hidden;
    display:block; background:#6f000c;
  }
  .portrait img{ display:block; width:100%; height:100%; object-fit:cover; }
  /* No character captured for this player: show the artwork's own empty
     frame rather than a red rectangle, so it reads as "not captured"
     instead of as a rendering fault. */
  .portrait.empty{ background:transparent; }
  .portrait.empty img{ display:none; }

  .pname{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    color:#1a1206; font-weight:800; font-size:30px;
    letter-spacing:.2px; white-space:nowrap; overflow:hidden;
  }

  .stat{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    color:#ffc400; font-weight:800; font-size:46px; line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .pct{
    position:absolute;
    display:flex; align-items:center; justify-content:flex-end;
    color:#ffc400; font-weight:800; font-size:27px;
    font-variant-numeric:tabular-nums;
  }
</style>
</head>
<body>

<div id="stage">
  <img class="bg" id="bg" alt="">
</div>

<script>
const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=freefire_booyah"
  : "ws://localhost:8765?page=freefire_booyah";

/* All in the artwork's own 1672x941 pixels -- see the note above. */
const CARD_X = [134, 867];
const CARD_Y = [227, 504];
const P = {                     // relative to a card's top-left corner
  portrait: { x: 10,  y: 15,  w: 190, h: 220 },
  name:     { x: 208, y: 13,  w: 458, h: 54  },
  elims:    { cx: 316, y: 118, w: 190, h: 56  },
  knocks:   { cx: 528, y: 118, w: 190, h: 56  },
  pct:      { x: 400, y: 190, w: 256, h: 32  },
};

const stage = document.getElementById("stage");
for(let i = 0; i < 4; i++){
  const col = i % 2, row = (i / 2) | 0;
  const card = document.createElement("div");
  card.className = "card";
  card.style.left = CARD_X[col] + "px";
  card.style.top = CARD_Y[row] + "px";
  card.style.width = "669px";
  card.style.height = "247px";
  card.innerHTML =
    '<div class="portrait empty" id="bs-' + i + '-portrait" style="' +
      'left:' + P.portrait.x + 'px;top:' + P.portrait.y + 'px;' +
      'width:' + P.portrait.w + 'px;height:' + P.portrait.h + 'px">' +
      '<img id="bs-' + i + '-img" alt="">' +
    '</div>' +
    '<div class="pname" id="bs-' + i + '-name" style="' +
      'left:' + P.name.x + 'px;top:' + P.name.y + 'px;' +
      'width:' + P.name.w + 'px;height:' + P.name.h + 'px"></div>' +
    '<div class="stat" id="bs-' + i + '-elims" style="' +
      'left:' + (P.elims.cx - P.elims.w / 2) + 'px;top:' + P.elims.y + 'px;' +
      'width:' + P.elims.w + 'px;height:' + P.elims.h + 'px"></div>' +
    '<div class="stat" id="bs-' + i + '-knocks" style="' +
      'left:' + (P.knocks.cx - P.knocks.w / 2) + 'px;top:' + P.knocks.y + 'px;' +
      'width:' + P.knocks.w + 'px;height:' + P.knocks.h + 'px"></div>' +
    '<div class="pct" id="bs-' + i + '-pct" style="' +
      'left:' + P.pct.x + 'px;top:' + P.pct.y + 'px;' +
      'width:' + P.pct.w + 'px;height:' + P.pct.h + 'px"></div>';
  stage.appendChild(card);
}

function set(i, field, value){
  const el = document.getElementById("bs-" + i + "-" + field);
  if(el) el.textContent = value;
}

/* The captured character for this player in THIS game. The Num5 capture
   stores the matched library entry's id, which is the filename of the
   reference art it matched, so the portrait is the game's own asset
   rather than a re-photographed screen crop. */
function characterImage(rosterPlayer, gameNumber){
  const loadouts = (rosterPlayer && rosterPlayer.loadouts) || {};
  const entry = loadouts[String(gameNumber)] || loadouts[gameNumber];
  const slot = entry && entry.slots && entry.slots.active;
  if(!slot || !slot.label) return "";
  return "assets/FFM/" + slot.label + ".png";
}

function rosterPlayerFor(ff, teamName, uid, ign){
  const teams = ((ff.roster && ff.roster.teams) || []);
  const team = teams.find(t => (t.name || "").trim().toUpperCase() ===
    (teamName || "").trim().toUpperCase());
  if(!team) return null;
  const players = team.players || [];
  return players.find(p => String(p.uid || "") === String(uid || "")) ||
         players.find(p => (p.ign || "").trim().toUpperCase() ===
           (ign || "").trim().toUpperCase()) || null;
}

let lastKey = "";

function applyFreefire(ff){
  const folder = (ff.event && ff.event.assetFolder) || "CLT";
  const matches = ff.matches || [];
  const latest = matches.length ? matches[matches.length - 1] : null;
  const winner = latest && (latest.teams || [])
    .slice().sort((a, b) => (a.rank || 99) - (b.rank || 99))[0];

  const visible = !!(ff.display && ff.display.booyahStatsVisible) && !!winner;
  document.getElementById("stage").classList.toggle("visible", visible);
  if(!visible) return;

  const players = (winner.players || []).slice(0, 4);
  const gameNumber = matches.length;

  // Weighted so a knockdown counts for less than a finish -- see the note
  // at the top for where 7 and 3 come from.
  const weight = p => 7 * (p.kills || 0) + 3 * (p.knocks || 0);
  const total = players.reduce((sum, p) => sum + weight(p), 0);

  const key = folder + "|" + JSON.stringify(players.map(p =>
    [p.name, p.uid, p.kills, p.knocks]));
  if(key === lastKey) return;
  lastKey = key;

  document.getElementById("bg").src =
    "assets/freefire/" + folder + "/BOOYAH TEAM STATS.png";

  for(let i = 0; i < 4; i++){
    const p = players[i];
    const portrait = document.getElementById("bs-" + i + "-portrait");
    if(!p){
      ["name", "elims", "knocks", "pct"].forEach(f => set(i, f, ""));
      portrait.classList.add("empty");
      continue;
    }
    set(i, "name", p.name || "");
    set(i, "elims", p.kills == null ? 0 : p.kills);
    // Blank, not zero, when knockdowns were never captured for this match
    // -- a squad really can knock nobody, but "0" everywhere is far more
    // likely to mean the engine wasn't reading the log that game, and a
    // confident zero on air is worse than an empty box.
    set(i, "knocks", p.knocks == null ? "" : p.knocks);
    set(i, "pct", total ? (weight(p) / total * 100).toFixed(2) + "%" : "");

    const src = characterImage(
      rosterPlayerFor(ff, winner.teamName, p.uid, p.name), gameNumber);
    const img = document.getElementById("bs-" + i + "-img");
    if(src){
      if(img.getAttribute("src") !== src) img.src = src;
      portrait.classList.remove("empty");
    } else {
      portrait.classList.add("empty");
    }
  }
}

let ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    // The Free Fire engine's state_sync carries its state flat, not under
    // a "freefire" key. The previous version of this page looked for that
    // key and so never rendered anything.
    if(msg.type === "state_sync") applyFreefire(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>

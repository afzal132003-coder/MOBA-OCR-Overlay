<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="ff_embed.js"></script>
<title>Free Fire Elimination Report</title>
<link rel="stylesheet" href="ff_theme.css">
<style>
  /* ELIMINATION REPORT -- the top 12 players of the post-match game
     (state.postGame), by eliminations, then knocks, then survival: team,
     player, elims, knocks, headshots, survival. The client writes no damage
     anywhere, so a DMG column appears only when damage was typed in during
     review. Drawn in the event's look (ff_theme.css). */
  .ss3 #board{left:150px;top:340px;width:1620px;height:552px;}
  .arrow #board{left:200px;top:236px;width:1520px;height:700px;}
  .hd, .pr{position:absolute;left:0;width:100%;display:flex;align-items:center;}
  .hd{top:0;}
  .ss3 .hd{height:44px;}
  .arrow .hd{height:54px;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%);}
  .hd > div, .pr > div{height:100%;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;}
  .ss3 .hd > div{font-size:20px;}
  .arrow .hd > div{font-size:24px;}
  .ss3 .pr{height:38px;}
  .arrow .pr{height:50px;border-bottom:1px solid rgba(255,255,255,.07);}
  .ss3 .pr:nth-child(odd){background:rgba(255,255,255,.06);}
  .ss3 .pr > div{font-size:22px;}
  .arrow .pr > div{font-size:26px;}
  .c-rk{width:80px;} .c-lg{width:56px;} .c-pl{flex:1;justify-content:flex-start !important;padding-left:8px;}
  .c-tm{width:250px;justify-content:flex-start !important;} .c-n{width:150px;}
  .pr img{width:32px;height:32px;object-fit:contain;}
  .arrow .pr img{width:40px;height:40px;}
  .top1 .c-rk, .top1 .c-pl{}
  .nodata{position:absolute;left:0;top:520px;width:1920px;text-align:center;font-family:'SMXB',Arial,sans-serif;font-size:30px;color:#fff;
          text-shadow:0 2px 8px rgba(0,0,0,.8);}
</style>
</head>
<body class="ss3">
<div class="ff-stage" id="stage">
  <div class="ff-frame fade"></div>
  <div class="ff-title fade" id="title" style="animation-delay:.1s">ELIMINATION REPORT</div>
  <div class="ff-round ctr fade" id="round" style="animation-delay:.25s"></div>
  <div class="abs ff-black fade" id="board" style="animation-delay:.35s"></div>
  <div class="nodata" id="nodata"></div>
</div>
<script src="ff_theme.js"></script>
<script>
const PREVIEW = new URLSearchParams(location.search).get("preview") === "1";
const ROWS = 12;
let lastSig = "";

function render(st){
  const theme = ffApplyTheme(st);
  const visible = PREVIEW || !!(st.display || {}).damageReportVisible;
  const stage = document.getElementById("stage");
  if(!visible){ stage.classList.remove("on"); lastSig = ""; return; }
  const pg = st.postGame || {};
  const g = pg.game || {};
  const roster = st.roster || {};
  const ev = st.event || {};
  const sig = JSON.stringify([theme, g, pg.label, ev.roundName, ((roster.teams) || []).map(t => [t.name, t.shortName, !!t.logo])]);
  if(sig === lastSig){ stage.classList.add("on"); return; }
  const replay = !stage.classList.contains("on");
  lastSig = sig;
  ffFitTitle(document.getElementById("title"));
  const ss3 = theme === "ss3";
  ffSetText(document.getElementById("round"), [pg.label, g.mapName].filter(Boolean).join(" · ") || ev.roundName || "", ss3 ? 320 : 520, 12);

  const players = [];
  (g.teams || []).forEach(t => (t.players || []).forEach(p => players.push(Object.assign({ teamName: t.teamName }, p))));
  players.sort((a, b) => ((b.kills || 0) - (a.kills || 0)) || ((b.knocks || 0) - (a.knocks || 0)) || ((b.survival || 0) - (a.survival || 0)));
  const top = players.slice(0, ROWS);
  document.getElementById("nodata").textContent = top.length ? "" : (g.error || "No game to show yet.");
  const hasDmg = top.some(p => p.damage != null && p.damage !== "");
  const cols = [["ELIMS", p => ffTwo(p.kills || 0)], ["KNOCKS", p => p.knocks == null ? "--" : ffTwo(p.knocks)],
                ["HEADSHOTS", p => p.headshots == null ? "--" : ffTwo(p.headshots)], ["SURVIVAL", p => ffMmss(p.survival)]]
    .concat(hasDmg ? [["DMG", p => p.damage == null ? "--" : String(p.damage)]] : []);

  const board = document.getElementById("board");
  board.innerHTML = `<div class="hd ff-label">` +
    `<div class="c-rk">#</div><div class="c-lg"></div><div class="c-pl">PLAYER</div><div class="c-tm">TEAM</div>` +
    cols.map(c => `<div class="c-n">${c[0]}</div>`).join("") + `</div>`;
  const pitch = ss3 ? 42 : 52, top0 = ss3 ? 50 : 62;
  top.forEach((p, i) => {
    const rt = ffTeam(p.teamName, roster);
    const r = document.createElement("div");
    r.className = "pr fromL";
    r.style.top = (top0 + i * pitch) + "px";
    r.style.animationDelay = (0.45 + i * 0.05).toFixed(2) + "s";
    r.innerHTML = `<div class="c-rk ${i < 3 ? "ff-num" : "ff-muted"}">${i + 1}</div>` +
      `<div class="c-lg">${rt && rt.logo ? `<img src="${rt.logo}">` : ""}</div>` +
      `<div class="c-pl ff-text"></div><div class="c-tm ff-muted"></div>` +
      cols.map(() => `<div class="c-n ff-num"></div>`).join("");
    board.appendChild(r);
    const rp = ffRosterPlayer(p.uid, p.name, roster);
    ffSetText(r.querySelector(".c-pl"), (rp && (rp.player.displayIgn || rp.player.ign)) || p.name, 0, 12);
    ffSetText(r.querySelector(".c-tm"), (rt && (rt.shortName || rt.name)) || p.teamName, 240, 12);
    r.querySelectorAll(".c-n").forEach((n, k) => { n.textContent = cols[k][1](p); });
  });
  if(replay){ stage.classList.remove("on"); void stage.offsetWidth; }
  stage.classList.add("on");
}
ffConnect("freefire_damage_report", render);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Fire — Director</title>
<!--
  A 1920x1080 browser source for whoever is calling the shots.

  NOT an on-air graphic. It is a board for a director to read at a
  glance while watching the game, so it is plain, large, and says WHY
  rather than only what -- a call you can see the reason for is a call
  you can overrule in a second.

  Everything comes from liveOps.director, which the engine builds from
  the client's own kill narration.

  ONE THING TO BE CLEAR ABOUT, because a director will act on it:
  WHO is fighting whom is certain -- every knock and kill names an
  attacker and a defender. WHERE is a best effort. The client publishes
  no continuous positions; the only routine fix is a revive, and a squad
  revives essentially where it just fought. So a position here can be up
  to two minutes old and is missing entirely for a fight nobody was
  revived in. It is always shown with its age for that reason, and never
  drawn as live tracking.
-->
<style>
  :root{
    --bg:#0b0e15; --panel:#141924; --line:#26304a; --dim:#7e8ba6;
    --txt:#eef3fc; --hot:#ff9f45; --cool:#6fc3ff; --good:#79e6a2;
    --warn:#ffd166;
  }
  *{box-sizing:border-box;margin:0}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{
    background:var(--bg); color:var(--txt);
    font:16px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;
    padding:34px 40px; display:flex; flex-direction:column; gap:26px;
  }
  header{display:flex;align-items:baseline;gap:22px}
  h1{font-size:30px;letter-spacing:.22em;color:var(--hot);font-weight:800}
  .sub{color:var(--dim);font-size:18px}
  #conn{margin-left:auto;font-size:16px;padding:5px 16px;border-radius:99px;
        border:1px solid var(--line);color:var(--dim)}
  #conn.on{color:var(--good);border-color:#2c6244}

  .call{
    background:var(--panel);border:2px solid var(--hot);border-radius:18px;
    padding:28px 34px;display:flex;align-items:center;gap:36px;
  }
  .shot{font-size:74px;font-weight:800;letter-spacing:.04em;color:var(--hot);
        white-space:nowrap;line-height:1}
  .callbody{min-width:0}
  .callteams{font-size:44px;font-weight:700;white-space:nowrap;overflow:hidden;
             text-overflow:ellipsis}
  .callwhy{font-size:21px;color:var(--dim);margin-top:6px}

  /* Three tables side by side -- fights going on, squads closing in, the
     slots -- each its own panel, so neither list can push the other off
     the bottom of the screen. Stacked, "closing in" ran out of room under
     a busy fight list and was cut off mid-team. */
  .grid{display:grid;grid-template-columns:1fr 1fr 540px;gap:26px;flex:1;min-height:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;
         padding:22px 26px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .panel h2{font-size:17px;letter-spacing:.2em;color:var(--dim);
            text-transform:uppercase;font-weight:600;margin-bottom:16px}

  .fight{padding:16px 0;border-top:1px solid var(--line)}
  .fight:first-of-type{border-top:0}
  .fteams{font-size:34px;font-weight:700}
  .fmeta{font-size:19px;color:var(--dim);margin-top:5px;display:flex;gap:20px;
         flex-wrap:wrap;align-items:center}
  .bar{height:10px;background:#1d2434;border-radius:99px;margin-top:10px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--hot);border-radius:99px}
  .fight.second .bar > i{background:var(--cool)}
  .where{color:var(--cool)}
  /* A fight that is over keeps its line, underneath, faded -- context,
     not a shot. */
  .fight.over{opacity:.42}
  .fight.over .bar > i{background:#4a5470}
  .tagover{font-size:15px;letter-spacing:.14em;color:var(--dim);
           border:1px solid var(--line);border-radius:6px;padding:1px 8px}
  .taglive{font-size:15px;letter-spacing:.14em;color:#0b0e15;background:var(--good);
           border-radius:6px;padding:1px 8px;font-weight:800}
  .stale{color:var(--warn)}

  /* THE SLOTS: every team with the number an observer presses to switch
     to it, read across a room -- the number biggest, the short name, the
     full name under it, who is still up. A squad that is out stays in its
     place, greyed, so the list never reshuffles mid-match. */
  #slots{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
  .slot{display:flex;align-items:center;gap:16px;padding:5px 10px 5px 6px;border-radius:12px;
        background:#1a2030;flex:1;min-height:0;max-height:60px}
  .slot .n{flex:0 0 56px;height:46px;display:flex;align-items:center;justify-content:center;
           border-radius:10px;background:var(--hot);color:#0b0e15;font-size:33px;font-weight:900;
           font-variant-numeric:tabular-nums;line-height:1}
  .slot .t{min-width:0;flex:1}
  .slot .s{font-size:25px;font-weight:800;letter-spacing:.03em;white-space:nowrap;
           overflow:hidden;text-overflow:ellipsis;line-height:1.1}
  .slot .f{font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot .up{display:flex;gap:4px;flex:0 0 auto}
  .slot .up i{width:9px;height:24px;border-radius:3px;background:#2a3348}
  .slot .up i.on{background:var(--good)}
  .slot.out{opacity:.38}
  .slot.out .n{background:#4a5470;color:#cfd6e6}
  .slot .x{font-size:14px;letter-spacing:.14em;color:var(--dim);border:1px solid var(--line);
           border-radius:6px;padding:1px 8px;flex:0 0 auto}

  .note{color:var(--dim);font-size:16px;margin-top:auto;padding-top:14px;
        border-top:1px solid var(--line);line-height:1.5}
  .empty{color:var(--dim);font-size:26px;padding:26px 0}

  /* A team as the board shows it: its SLOT, big, then its SHORT name.
     Read across a room at a glance, the number is what the eye finds
     first, so it is the biggest thing on the line. Sized in em so it
     scales with whichever line it sits in -- the call, a fight, the
     kill leader. */
  .tm{display:inline-flex;align-items:center;gap:.28em;white-space:nowrap}
  .tm .sl{display:inline-flex;align-items:center;justify-content:center;
          min-width:1.5em;height:1.5em;padding:0 .28em;border-radius:.24em;
          font-size:1.45em;font-weight:900;line-height:1;
          background:var(--hot);color:#0b0e15;font-variant-numeric:tabular-nums}
  .tm .sn{font-weight:800;letter-spacing:.03em}
  .vs{color:var(--dim);font-weight:400;margin:0 .5em}

  /* NOT ONLY A 1920x1080 SOURCE. Observers open this on a phone, where a
     fixed 1920px page with scrolling switched off sat shrunk, cut off and
     stuck. On a smaller screen it scrolls; on a phone it stacks into one
     column -- the slot list first, it is what an observer is there for. */
  @media (max-width: 1919px){ html,body{overflow:auto} }
  @media (max-width: 900px){
    html,body{width:auto;height:auto;overflow:auto}
    body{padding:14px;gap:14px;font-size:15px}
    header{flex-wrap:wrap;gap:8px 12px}
    h1{font-size:22px}
    .sub{font-size:13px}
    #conn{font-size:13px;padding:3px 12px}
    .grid{display:flex;flex-direction:column;gap:14px;flex:none}
    .panel{overflow:visible;padding:16px 16px 12px;flex:none}
    .panel.slots{order:-1}
    .panel h2{font-size:14px;margin-bottom:10px}
    .fight{padding:12px 0}
    .fteams{font-size:24px}
    .fmeta{font-size:14px;gap:10px}
    #slots{flex:none}
    .slot{flex:none;max-height:none;min-height:58px;gap:12px}
    .slot .n{flex-basis:52px;height:46px;font-size:30px}
    .slot .s{font-size:22px}
    .slot .f{font-size:13px}
    .empty{font-size:18px;padding:12px 0}
    .note{font-size:13px}
  }
</style>
</head>
<body>

<header>
  <h1>DIRECTOR</h1>
  <span class="sub">from the client's own kill narration</span>
  <span id="conn">connecting</span>
</header>

<div class="grid">
  <div class="panel">
    <h2>Fights right now</h2>
    <div id="fights"></div>
    <h2 id="overHead" style="margin-top:22px" hidden>Just ended</h2>
    <div id="over"></div>
  </div>
  <div class="panel">
    <h2 id="closingHead">Closing in</h2>
    <div id="closing"></div>
    <div class="note" id="posNote"></div>
  </div>
  <div class="panel slots">
    <h2>Slots — switch by number</h2>
    <div id="slots"></div>
  </div>
</div>

<script>
const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
/* Same rule as every other overlay here: served over https from a real
   host, connect back to it, so a browser source needs no ?relay=. */
const _sameOrigin = (location.protocol === "https:"
  && location.hostname && !/^(localhost|127\.|\[?::1)/.test(location.hostname))
  ? "wss://" + location.host : "";
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || _sameOrigin;
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=freefire_director&rostercache=1"
  : "ws://localhost:8765?page=freefire_director&rostercache=1";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

/* One team: the slot big, the short name beside it. Falls back to the
   full name the engine used to send if this board is newer than the
   engine feeding it, so it never goes blank in between. */
function tag(info, fallback){
  if(!info) return esc(fallback || "");
  return "<span class='tm'>" +
    (info.slot != null ? "<span class='sl'>" + esc(info.slot) + "</span>" : "") +
    "<span class='sn'>" + esc(info.short || info.name || fallback || "") + "</span></span>";
}

function tags(infos, names, joiner){
  const list = (infos && infos.length) ? infos : (names || []).map(() => null);
  return list.map((inf, i) => tag(inf, (names || [])[i]))
             .join("<span class='vs'>" + joiner + "</span>");
}

function render(d){
  if(!d){
    $("slots").innerHTML = "<div class='empty'>waiting for a match</div>";
    $("fights").innerHTML = "<div class='empty'>waiting for a match</div>";
    $("closing").innerHTML = "<div class='empty'>nobody closing in</div>";
    $("closingHead").textContent = "Closing in";
    $("over").innerHTML = "";
    $("overHead").hidden = true;
    $("posNote").textContent = "";
    return;
  }

  /* Live fights at the top, then what is about to start, then what has
     just ended -- in that order down the board, because that is the
     order a director needs them in. An engine older than this board
     sends no status, and its fights are all treated as live. */
  const all = d.engagements || [];
  const list = all.filter(e => e.status !== "over");
  const ended = all.filter(e => e.status === "over");
  const top = list.length ? list[0].weight : 1;
  $("fights").innerHTML = list.length ? list.map((e, i) => {
    /* The position's AGE is shown beside it, always. A director acting
       on "where" needs to know whether it is twelve seconds old or a
       hundred, and the number is the only honest way to say so. */
    const where = e.where
      ? "<span class='" + (e.whereAgeSeconds > 45 ? "stale" : "where") + "'>near " +
        e.where[0] + ", " + e.where[1] + " &middot; " + e.whereAgeSeconds + "s old</span>"
      : "<span class='stale'>no position</span>";
    return "<div class='fight" + (i === 1 ? " second" : "") + "'>" +
      "<div class='fteams'>" + tags(e.teamInfo, e.teams, "vs") + "</div>" +
      "<div class='fmeta'>" + (e.status === "live" ? "<span class='taglive'>LIVE</span>" : "") +
      "<span>" + e.knocks + " knocks &middot; " + e.kills +
      " eliminations</span><span>" + e.secondsAgo + "s ago</span>" + where + "</div>" +
      "<div class='bar'><i style='width:" +
      Math.max(6, Math.round(100 * e.weight / (top || 1))) + "%'></i></div></div>";
  }).join("") : "<div class='empty'>no fight going on right now</div>";

  $("overHead").hidden = !ended.length;
  $("over").innerHTML = ended.map(e => {
    const out = (e.alive || []).some(a => a === false);
    return "<div class='fight over'><div class='fteams' style='font-size:26px'>" +
      tags(e.teamInfo, e.teams, "vs") + "</div>" +
      "<div class='fmeta'><span class='tagover'>" + (out ? "SQUAD OUT" : "WENT QUIET") +
      "</span><span>" + e.knocks + " knocks &middot; " + e.kills + " kills</span>" +
      "<span>" + e.secondsAgo + "s ago</span></div></div>";
  }).join("");

  /* Squads near each other that are not fighting yet -- the shot to be
     ready for rather than the one to cut to. Distance is meaningless
     without the scale it is judged against, which changes with the
     circle, so the heading carries it. */
  const near = d.closingIn || [];
  $("closingHead").textContent = "Closing in" +
    (d.nearRange ? " — within " + d.nearRange + " units" : "");
  $("closing").innerHTML = near.length ? near.map(c =>
    "<div class='fight'><div class='fteams' style='font-size:27px'>" +
    tags(c.teamInfo, c.teams, "+") + "</div>" +
    "<div class='fmeta'><span>" + c.apart + " apart</span>" +
    "<span class='" + (c.ageSeconds > 45 ? "stale" : "where") + "'>" +
    c.ageSeconds + "s old</span></div></div>").join("")
    : "<div class='empty'>nobody closing in</div>";

  $("posNote").innerHTML = d.positionsAre
    ? "Positions are " + esc(d.positionsAre) + " — the game publishes no live " +
      "tracking, so treat them as a direction, not a pin."
    : "";

  /* The slots: an engine from before this board sends none, and a list
     guessed here could put the wrong number beside a team -- which is
     exactly what an observer would act on -- so it says so instead. */
  const sl = d.slots;
  $("slots").innerHTML = !sl ? "<div class='empty'>restart the engine for the slot list</div>"
    : !sl.length ? "<div class='empty'>no teams yet</div>"
    : sl.map(t => {
        const up = t.alive == null ? "" : "<span class='up'>" +
          [0, 1, 2, 3].map(k => "<i" + (k < t.alive ? " class='on'" : "") + "></i>").join("") + "</span>";
        const full = t.name && String(t.name).toUpperCase() !== String(t.short || "").toUpperCase()
          ? "<div class='f'>" + esc(t.name) + "</div>" : "";
        return "<div class='slot" + (t.out ? " out" : "") + "'>" +
          "<span class='n'>" + (t.slot != null ? esc(t.slot) : "?") + "</span>" +
          "<div class='t'><div class='s'>" + esc(t.short || t.name || "") + "</div>" + full + "</div>" +
          (t.out ? "<span class='x'>OUT</span>" : up) + "</div>";
      }).join("");
}

let _lastRoster = null, ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { $("conn").textContent = "connected"; $("conn").className = "on"; };
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type !== "state_sync" || !msg.data) return;
    if(msg.data.roster) _lastRoster = msg.data.roster;
    else if(_lastRoster) msg.data.roster = _lastRoster;
    render((msg.data.liveOps || {}).director);
  };
  ws.onclose = () => {
    $("conn").textContent = "reconnecting"; $("conn").className = "";
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="ff_embed.js"></script>
<title>Free Fire Game Summary</title>
<link rel="stylesheet" href="ff_theme.css">
<style>
  /* GAME SUMMARY -- one card recapping the post-match game (state.postGame):
     the map and game length, the Booyah team, the MVP, the top 6 finish
     table, and the game's totals (kills, knocks, headshots). Drawn in the
     event's look (ff_theme.css). */

  /* ---- SS3 ---- */
  .ss3 #booyah{left:150px;top:352px;width:520px;height:530px;}
  .ss3 #booyahHead{left:0;top:0;width:520px;height:58px;font-size:30px;}
  .ss3 #booyahLogo{left:150px;top:78px;width:220px;height:220px;object-fit:contain;}
  .ss3 #booyahName{left:0;top:312px;width:520px;height:64px;font-size:38px;}
  .ss3 #booyahNums{left:0;top:396px;width:520px;height:134px;}
  .ss3 #table{left:700px;top:352px;width:560px;height:530px;}
  .ss3 #side{left:1290px;top:352px;width:480px;height:530px;}

  /* ---- ARROW ---- */
  .arrow #booyah{left:200px;top:236px;width:520px;height:700px;}
  .arrow #booyahHead{left:0;top:0;width:520px;height:64px;font-size:34px;justify-content:flex-start;padding-left:24px;
                     clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%);}
  .arrow #booyahLogo{left:130px;top:96px;width:260px;height:260px;object-fit:contain;}
  .arrow #booyahName{left:0;top:380px;width:520px;height:76px;font-size:44px;}
  .arrow #booyahNums{left:0;top:490px;width:520px;height:180px;}
  .arrow #table{left:750px;top:236px;width:560px;height:700px;}
  .arrow #side{left:1340px;top:236px;width:390px;height:700px;}

  .pair{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .pair .k{font-size:22px;}
  .pair .v{font-size:54px;margin-top:4px;}
  .trow{position:absolute;left:0;width:100%;display:flex;align-items:center;gap:12px;}
  .trow .rk{width:58px;height:100%;font-size:28px;}
  .trow img{width:44px;height:44px;object-fit:contain;}
  .trow .nm{flex:1;font-size:26px;overflow:hidden;}
  .trow .pt{width:96px;font-size:34px;justify-content:flex-end;padding-right:16px;}
  .ss3 .trow{height:68px;background:rgba(255,255,255,.06);}
  .arrow .trow{height:96px;border-bottom:1px solid rgba(255,255,255,.08);}
  .thead{position:absolute;left:0;top:0;width:100%;height:58px;font-size:28px;}
  .arrow .thead{height:64px;font-size:32px;justify-content:flex-start;padding-left:24px;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%);}
  .tile{position:absolute;left:0;width:100%;}
  .tile .k{position:absolute;left:0;top:0;width:100%;height:46px;font-size:22px;}
  .tile .v{position:absolute;left:0;top:46px;width:100%;height:76px;font-size:56px;}
  .ss3 .tile .k{height:38px;font-size:20px;}
  .ss3 .tile .v{top:38px;height:58px;font-size:44px;}
  /* CHIRAYU: white value boxes edged in gold, as its table rows */
  .chirayu .tile{background:#fff !important;box-shadow:inset 4px 0 0 #e3a23a, 0 2px 10px rgba(20,30,50,.14);}
  .chirayu #booyahNums .v{color:#f6c45c;}
  /* A team with no logo yet: its short name, large, where the logo goes. */
  .noLogo{display:flex;align-items:center;justify-content:center;font-family:'SMBlack',Arial,sans-serif;color:#fff;
          text-transform:uppercase;text-shadow:0 4px 0 rgba(0,0,0,.25);}
  .arrow .noLogo{font-family:'SMBI',Arial,sans-serif;}
  .ss3 #booyahTag{left:20px;top:78px;width:480px;height:220px;font-size:110px;}
  .arrow #booyahTag{left:20px;top:96px;width:480px;height:260px;font-size:120px;}
  .arrow .tile .k{justify-content:flex-start;padding-left:20px;clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);}
  .arrow .tile .v{justify-content:flex-start;padding-left:20px;}
  .mvpline{position:absolute;left:0;width:100%;}
  .nodata{position:absolute;left:0;top:520px;width:1920px;text-align:center;font-family:'SMXB',Arial,sans-serif;font-size:30px;color:#fff;
          text-shadow:0 2px 8px rgba(0,0,0,.8);}
</style>
</head>
<body class="ss3">
<div class="ff-stage" id="stage">
  <div class="ff-frame fade"></div>
  <div class="ff-title fade" id="title" style="animation-delay:.1s">GAME SUMMARY</div>
  <div class="ff-round ctr fade" id="round" style="animation-delay:.25s"></div>
  <div class="abs ff-zebra rise" id="booyah" style="animation-delay:.3s">
    <div class="abs ff-label ctr" id="booyahHead">BOOYAH</div>
    <img class="abs pop" id="booyahLogo" alt="" style="animation-delay:.6s">
    <div class="abs pop noLogo" id="booyahTag" style="animation-delay:.6s"></div>
    <div class="abs ff-yellow ctr" id="booyahName"></div>
    <div class="abs" id="booyahNums"></div>
  </div>
  <div class="abs ff-black fade" id="table" style="animation-delay:.45s"></div>
  <div class="abs fade" id="side" style="animation-delay:.55s"></div>
  <div class="nodata" id="nodata"></div>
</div>
<script src="ff_theme.js"></script>
<script>
const PREVIEW = new URLSearchParams(location.search).get("preview") === "1";
let lastSig = "";

function render(st){
  const theme = ffApplyTheme(st);
  const visible = PREVIEW || !!(st.display || {}).gameSummaryVisible;
  const stage = document.getElementById("stage");
  if(!visible){ stage.classList.remove("on"); lastSig = ""; return; }
  const pg = st.postGame || {};
  const g = pg.game || {};
  const teams = g.teams || [];
  const roster = st.roster || {};
  const ev = st.event || {};
  const sig = JSON.stringify([theme, g, pg.label, ev.roundName, ((roster.teams) || []).map(t => [t.name, t.shortName, !!t.logo])]);
  if(sig === lastSig){ stage.classList.add("on"); return; }
  const replay = !stage.classList.contains("on");
  lastSig = sig;
  ffFitTitle(document.getElementById("title"));
  const ss3 = theme === "ss3";
  document.getElementById("nodata").textContent = teams.length ? "" : (g.error || "No game to show yet.");
  ffSetText(document.getElementById("round"), [pg.label, g.mapName].filter(Boolean).join(" · ") || ev.roundName || "", ss3 ? 320 : 520, 12);

  // Booyah
  const win = teams[0];
  const wt = win ? ffTeam(win.teamName, roster) : null;
  const wl = document.getElementById("booyahLogo");
  const tag = document.getElementById("booyahTag");
  if(wt && wt.logo){ wl.src = wt.logo; wl.style.visibility = ""; tag.textContent = ""; }
  else {
    wl.style.visibility = "hidden";
    ffSetText(tag, win ? ((wt && wt.shortName) || win.shortName || win.teamName) : "", 460, 30);
  }
  ffSetText(document.getElementById("booyahName"), win ? ((wt && (wt.displayName || wt.name)) || win.teamName) : "", 480, 16);
  const bn = document.getElementById("booyahNums");
  bn.innerHTML = "";
  [["ELIMS", win && win.kills], ["PLACEMENT", win && win.placement], ["TOTAL", win && win.points]].forEach(([k, v], i) => {
    const p = document.createElement("div");
    p.className = "pair";
    Object.assign(p.style, { left: (i * 173) + "px", top: "0px", width: "173px", height: "100%" });
    p.innerHTML = `<div class="k ${ss3 ? "ff-yellow" : "ff-muted"}" style="${ss3 ? "padding:2px 10px;" : ""}">${k}</div><div class="v ff-num"></div>`;
    bn.appendChild(p);
    ffCountUp(p.querySelector(".v"), v == null ? null : v, ffTwo, 0.8 + i * 0.1);
  });

  // Top 6
  const tb = document.getElementById("table");
  tb.innerHTML = `<div class="thead ff-label ctr">TOP 6</div>`;
  const pitch = ss3 ? 76 : 102, top0 = ss3 ? 68 : 76;
  teams.slice(0, 6).forEach((t, i) => {
    const rt = ffTeam(t.teamName, roster);
    const r = document.createElement("div");
    r.className = "trow fromR";
    r.style.top = (top0 + i * pitch) + "px";
    r.style.animationDelay = (0.6 + i * 0.07).toFixed(2) + "s";
    r.innerHTML = `<div class="rk ctr ${ss3 ? "ff-label" : "ff-muted"}">#${t.rank}</div>` +
      (rt && rt.logo ? `<img src="${rt.logo}">` : `<span style="width:44px"></span>`) +
      `<div class="nm ff-text left"></div><div class="pt ff-num left"></div>`;
    tb.appendChild(r);
    ffSetText(r.querySelector(".nm"), (rt && (rt.shortName || rt.name)) || t.teamName, 280, 14);
    ffCountUp(r.querySelector(".pt"), t.points, v => String(v), 0.8 + i * 0.07);
  });

  // MVP and the game's totals
  const side = document.getElementById("side");
  side.innerHTML = "";
  const m = g.mvp;
  const tiles = [
    ["MATCH MVP", m ? m.name : "--", null],
    ["MVP ELIMINATIONS", m ? m.kills : null, ffTwo],
    ["TOTAL ELIMINATIONS", g.totalKills, v => String(v)],
    ["KNOCKS", g.totalKnocks, v => String(v)],
    ["GAME LENGTH", g.length, ffMmss],
  ];
  const tp = ss3 ? 106 : 140;   // ss3: 38 label + 58 value + 10 apart
  tiles.forEach(([k, v, fmt], i) => {
    const t = document.createElement("div");
    t.className = "tile fromR";
    Object.assign(t.style, { top: (i * tp) + "px", height: (tp - 10) + "px", animationDelay: (0.7 + i * 0.08).toFixed(2) + "s" });
    t.innerHTML = `<div class="k ${ss3 ? "ff-label" : "ff-label"} ctr">${k}</div><div class="v ${fmt ? "ff-num" : "ff-text"} ctr"></div>`;
    side.appendChild(t);
    const node = t.querySelector(".v");
    if(fmt) ffCountUp(node, v == null ? null : v, fmt, 0.85 + i * 0.08);
    else { node.style.fontSize = (ss3 ? 34 : 38) + "px"; ffSetText(node, v, (ss3 ? 460 : 370), 14); }
    if(ss3) t.style.background = "rgba(0,0,0,.92)";
  });
  if(replay){ stage.classList.remove("on"); void stage.offsetWidth; }
  stage.classList.add("on");
}
ffConnect("freefire_game_summary", render);
</script>
</body>
</html>

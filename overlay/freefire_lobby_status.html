<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Fire Lobby Status</title>
<style>
  /* ROOM CREATE -> LOBBY STATUS
     ---------------------------------------------------------------
     A FIXED STRIP, 1918x248, parked below the stream for the whole of
     room-create. Not a full-screen card: it is glanced at repeatedly
     rather than making an entrance.

     DRESSED FOR ARROW SHOWDOWN, from the Caster Desk frame: deep green
     ground with the halftone dot field and a vignette, amber headings in
     heavy italic, cream letterspaced labels, and the angular cut on the
     name plates. TT Supermolot Black Italic is the closest face in the
     bundle to the deck's heavy italic, and it is already shipped with
     the other Free Fire overlays.

     NOT READ FROM THE GAME. The operator ticks each squad in the
     dashboard as it arrives. The room-create screen scrolls and re-sorts
     itself; a person watching names appear is faster and far more
     reliable than OCR of it.

     COLOUR CANNOT CARRY THIS ALONE, and on a green ground least of all.
     Joined is mint, yet-to-join is coral, and both say so in words --
     about one man in twelve cannot separate those hues, and the whole
     point of this strip is to be read at a glance across a room. The
     amber is structure only, never state, so it never competes with the
     two colours that mean something.

     The join plays the pick/ban lock-in -- sweep, logo up to colour, top
     edge turning mint -- driven by a class change, so a squad already in
     when the page loads renders joined WITHOUT animating. A refresh
     mid-show would otherwise re-lock every squad at once. */

  @font-face {
    font-family: 'Supermolot';
    src: url('assets/fonts/TT Supermolot Neue Trial Black Italic.ttf') format('truetype');
    font-weight: 900; font-style: italic;
  }
  @font-face {
    font-family: 'Supermolot';
    src: url('assets/fonts/TT Supermolot Neue Trial ExtraBold.ttf') format('truetype');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'Supermolot';
    src: url('assets/fonts/TT Supermolot Neue Trial Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal;
  }

  :root{
    --amber:#f7941d;          /* headings and structure -- never state */
    --amber-deep:#d97a08;
    --joined:#5fe39a;         /* mint  -- in the lobby   */
    --waiting:#ff7a7a;        /* coral -- yet to join    */
    --green-0:#0d4733;
    --green-1:#072a1f;
    --panel:#0b3326;
    --panel-lit:#124430;
    --cream:#f3efe4;
    --muted:#8fae9f;
  }

  @font-face {
    font-family: 'TacticSans';
    src: url('assets/freefire/ss3/TacticSans-BldIt.otf') format('opentype');
    font-weight: 100 900; font-style: normal;
  }
  /* SS3 (PRG BR SS3): red and black, the yellow of its headers, Tactic
     Sans. Only the palette and face change -- every motion and layout rule
     below is shared, so the two themes cannot drift apart. JOINED stays
     light green and YET TO JOIN light red: those are meanings, not
     decoration. */
  body[data-theme="ss3"]{
    --amber:#ffe97a; --amber-deep:#f5c400;
    --joined:#6ef0a4; --waiting:#ff9c9c;
    --green-0:#2a0707; --green-1:#0b0b0b;
    --panel:#151515; --panel-lit:#222222;
    --cream:#ffffff; --muted:#c9a9a9;
    font-family:'TacticSans',Arial,sans-serif;
  }
  body[data-theme="ss3"] #stage{
    background:
      radial-gradient(120% 180% at 50% 0%, rgba(255,30,30,.35) 0%, rgba(11,11,11,0) 68%),
      repeating-linear-gradient(115deg, rgba(255,30,30,.07) 0 2px, transparent 2px 18px),
      linear-gradient(180deg, var(--green-0) 0%, var(--green-1) 100%);
    border-top-color:#ff1e1e;
  }
  body[data-theme="ss3"] #stage::before{
    background:linear-gradient(90deg, #ff1e1e 0%, rgba(255,30,30,.15) 38%,
                                      rgba(255,30,30,.15) 62%, #ff1e1e 100%);
  }
  body[data-theme="ss3"] .slot{ border-color:rgba(255,30,30,.35); }
  body.chirayu[data-theme="ss3"]{ --amber:#f6c45c; --amber-deep:#e8a33a; --green-0:#4e6181; --green-1:#33415d;
    --panel:#17233d; --panel-lit:#22345a; --muted:#9fb0cc; }
  body.chirayu[data-theme="ss3"] #stage{
    background:
      radial-gradient(120% 180% at 50% 0%, rgba(110,130,165,.40) 0%, rgba(51,65,93,0) 68%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 18px),
      linear-gradient(180deg, var(--green-0) 0%, var(--green-1) 100%);
    border-top-color:#e8a33a;
  }
  body.chirayu[data-theme="ss3"] #stage::before{
    background:linear-gradient(90deg, #e8a33a 0%, rgba(232,163,58,.15) 38%, rgba(232,163,58,.15) 62%, #e8a33a 100%);
  }
  body.chirayu[data-theme="ss3"] .slot{ border-color:rgba(127,151,187,.35); }
  /* Tactic Sans runs wider than Supermolot: "YET TO JOIN" was clipped. */
  body[data-theme="ss3"] .state{ font-size:11px; letter-spacing:.01em; gap:5px; }
  body[data-theme="ss3"] .head .title,
  body[data-theme="ss3"] .timer .tclock{ font-style:normal; }

  html,body{margin:0;padding:0;background:transparent;overflow:hidden;}
  body{
    width:1918px;height:248px;
    font-family:'Supermolot',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ALWAYS LAID OUT, MOVED RATHER THAN HIDDEN.
     display:none cannot be animated -- it is on or it is off -- so the
     strip would have flown in on Show and simply vanished on Hide. It is
     parked below the bottom edge instead and slid up into place, which
     makes the exit the entrance played backwards and costs nothing: the
     body is 248px with overflow hidden, so parked is off-screen. */
  #stage{
    display:flex;
    transform:translateY(112%);
    opacity:0;
    /* visibility as well as the transform, and it is what actually
       guarantees the thing is gone. The slide is the nice part, but a
       transform can be defeated -- a stale stylesheet, a compositor that
       ignores will-change, a parent that clips differently -- and when
       that happens the strip simply stays on screen with Hide pressed,
       which is what went out on air. visibility cannot be half-applied.
       It is delayed by the length of the slide on the way out so the
       animation still plays, and applied instantly on the way in. */
    visibility:hidden;
    pointer-events:none;
    transition:transform .62s cubic-bezier(.16,.84,.34,1),
               opacity .34s ease,
               visibility 0s linear .62s;
    will-change:transform;
    position:relative;
    width:1918px;height:248px;box-sizing:border-box;
    background:
      /* vignette, so the ends sit down under the stream */
      radial-gradient(120% 180% at 50% 0%,
        rgba(18,90,64,.55) 0%, rgba(7,42,31,0) 68%),
      /* the deck's halftone dot field */
      radial-gradient(rgba(95,227,154,.085) 1.1px, transparent 1.2px)
        0 0 / 9px 9px,
      linear-gradient(180deg, var(--green-0) 0%, var(--green-1) 100%);
    border-top:3px solid var(--amber);
    padding:16px 22px;
    align-items:stretch;
    gap:16px;
  }
  #stage.visible{
    transform:translateY(0);
    opacity:1;
    visibility:visible;
    transition:transform .62s cubic-bezier(.16,.84,.34,1),
               opacity .34s ease,
               visibility 0s linear 0s;
  }

  /* The torn highlight the deck runs along its top edge. */
  #stage::before{
    content:"";position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,
      var(--amber) 0%, rgba(247,148,29,.15) 38%,
      rgba(247,148,29,.15) 62%, var(--amber) 100%);
  }

  /* ---- the left-hand label ---- */
  .head{
    /* Takes what the longest line needs, within bounds, instead of a
       fixed width: "ROOM CREATE" and "GRAND FINALS DAY 1" are not the
       same size, and a fixed box clips the second one mid-word. The
       cards divide whatever is left, so a wider header costs each of
       twelve about two pixels. */
    flex:0 1 auto;min-width:252px;max-width:360px;
    display:flex;flex-direction:column;justify-content:center;
    padding-right:20px;position:relative;
  }
  .head::after{
    content:"";position:absolute;right:0;top:8%;bottom:8%;width:3px;
    background:linear-gradient(180deg,
      transparent, var(--amber) 22%, var(--amber) 78%, transparent);
  }
  /* The line above the title. It was 15px at .34em tracking and 72%
     opacity, which at this size is thin, cramped and half-lit all at
     once -- the letters sit so far apart they stop reading as a word and
     there is not enough weight left to hold them together. Heavier,
     a little larger, tracking pulled back to where the spacing helps
     rather than separates, and at full strength. The amber rule in front
     of it is the deck's own accent, and it gives the line something to
     start against instead of floating. */
  .head .kicker{
    font-weight:800;font-size:17px;letter-spacing:.2em;
    color:var(--cream);text-transform:uppercase;
    white-space:nowrap;overflow:hidden;
    text-shadow:0 1px 0 rgba(0,0,0,.4);
  }
  /* The rule sits ABOVE the line, not beside it. Inline, it pushed the
     kicker 30px right while the title below stayed at zero, and the two
     lines no longer shared a left edge -- which is the first thing the
     eye checks on a stacked block like this. Everything in the header
     now starts at the same x. */
  .head .kicker::before{
    content:"";display:block;width:26px;height:3px;
    background:var(--amber);margin:0 0 7px;
  }
  .head .title{
    font-weight:900;font-style:italic;font-size:47px;line-height:.98;
    letter-spacing:.005em;text-transform:uppercase;margin-top:3px;
    color:var(--amber);
    text-shadow:0 3px 0 rgba(0,0,0,.35);
  }
  .head .count{
    margin-top:9px;display:flex;align-items:baseline;gap:0;
    /* Italic overhangs its box on the left, so a big italic numeral set
       flush reads as if it has drifted inwards. Pulled back by one pixel
       so the 0 lines up with the L of LOBBY above it. */
    margin-left:-1px;
  }
  .head .count b{
    font-weight:900;font-style:italic;font-size:40px;line-height:1;
    color:var(--joined);
  }
  /* "0" and "/12" are one number and belong tight together; the label
     is a separate thought and needs the air. One gap for all three set
     them equally far apart, which read as three unrelated items. */
  .head .count small{
    font-weight:800;font-size:19px;color:var(--muted);
    margin:0 0 0 3px;
  }
  .head .count span{
    margin-left:11px;
  }
  .head .count span{
    font-weight:700;font-size:12px;letter-spacing:.24em;
    color:var(--muted);text-transform:uppercase;
  }

  /* ---- the squads ---- */
  .cards{flex:1;display:flex;gap:9px;min-width:0;}

  .slot{
    position:relative;flex:1 1 0;min-width:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:7px;padding:9px 6px 8px;box-sizing:border-box;
    background:linear-gradient(180deg, var(--panel-lit), var(--panel));
    border:1px solid rgba(247,148,29,.3);
    border-top:6px solid var(--waiting);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),
               0 6px 14px rgba(0,0,0,.4);
    /* the angular cut from the caster name plates */
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    overflow:hidden;
    transition:border-top-color .4s ease, background .4s ease,
               box-shadow .4s ease, transform .4s ease;
  }
  /* THE IDLE DRIFT -- the strip is watched for the whole of room-create,
     so the cards keep a slow life of their own rather than sitting dead.
     Deliberately small: 3px over four and a half seconds. The phase is
     offset per card, so the row undulates instead of bobbing in unison,
     which is what makes it read as alive rather than as a loop. Big
     enough to notice, small enough to stop noticing. */
  .slot{
    animation:idleDrift 4.6s ease-in-out calc(var(--i) * -380ms) infinite;
  }
  @keyframes idleDrift{
    0%,100%{transform:translateY(0);}
    50%    {transform:translateY(-3px);}
  }
  /* Waiting squads breathe their opacity on top of it. Opacity, not
     transform, so it layers over the drift instead of replacing it. */
  .slot:not(.joined) .name,
  .slot:not(.joined) .logo{
    animation:breathe 2.8s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.74;}
    50%    {opacity:1;}
  }

  /* A sheen crossing the row every eight seconds, one card after the
     next. This is the part that is actually visible from the sofa. */
  .shimmer{
    position:absolute;top:0;bottom:0;left:-60%;width:55%;
    background:linear-gradient(90deg,
      transparent, rgba(255,255,255,.07), rgba(247,148,29,.09), transparent);
    pointer-events:none;
    animation:shimmer 8s ease-in-out calc(var(--i) * 190ms) infinite;
  }
  @keyframes shimmer{
    0%      {left:-60%;}
    22%     {left:115%;}
    100%    {left:115%;}
  }
  .slot.joined{
    opacity:1;animation:none;
    border-top-color:var(--joined);
    background:
      linear-gradient(180deg, rgba(95,227,154,.2), rgba(11,51,38,0) 62%),
      linear-gradient(180deg, var(--panel-lit), var(--panel));
    border-color:rgba(95,227,154,.48);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
               0 0 22px rgba(95,227,154,.17),
               0 6px 16px rgba(0,0,0,.42);
  }

  /* THE ENTRANCE, and the reason it is an entrance rather than a loop.
     This strip is on air for the whole of room-create -- ten, twenty
     minutes -- directly under a live game. Anything that runs forever
     stops being a flourish at about the ninety-second mark and spends
     the rest of the show competing with the feed above it. So the motion
     is spent on the two things that are actually events: the strip
     arriving, and a squad joining. Idle is deliberately still.

     Staggered off the left, 55ms apart, so twelve squads read as a
     cascade rather than a flashbulb. Runs only when the strip goes from
     hidden to shown -- see justShown -- never on the several state syncs
     a second that follow. */
  .cards.justShown .slot,
  .cards.justShown .slot:not(.joined){
    opacity:0;
    /* 230ms is the strip's own slide: the cards start cascading as it
       settles rather than racing it. */
    animation:flyIn .52s cubic-bezier(.17,.84,.44,1)
              calc(230ms + var(--i) * 55ms) both;
  }
  @keyframes flyIn{
    0%  {opacity:0;transform:translateY(26px) scale(.93);}
    60% {opacity:1;transform:translateY(-4px) scale(1.012);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }


  .logo{
    width:66px;height:66px;flex:0 0 66px;
    display:flex;align-items:center;justify-content:center;
    filter:grayscale(1) brightness(.62);
    transition:filter .45s ease;
  }
  .slot.joined .logo{filter:none;}
  .logo img{max-width:100%;max-height:100%;display:block;}
  .logo .initials{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.26);border:1px solid rgba(247,148,29,.3);
    font-weight:900;font-style:italic;font-size:21px;
    color:var(--muted);letter-spacing:.02em;
  }

  .name{
    width:100%;text-align:center;
    font-weight:900;font-style:italic;font-size:19px;letter-spacing:.015em;
    color:var(--cream);opacity:.74;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:opacity .4s ease;
  }
  .slot.joined .name{opacity:1;}

  /* The same heavy italic as the LOBBY STATUS title and the team names,
     so the three weights on the strip read as one family rather than as
     a heading with captions bolted under it. Tracking is pulled in --
     wide letterspacing fights an italic this heavy -- and the size comes
     up a little to pay for it. */
  .state{
    display:flex;align-items:center;gap:6px;
    font-weight:900;font-style:italic;font-size:13px;letter-spacing:.05em;
    text-transform:uppercase;white-space:nowrap;
    color:var(--waiting);
    transition:color .4s ease;
  }
  .slot.joined .state{color:var(--joined);}
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:currentColor;box-shadow:0 0 9px currentColor;
  }

  .sweep{
    position:absolute;top:0;bottom:0;left:-45%;width:45%;
    background:linear-gradient(90deg,
      transparent, rgba(95,227,154,.5), transparent);
    opacity:0;pointer-events:none;
  }
  .slot.justJoined .sweep{animation:sweep .62s ease-out 1;}
  @keyframes sweep{
    0%  {left:-45%;opacity:1;}
    100%{left:115%;opacity:0;}
  }
  .slot.justJoined{animation:lockIn .66s cubic-bezier(.2,.9,.3,1) 1 !important;}
  @keyframes lockIn{
    0%  {transform:translateY(0) scale(1);
         box-shadow:0 6px 14px rgba(0,0,0,.4);}
    30% {transform:translateY(-9px) scale(1.075);
         box-shadow:0 0 46px rgba(95,227,154,.6), 0 14px 22px rgba(0,0,0,.5);}
    62% {transform:translateY(2px) scale(.992);}
    100%{transform:translateY(0) scale(1);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
                    0 0 22px rgba(95,227,154,.17),
                    0 6px 16px rgba(0,0,0,.42);}
  }
  /* The logo lands a beat after the plate does. */
  .slot.justJoined .logo{animation:logoLand .66s cubic-bezier(.2,.9,.3,1) 1;}
  @keyframes logoLand{
    0%  {transform:scale(.72) rotate(-7deg);}
    45% {transform:scale(1.14) rotate(2deg);}
    100%{transform:scale(1) rotate(0);}
  }
  /* GOING BACK TO WAITING. Clear All, or a squad un-ticked, used to snap
     from mint to coral with nothing in between -- the only move on the
     strip that happened instantly, which read as a glitch next to
     everything else. It is the lock-in conceded: the plate drops, flares
     coral, and settles. */
  .slot.justLeft{animation:unlock .52s cubic-bezier(.3,.7,.4,1) 1 !important;}
  @keyframes unlock{
    0%  {transform:translateY(-4px) scale(1.03);
         box-shadow:0 0 30px rgba(95,227,154,.4);}
    40% {transform:translateY(4px) scale(.978);
         box-shadow:0 0 26px rgba(255,122,122,.42);}
    100%{transform:translateY(0) scale(1);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.05),
                    0 6px 14px rgba(0,0,0,.4);}
  }
  .slot.justLeft .logo{animation:logoLeave .52s ease-out 1;}
  @keyframes logoLeave{
    0%  {transform:scale(1.08) rotate(3deg);filter:none;}
    100%{transform:scale(1) rotate(0);}
  }

  .slot.justJoined .state{animation:stateIn .66s ease-out 1;}
  @keyframes stateIn{
    0%  {opacity:0;transform:translateY(7px);}
    55% {opacity:1;}
    100%{opacity:1;transform:translateY(0);}
  }
  /* ---- the room-create countdown, the header's mirror at the far end ----
     Present only while the operator has it switched on; off, it is gone
     from the layout entirely and the twelve cards take the room back. */
  .timer{
    flex:0 0 212px;display:none;flex-direction:column;justify-content:center;
    padding-left:22px;position:relative;
  }
  .timer.on{display:flex;}
  .timer::before{
    content:"";position:absolute;left:0;top:8%;bottom:8%;width:3px;
    background:linear-gradient(180deg,
      transparent, var(--amber) 22%, var(--amber) 78%, transparent);
  }
  .timer .tlabel{
    font-weight:800;font-size:15px;letter-spacing:.16em;
    color:var(--cream);text-transform:uppercase;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 0 rgba(0,0,0,.4);
  }
  .timer .tlabel::before{
    content:"";display:block;width:26px;height:3px;
    background:var(--amber);margin:0 0 7px;
  }
  .timer .tclock{
    font-weight:900;font-style:italic;font-size:66px;line-height:1;
    margin-top:6px;color:var(--amber);letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 3px 0 rgba(0,0,0,.35);
    transition:color .3s ease;
  }
  /* The last thirty seconds: coral, and a slow pulse -- urgency without
     anything that flickers under the live game. */
  .timer.urgent .tclock{color:var(--waiting);animation:tpulse 1s ease-in-out infinite;}
  @keyframes tpulse{0%,100%{opacity:1;}50%{opacity:.62;}}
  .timer.done .tclock{color:var(--waiting);}
  .timer .tbar{
    margin-top:10px;height:5px;background:rgba(0,0,0,.35);overflow:hidden;
    clip-path:polygon(0 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
  }
  .timer .tbar i{
    display:block;height:100%;width:100%;background:var(--amber);
    transform-origin:left center;
  }
  .timer.urgent .tbar i, .timer.done .tbar i{background:var(--waiting);}
  .timer .tstate{
    margin-top:7px;font-weight:700;font-size:12px;letter-spacing:.24em;
    color:var(--muted);text-transform:uppercase;min-height:14px;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="head">
    <div class="kicker" id="kicker">Room Create</div>
    <div class="title" id="title">Lobby Status</div>
    <div class="count"><b id="joined">0</b><small>/<span id="total">0</span></small>
      <span>Checked In</span></div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="timer" id="timer">
    <div class="tlabel" id="timerLabel">Lobby closes in</div>
    <div class="tclock" id="timerClock">05:00</div>
    <div class="tbar"><i id="timerBar"></i></div>
    <div class="tstate" id="timerState"></div>
  </div>
</div>

<script>
const _params = new URLSearchParams(location.search);
const _sameOrigin = (location.protocol === "https:"
  ? "wss://" : "ws://") + location.host;
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || _sameOrigin;
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=freefire_lobby_status&rostercache=1"
  : "ws://localhost:8765?page=freefire_lobby_status&rostercache=1";

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}

/* What goes under the logo. Twelve cards across 1918px leave each about
   140 pixels, and at that width a long registered name is three letters
   and an ellipsis -- so short names are the default. The operator can
   turn them off for a lobby whose names all fit, where the full ones
   read better.

   displayName always wins: it exists precisely to override what a team
   is called on air. */
function label(t, useShort){
  const full = (t.displayName || t.name || "").trim();
  if(!useShort) return full;
  return (t.displayName || t.shortName || t.tagRead || t.name || "").trim();
}

function initials(t){
  const words = (t.name || "").trim().split(/\s+/).filter(Boolean);
  if(!words.length) return "";
  return (words.length === 1 ? words[0].slice(0, 3)
                             : words.map(w => w[0]).join("").slice(0, 3)).toUpperCase();
}

/* Which squads were already in last time this drew. One in here renders
   joined with no animation; one joined now and NOT in here gets the
   sweep. That is what stops a refresh -- or any of the several
   state_syncs a second -- from replaying every lock-in at once. */
let wasJoined = new Set();
let lastSignature = "";
/* Was the strip on air last time this drew? The entrance plays on the
   hidden -> shown edge ONLY. Without this it would replay on every
   redraw -- a squad being ticked rebuilds the row, and that would send
   all twelve cards flying again in the middle of the show. */
let wasVisible = false;

/* ---- the countdown ----
   The engine sends an END TIME while running and a remainder while paused;
   this page counts down by itself, every frame. clockOffset is the engine's
   clock minus this one, taken from each lobby_update, so a PC running OBS a
   second or two off the engine's still shows the right time. */
let clockOffset = 0;
let timerState = null;
let lastShown = "";

function fmt(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(s / 60), r = s % 60;
  return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
}

function timerRemaining(t){
  if(!t) return 0;
  if(t.running && t.endsAt) return Math.max(0, t.endsAt - (Date.now() + clockOffset));
  return Math.max(0, Number(t.remainingMs) || 0);
}

function drawTimer(){
  const t = timerState;
  const box = document.getElementById("timer");
  const on = !!(t && t.show);
  box.classList.toggle("on", on);
  if(!on){ lastShown = ""; return; }
  const left = timerRemaining(t);
  const text = fmt(left);
  const total = Math.max(1, Number(t.durationMs) || 1);
  document.getElementById("timerBar").style.transform =
    "scaleX(" + Math.min(1, left / total).toFixed(4) + ")";
  box.classList.toggle("urgent", left > 0 && left <= 30000);
  box.classList.toggle("done", left <= 0);
  const state = left <= 0 ? "Time up" : (t.running ? "" : "Paused");
  const sig = text + "|" + (t.label || "") + "|" + state;
  if(sig === lastShown) return;
  lastShown = sig;
  document.getElementById("timerClock").textContent = text;
  document.getElementById("timerLabel").textContent = t.label || "Lobby closes in";
  document.getElementById("timerState").textContent = state;
}

(function tick(){
  drawTimer();
  requestAnimationFrame(tick);
})();

/* Which look: the operator's choice, else the event's own package -- an
   event running SS3 graphics gets the SS3 strip without being told. */
function lobbyTheme(ff){
  const pick = ((ff.lobby || {}).theme || "auto").toLowerCase();
  if(pick === "ss3" || pick === "arrow") return pick;
  const ev = ff.event || {};
  const folder = String(ev.aliveAssetFolder || ev.assetFolder || "").toLowerCase();
  return (folder === "ss3" || folder === "chirayu") ? "ss3" : "arrow";
}

function render(ff){
  const teams = ((ff.roster || {}).teams) || [];
  const lobby = ff.lobby || {};
  document.body.dataset.theme = lobbyTheme(ff);
  const lev = ff.event || {};
  document.body.classList.toggle("chirayu", document.body.dataset.theme === "ss3" &&
    String(lev.aliveAssetFolder || lev.assetFolder || "").toLowerCase() === "chirayu");
  timerState = lobby.timer || null;
  drawTimer();
  const joined = lobby.joined || {};
  const visible = !!(ff.display && ff.display.lobbyStatusVisible) && teams.length > 0;

  document.getElementById("stage").classList.toggle("visible", visible);
  if(!visible){
    wasJoined = new Set(teams.filter(function(t){ return joined[t.name]; })
                             .map(function(t){ return t.name; }));
    lastSignature = "";
    wasVisible = false;
    return;
  }
  const entering = !wasVisible;
  wasVisible = true;

  const useShort = lobby.shortNames !== false;
  /* THE HEADER IS SET EVERY TIME; THE CARDS ARE REBUILT ONLY WHEN THEY
     CHANGE. Both used to share one signature, so typing a title tore the
     whole row down and built it again -- and rebuilding an element
     restarts every CSS animation on it, which is a visible flicker
     across twelve cards for a change that never touched them. Setting
     two strings costs nothing; rebuilding the row is the expensive part
     and now happens only when a squad actually moves. */
  document.getElementById("title").textContent = lobby.title || "Lobby Status";
  document.getElementById("kicker").textContent = lobby.kicker || "Room Create";

  const count = teams.filter(function(t){ return joined[t.name]; }).length;
  document.getElementById("joined").textContent = count;
  document.getElementById("total").textContent = teams.length;

  const signature = JSON.stringify([
    teams.map(function(t){ return [t.name, label(t, useShort), t.logo ? 1 : 0]; }),
    teams.map(function(t){ return !!joined[t.name]; })
  ]);
  if(signature === lastSignature) return;
  lastSignature = signature;

  const cards = document.getElementById("cards");
  cards.className = "cards" + (entering ? " justShown" : "");
  cards.innerHTML = teams.map(function(t, i){
    const isIn = !!joined[t.name];
    // Not on the way in: a card cannot both arrive and lock in, and
    // asking it to do both at once just cancels one of them.
    const fresh = isIn && !wasJoined.has(t.name) && !entering;
    // And the other direction -- un-ticked, or Clear All.
    const left = !isIn && wasJoined.has(t.name) && !entering;
    return '<div class="slot' + (isIn ? " joined" : "") +
      (fresh ? " justJoined" : "") + (left ? " justLeft" : "") + '"' +
      // The card's position, and nothing else. Every delay on it --
      // the entrance cascade, the idle drift, the shimmer -- is worked
      // out from this in CSS, so the two never disagree about which card
      // is third.
      ' style="--i:' + i + '"' + '>' +
      '<div class="sweep"></div>' +
      '<div class="shimmer"></div>' +
      '<div class="logo">' +
        (t.logo ? '<img src="' + esc(t.logo) + '" alt="">'
                : '<div class="initials">' + esc(initials(t)) + '</div>') +
      '</div>' +
      '<div class="name">' + esc(label(t, useShort)) + '</div>' +
      '<div class="state"><span class="dot"></span>' +
        (isIn ? "Joined" : "Yet To Join") + '</div>' +
    '</div>';
  }).join("");

  wasJoined = new Set(teams.filter(function(t){ return joined[t.name]; })
                           .map(function(t){ return t.name; }));

  // Taken off once it has played. Left on, the next redraw would inherit
  // it and the cards would arrive a second time without ever leaving.
  if(entering){
    const total = 230 + teams.length * 55 + 620;
    setTimeout(function(){ cards.classList.remove("justShown"); }, total);
  }

  // The one-shot classes come off once their animation is spent, so the
  // idle drift takes the card back. They live in the markup until the
  // next redraw otherwise, and a redraw only happens when something
  // changes -- so a card that had just joined would sit perfectly still
  // for as long as nobody touched anything, which is the one card the
  // eye is on.
  setTimeout(function(){
    const spent = cards.querySelectorAll(".justJoined, .justLeft");
    for(let i = 0; i < spent.length; i++){
      spent[i].classList.remove("justJoined");
      spent[i].classList.remove("justLeft");
    }
  }, 700);
}

let _lastRoster = null;
/* The last whole state this page was given. lobby_update carries only
   what the strip draws, so it is merged into this and re-rendered --
   the roster, which is the expensive part, is already here. */
let _lastState = null;
/* The newest lobby this page has been told about, from either message.
   A full state can be built just before a tick and arrive just after it
   -- see _bump_lobby_rev in the engine -- and without this the strip
   flicks back to the old picture for a beat. Only trusted for a few
   seconds: if the engine is restarted and its count begins again, the
   strip must not ignore it for the rest of the show. */
let _newestLobby = null;
const NEWEST_LOBBY_TRUST_MS = 4000;

function _lobbyRev(lobby){ return Number((lobby && lobby.rev) || 0); }

function _keepNewestLobby(data){
  const n = _newestLobby;
  if(!n || Date.now() - n.at > NEWEST_LOBBY_TRUST_MS) return data;
  if(_lobbyRev(data.lobby) >= n.rev) return data;
  data.lobby = n.lobby;
  data.display = Object.assign({}, data.display, {lobbyStatusVisible: n.visible});
  return data;
}
let ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = function(evt){
    const msg = JSON.parse(evt.data);
    if(msg.type === "lobby_update"){
      /* A tick, or Show/Hide. Under a kilobyte, sent straight to this
         page, and it arrives before the full state_sync that follows --
         which is the difference between a checkbox turning green now and
         most of a second later. Nothing to do if no whole state has
         arrived yet; one is always sent on connect. */
      if(!_lastState) return;
      const lobby = msg.lobby || {};
      if(msg.serverNow) clockOffset = Number(msg.serverNow) - Date.now();
      // Out of order? An older update is simply ignored.
      if(_newestLobby && _lobbyRev(lobby) < _newestLobby.rev &&
         Date.now() - _newestLobby.at <= NEWEST_LOBBY_TRUST_MS) return;
      _newestLobby = {rev: _lobbyRev(lobby), lobby: lobby,
                      visible: !!msg.visible, at: Date.now()};
      _lastState.lobby = lobby;
      _lastState.display = Object.assign({}, _lastState.display,
                                         {lobbyStatusVisible: !!msg.visible});
      render(_lastState);
      return;
    }
    if(msg.type === "state_sync" && msg.data){
      // The roster is left out of a sync when unchanged -- it is the
      // biggest thing on the wire. Hold the last one and put it back, or
      // this strip empties itself between syncs.
      if(msg.data.roster) _lastRoster = msg.data.roster;
      else if(_lastRoster) msg.data.roster = _lastRoster;
      _lastState = _keepNewestLobby(msg.data);
      render(_lastState);
    }
  };
  ws.onclose = function(){ setTimeout(connect, 2000); };
  ws.onerror = function(){ ws.close(); };
}
connect();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Free Fire Zone Map</title>
<style>
  /* ZONE MAP -- one full-screen browser source, two layouts, three things
     it can show.

     LAYOUT    "std"  the standard panel: map left, title and teams right.
               "ss3"  the SS3 drop-spot artwork: the map in its frame,
                      MATCH / map tags, the round bar, the 12-team grid.

     SHOWING   live   the circle as the client narrates it: every circle
                      so far, the next one, the plane -- on the map the
                      log says this match loaded.
               match  a finished match from its replay: zones, plane,
                      where each kill landed, and each squad's rotation
                      (where it fought and fell while each circle was up).
               drops  each team's drop spot as a pin with its logo, set
                      per map in the dashboard (by hand or from recent
                      games) and kept for the event.

     Positions arrive placed on the map image (0..1 across and down) by
     ocr/freefire/map_analysis.py, which holds the calibration; this page
     only draws. Squad colours: twelve that stay apart on a busy map, by
     squad number. Text never wears a squad colour. */
  @font-face { font-family:'Supermolot'; src:url('assets/fonts/TT Supermolot Neue Trial Black Italic.ttf') format('truetype'); font-weight:900; font-style:italic; }
  @font-face { font-family:'Supermolot'; src:url('assets/fonts/TT Supermolot Neue Trial ExtraBold.ttf') format('truetype'); font-weight:800; font-style:normal; }
  @font-face { font-family:'Supermolot'; src:url('assets/fonts/TT Supermolot Neue Trial Bold.ttf') format('truetype'); font-weight:700; font-style:normal; }
  @font-face { font-family:'TacticSans'; src:url('assets/freefire/ss3/TacticSans-BldIt.otf') format('opentype'); font-weight:100 900; }

  :root{
    --surface:#0f1a17; --text-1:#ffffff; --text-2:#c3c2b7; --text-3:#8fa39a;
    --accent:#f7941d; --zone:#ffffff; --next:#ffe97a; --pin:#ee1c25;
  }
  body.ss3{ --surface:#0e0e0e; --accent:#ff1e1e; --text-3:#b39b9b; }
  body.ss3.chirayu{ --surface:#33415d; --accent:#e8a33a; --next:#f6c45c; --text-2:#dbe2ee; --text-3:#aeb9cc; }
  body.ss3, body.ss3 svg text, body.tpl-ss3, body.tpl-ss3 svg text{ font-family:'TacticSans',Arial,sans-serif !important; }

  html,body{margin:0;padding:0;background:transparent;overflow:hidden;}
  body{width:1920px;height:1080px;font-family:'Supermolot',Arial,sans-serif;color:var(--text-1);
       -webkit-font-smoothing:antialiased;}
  body.still *{animation:none !important;transition:none !important;}

  /* ---- standard panel ---- */
  #panel{position:absolute;left:160px;top:96px;width:1600px;height:888px;box-sizing:border-box;
         padding:40px 56px 40px;display:flex;gap:48px;
         opacity:.004;transform:translateY(28px);pointer-events:none;
         transition:opacity .45s ease, transform .55s cubic-bezier(.16,.84,.34,1);}
  #panel.on{opacity:1;transform:translateY(0);}
  #panel:not(.on){transition:opacity .35s ease, transform .45s cubic-bezier(.5,0,.75,0);
                  transform:translateY(42px) scale(.985);}
  #panel.bg{
    background:radial-gradient(120% 90% at 50% 0%, rgba(18,90,64,.35) 0%, rgba(15,26,23,0) 60%),
               radial-gradient(rgba(95,227,154,.06) 1.1px, transparent 1.2px) 0 0 / 10px 10px, var(--surface);
    border-top:4px solid var(--accent); box-shadow:0 24px 60px rgba(0,0,0,.55);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 28px),calc(100% - 28px) 100%,0 100%);
  }
  body.ss3 #panel.bg{
    background:radial-gradient(120% 90% at 50% 0%, rgba(255,30,30,.28) 0%, rgba(14,14,14,0) 60%),
               repeating-linear-gradient(115deg, rgba(255,30,30,.05) 0 2px, transparent 2px 22px), var(--surface);
  }
  body.ss3.chirayu #panel.bg{
    background:radial-gradient(120% 90% at 50% 0%, rgba(110,130,165,.40) 0%, rgba(51,65,93,0) 60%),
               repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 22px), var(--surface);
    border-top-color:#e8a33a;
  }
  #panel:not(.bg) .side{ text-shadow:0 2px 6px rgba(0,0,0,.85); }
  #stdMap{width:808px;height:808px;flex:0 0 808px;position:relative;}
  #mapbox{position:relative;width:100%;height:100%;overflow:hidden;background:#0b1210;}
  #stdMap #mapbox{border-radius:6px;box-shadow:0 0 0 2px rgba(255,255,255,.12), 0 18px 40px rgba(0,0,0,.5);}
  #map{display:block;width:100%;height:100%;}
  .side{flex:1;display:flex;flex-direction:column;min-width:0;}
  /* MAP & TEAM STATS: a smaller map, and the table of each squad's kills
     circle by circle beside it. */
  body.stats #stdMap{width:700px;height:700px;flex:0 0 700px;}
  /* MapStream's elimination feed, OFF the map: the strip under it, three
     cards in a row, newest first -- on the map it sat over the fights. */
  #binFeed{position:absolute;left:0;right:0;top:calc(100% + 12px);height:46px;display:none;gap:8px;}
  #binFeed.on{display:flex;}
  #binFeed .kf{flex:0 0 calc((100% - 16px) / 3);min-width:0;display:flex;align-items:center;gap:8px;height:46px;
               padding:0 14px 0 0;background:rgba(8,11,17,.92);font-style:italic;
               clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);}
  #binFeed .kf i{width:6px;align-self:stretch;flex:0 0 6px;}
  #binFeed .kf img{width:30px;height:30px;object-fit:contain;flex:0 0 30px;}
  #binFeed .kf .w{min-width:0;display:flex;flex-direction:column;line-height:1.05;}
  #binFeed .kf b{font-weight:900;font-size:16px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;}
  #binFeed .kf span{font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
                    color:#aab4c5;text-transform:uppercase;letter-spacing:.03em;}
  #binFeed .kf span em{font-style:inherit;color:var(--accent);margin-right:5px;}
  #binFeed .kf.in{animation:kfin .45s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes kfin{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}
  body.stats #panel{gap:36px;}
  /* Fixed layout: every circle column the same width, so a line's length
     reads as time survived. */
  .cs{margin-top:16px;width:100%;border-collapse:separate;border-spacing:0 3px;font-weight:800;table-layout:fixed;}
  .cs th.sq{width:290px;}
  .cs th{height:38px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#111;white-space:nowrap;}
  .cs th.sq{text-align:left;padding-left:12px;color:var(--text-2);background:rgba(255,255,255,.06);}
  .cs th.c{background:var(--accent);}
  .cs th.c:nth-of-type(odd){filter:brightness(.88);}
  .cs td{height:46px;background:rgba(255,255,255,.04);font-size:18px;color:var(--text-1);white-space:nowrap;}
  .cs tr:nth-child(even) td{background:rgba(255,255,255,.07);}
  .cs td.sq{padding:0 10px 0 6px;}
  .cs td.sq .in{display:flex;align-items:center;gap:8px;}
  .cs td.sq img{width:30px;height:30px;object-fit:contain;}
  .cs td.sq .nm{flex:1;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
  .cs td.sq .tk{color:var(--accent);font-size:16px;font-variant-numeric:tabular-nums;}
  .cs td.c{text-align:center;position:relative;}
  .cs td.c .k{display:inline-flex;align-items:center;gap:5px;}
  .cs td.c .k i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);position:relative;box-sizing:border-box;}
  .cs td.c .k i::after{content:"";position:absolute;left:3px;top:3px;width:4px;height:4px;border-radius:50%;background:var(--accent);}
  .cs .badge{display:inline-block;margin-left:5px;padding:3px 7px;border-radius:3px;font-size:12px;letter-spacing:.06em;color:#fff;
             vertical-align:middle;}
  .cs .badge.out{background:#c62f2f;}
  .cs .badge.win{background:var(--next);color:#111;}
  /* THE LIFE LINE: one per squad, drawn left to right through every circle
     it was alive in -- to the middle of the circle it went OUT in, or on
     to BOOYAH. Each cell holds its piece and starts it as the one before
     finishes (--d, --seg), so it reads as one line growing. The number
     and the badges sit on it in their own chips and pop as it reaches
     them. */
  .cs td.c .life{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;
                 background:var(--accent);transform-origin:left center;transform:scaleX(0);
                 box-shadow:0 0 8px var(--accent);}
  .cs td.c .life.half{right:50%;}
  .cs td.c .life.win{background:var(--next);box-shadow:0 0 8px var(--next);}
  .cs td.c > span{position:relative;z-index:1;}
  .cs td.c .k{background:var(--surface);padding:2px 8px 2px 6px;border-radius:12px;
              box-shadow:0 0 0 1px rgba(255,255,255,.08);}
  .cs td.c .badge{position:relative;z-index:1;}
  .cs td.sq .pl{width:30px;flex:0 0 30px;color:var(--text-3);font-size:15px;font-variant-numeric:tabular-nums;}
  #panel.on .cs tr{animation:rowin .45s cubic-bezier(.2,.8,.3,1) both;}
  #panel.on .cs .life{animation:grow var(--seg) linear var(--d) forwards;}
  @keyframes grow{to{transform:scaleX(1);}}
  #panel.on .cs td.c .k, #panel.on .cs td.c .badge{animation:chip .32s cubic-bezier(.2,.9,.3,1.3) var(--c) both;}
  @keyframes chip{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:none;}}
  body.still .cs .life{transform:none;}
  .kicker{font-weight:800;font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-2);}
  .kicker::before{content:"";display:block;width:30px;height:4px;background:var(--accent);margin:0 0 9px;}
  .title{font-weight:900;font-style:italic;font-size:58px;line-height:1;margin-top:4px;text-transform:uppercase;color:var(--accent);}
  body.ss3 .title{font-style:normal;color:#fff;}
  .sub{font-weight:700;font-size:18px;color:var(--text-3);margin-top:10px;letter-spacing:.06em;text-transform:uppercase;}
  .zones{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;}
  .zchip{font-weight:800;font-size:15px;letter-spacing:.06em;padding:6px 10px;border-radius:4px;
         background:rgba(255,255,255,.07);color:var(--text-2);white-space:nowrap;}
  .zchip b{color:var(--text-1);margin-right:6px;}
  .zchip.last{background:var(--next);color:#111;}
  .zchip.last b{color:#111;}
  .status{margin-top:28px;}
  .status .big{font-weight:900;font-size:64px;line-height:1;text-transform:uppercase;}
  .status .phase{font-weight:800;font-size:24px;letter-spacing:.12em;color:var(--next);margin-top:8px;text-transform:uppercase;}
  .status .meta{font-weight:700;font-size:18px;color:var(--text-3);margin-top:8px;letter-spacing:.06em;}
  .teams{margin-top:22px;display:flex;flex-direction:column;gap:5px;}
  .trow{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px 0 0;
        background:rgba(255,255,255,.045);border-radius:4px;font-weight:800;font-size:19px;}
  .trow i{width:7px;align-self:stretch;border-radius:4px 0 0 4px;flex:0 0 7px;}
  .trow img{width:30px;height:30px;object-fit:contain;flex:0 0 30px;}
  .trow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;}
  .trow .k{color:var(--text-2);width:96px;text-align:right;font-size:17px;white-space:nowrap;}
  .trow .k small{font-size:12px;letter-spacing:.06em;margin-left:4px;opacity:.8;}
  .trow .p{width:48px;text-align:right;color:var(--text-1);}
  .trow.dim{opacity:.42;}
  .trow.win .p{color:var(--next);}
  #panel.on .trow{animation:rowin .45s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes rowin{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
  .legend{margin-top:auto;display:flex;gap:22px;flex-wrap:wrap;font-weight:800;font-size:15px;color:var(--text-2);
          text-transform:uppercase;letter-spacing:.06em;}
  .legend span{display:flex;align-items:center;gap:8px;}
  /* A count AND a badge in one circle's cell overflowed into the next
     with six circles: the count lifts, the badge sits small in the
     cell's bottom corner. */
  .cs td.c.two > .k{top:-6px;font-size:15px;padding:1px 6px 1px 4px;gap:3px;}
  .cs td.c.two .badge{position:absolute;right:2px;bottom:2px;margin:0;padding:1px 4px;font-size:9px;letter-spacing:.03em;}

  /* BIN replay: a canvas in place of the drawn map, the same box. */
  #binCanvas{position:absolute;left:0;top:0;width:100%;height:100%;display:none;}
  #mapbox.bin #map{display:none;}
  #mapbox.bin #binCanvas{display:block;}
  .clock{position:absolute;right:14px;top:12px;font-weight:900;font-size:30px;padding:4px 12px;border-radius:4px;
         background:rgba(0,0,0,.6);display:none;font-variant-numeric:tabular-nums;z-index:3;}
  .clock.on{display:block;}
  .nomap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
         font-weight:800;font-size:26px;color:var(--text-2);padding:40px;background:rgba(0,0,0,.35);}

  /* ---- SS3 drop-spot artwork ----
     Measured from "prg br ss3 drop spot - BLANK": the map frame 65..1004 x
     58..997 (3px red border), the yellow MATCH tag 65..231 x 910..947, the
     red map tag 65..279 x 949..998, the round bar 1412..1790 x 435..482,
     the red panel 1055..1855 x 541..996 with name bars 150 wide at x 1090 /
     1284 / 1477 / 1672 and y 662 / 799 / 935. The ribbons cross the frame,
     so the art goes BEHIND the map, and the border and tags are put back
     on top from the same image (.sprite). */
  #ss3{position:absolute;inset:0;opacity:.004;pointer-events:none;transition:opacity .35s ease;}
  #ss3.on{opacity:1;}
  #ss3Art{position:absolute;left:0;top:0;width:1920px;height:1080px;}
  #ss3Map{position:absolute;left:65px;top:58px;width:940px;height:940px;}
  .sprite{position:absolute;background-repeat:no-repeat;background-size:1920px 1080px;}
  .tagtxt{position:absolute;display:flex;align-items:center;font-size:27px;letter-spacing:.02em;
          text-transform:uppercase;white-space:nowrap;}
  #ss3Match{left:65px;top:910px;width:167px;height:38px;padding-left:22px;box-sizing:border-box;color:#e8141b;}
  #ss3MapName{left:65px;top:949px;width:215px;height:46px;padding-left:22px;box-sizing:border-box;color:#fff;}
  #ss3Round{position:absolute;left:1412px;top:435px;width:378px;height:48px;display:flex;align-items:center;
            justify-content:center;font-size:32px;color:#171717;text-transform:uppercase;white-space:nowrap;}
  .cell{position:absolute;width:150px;}
  .cell img{position:absolute;left:30px;width:90px;height:90px;object-fit:contain;}
  .cell .nm{position:absolute;left:0;width:150px;height:27px;display:flex;align-items:center;justify-content:center;
            font-size:17px;color:#121212;text-transform:uppercase;white-space:nowrap;overflow:hidden;}
  /* The demo sets the names and the two tags upright and condensed, the
     round name italic: Supermolot ExtraBold for the first, Tactic Sans
     for the second. */
  body.tpl-ss3 .cell .nm, body.tpl-ss3 .tagtxt{font-family:'Supermolot',Arial,sans-serif !important;
            font-weight:800;font-style:normal;letter-spacing:.01em;}
  /* SS3 entrance: the map wipes down, the tags slide in, the grid pops
     in cell by cell; out, the whole layer fades. */
  #ss3.on #ss3Map{animation:wipe .75s cubic-bezier(.3,.7,.2,1) .15s both;}
  @keyframes wipe{from{clip-path:inset(0 0 100% 0);}to{clip-path:inset(0 0 0 0);}}
  #ss3.on .slidein{animation:slidein .5s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes slidein{from{opacity:0;transform:translateX(-60px);}to{opacity:1;transform:none;}}
  #ss3.on .rise{animation:rise .5s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  #ss3.on .cell{animation:cellpop .45s cubic-bezier(.2,.9,.3,1.2) both;}
  @keyframes cellpop{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}

  /* Map entrances (static mode). */
  .draw{animation:draw 1.2s cubic-bezier(.3,.6,.3,1) both;}
  @keyframes draw{from{stroke-dashoffset:var(--len);}to{stroke-dashoffset:0;}}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.9,.3,1.25) both;}
  @keyframes pop{from{opacity:0;transform:scale(.3);}to{opacity:1;transform:scale(1);}}
  .fade{animation:fade .6s ease both;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  /* A pin falls onto its spot and settles; a ring spreads where it lands. */
  .pindrop{animation:pindrop .7s cubic-bezier(.3,1.5,.5,1) both;}
  @keyframes pindrop{0%{opacity:0;transform:translateY(var(--fall));}55%{opacity:1;}100%{opacity:1;transform:translateY(0);}}
  .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.6s ease-out infinite;}
  @keyframes ripple{0%{opacity:.75;transform:scale(.3);}80%{opacity:0;transform:scale(1.6);}100%{opacity:0;transform:scale(1.6);}}
  /* The next circle, live: its dashes march while it waits to close. */
  .march{animation:march 1.6s linear infinite;}
  @keyframes march{to{stroke-dashoffset:var(--step);}}
  /* Nothing animates while the layout is hidden: a push builds the whole
     map and table first (a quarter of a second of work), and the entrance
     used to start during it and stutter. Everything waits, then plays. */
  #panel:not(.on) *, #ss3:not(.on) *{animation-play-state:paused !important;}
</style>
</head>
<body>
<div id="panel">
  <div id="stdMap"><div id="mapbox"><svg id="map" viewBox="0 0 1000 1000"></svg><canvas id="binCanvas"></canvas><div class="clock" id="clock"></div></div><div id="binFeed"></div></div>
  <div class="side">
    <div class="kicker" id="kicker"></div>
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
    <div id="sideBody"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<div id="ss3">
  <img id="ss3Art" alt="">
  <div id="ss3Map"></div>
  <div id="ss3Over"></div>
  <div class="tagtxt slidein" id="ss3Match" style="animation-delay:.55s"></div>
  <div class="tagtxt slidein" id="ss3MapName" style="animation-delay:.65s"></div>
  <div id="ss3Round" class="rise" style="animation-delay:.5s"></div>
  <div id="ss3Grid"></div>
</div>

<script>
const _params = new URLSearchParams(location.search);
const _sameOrigin = (location.host ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host : "");
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || _sameOrigin;
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=freefire_map&rostercache=1"
  : "ws://localhost:8765?page=freefire_map&rostercache=1";
// ?preview=1 draws whether or not it is on air (the dashboard's preview).
const PREVIEW = _params.get("preview") === "1";
const NS = "http://www.w3.org/2000/svg";
let SS3_ART = "assets/freefire/ss3/" + encodeURI("prg br ss3 drop spot - BLANK.png");   // per package

/* Twelve squad colours that stay apart on a dark map: one per hue, bright
   and saturated, neighbours in the list far apart on the wheel. The old
   twelve had near-twins (two blues, two oranges, three greens, two pinks)
   and squads ran together on air. */
const SQUAD_COLOURS = ["#ff3b30", "#ffea00", "#2979ff", "#00e676", "#ff40c4", "#ff9100",
                       "#00e5ff", "#b388ff", "#ffffff", "#aeea00", "#ff8a80", "#1de9b6"];
const colourOf = sq => SQUAD_COLOURS[((Number(sq) || 1) - 1) % SQUAD_COLOURS.length];

function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const P = uv => [uv[0] * 1000, uv[1] * 1000];
let U = 1;            // drawing unit: the viewBox width / 1000
const u = v => +(v * U).toFixed(2);
function mmss(t){ t = Math.max(0, Math.round(t || 0)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }

/* ZOOM. "map" is the whole image. "zones" fits the first circle -- where
   the match was actually played. "end" fits the endgame: the circle
   three from the last, or for the live view the one closing now. */
function zoomBox(zones, zoom, live){
  const zs = zones || [];
  let c = null, pad = 1.08;
  if(zoom === "zones" && zs.length) c = zs[0];
  if(zoom === "end" && zs.length){ c = zs[Math.max(0, zs.length - (live ? 2 : 3))]; pad = 1.25; }
  if(!c || !c.at || !c.r) return [0, 0, 1000];
  const [cx, cy] = P(c.at);
  const w = Math.max(220, Math.min(1000, 2 * c.r * 1000 * pad));
  return [Math.max(0, Math.min(1000 - w, cx - w / 2)), Math.max(0, Math.min(1000 - w, cy - w / 2)), w];
}
function applyZoom(svg, box){
  const [x, y, w] = box;
  svg.setAttribute("viewBox", `${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${w.toFixed(1)}`);
  U = w / 1000;
}

/* The squad's name as the game files have it, against each roster team's
   name / display name / short name: exact, ignoring case and punctuation
   ("TeamLegacy" is "TEAM LEGACY"), then -- only when exactly one team
   fits -- one name inside the other. Its logo comes from what this finds. */
function teamFor(name, roster){
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const want = norm(name);
  if(!want) return null;
  const teams = ((roster || {}).teams || []).filter(Boolean);
  const names = t => [t.name, t.displayName, t.shortName].map(norm).filter(Boolean);
  const exact = teams.find(t => names(t).includes(want));
  if(exact) return exact;
  const near = teams.filter(t => names(t).some(n =>
    Math.min(n.length, want.length) >= 4 && (n.includes(want) || want.includes(n))));
  return near.length === 1 ? near[0] : null;
}
function shortOf(sq, roster){
  const t = teamFor(sq.teamName, roster);
  return (t && t.shortName) || sq.teamName || ("SQUAD " + sq.squad);
}
function fullOf(t){ return (t && (t.displayName || t.name)) || ""; }
function fitText(node, min){
  node.style.fontSize = "";
  const base = parseFloat(getComputedStyle(node).fontSize) || 16;
  let size = base;
  while(node.scrollWidth > node.clientWidth + 1 && size > base * (min || 0.55)){
    size -= 0.5; node.style.fontSize = size + "px";
  }
}

/* ---- the map itself ------------------------------------------------ */

function baseMap(svg, image){
  svg.innerHTML = "";
  const defs = el("defs", {}, svg);
  const clip = el("clipPath", { id: "mapclip" }, defs);
  el("rect", { x: 0, y: 0, width: 1000, height: 1000 }, clip);
  const arrow = el("marker", { id: "arrow", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7,
                               orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 z", fill: "#ffffff" }, arrow);
  const glow = el("filter", { id: "glow", x: "-50%", y: "-50%", width: "200%", height: "200%" }, defs);
  el("feGaussianBlur", { stdDeviation: 4 }, glow);
  el("image", { href: "assets/" + encodeURI(image), x: 0, y: 0, width: 1000, height: 1000,
                preserveAspectRatio: "none" }, svg);
  // A light veil so circles and dots read over the busiest map art.
  el("rect", { x: 0, y: 0, width: 1000, height: 1000, fill: "rgba(0,0,0,.16)" }, svg);
  return el("g", { "clip-path": "url(#mapclip)" }, svg);
}

function drawPlane(g, plane, delay){
  if(!plane || !plane.from || !plane.to) return null;
  const [x1, y1] = P(plane.from), [x2, y2] = P(plane.to);
  const ln = el("line", { x1, y1, x2, y2, stroke: "#ffffff", "stroke-width": u(4),
                          "stroke-dasharray": u(14) + " " + u(10),
                          "stroke-linecap": "round", opacity: .85, "marker-end": "url(#arrow)" }, g);
  ln.classList.add("fade"); ln.style.animationDelay = delay + "s";
  return ln;
}

function circlePath(cx, cy, r){
  return `M ${cx - r} ${cy} a ${r} ${r} 0 1 0 ${2 * r} 0 a ${r} ${r} 0 1 0 ${-2 * r} 0`;
}

function drawZone(g, z, i, n, opts){
  const [cx, cy] = P(z.at), r = z.r * 1000;
  const last = i === n - 1;
  const grp = el("g", {}, g);
  const dash = opts && opts.dashed ? u(16) + " " + u(10) : "none";
  const halo = el("path", { d: circlePath(cx, cy, r), fill: "none", stroke: "rgba(0,0,0,.45)",
                            "stroke-width": u(last ? 10 : 8), "stroke-dasharray": dash }, grp);
  const path = el("path", { d: circlePath(cx, cy, r), fill: last ? "rgba(255,233,122,.10)" : "none",
                            stroke: last ? "var(--next)" : "var(--zone)", "stroke-width": u(last ? 5 : 3.5),
                            opacity: last ? 1 : 0.45 + 0.55 * ((i + 1) / n), "stroke-dasharray": dash }, grp);
  if(opts && opts.dashed){
    // Waiting to close: the dashes march round it.
    [halo, path].forEach(nd => { nd.style.setProperty("--step", -u(26)); nd.classList.add("march"); });
  } else if(opts && opts.animate){
    const len = 2 * Math.PI * r;
    [halo, path].forEach(nd => { nd.setAttribute("stroke-dasharray", len); nd.style.setProperty("--len", len);
                                 nd.classList.add("draw"); nd.style.animationDelay = opts.delay + "s"; });
  }
  const by = cy - r;
  const badge = el("g", {}, grp);
  el("circle", { cx, cy: by, r: u(15), fill: last ? "var(--next)" : "#ffffff", stroke: "rgba(0,0,0,.6)",
                 "stroke-width": u(2) }, badge);
  const t = el("text", { x: cx, y: by + u(6), "text-anchor": "middle", "font-size": u(17), "font-weight": 900,
                         fill: "#111" }, badge);
  t.textContent = (z.stage || 0) + 1;
  if(opts && opts.animate){ badge.classList.add("pop"); badge.style.animationDelay = (opts.delay + .5) + "s"; }
  return grp;
}

/* A drop-spot pin: red teardrop, its tip on the spot, the team's logo in
   a black disc -- the shape the SS3 demo draws. */
function drawPin(g, at, team, i, animate, delay){
  const [x, y] = P(at);
  const s = U * 1.0;
  const outer = el("g", { transform: `translate(${x.toFixed(1)},${y.toFixed(1)})` }, g);
  const ring = el("ellipse", { cx: 0, cy: 0, rx: 30 * s, ry: 12 * s, fill: "none", stroke: "var(--pin)",
                               "stroke-width": 3 * s }, outer);
  el("ellipse", { cx: 0, cy: 2 * s, rx: 14 * s, ry: 5 * s, fill: "rgba(0,0,0,.45)" }, outer);
  const pin = el("g", {}, outer);
  el("path", { d: `M0,0 L${-26 * s},${-44 * s} A${38 * s} ${38 * s} 0 1 1 ${26 * s},${-44 * s} Z`,
               fill: "var(--pin)", stroke: "rgba(0,0,0,.55)", "stroke-width": 2 * s }, pin);
  el("circle", { cx: 0, cy: -72 * s, r: 30 * s, fill: "#0d0d0d" }, pin);
  if(team && team.logo){
    // The clip is in the logo's own coordinates (the pin's), so it falls
    // with the pin rather than staying behind on the map.
    const cid = "pinclip" + i;
    const cp = el("clipPath", { id: cid, clipPathUnits: "userSpaceOnUse" }, g.ownerSVGElement.querySelector("defs"));
    el("circle", { cx: 0, cy: -72 * s, r: 27 * s }, cp);
    el("image", { href: team.logo, x: -24 * s, y: -96 * s, width: 48 * s, height: 48 * s,
                  "clip-path": `url(#${cid})` }, pin);
  } else {
    const t = el("text", { x: 0, y: -65 * s, "text-anchor": "middle", "font-size": 20 * s, "font-weight": 900, fill: "#fff" }, pin);
    t.textContent = ((team && (team.shortName || team.name)) || "?").slice(0, 4);
  }
  if(animate){
    pin.style.setProperty("--fall", (-260 * s) + "px");
    pin.classList.add("pindrop"); pin.style.animationDelay = delay + "s";
    ring.classList.add("ripple"); ring.style.animationDelay = (delay + .55) + "s";
  } else {
    ring.setAttribute("opacity", 0);
  }
  return outer;
}

/* ---- MATCH --------------------------------------------------------- */

function chosenSquads(view, cfg){
  const pick = (cfg.teams || []).map(Number);
  if(pick.length) return new Set(pick);
  // Nobody picked: the four who finished highest -- twelve rotations at
  // once is a tangle, four tell the story of the endgame.
  return new Set((view.squads || []).filter(s => s.place).sort((a, b) => a.place - b.place)
                 .slice(0, 4).map(s => s.squad));
}

/* Every element that appears at a moment in the match carries data-t, so
   the replay can walk time forward by showing what has happened. */
function drawMatch(svg, view, cfg, roster, animate){
  applyZoom(svg, zoomBox(view.zones, cfg.zoom, false));
  const g = baseMap(svg, view.image);
  const show = Object.assign({ zones: true, plane: true, kills: true, paths: true, shots: false }, cfg.show || {});
  const picked = chosenSquads(view, cfg);
  const filtered = (cfg.teams || []).length > 0;
  // Rotations: the ticked teams, else every team -- or the top four
  // finishers when the dashboard says so.
  const rotPicked = filtered ? picked : (cfg.pathScope === "top4" ? picked
                    : new Set((view.squads || []).map(s => s.squad)));
  const timed = [];
  const stamp = (node, t) => { if(node){ node.dataset.t = t; timed.push(node); } return node; };

  if(show.plane) stamp(drawPlane(g, view.plane, 0.1), 0);
  if(show.zones){
    const zs = view.zones || [];
    zs.forEach((z, i) => stamp(drawZone(g, z, i, zs.length, { animate, delay: 0.3 + i * 0.35 }), z.announced));
  }
  const kills = (view.kills || []).filter(k => k.at &&
    (!filtered || picked.has(k.ks) || picked.has(k.vs)));
  const kd = Math.max(1, kills.length);
  if(show.shots){
    kills.forEach((k, i) => {
      if(!k.from) return;
      const [x1, y1] = P(k.from), [x2, y2] = P(k.at);
      const ln = el("line", { x1, y1, x2, y2, stroke: colourOf(k.ks), "stroke-width": u(2.5), opacity: .8 }, g);
      if(animate){ ln.classList.add("fade"); ln.style.animationDelay = (1.2 + 1.6 * i / kd) + "s"; }
      stamp(ln, k.t);
    });
  }
  if(show.kills){
    kills.forEach((k, i) => {
      const [x, y] = P(k.at);
      // A squad that was picked: its kills solid, its own deaths hollow.
      const own = filtered && picked.has(k.vs) && !picked.has(k.ks);
      const c = el("circle", { cx: x, cy: y, r: u(own ? 7 : 6.5),
                               fill: own ? "none" : colourOf(k.ks),
                               stroke: own ? colourOf(k.vs) : "rgba(0,0,0,.75)", "stroke-width": u(own ? 3 : 2) }, g);
      if(animate){ c.classList.add("pop"); c.style.animationDelay = (1.2 + 1.6 * i / kd) + "s"; }
      stamp(c, k.t);
    });
  }
  if(show.paths){
    /* Each team's rotation: where it dropped (first seen, before the first
       circle), then one point per zone -- the middle of where its players
       fought and fell while that circle was up -- then where it finished,
       joined in order with an arrow on each leg. Not the exact route (the
       replay file has positions only at fights), but the from-and-to of
       every zone. */
    const squads = (view.squads || []).filter(s => rotPicked.has(s.squad) && ((s.path || []).length || s.last));
    const many = squads.length > 4;
    const zoneT = ph => ph <= 0 ? 0 : (((view.zones || [])[ph - 1] || {}).announced || 0);
    squads.forEach((s, si) => {
      const seq = [];
      // the drop: the first fight in the opening minutes, else the
      // positions from before the first circle
      if(s.first) seq.push({ kind: "start", at: s.first, phase: 0 });
      (s.path || []).forEach(p => {
        if(p.phase === 0 && s.first) return;
        seq.push({ kind: p.phase === 0 ? "start" : "zone", at: p.at, phase: p.phase });
      });
      if(s.last){
        const lp = seq[seq.length - 1];
        const far = !lp || Math.hypot(lp.at[0] - s.last[0], lp.at[1] - s.last[1]) > 0.012;
        if(far) seq.push({ kind: "end", at: s.last, phase: lp ? lp.phase : 0, t: s.out });
        else lp.kind = seq.length === 1 ? "end" : "end";
      } else if(seq.length){
        seq[seq.length - 1].kind = "end";
      }
      if(!seq.length) return;
      const col = colourOf(s.squad);
      const xy = seq.map(p => P(p.at));
      const t0 = 2.2 + si * (many ? .12 : .25);
      const stepT = i => (t0 + i * .32).toFixed(2) + "s";
      const sw = many ? 4 : 6;
      // legs, each with an arrow at its middle pointing the way it went
      for(let i = 1; i < xy.length; i++){
        const [x1, y1] = xy[i - 1], [x2, y2] = xy[i];
        const halo = el("line", { x1, y1, x2, y2, stroke: "rgba(0,0,0,.6)", "stroke-width": u(sw + 5), "stroke-linecap": "round" }, g);
        const seg = el("line", { x1, y1, x2, y2, stroke: col, "stroke-width": u(sw), "stroke-linecap": "round" }, g);
        const len = Math.hypot(x2 - x1, y2 - y1);
        const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
        const a = u(many ? 9 : 12);
        const arrow = el("polygon", { points: `${a},0 ${-a * .8},${a * .75} ${-a * .8},${-a * .75}`, fill: col,
                                      stroke: "#111", "stroke-width": u(1.5),
                                      transform: `translate(${((x1 + x2) / 2).toFixed(1)},${((y1 + y2) / 2).toFixed(1)}) rotate(${ang.toFixed(1)})` }, g);
        if(len < u(36)) arrow.setAttribute("display", "none");
        if(animate){
          [halo, seg].forEach(n => { n.setAttribute("stroke-dasharray", len); n.style.setProperty("--len", len);
                                     n.classList.add("draw"); n.style.animationDelay = stepT(i); });
          arrow.classList.add("pop"); arrow.style.animationDelay = (t0 + i * .32 + .25).toFixed(2) + "s";
        }
        const tt = seq[i].kind === "end" ? (seq[i].t || zoneT(seq[i].phase)) : zoneT(seq[i].phase);
        stamp(halo, tt); stamp(seg, tt); stamp(arrow, tt);
      }
      const team = teamFor(s.teamName, roster);
      seq.forEach((p, i) => {
        const [x, y] = xy[i];
        const node = el("g", {}, g);
        if(p.kind === "start"){
          // the drop: a square with a D
          const r = u(many ? 10 : 12);
          el("rect", { x: x - r, y: y - r, width: 2 * r, height: 2 * r, rx: u(3), fill: "#111", stroke: col, "stroke-width": u(3) }, node);
          const t = el("text", { x, y: y + u(5), "text-anchor": "middle", "font-size": u(many ? 12 : 14), "font-weight": 900, fill: col }, node);
          t.textContent = "D";
        } else if(p.kind === "end"){
          // where it finished: its logo, else its tag; the name beside
          el("circle", { cx: x, cy: y, r: u(many ? 17 : 22), fill: "#111", stroke: col, "stroke-width": u(4) }, node);
          if(team && team.logo){
            const w = u(many ? 26 : 34);
            el("image", { href: team.logo, x: x - w / 2, y: y - w / 2, width: w, height: w }, node);
          } else {
            const t = el("text", { x, y: y + u(4), "text-anchor": "middle", "font-size": u(many ? 9 : 11), "font-weight": 900, fill: "#fff" }, node);
            t.textContent = String((team && team.shortName) || s.teamName || s.squad).slice(0, 4).toUpperCase();
          }
          const lab = el("text", { x, y: y + u(many ? 31 : 38), "text-anchor": "middle", "font-size": u(many ? 13 : 15), "font-weight": 900,
                                   fill: "#fff", stroke: "rgba(0,0,0,.85)", "stroke-width": u(3.5), "paint-order": "stroke" }, node);
          lab.textContent = ((team && team.shortName) || s.teamName || "").toUpperCase() + (s.place ? " #" + s.place : "");
          // twelve names all ending in the last circle only pile up: the
          // disc and the team list's colours carry it then
          if(many) lab.setAttribute("display", "none");
        } else {
          el("circle", { cx: x, cy: y, r: u(many ? 9 : 11), fill: col, stroke: "#111", "stroke-width": u(3) }, node);
          const t = el("text", { x, y: y + u(4.5), "text-anchor": "middle", "font-size": u(many ? 11 : 14), "font-weight": 900, fill: "#111" }, node);
          t.textContent = p.phase;
        }
        if(animate){ node.classList.add("pop"); node.style.animationDelay = stepT(i); }
        stamp(node, p.kind === "end" ? (p.t || zoneT(p.phase)) : zoneT(p.phase));
      });
      // a marker that travels the rotation once it is drawn
      if(animate && xy.length > 1){
        const d = "M" + xy.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" L");
        const comet = el("g", {}, g);
        el("circle", { r: u(many ? 10 : 14), fill: col, opacity: .55, filter: "url(#glow)" }, comet);
        el("circle", { r: u(many ? 5 : 7), fill: "#fff", stroke: col, "stroke-width": u(3) }, comet);
        comet.setAttribute("opacity", 0);
        const begin = (t0 + xy.length * .32 + .4).toFixed(2) + "s";
        el("animateMotion", { path: d, dur: Math.max(1.6, xy.length * .55).toFixed(2) + "s", begin, fill: "freeze",
                              calcMode: "paced" }, comet);
        el("set", { attributeName: "opacity", to: 1, begin }, comet);
      }
    });
  }
  return timed;
}

/* Each squad's kills in the circle they happened in, an OUT where it was
   eliminated and BOOYAH for the winner. A kill before the first circle is
   drawn counts in circle 1. */
/* `tm`, for the BIN replay: the table runs in time with the match being
   played back -- each squad's line reaches a circle when the replay does,
   stops when the squad goes out, and each count pops on its squad's last
   elimination in that circle. Replay seconds = tm.s0 + tm.toReal(match seconds)
   -- the replay's own time map (binTimeMap), so the drop's slower share holds. */
function sideStats(view, roster, tm){
  const zones = (view.zones || []).slice(0, 6);
  const n = Math.max(1, zones.length);
  const circleOf = t => {
    let c = 0;
    zones.forEach((z, i) => { if(z.announced != null && z.announced <= t) c = i + 1; });
    return Math.max(1, Math.min(n, c));
  };
  const rows = (view.squads || []).map(s => {
    const per = new Array(n).fill(0), lastKill = new Array(n).fill(null);
    (view.kills || []).forEach(k => {
      if(k.ks !== s.squad || k.t == null) return;
      const c = circleOf(k.t) - 1;
      per[c]++;
      lastKill[c] = Math.max(lastKill[c] == null ? 0 : lastKill[c], k.t);
    });
    return { s, per, lastKill, total: per.reduce((a, b) => a + b, 0),
             out: s.place === 1 ? null : (s.out != null ? circleOf(s.out) : null) };
  });
  // circle c (1..n) runs from the moment it is the latest drawn to the next
  const dur = Number(view.duration) || 0;
  const zFrom = c => c === 1 ? 0 : Number((zones[c - 1] || {}).announced) || 0;
  const zTo = c => c === n ? dur : Number((zones[c] || {}).announced) || dur;
  const at = t => tm.s0 + tm.toReal(Math.max(0, t));
  // In the order they finished, so the life lines step down the table:
  // the winner's runs the whole way, the first out's stops first.
  rows.sort((a, b) => ((a.s.place || 99) - (b.s.place || 99)) || (b.total - a.total));
  const SEG = 0.28;
  const head = `<tr><th class="sq">SQUAD<span style="float:right;margin-right:10px;">ELIMINATIONS</span></th>` +
    Array.from({ length: n }, (_, i) => `<th class="c">CIRCLE ${i + 1}</th>`).join("") + `</tr>`;
  const body = rows.map((r, ri) => {
    const team = teamFor(r.s.teamName, roster);
    const tag = (team && team.shortName) || r.s.teamName || ("SQUAD " + r.s.squad);
    const win = r.s.place === 1;
    // how far its line runs: through the circle it went out in (to the
    // middle), the whole way for the winner, nowhere when not known
    const reach = win ? n : (r.out || 0);
    const start = .35 + ri * .05 + .35;
    const cells = r.per.map((v, i) => {
      const c = i + 1;
      const half = !win && c === r.out;
      let d = start + i * SEG, seg = half ? SEG / 2 : SEG;
      let chipAt = d + SEG * .5, outAt = chipAt, winAt = d + SEG;
      if(tm){
        d = at(zFrom(c));
        seg = Math.max(.05, at(half && r.s.out != null ? r.s.out : zTo(c)) - d);
        chipAt = r.lastKill[i] != null ? at(r.lastKill[i]) : d + seg;
        outAt = r.s.out != null ? at(r.s.out) : d + seg;
        winAt = at(dur);
      }
      let html = "";
      if(c <= reach){
        html += `<b class="life${half ? " half end" : ""}${win ? " win" : ""}" style="--d:${d.toFixed(2)}s;--seg:${seg.toFixed(2)}s"></b>`;
      }
      if(v) html += `<span class="k" style="--c:${chipAt.toFixed(2)}s"><i></i>x${v}</span>`;
      if(r.out === c) html += `<span class="badge out" style="--c:${outAt.toFixed(2)}s">OUT</span>`;
      if(win && c === n) html += `<span class="badge win" style="--c:${winAt.toFixed(2)}s">BOOYAH</span>`;
      const two = v && (r.out === c || (win && c === n));
      return `<td class="c${two ? " two" : ""}">${html}</td>`;
    }).join("");
    return `<tr style="animation-delay:${(.35 + ri * .05).toFixed(2)}s"><td class="sq"><div class="in">` +
      `<span class="pl">${r.s.place ? "#" + r.s.place : ""}</span>` +
      (team && team.logo ? `<img src="${team.logo}">` : `<span style="width:30px"></span>`) +
      `<span class="nm">${esc(tag)}</span><span class="tk">${r.total}</span></div></td>${cells}</tr>`;
  }).join("");
  return `<table class="cs">${head}${body}</table>`;
}

function sideMatch(view, cfg, roster){
  const picked = chosenSquads(view, cfg);
  const filtered = (cfg.teams || []).length > 0;
  const zs = view.zones || [];
  const zones = "<div class='zones'>" + zs.map((z, i) =>
    `<div class="zchip${i === zs.length - 1 ? " last" : ""}"><b>Z${(z.stage || 0) + 1}</b>${Math.round(z.meters)}m · ${mmss(z.announced)}</div>`
  ).join("") + "</div>";
  let squads = (view.squads || []).slice();
  if(filtered) squads = squads.filter(s => picked.has(s.squad));
  const rows = squads.map((s, i) => {
    const team = teamFor(s.teamName, roster);
    const logo = team && team.logo ? `<img src="${team.logo}">` : `<span style="width:30px"></span>`;
    const dim = !filtered && cfg.pathScope === "top4" && !picked.has(s.squad) && (cfg.show || {}).paths !== false;
    return `<div class="trow${s.place === 1 ? " win" : ""}${dim ? " dim" : ""}" style="animation-delay:${(.3 + i * .05).toFixed(2)}s">` +
           `<i style="background:${colourOf(s.squad)}"></i>${logo}` +
           `<span class="nm">${esc(shortOf(s, roster))}</span><span class="k">${s.kills}<small>${s.kills === 1 ? "ELIMINATION" : "ELIMINATIONS"}</small></span>` +
           `<span class="p">${s.place ? "#" + s.place : ""}</span></div>`;
  }).join("");
  return zones + "<div class='teams'>" + rows + "</div>";
}

/* ---- LIVE ---------------------------------------------------------- */

function drawLive(svg, view, animate, zoom){
  applyZoom(svg, zoomBox(view.zones, zoom, true));
  const g = baseMap(svg, view.image);
  drawPlane(g, view.plane, 0);
  const zs = view.zones || [];
  zs.forEach((z, i) => {
    const last = i === zs.length - 1;
    drawZone(g, z, i, zs.length, { animate, delay: 0.2 + i * 0.25,
                                   dashed: last && view.phase !== "SHRINK" && view.phase !== "RANDOM_MOVE" });
  });
}

/* ---- DROPS --------------------------------------------------------- */

/* Which map the drop spots are for: the operator's pick, else the map the
   live match loaded, else the loaded match's. */
function dropMapId(state, cfg){
  const live = (((state.liveOps || {}).zone) || {}).mapId;
  return String(cfg.dropMap || live || ((cfg.match || {}).mapId) || 1);
}
function dropPins(state, cfg){
  const id = dropMapId(state, cfg);
  const pins = ((cfg.drops || {})[id]) || {};
  const teams = ((state.roster || {}).teams) || [];
  const out = [];
  teams.forEach(t => {
    const keys = [t.name, t.displayName, t.shortName].map(n => String(n || "").trim().toUpperCase()).filter(Boolean);
    const hit = keys.map(k => pins[k]).find(Boolean);
    if(hit && hit.at) out.push({ team: t, at: hit.at });
  });
  return out;
}
/* Two squads on the same POI would stack one pin exactly on the other and
   hide a logo, so pins closer than a pin's width are eased apart sideways
   -- only for drawing, the saved spot is untouched. */
function spreadPins(pins){
  const pts = pins.map(p => ({ p, x: p.at[0], y: p.at[1] }));
  // A pin is ~0.07 wide and its head stands ~0.1 above its tip, so two
  // pins collide when they are close across AND within a head's height.
  const MINX = 0.068, MINY = 0.1;
  for(let pass = 0; pass < 60; pass++){
    let moved = false;
    for(let i = 0; i < pts.length; i++) for(let j = i + 1; j < pts.length; j++){
      const a = pts[i], b = pts[j];
      const dx = b.x - a.x;
      if(Math.abs(dx) >= MINX || Math.abs(b.y - a.y) >= MINY) continue;
      const push = (MINX - Math.abs(dx)) / 2 + 0.002;
      const dir = dx === 0 ? (i % 2 ? 1 : -1) : Math.sign(dx);
      a.x -= dir * push; b.x += dir * push;
      moved = true;
    }
    if(!moved) break;
  }
  return pts.map(q => ({ team: q.p.team, at: [Math.min(.97, Math.max(.03, q.x)), q.y] }));
}
function drawDrops(svg, image, pins, animate){
  applyZoom(svg, [0, 0, 1000]);
  const g = baseMap(svg, image);
  pins = spreadPins(pins);
  // Top of the map first, so lower pins overlap the ones behind them.
  pins.slice().sort((a, b) => a.at[1] - b.at[1])
      .forEach((p, i) => drawPin(g, p.at, p.team, i, animate, 1.0 + i * .12));
}
function sideDrops(pins){
  const rows = pins.map((p, i) =>
    `<div class="trow" style="animation-delay:${(.3 + i * .05).toFixed(2)}s"><i style="background:var(--pin)"></i>` +
    (p.team.logo ? `<img src="${p.team.logo}">` : `<span style="width:30px"></span>`) +
    `<span class="nm">${esc(p.team.shortName || p.team.name)}</span></div>`).join("");
  return "<div class='teams'>" + rows + "</div>";
}

/* ---- BIN REPLAY (Map & Team Stats, "BIN replay") -------------------
   The finished match played back from its replay .bin, QG Pro style:
   every player a dot in their squad's colour, each squad's logo riding
   above its players, the zone closing in, who eliminated whom -- over
   binSeconds, the camera closing in with the circle (or on the teams
   ticked in the dashboard). The engine sends the tracks on their own
   message (map_bin), already placed on the map image (0..1000 across
   and down); this only draws. The table beside it runs in time (see
   sideStats). */
const BIN_WAIT_MS = 6000;      // a push waits this long for the replay, then draws the standard map
const BIN_LEAD = 0.7;          // seconds of entrance before the match starts moving
const BIN_TRAIL = 30;          // seconds of route behind each player
let binData = null, binGaveUp = "", binWaitTimer = 0, bin = null, lastState = null;
const binMaps = {};

function binSecs(cfg){ return Math.max(10, Math.min(300, Number(cfg.binSeconds) || 60)); }
/* LIVE SPEED: the operator's - / + / pause on the dashboard. A replay
   keeps its own position and moves it on by speed x the time since the
   last frame, so a change takes hold from where it is -- never a restart,
   never a jump. The circle table beside MapStream is CSS animation, so its
   playback rate is set to the same speed and it stays in step. */
let replaySpeed = 1;
// The feed's place and the players' names, from the dashboard: read every
// frame, so a change shows at once, the replay going on as it was.
const binOpts = { feed: "below", names: true };
function setReplaySpeed(v){
  v = Number(v);
  replaySpeed = isFinite(v) ? Math.max(0, Math.min(8, v)) : 1;
  binTableRate();
}
function binTableRate(){
  const side = document.getElementById("sideBody");
  if(!bin || !bin.anim || bin.still || !side || !side.getAnimations) return;
  side.getAnimations({ subtree: true }).forEach(a => { try { a.playbackRate = replaySpeed; } catch(e){} });
  bin.rateApplied = replaySpeed;
}
/* Replay time to match time, and back. The drop -- the plane crossing,
   the squads coming down -- gets its own share of the replay (15%, 3 to
   12 seconds) so the plane can be watched; played at the same rate as the
   rest it was over in a second or two. The circle table runs on the same
   map, so it stays in step. */
// When the squads are down: the middle of the players' first moments on
// the map. The first alone was one early player, and the map then sat
// near-empty for most of a minute after "dropping" was over.
function binLandedBy(players){
  const ts = players.map(p => (p.t && p.t.length) ? p.t[0] : null).filter(v => v != null).sort((a, c) => a - c);
  return ts.length ? ts[Math.floor(ts.length / 2)] : 1e9;
}
function binTimeMap(d, view, secs){
  const dur = Math.max(1, Number(d.duration || view.duration) || 1);
  const first = binLandedBy(d.players || []);
  const open = Math.min(isFinite(first) && first < 1e8 ? first : 0, dur * .3);
  const ro = open > 5 ? Math.max(3, Math.min(12, secs * .15)) : 0;
  return {
    dur, secs, open, ro,
    toMatch: r => r <= ro ? (ro ? r / ro * open : 0) : open + (r - ro) / Math.max(.001, secs - ro) * (dur - open),
    toReal: t => t <= open ? (open ? t / open * ro : 0) : ro + (t - open) / Math.max(1, dur - open) * (secs - ro),
  };
}
// Map view "bin" plays the match (MapStream); "bin-landing",
// "bin-rotations" and "bin-paths" are the BIN tab's other three views.
function binView(cfg){ return String(cfg.statsMap || "").replace(/^bin-?/, "") || "stream"; }
function binStatus(cfg){
  if(!/^bin/.test(String(cfg.statsMap || ""))) return "off";
  if(binData && binData.matchFile === cfg.matchFile) return binData.ok ? "ready" : "failed";
  return binGaveUp === cfg.matchFile ? "failed" : "waiting";
}
// Names as drawn: private-use characters dropped (the font draws its
// foundry's logo there), the Hangul fillers players use as spaces made spaces.
function binName(s){
  return String(s == null ? "" : s).replace(/[-]|[\u{F0000}-\u{10FFFF}]/gu, "")
    .replace(/[ㅤﾠᅟᅠ]/g, " ").replace(/\s{2,}/g, " ").trim();
}
function binPrep(msg){
  (msg.players || []).forEach(p => {
    p.airAt = new Uint8Array(p.t.length);
    (p.air || []).forEach(([a, b]) => { for(let i = a; i < b && i < p.t.length; i++) p.airAt[i] = 1; });
    p.cutAt = new Set(p.cut || []);
    p.end = p.t.length ? p.t[p.t.length - 1] : 0;
  });
  msg.photoImgs = (msg.photoSet || []).map(src => { const im = new Image(); im.src = src; return im; });
  // The recording stops a few seconds before the match's own end: past
  // it, everyone still in is held where the recording last saw them, or
  // the winners would vanish from the final frame.
  msg.recEnd = Math.max(0, ...(msg.players || []).map(p => p.end));
  // Out at their elimination -- the recording stops the moment the last
  // opponent falls, so the final squad beaten runs to its very end too
  // and stood beside the winners. A track that carries on well past an
  // elimination was a revive: that one is not the end.
  const died = {};
  (msg.kills || []).forEach(k => { if(k.vn) died[k.vn] = k.t; });
  (msg.players || []).forEach(p => {
    const d = died[p.name];
    const fell = d != null && d >= p.end - 15;      // a track runs ~2.5 s past its elimination
    p.survivor = !fell && p.end >= msg.recEnd - 3;
    p.out = p.survivor ? Infinity : (fell ? d : p.end);
  });
  return msg;
}
// Where a player is at match time t -- slid between samples, except
// across a jump -- or null outside their track (not in yet, or out).
function binAt(p, t){
  const ts = p.t, n = ts.length;
  if(!n || t < ts[0] || t > p.out + 0.3) return null;
  let lo = 0, hi = n - 1;
  while(lo < hi){ const mid = (lo + hi + 1) >> 1; if(ts[mid] <= t) lo = mid; else hi = mid - 1; }
  const j = Math.min(lo + 1, n - 1);
  if(j === lo || p.cutAt.has(j) || ts[j] <= ts[lo]) return [p.u[lo], p.v[lo], p.airAt[lo]];
  const f = Math.min(1, (t - ts[lo]) / (ts[j] - ts[lo]));
  return [p.u[lo] + (p.u[j] - p.u[lo]) * f, p.v[lo] + (p.v[j] - p.v[lo]) * f, p.airAt[lo]];
}
// The map, toned down so the dots read -- the HD copy when there is one.
function binMapSrc(image){
  const file = String(image || "").split("/").pop().replace(/\.[^.]+$/, "");
  return "assets/" + encodeURI("FF Maps/hd/" + file + ".jpg");
}
function binMap(image){
  const key = String(image || "");
  if(binMaps[key]) return binMaps[key];
  const m = binMaps[key] = { ready: false, canvas: document.createElement("canvas") };
  const im = new Image();
  const tone = () => {
    m.canvas.width = im.naturalWidth; m.canvas.height = im.naturalHeight;
    const c = m.canvas.getContext("2d");
    // the map in its own colours, a touch dimmed so what is drawn on it
    // reads -- the viewers are looking at it, not just at the dots
    c.filter = "saturate(1.1) brightness(.84) contrast(1.06)";
    c.drawImage(im, 0, 0);
    m.ready = true;
  };
  im.onload = tone;
  im.onerror = () => { if(!im.dataset.fallback){ im.dataset.fallback = "1"; im.src = "assets/" + encodeURI(key); } };
  im.src = binMapSrc(image);
  return m;
}
function binImg(src){
  if(!src) return null;
  const m = binMaps["img:" + src] || (binMaps["img:" + src] = Object.assign(new Image(), { src }));
  return m.complete && m.naturalWidth ? m : null;
}
function stopBin(){
  if(bin && bin.raf) cancelAnimationFrame(bin.raf);
  bin = null;
  document.getElementById("mapbox").classList.remove("bin");
  const fd = document.getElementById("binFeed");
  fd.classList.remove("on"); fd.innerHTML = ""; fd.dataset.key = ""; fd.dataset.seen = "";
}
// The feed under the map: three cards, newest first, a new one sliding in.
// Rebuilt only when what it shows changes.
function binFeedBelow(list){
  const box = document.getElementById("binFeed");
  box.classList.toggle("on", binOpts.feed === "below");
  if(binOpts.feed !== "below") return;
  const id = k => k.t + "|" + k.kn + "|" + k.vn;
  const key = list.map(id).join("~");
  if(key === box.dataset.key) return;
  const seen = new Set((box.dataset.seen || "").split("~"));
  box.dataset.key = key;
  box.dataset.seen = key;
  box.innerHTML = list.slice().reverse().map(k => {
    const q = bin.squads.find(s => s.squad === k.ks);
    const logo = q && q.team && q.team.logo;
    return `<div class="kf${seen.has(id(k)) ? "" : " in"}"><i style="background:${colourOf(k.ks)}"></i>` +
      (logo ? `<img src="${logo}">` : "") +
      `<div class="w"><b>${esc(binName(k.kn) || "?")}</b><span><em>ELIMINATED</em>${esc(binName(k.vn))}</span></div></div>`;
  }).join("");
}
function startBin(view, cfg, roster, animate){
  stopBin();
  const box = document.getElementById("mapbox");
  const cv = document.getElementById("binCanvas");
  const W = box.clientWidth || 700, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(W * dpr);
  const d = binData;
  const dur = Math.max(1, Number(d.duration || view.duration) || 1);
  // the Booyah route: the winners alone
  const winSq = ((view.squads || []).find(s => s.place === 1) || {}).squad;
  const picked = binView(cfg) === "booyah" && winSq != null ? new Set([winSq])
               : new Set((cfg.teams || []).map(Number));
  const bySq = {};
  (d.players || []).forEach(p => {
    if(picked.size && !picked.has(p.squad)) return;
    const meta = (view.squads || []).find(s => s.squad === p.squad) || {};
    const q = bySq[p.squad] || (bySq[p.squad] = { squad: p.squad, players: [], colour: colourOf(p.squad),
                                                 place: meta.place, team: teamFor(meta.teamName, roster), name: meta.teamName });
    q.players.push(p);
  });
  const css = getComputedStyle(document.body);
  bin = { d, view, cv, ctx: cv.getContext("2d"), W, dpr, dur, secs: binSecs(cfg), picked,
          squads: Object.values(bySq), cam: null, started: null, raf: 0, last: 0, still: !animate,
          mode: binView(cfg), map: binMap(view.image), font: css.fontFamily,
          next: css.getPropertyValue("--next").trim() || "#ffe97a",
          accent: css.getPropertyValue("--accent").trim() || "#f7941d" };
  // when the squads are down (the middle of their landings): before it, they are dropping
  bin.firstOn = binLandedBy(bin.squads.reduce((a, q) => a.concat(q.players), []));
  // 3D unless the dashboard says flat
  bin.tilt = cfg.bin3d === false ? 0 : BIN_TILT;
  // The plane's crossing. The files say where it flew, not when, so it
  // is given until shortly before the first squad touches down.
  bin.anim = ["stream", "booyah"].includes(bin.mode);
  bin.time = binTimeMap(d, view, bin.secs);
  // A photo shared by players of different squads is the folder's stand-in,
  // not a face: those players (and any with no photo) wear their team's
  // logo in their circle instead.
  bin.standIn = new Set();
  const bySquadOfPhoto = {};
  (d.players || []).forEach(p => {
    const i = (d.photoOf || {})[String(p.pid)];
    if(i == null) return;
    (bySquadOfPhoto[i] = bySquadOfPhoto[i] || new Set()).add(p.squad);
  });
  Object.entries(bySquadOfPhoto).forEach(([i, sq]) => { if(sq.size > 1) bin.standIn.add(Number(i)); });
  binClouds();
  if(bin.mode === "booyah") binBooyahPrep();
  bin.planeEnd = Math.max(45, Math.min(150, (isFinite(bin.firstOn) && bin.firstOn < 1e8 ? bin.firstOn : 105) - 15));
  // Where each squad dropped: the middle of where its players first stood
  // on the ground, and when (the middle of their landings) -- marked on
  // the map from that moment on.
  bin.squads.forEach(q => {
    const lands = q.players.map(p => {
      const k = p.airAt.indexOf(0);
      return k >= 0 ? [p.u[k], p.v[k], p.t[k]] : null;
    }).filter(Boolean);
    if(!lands.length) return;
    const ts = lands.map(l => l[2]).sort((a, c) => a - c);
    q.drop = { u: lands.reduce((a, l) => a + l[0], 0) / lands.length,
               v: lands.reduce((a, l) => a + l[1], 0) / lands.length,
               t: ts[Math.floor(ts.length / 2)] };
  });
  box.classList.add("bin");
  document.getElementById("clock").classList.remove("on");     // the HUD has its own
  const panel = document.getElementById("panel");
  const tick = now => {
    if(!bin) return;
    let t;
    const dt = bin.last ? Math.min(0.1, (now - bin.last) / 1000) : 1;
    if(!bin.anim || bin.still) t = bin.dur;
    else if(!panel.classList.contains("on")){ bin.started = null; t = 0; }
    else {
      if(bin.started == null){ bin.started = now; bin.pos = -BIN_LEAD; }
      else bin.pos += (bin.last ? dt : 0) * replaySpeed;
      t = bin.time.toMatch(Math.max(0, Math.min(bin.secs, bin.pos)));
      // the table's animations exist once the panel is up: matched to the speed
      if(bin.rateApplied !== replaySpeed) binTableRate();
    }
    bin.last = now;
    if(bin.anim) binFrame(t, dt, bin.started == null ? 0 : (now - bin.started) / 1000);
    else binStatic(now);

    // pictures are in -- except the 3D MapStream, whose camera keeps
    // circling the Booyah squad for as long as it is on air
    if(!bin.anim || bin.still || (t >= bin.dur && !bin.tilt)){
      bin.doneAt = bin.doneAt || now;
      if(now - bin.doneAt > 2500 && bin.map.ready) return;
    }

  };

}
// The boundary at time t: the circle the blue zone has closed to, sliding
// from one to the next while it closes. How long a close takes is not in
// the files, so it is given most of the wait before the next circle --
// the safe side: a player is never shown outside a zone they were in.
function binBoundary(zs, t, dur){
  let prev = null;
  for(let i = 0; i < zs.length; i++){
    const z = zs[i];
    if(z.announced == null || z.announced > t) break;
    const start = z.closing != null ? z.closing : z.announced;
    const nextAt = (zs[i + 1] && zs[i + 1].announced != null) ? zs[i + 1].announced : dur;
    const len = Math.max(20, Math.min(150, (nextAt - start) * 0.8));
    const f = t <= start ? 0 : Math.min(1, (t - start) / len);
    const to = { x: z.at[0] * 1000, y: z.at[1] * 1000, r: z.r * 1000 };
    const from = prev || { x: to.x, y: to.y, r: 1500 };
    const cur = { x: from.x + (to.x - from.x) * f, y: from.y + (to.y - from.y) * f, r: from.r + (to.r - from.r) * f };
    if(f < 1) return { cur, next: to, closing: f > 0 };
    prev = to;
  }
  return prev ? { cur: prev, next: null, closing: false } : null;
}
// The HUD across the top and the timeline across the bottom, as in the
// BIN tab: the camera frames what matters in the space between them.
const BIN_HUD = 72, BIN_TL = 54;
function binTarget(t, alive){
  const b = bin, zs = (b.view.zones || []);
  const room = (b.W - BIN_HUD - BIN_TL) / b.W;
  const fit = (x0, y0, x1, y1) => {
    const w = Math.max(90, x1 - x0, y1 - y0);
    return [(x0 + x1) / 2, (y0 + y1) / 2, Math.max(1, Math.min(3.2, 1000 / w * room))];
  };
  let tx = 500, ty = 500, tz = 1;
  if(b.picked.size && alive.length){
    // only the ticked teams: frame them where they are
    const us = alive.map(a => a[0]), vs = alive.map(a => a[1]);
    [tx, ty, tz] = fit(Math.min(...us) - 70, Math.min(...vs) - 70, Math.max(...us) + 70, Math.max(...vs) + 70);
  } else {
    // every team: the camera closes in with the zone
    const bd = binBoundary(zs, t, b.dur);
    if(bd && bd.cur.r < 900){
      const r = Math.max(bd.cur.r, bd.next ? bd.next.r : 0) * 1.12 + 25;
      [tx, ty, tz] = fit(bd.cur.x - r, bd.cur.y - r, bd.cur.x + r, bd.cur.y + r);
    }
  }
  const half = 500 / tz;
  return [Math.max(half, Math.min(1000 - half, tx)), Math.max(half, Math.min(1000 - half, ty)), tz];
}
// A squad's tag on the map: its short name, else its name cut to a tag --
// a full name over every pin is what made the map unreadable.
function binTag(q){
  const sh = q.team && q.team.shortName;

const BIN_TILT = 50 * Math.PI / 180;

/* THE CINEMATIC CAMERA. A broadcast map never sits still: it opens wide

   breathes -- a slow orbit and drift round the circle -- and at the end

   (critically damped: eased in and out, no overshoot), so a jump in where
   it should be -- a new circle -- is a glide, never a cut. */
function binSpring(o, k, to, w, dt){
  const v = o["v_" + k] || 0;

  pins.sort((m, n) => n.depth - m.depth);
  for(let pass = 0; pass < 5; pass++){
    for(let i = 0; i < pins.length; i++) for(let j = i + 1; j < pins.length; j++){
      const a = pins[i], c = pins[j], need = (a.R + c.R) * .95;
      const ax = a.x0 + a.dx, cx = c.x0 + c.dx;
      if(Math.abs(a.y0 - c.y0) > a.R + c.R || Math.abs(ax - cx) >= need) continue;
      const push = (need - Math.abs(ax - cx)) / 2 + .5, dir = ax <= cx ? 1 : -1;
      a.dx -= dir * push; c.dx += dir * push;

  pins.forEach(p => binPin(p.x0, p.y0, p.q, near, (near ? 12 : 8) * p.sc, p.win, p.sc, p.dx));
  // the plane, over everything on the ground -- and the sky over it
  binPlane(S, T);
  binSky(S, T, realSec);
  // who eliminated whom, as it happens: plates down the right
  const window_ = 3.5 * realSec;                   // ~3.5 real seconds on screen
  const feed = binOpts.feed === "off" ? [] : (b.d.kills || []).filter(k => k.t <= T && T - k.t < window_ &&

  binFeedBelow(feed);
  if(binOpts.feed === "map") feed.forEach((k, i) => {
    const y = BIN_HUD + 18 + i * 46, x = W - 270, w = 252;

    ctx.font = binFont(800, 11); ctx.fillStyle = b.accent; ctx.fillText("ELIMINATED", x + 15, y + 32);
    const ew = ctx.measureText("ELIMINATED ").width;

  const teams = Math.max(1, (b.view.squads || []).length - outBy);
  const elims = (b.d.kills || []).filter(k => k.t <= T).length;
  if(b.mode === "booyah"){
    const mine = (b.d.kills || []).filter(k => k.t <= T && k.ks === (b.squads[0] || {}).squad).length;

  const circle = (b.view.zones || []).filter(z => z.announced != null && z.announced <= T).length;
  const lab = circle ? "CIRCLE " + circle : (T < b.firstOn ? "DROP" : "PRE-CIRCLE");
  ctx.font = binFont(900, 13); binSpacing(1);
  const lw = ctx.measureText(lab).width + 26;
  binPlate(16, W - 40, lw, 24, b.accent, 7);
  ctx.fillStyle = "#101318"; ctx.fillText(lab, 28, W - 23); binSpacing(0);
  const T0 = 16 + lw + 22, T1 = W - 70, ty0 = W - 28, X = v => T0 + (T1 - T0) * Math.min(1, Math.max(0, v / b.dur));
  ctx.fillStyle = "rgba(255,255,255,.22)"; ctx.fillRect(T0, ty0 - 1.5, T1 - T0, 3);
  ctx.fillStyle = b.accent; ctx.fillRect(T0, ty0 - 1.5, X(T) - T0, 3);
  (b.view.zones || []).forEach(z => {
    if(z.announced == null) return;
    const x = X(z.announced);
    ctx.save(); ctx.translate(x, ty0); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = z.announced <= T ? b.accent : "rgba(255,255,255,.6)"; ctx.fillRect(-3.5, -3.5, 7, 7);
    ctx.restore();

  ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(X(T), ty0, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.font = binFont(800, 12); ctx.fillStyle = "#aab4c5"; ctx.textAlign = "right"; ctx.fillText(mmss(b.dur), W - 18, ty0 + 4);
  ctx.textAlign = "left";
}

// Map units to the screen, for a camera {x, y, z}: the map centred between
// the HUD and the timeline. Flat (tilt 0), or tilted back by `tilt` and
// turned by `yaw`: a pinhole camera looking down at the camera's point
// from far enough that the perspective stays the same at any zoom.
// S(u, v, h) is a point (h up off the map); S.k(u, v) is screen pixels per
// map unit there; S.depth orders things far to near.
function binScreen(cam, tilt, yaw){
  const W = bin.W, cy = BIN_HUD + (W - BIN_HUD - BIN_TL) / 2, s0 = W / 1000 * cam.z;
  let S;
  if(!tilt){
    S = (u, v) => [(u - cam.x) * s0 + W / 2, (v - cam.y) * s0 + cy];
    S.k = () => s0;
    S.depth = (u, v) => -v;
  } else {
    const sn = Math.sin(tilt), cs = Math.cos(tilt), d = 1500 / cam.z, F = s0 * d, near = d * .2;
    const cw = Math.cos(yaw || 0), sw = Math.sin(yaw || 0);
    const rot = (u, v) => { const x = u - cam.x, y = v - cam.y; return [x * cw - y * sw, x * sw + y * cw]; };
    S = (u, v, h) => {
      const r = rot(u, v), hh = h || 0, dep = d - sn * r[1] - cs * hh;
      if(dep < near) return [NaN, NaN];
      return [W / 2 + F * r[0] / dep, cy + F * (cs * r[1] - sn * hh) / dep];
    };
    S.k = (u, v) => F / Math.max(near, d - sn * rot(u, v)[1]);
    S.depth = (u, v) => d - sn * rot(u, v)[1];
    // the ground row (in the camera's turned frame) seen at screen height Y,
    // its scale, and the screen height of a ground row
    S.rowY = Y => (Y - cy) * d / Math.max(1e-6, F * cs + (Y - cy) * sn);
    S.kRow = y => F / Math.max(near, d - sn * y);
    S.yOfRow = y => cy + F * cs * y / Math.max(near, d - sn * y);
    S.yaw = yaw || 0;
  }
  S.s = s0; S.tilt = tilt || 0; S.cam = cam;
  return S;
}
// The map under everything. Flat, drawn whole. Tilted, the map is first
// turned into the camera's frame on a ground canvas, then laid down in
// strips, each as wide as its distance makes it -- the classic way to draw
// a floor, and it keeps the turn and the tilt one picture.
function binBase(S){
  const b = bin, ctx = b.ctx, W = b.W;
  ctx.fillStyle = "#05070b"; ctx.fillRect(0, 0, W, W);
  if(!b.map.ready) return;
  const img = b.map.canvas;
  if(!S.tilt){ const [x0, y0] = S(0, 0); ctx.drawImage(img, x0, y0, 1000 * S.s, 1000 * S.s); return; }
  const yTop = S.rowY(0), yBot = S.rowY(W);
  if(!(yBot > yTop)) return;
  const halfX = (W / 2) / S.kRow(yTop) + 4, wU = 2 * halfX, hU = yBot - yTop;
  const G = 2048;
  const g = b.ground || (b.ground = Object.assign(document.createElement("canvas"), { width: G, height: G }));
  const gs = Math.min(S.kRow(yBot), G / Math.max(wU, hU));
  const gw = Math.min(G, Math.ceil(wU * gs)), gh = Math.min(G, Math.ceil(hU * gs));
  const gc = g.getContext("2d");
  gc.setTransform(1, 0, 0, 1, 0, 0);
  gc.fillStyle = "#05070b"; gc.fillRect(0, 0, gw + 2, gh + 2);
  // (u, v) -> turned frame -> ground canvas pixels
  gc.setTransform(gs, 0, 0, gs, halfX * gs, -yTop * gs);
  gc.rotate(S.yaw);
  gc.translate(-S.cam.x, -S.cam.y);
  gc.drawImage(img, 0, 0, 1000, 1000);
  const N = 200, step = hU / N;
  for(let i = 0; i < N; i++){
    const r0 = yTop + i * step, r1 = r0 + step;
    const Y0 = S.yOfRow(r0), Y1 = S.yOfRow(r1), k = S.kRow((r0 + r1) / 2);
    ctx.drawImage(g, 0, (r0 - yTop) * gs, gw, step * gs, W / 2 - k * halfX, Y0, 2 * halfX * k, Y1 - Y0 + .7);
  }
}
// A circle on the map as a path (tilted, it is an oval).
function binRing(S, cx, cy, r, keep){
  const ctx = bin.ctx;
  if(!keep) ctx.beginPath();
  if(!S.tilt){ const [x, y] = S(cx, cy); ctx.moveTo(x + r * S.s, y); ctx.arc(x, y, r * S.s, 0, Math.PI * 2); return; }
  let pen = false;
  for(let i = 0; i <= 96; i++){
    const a = i / 96 * Math.PI * 2, [x, y] = S(cx + r * Math.cos(a), cy + r * Math.sin(a));
    if(!isFinite(x)){ pen = false; continue; }
    if(pen) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    pen = true;
  }
  ctx.closePath();
}
// One player's route on the ground between two moments.
function binRoute(ctx, S, p, from, to){
  ctx.beginPath();
  let pen = false;
  for(let k = 0; k < p.t.length; k++){
    const tk = p.t[k];
    if(tk < from) continue;
    if(tk > to) break;
    if(p.airAt[k]){ pen = false; continue; }
    if(p.cutAt.has(k)) pen = false;
    const [x, y] = S(p.u[k], p.v[k]);
    if(!isFinite(x)){ pen = false; continue; }
    if(pen) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    pen = true;
  }
  if(to < 1e8){
    const a = binAt(p, to);
    if(pen && a && !a[2]){ const [x, y] = S(a[0], a[1]); if(isFinite(x)) ctx.lineTo(x, y); }
  }
  ctx.stroke();
}
// A squad's pin: its logo in a ring standing above (x0, y0) -- moved `dx`
// sideways when another would sit on it -- its tag over it, its shadow on
// the map. `sc` sizes it for its distance in the 3D view.
function binPin(x0, y0, q, near, pr, win, sc, dx){
  const b = bin, ctx = b.ctx, W = b.W;
  sc = sc || 1; dx = dx || 0;
  const R = (near ? 24 : 18) * (win ? 1.35 : 1) * sc, px = x0 + dx, py = y0 - (pr || 0) - R - 14 * sc;
  if(px < -40 || py < -60 || px > W + 40 || y0 > W + 40) return;
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.beginPath(); ctx.ellipse(x0, y0 + 2, R * .55, R * .2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = q.colour; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px, py + R); ctx.lineTo(x0, y0 - (pr || 0)); ctx.stroke();
  if(win){ ctx.shadowColor = b.next; ctx.shadowBlur = 18; }
  ctx.fillStyle = "#0b0f14"; ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  const logo = q.team && binImg(q.team.logo);
  if(logo){
    ctx.save(); ctx.beginPath(); ctx.arc(px, py, R - 3, 0, Math.PI * 2); ctx.clip();
    ctx.drawImage(logo, px - R + 3, py - R + 3, (R - 3) * 2, (R - 3) * 2); ctx.restore();
  } else {
    const tg = binTag(q).replace(/[^A-Z0-9]/g, "").slice(0, 3);
    ctx.font = binFont(900, Math.round(R * .62)); ctx.fillStyle = q.colour; ctx.textAlign = "center";
    ctx.fillText(tg, px, py + R * .22); ctx.textAlign = "left";
  }
  ctx.strokeStyle = win ? b.next : q.colour; ctx.lineWidth = win ? 3.5 : 3;
  ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.stroke();
  const tag = binTag(q);
  ctx.font = binFont(900, Math.round((near || win ? 15 : 13) * Math.min(1.2, sc))); ctx.textAlign = "center";
  ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.85)"; ctx.strokeText(tag, px, py - R - 6);
  ctx.fillStyle = win ? b.next : "#ffffff"; ctx.fillText(tag, px, py - R - 6);
  ctx.textAlign = "left";
}
// The plates along the top: the map's name on the accent tag, the clock
// (or the view's title) under it, and the numbers on the right.
function binHud(big, stats){
  const b = bin, ctx = b.ctx, W = b.W;
  const map = String(b.view.mapName || "").toUpperCase();
  ctx.font = binFont(900, 13); binSpacing(2);
  const mw = ctx.measureText(map).width + 26;
  binPlate(16, 14, mw, 24, b.accent, 7);
  ctx.fillStyle = "#101318"; ctx.fillText(map, 28, 31); binSpacing(0);
  const clock = /^\d/.test(big);
  ctx.font = binFont(900, clock ? 40 : 28);
  const bw = ctx.measureText(big).width + 30;
  binPlate(12, 42, bw, clock ? 44 : 36, "rgba(8,11,17,.86)", 9);
  ctx.fillStyle = "#ffffff"; ctx.fillText(big, 24, clock ? 79 : 71);
  ctx.textAlign = "center";
  stats.forEach(([n, lab], i) => {
    const w = 112, x = W - 16 - (stats.length - i) * (w + 8);
    binPlate(x, 14, w, 56, "rgba(8,11,17,.86)", 8);
    ctx.fillStyle = b.accent; ctx.fillRect(x + 8, 66, w - 16, 3);
    ctx.font = binFont(900, 30); ctx.fillStyle = "#ffffff"; ctx.fillText(String(n), x + w / 2 + 4, 46);
    ctx.font = binFont(800, 10); binSpacing(1); ctx.fillStyle = "#aab4c5"; ctx.fillText(lab, x + w / 2 + 2, 61); binSpacing(0);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="ff_embed.js"></script>
<title>Free Fire MVP</title>
<link rel="stylesheet" href="ff_theme.css">
<style>
  /* MATCH MVP -- the standout player of the post-match game (state.postGame:
     the newest result file, or the game picked in Post-Match). Picked by the
     engine: most kills, then knocks, then survival; the MVP override wins.
     Drawn in the event's look (ff_theme.css): SS3 on its own frame, ARROW
     on the green board. */

  /* ---- SS3 ---- */
  .ss3 #photoBox{left:300px;top:352px;width:540px;height:530px;overflow:hidden;}
  .ss3 #photo{position:absolute;left:0;bottom:70px;width:540px;height:470px;object-fit:contain;object-position:center bottom;}
  .ss3 #logo{left:318px;top:368px;width:120px;height:120px;object-fit:contain;}
  .ss3 #nameBar{left:300px;top:812px;width:540px;height:70px;font-size:44px;}
  .ss3 #teamTag{left:620px;top:372px;width:204px;height:40px;font-size:22px;justify-content:flex-end;}
  .ss3 #stats{left:880px;top:392px;width:740px;height:490px;}
  .ss3 .srow{position:absolute;left:30px;width:680px;height:78px;}
  .ss3 .srow .lab{position:absolute;left:0;top:7px;width:340px;height:64px;font-size:30px;}
  .ss3 .srow .val{position:absolute;left:370px;top:0;width:310px;height:78px;font-size:60px;justify-content:flex-start;}

  /* ---- ARROW ---- */
  .arrow #photoBox{left:210px;top:236px;width:560px;height:690px;overflow:hidden;}
  .arrow #photo{position:absolute;left:6px;bottom:96px;width:548px;height:588px;object-fit:contain;object-position:center bottom;}
  .arrow #logo{left:232px;top:258px;width:120px;height:120px;object-fit:contain;}
  .arrow #nameBar{left:210px;top:842px;width:560px;height:84px;font-size:48px;}
  .arrow #teamTag{left:520px;top:262px;width:230px;height:40px;font-size:24px;justify-content:flex-end;}
  .arrow #stats{left:830px;top:236px;width:880px;height:690px;}
  .arrow .srow{position:absolute;left:24px;width:832px;height:104px;}
  .arrow .srow .lab{position:absolute;left:0;top:14px;width:440px;height:76px;font-size:36px;padding-left:26px;justify-content:flex-start;
                    clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%);}
  .arrow .srow .val{position:absolute;left:470px;top:0;width:360px;height:104px;font-size:70px;justify-content:flex-start;}

  .nodata{position:absolute;left:0;top:520px;width:1920px;text-align:center;font-family:'SMXB',Arial,sans-serif;font-size:30px;color:#fff;
          text-shadow:0 2px 8px rgba(0,0,0,.8);}
</style>
</head>
<body class="ss3">
<div class="ff-stage" id="stage">
  <div class="ff-frame fade"></div>
  <div class="ff-title fade" id="title" style="animation-delay:.1s">MATCH MVP</div>
  <div class="ff-round ctr fade" id="round" style="animation-delay:.25s"></div>
  <div class="abs ff-zebra rise" id="photoBox" style="animation-delay:.3s"><img id="photo" alt=""></div>
  <img class="abs pop" id="logo" alt="" style="animation-delay:.55s">
  <div class="abs ff-text left fade" id="teamTag" style="animation-delay:.6s"></div>
  <div class="abs ff-yellow ctr fromL" id="nameBar" style="animation-delay:.5s"></div>
  <div class="abs ff-black fade" id="stats" style="animation-delay:.45s"></div>
  <div class="nodata" id="nodata"></div>
</div>
<script src="ff_theme.js"></script>
<script>
const PREVIEW = new URLSearchParams(location.search).get("preview") === "1";
const photoCache = {};
let lastSig = "", lastState = null;

const ROWS = [
  ["ELIMINATIONS", m => m.kills, v => ffTwo(v)],
  ["KNOCKS", m => m.knocks, v => ffTwo(v)],
  ["HEADSHOTS", m => m.headshots, v => ffTwo(v)],
  ["SURVIVAL TIME", m => m.survival, v => ffMmss(v)],
  ["TEAM FINISH", m => m.rank, v => "#" + v],
];

function render(st){
  lastState = st;
  const theme = ffApplyTheme(st);
  const visible = PREVIEW || !!(st.display || {}).mvpVisible;
  const stage = document.getElementById("stage");
  if(!visible){ stage.classList.remove("on"); lastSig = ""; return; }
  const g = (st.postGame || {}).game || {};
  const m = g.mvp || null;
  const roster = st.roster || {};
  const ev = st.event || {};
  const sig = JSON.stringify([theme, m, g.matchId, g.mapName, (st.postGame || {}).label, ev.roundName,
                              m && photoCache[m.uid || m.name], ((roster.teams) || []).map(t => [t.name, !!t.logo])]);
  if(sig === lastSig){ stage.classList.add("on"); return; }
  const replay = !stage.classList.contains("on");
  lastSig = sig;
  ffFitTitle(document.getElementById("title"));

  document.getElementById("nodata").textContent = m ? "" : (g.error || "No game to show yet.");
  const label = (st.postGame || {}).label || "";
  ffSetText(document.getElementById("round"), [label, g.mapName].filter(Boolean).join(" · ") || ev.roundName || "", theme === "ss3" ? 320 : 520, 12);
  const rp = m ? ffRosterPlayer(m.uid, m.name, roster) : null;
  const team = m ? (ffTeam(m.teamName, roster) || (rp && rp.team)) : null;
  const photo = document.getElementById("photo");
  const src = m ? (photoCache[m.uid || m.name] || (rp && rp.player.photo) || roster.defaultPlayerPhoto || "") : "";
  if(src){ if(photo.getAttribute("src") !== src) photo.src = src; photo.style.visibility = ""; } else photo.style.visibility = "hidden";
  const logo = document.getElementById("logo");
  if(team && team.logo){ logo.src = team.logo; logo.style.visibility = ""; } else logo.style.visibility = "hidden";
  ffSetText(document.getElementById("nameBar"), m ? ((rp && (rp.player.displayIgn || rp.player.ign)) || m.name) : "", theme === "ss3" ? 500 : 520, 18);
  ffSetText(document.getElementById("teamTag"), m ? ((team && (team.shortName || team.name)) || m.teamName || "") : "", 200, 12);

  const stats = document.getElementById("stats");
  stats.innerHTML = "";
  const pitch = theme === "ss3" ? 92 : 132;
  const top = theme === "ss3" ? 22 : 20;
  ROWS.forEach(([label, get, fmt], i) => {
    const row = document.createElement("div");
    row.className = "srow fromR";
    row.style.top = (top + i * pitch) + "px";
    row.style.animationDelay = (0.6 + i * 0.1).toFixed(2) + "s";
    row.innerHTML = `<div class="lab ff-label ctr">${label}</div><div class="val ff-num left"></div>`;
    stats.appendChild(row);
    const v = m ? get(m) : null;
    const node = row.querySelector(".val");
    if(v == null) node.textContent = "--";
    else ffCountUp(node, v, fmt, 0.75 + i * 0.1);
  });
  if(replay){ stage.classList.remove("on"); void stage.offsetWidth; }
  stage.classList.add("on");
}

ffConnect("freefire_mvp", render, msg => {
  if(msg.type === "postgame_photos"){
    Object.assign(photoCache, msg.photos || {});
    if(lastState){ lastSig = ""; render(lastState); }
  }
});
</script>
</body>
</html>

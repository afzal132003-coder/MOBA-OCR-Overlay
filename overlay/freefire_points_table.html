<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Fire Overall Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /*
    Overall standings -- an OBS Browser Source driven by freefire_engine.py's
    computed standings, drawn over the operator's own artwork
    (assets/freefire/overall standings.png).

    Geometry is MEASURED off that artwork rather than transcribed from a
    design file: its gold header labels give the column centres, and the
    twelve violet row plates give the row centres. An earlier version of
    this page was built from a vMix .gtzip template instead, and converting
    that template's coordinates put every row progressively out of
    alignment -- the template renders the background through a scale the
    numbers don't describe. Measuring the artwork is the only version that
    lines up, so it's what this uses.

    Rank numbers are drawn here (unlike the older artwork, this design
    leaves the "#" column empty).
  */

  html, body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px;
    font-family:'Poppins','Segoe UI',Arial,sans-serif;
  }

  #stage{
    position:relative; width:1920px; height:1080px;
    opacity:0; transition:opacity 0.45s ease;
  }
  #stage.visible{ opacity:1; }

  .bg{ position:absolute; top:0; left:0; width:1920px; height:1080px; }

  .cell{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    color:#ffffff;
    font-weight:700;
    font-size:26px;
    line-height:1;
    white-space:nowrap;
    text-shadow:0 2px 4px rgba(0,0,0,0.55);
  }
  .cell.rank{ font-size:27px; color:#ffc21f; }
  /* Team names are left-aligned on their plate and clipped rather than
     shrunk, so every row keeps one consistent type size no matter how long
     a sponsor-laden name is. */
  .cell.name{
    justify-content:flex-start;
    overflow:hidden; text-overflow:ellipsis; display:block;
  }
</style>
</head>
<body>

<div id="stage">
  <img class="bg" id="bg" src="assets/freefire/overall standings.png" alt="">
</div>

<script>
const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=freefire_points_table"
  : "ws://localhost:8765?page=freefire_points_table";

// Column centres, measured from the artwork's own gold header labels.
const COL_CENTRE = {
  rank: 407,
  matches: 831,
  booyah: 986,
  placement: 1147,
  kills: 1307,
  total: 1466,
};
// The team-name plate runs from the rank column to where MATCHES PLAYED
// begins; text is inset slightly so it doesn't touch the plate's edge.
const NAME_X = 470;
const NAME_W = 285;
const NUM_W = 150;

// Row centres, from the twelve violet plates in the artwork.
const ROW_CENTRE = [314, 376, 439, 500, 562, 625, 687, 749, 812, 873, 936, 998];
const ROW_H = 44;
const TEAMS = ROW_CENTRE.length;

const stage = document.getElementById("stage");
ROW_CENTRE.forEach((cy, i) => {
  const top = cy - ROW_H / 2;
  const mk = (field, left, width, cls) => {
    const el = document.createElement("div");
    el.id = `pt-${i}-${field}`;
    el.className = "cell" + (cls ? " " + cls : "");
    el.style.left = left + "px";
    el.style.top = top + "px";
    el.style.width = width + "px";
    el.style.height = ROW_H + "px";
    if(cls === "name") el.style.lineHeight = ROW_H + "px";
    stage.appendChild(el);
  };
  mk("rank", COL_CENTRE.rank - NUM_W / 2, NUM_W, "rank");
  mk("name", NAME_X, NAME_W, "name");
  ["matches", "booyah", "placement", "kills", "total"].forEach(f => {
    mk(f, COL_CENTRE[f] - NUM_W / 2, NUM_W);
  });
});

function setText(i, field, value){
  const el = document.getElementById(`pt-${i}-${field}`);
  if(el) el.textContent = value;
}

function applyState(state){
  const ff = state || {};
  document.getElementById("stage").classList.toggle(
    "visible", !!(ff.display && ff.display.pointsTableVisible)
  );

  const standings = ff.standings || [];
  for(let i = 0; i < TEAMS; i++){
    const row = standings[i];
    if(!row){
      // Blank, not zeros. An unused slot means "no team here"; printing 00s
      // would read as a team that played and scored nothing. The rank
      // number goes too, so the table visibly ends where the field does.
      ["rank","name","matches","booyah","placement","kills","total"]
        .forEach(f => setText(i, f, ""));
      continue;
    }
    setText(i, "rank", String(i + 1).padStart(2, "0"));
    // Short name preferred -- the plate fits roughly 14 characters, and a
    // full sponsor-laden name would clip.
    setText(i, "name", (row.shortName || row.teamName || "").toUpperCase());
    setText(i, "matches", row.matches || 0);
    setText(i, "booyah", row.booyahs || 0);
    setText(i, "placement", row.placementPoints || 0);
    setText(i, "kills", row.totalKills || 0);
    setText(i, "total", row.totalPoints || 0);
  }
}

let ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") applyState(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>

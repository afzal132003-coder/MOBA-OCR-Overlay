<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Fire Points Table</title>
<style>
  /* The points table and the match scoreboard now share ONE browser
     source -- freefire_scoreboard.html carries both, each with its own
     push/pull control, only one up at a time.

     This file stays as a forwarder rather than being deleted, because an
     OBS source already pointing at it would otherwise go blank mid-event
     with no obvious cause. The query string carries the relay and token,
     so it has to be passed along; location.replace keeps the redirect out
     of history, which matters if anyone ever opens this in a real tab. */
  html, body{ margin:0; padding:0; background:transparent; }
</style>
</head>
<body>
<script>
location.replace("freefire_scoreboard.html" + location.search);
</script>
</body>
</html>

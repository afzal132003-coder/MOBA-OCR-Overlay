<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Fire Max Scoreboard Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /*
    Matchwise standings, drawn over the operator's own artwork
    (assets/freefire/postmatch-gamestats.png). This replaces the earlier
    CSS-drawn placeholder, which existed only because no artwork had been
    supplied yet -- its own note said to swap it for the real thing once
    reference art arrived, which is what this is.

    Geometry is MEASURED off that artwork (its gold header labels give the
    column centres, its twelve violet plates give the row centres) rather
    than transcribed from a design file. On the sibling points-table page,
    converting coordinates out of a vMix template instead of measuring put
    every row progressively out of alignment, so this doesn't repeat it.

    The artwork's table carries four columns -- #, TEAM NAME, KILLS,
    TOTAL -- which both display modes can fill, so the dashboard's existing
    match/overall toggle still works: "match" shows the latest committed
    match's own result, "overall" shows cumulative standings, same columns
    either way.
  */

  html, body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px;
    font-family:'Poppins','Segoe UI',Arial,sans-serif;
  }

  #stage{
    position:relative; width:1920px; height:1080px;
    opacity:0; transition:opacity 0.45s ease;
  }
  #stage.visible{ opacity:1; }

  .bg{ position:absolute; top:0; left:0; width:1920px; height:1080px; }

  .cell{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    color:#ffffff; font-weight:700; font-size:25px; line-height:1;
    white-space:nowrap;
    text-shadow:0 2px 4px rgba(0,0,0,0.55);
  }
  .cell.rank{ color:#ffc21f; }
  .cell.name{
    justify-content:flex-start;
    overflow:hidden; text-overflow:ellipsis; display:block;
  }
</style>
</head>
<body>

<div id="stage">
  <img class="bg" id="bg" src="assets/freefire/postmatch-gamestats.png" alt="">
</div>

<script>
const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=freefire_scoreboard"
  : "ws://localhost:8765?page=freefire_scoreboard";

// Measured off the artwork's own header labels and row plates.
const COL_CENTRE = { rank: 1103, kills: 1534, total: 1667 };
const NAME_X = 1150;
const NAME_W = 330;
const NUM_W = 140;
const ROW_CENTRE = [351, 408, 465, 520, 577, 634, 691, 748, 805, 862, 919, 976];
const ROW_H = 44;
const TEAMS = ROW_CENTRE.length;

const stage = document.getElementById("stage");
ROW_CENTRE.forEach((cy, i) => {
  const top = cy - ROW_H / 2;
  const mk = (field, left, width, cls) => {
    const el = document.createElement("div");
    el.id = `sb-${i}-${field}`;
    el.className = "cell" + (cls ? " " + cls : "");
    el.style.left = left + "px";
    el.style.top = top + "px";
    el.style.width = width + "px";
    el.style.height = ROW_H + "px";
    if(cls === "name") el.style.lineHeight = ROW_H + "px";
    stage.appendChild(el);
  };
  mk("rank", COL_CENTRE.rank - NUM_W / 2, NUM_W, "rank");
  mk("name", NAME_X, NAME_W, "name");
  mk("kills", COL_CENTRE.kills - NUM_W / 2, NUM_W);
  mk("total", COL_CENTRE.total - NUM_W / 2, NUM_W);
});

function setText(i, field, value){
  const el = document.getElementById(`sb-${i}-${field}`);
  if(el) el.textContent = value;
}

function applyFreefire(ff){
  const mode = (ff.display && ff.display.scoreboardMode) || "match";
  const latest = ff.matches && ff.matches.length ? ff.matches[ff.matches.length - 1] : null;

  let rows;
  if(mode === "overall"){
    rows = (ff.standings || []).map((r, i) => ({
      rank: i + 1,
      name: r.shortName || r.teamName,
      kills: r.totalKills,
      total: r.totalPoints,
    }));
  } else {
    // Sorted by the game's own rank rather than trusting file order --
    // the result file lists teams in an order that doesn't always match
    // their placement.
    rows = latest ? latest.teams.slice()
      .sort((a, b) => (a.rank || 99) - (b.rank || 99))
      .map(t => ({
        rank: t.rank,
        name: t.shortName || t.teamName,
        kills: t.killScore,
        total: t.totalScore,
      })) : [];
  }

  for(let i = 0; i < TEAMS; i++){
    const row = rows[i];
    if(!row){
      // Blank, not zeros -- an unused slot means "no team here", and 0s
      // would read as a team that played and scored nothing.
      ["rank","name","kills","total"].forEach(f => setText(i, f, ""));
      continue;
    }
    setText(i, "rank", String(row.rank ?? (i + 1)).padStart(2, "0"));
    setText(i, "name", (row.name || "").toUpperCase());
    setText(i, "kills", row.kills ?? 0);
    setText(i, "total", row.total ?? 0);
  }

  // Nothing is drawn on the left-hand BOOYAH plate: the artwork already
  // has "BOOYAH" printed there, and overlaying the winning team's name on
  // top of it just collides with the baked text. If that plate is meant to
  // carry the winner's name, the word needs removing from the PNG first --
  // that's an artwork decision, not something to paper over here.

  // Defaults to VISIBLE. This page had no push/pull control before, so
  // gating it on a flag that isn't set yet would leave it permanently
  // blank on an existing setup -- "!== false" means it keeps showing until
  // someone actively pulls it down.
  document.getElementById("stage").classList.toggle(
    "visible", !(ff.display && ff.display.scoreboardVisible === false)
  );
}

let ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") applyFreefire(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>

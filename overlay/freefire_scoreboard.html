<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Fire Max Scoreboard Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /*
    ONE browser source, two graphics.
    ---------------------------------------------------------------
    This page carries both the match/overall scoreboard and the overall
    points table, so OBS needs a single source for the two of them instead
    of a pair that have to be kept in step. Each has its own stage and its
    own push/pull flag from the dashboard, and only one is ever up at a
    time -- the engine pulls the other down when either is pushed, because
    on one source they would otherwise sit on top of each other.

    overlay/freefire_points_table.html still exists and forwards here, so
    an OBS source already pointing at it keeps working.

    Geometry for both is MEASURED off the artwork rather than transcribed
    from a design file. An earlier attempt to convert coordinates out of a
    vMix template put every row progressively out of alignment, so neither
    of these repeats it.

      Scoreboard: the artwork's gold header labels give the column
      centres, its twelve violet plates give the row centres. Four columns
      -- #, TEAM NAME, KILLS, TOTAL -- which both display modes fill, so
      the dashboard's match/overall toggle works either way.

      Points table: two blocks of six, which is what the CLT design draws.
      Header plate at y 348..411, row rules at y 488/567/646/725/805/885,
      blocks at x 93..949 and x 970..1826, column centres taken from the
      header labels so each number sits under the word naming it. Its
      background follows the selected graphics package; the scoreboard's
      does not yet, because no package has supplied a blank for it.
  */

  html, body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px;
    font-family:'Poppins','Segoe UI',Arial,sans-serif;
  }

  .stage{
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    opacity:0; transition:opacity 0.45s ease;
    pointer-events:none;
  }
  .stage.visible{ opacity:1; }

  .bg{ position:absolute; top:0; left:0; width:1920px; height:1080px; }

  .cell{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    color:#ffffff; font-weight:700; font-size:25px; line-height:1;
    white-space:nowrap;
    text-shadow:0 2px 4px rgba(0,0,0,0.55);
  }
  .cell.rank{ color:#ffc21f; }
  .cell.name{
    justify-content:flex-start;
    overflow:hidden; text-overflow:ellipsis; display:block;
  }

  /* The points table's own type: gold on black plates, and no rank cell --
     01..12 are printed in that artwork already. */
  #pt-stage .cell{
    color:#ffc400; font-weight:800; font-size:25px;
    font-variant-numeric:tabular-nums; letter-spacing:.3px;
    text-shadow:none;
  }
  /* Sits in the gap the artwork leaves after "GRAND FINALS -", so the
     table says which game the standings run to. Measured: that subtitle
     occupies y 242..276 and ends at x 955. Italic and gold to match the
     word it continues. */
  #pt-after{
    position:absolute; left:985px; top:242px; height:34px;
    display:flex; align-items:center;
    color:#ffc400; font-weight:800; font-style:italic; font-size:29px;
    letter-spacing:.5px; white-space:nowrap;
  }
  /* Champion Rush emblem, shown beside an activated team's name. The
     artwork comes from the selected package as champion_rush.png; if a
     package hasn't supplied one the image simply fails to load and the
     name sits where it always did, rather than leaving a hole. */
  .badge{
    position:absolute; width:26px; height:26px;
    object-fit:contain; display:none;
  }
  .badge.on{ display:block; }
  #pt-stage .cell.name{
    justify-content:flex-start; display:flex;
    font-size:23px; text-transform:uppercase; line-height:1.05;
    white-space:normal; overflow:hidden; text-overflow:clip;
  }
  /* Team logo, sitting inside the name cell just before the text -- NOT
     the same slot as the Champion Rush badge, which sits further left,
     outside the cell entirely. A team with no logo on file leaves this
     empty rather than showing a broken-image icon. */
  /* Sized against each row's own height rather than a flat pixel value
     (46px on the points table's 62px rows, 34px on the scoreboard's 44px
     rows) -- both come out to roughly 3/4 of the row, which is what makes
     a logo actually read next to text this size instead of disappearing
     beside it. */
  .team-logo{
    position:absolute; object-fit:contain; display:none;
  }
  .team-logo.on{ display:block; }

  /* Map-by-map strip under the points table: which map each game was
     played on, and the Booyah team's logo once that game is committed --
     blank until then, not a guess. Placeholder styling (a plain dark
     strip) until a package supplies its own artwork for this. */
  #pt-maps{
    position:absolute; left:93px; top:952px; width:1733px; height:100px;
    display:flex; gap:8px;
  }
  .pt-map{
    flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:6px; background:rgba(10,13,24,0.55);
    border-radius:8px; padding:8px 4px;
  }
  .pt-map .mapLogo{
    width:36px; height:36px; object-fit:contain; display:none;
  }
  .pt-map .mapLogo.on{ display:block; }
  .pt-map .mapName{
    color:#ffc400; font-weight:800; font-size:15px; letter-spacing:.5px;
    text-transform:uppercase; text-align:center; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
</style>
</head>
<body>

<div class="stage" id="sb-stage">
  <img class="bg" id="sb-bg" src="assets/freefire/postmatch-gamestats.png" alt="">
</div>

<div class="stage" id="pt-stage">
  <img class="bg" id="pt-bg" alt="">
  <div id="pt-after"></div>
  <div id="pt-maps"></div>
</div>

<script>
const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=freefire_scoreboard"
  : "ws://localhost:8765?page=freefire_scoreboard";

/* ---------- scoreboard ---------- */
const SB_COL = { rank: 1103, kills: 1534, total: 1667 };
const SB_NAME_X = 1150;
const SB_NAME_W = 330;
const NUM_W = 140;
const SB_ROW_CENTRE = [351, 408, 465, 520, 577, 634, 691, 748, 805, 862, 919, 976];
const SB_ROW_H = 44;
const TEAMS = SB_ROW_CENTRE.length;

const sbStage = document.getElementById("sb-stage");
SB_ROW_CENTRE.forEach((cy, i) => {
  const top = cy - SB_ROW_H / 2;
  const mk = (field, left, width, cls) => {
    const el = document.createElement("div");
    el.id = "sb-" + i + "-" + field;
    el.className = "cell" + (cls ? " " + cls : "");
    el.style.left = left + "px";
    el.style.top = top + "px";
    el.style.width = width + "px";
    el.style.height = SB_ROW_H + "px";
    if(cls === "name") el.style.lineHeight = SB_ROW_H + "px";
    sbStage.appendChild(el);
  };
  mk("rank", SB_COL.rank - NUM_W / 2, NUM_W, "rank");
  // Reserved width = left padding + logo + gap before the text, so the
  // logo never crowds either the row's left edge or the name.
  // Tightened after checking against the operator's own reference: a
  // 10-12px gap read as the logo floating apart from the name instead of
  // sitting fitted against it.
  const sbLogoSize = 34, sbLogoPad = 6, sbLogoGap = 6;
  const sbLogoReserve = sbLogoPad + sbLogoSize + sbLogoGap;
  mk("name", SB_NAME_X + sbLogoReserve, SB_NAME_W - sbLogoReserve, "name");
  mk("kills", SB_COL.kills - NUM_W / 2, NUM_W);
  mk("total", SB_COL.total - NUM_W / 2, NUM_W);
  const sbLogo = document.createElement("img");
  sbLogo.className = "team-logo";
  sbLogo.id = "sb-" + i + "-logo";
  sbLogo.style.left = (SB_NAME_X + sbLogoPad) + "px";
  sbLogo.style.top = (cy - sbLogoSize / 2) + "px";
  sbLogo.style.width = sbLogoSize + "px";
  sbLogo.style.height = sbLogoSize + "px";
  sbStage.appendChild(sbLogo);
  const sbBadge = document.createElement("img");
  sbBadge.className = "badge";
  sbBadge.id = "sb-" + i + "-badge";
  sbBadge.style.left = (SB_NAME_X - 30) + "px";
  sbBadge.style.top = (cy - 13) + "px";
  sbStage.appendChild(sbBadge);
});

/* ---------- points table ---------- */
const PT_ROW_CENTRE = [450, 528, 607, 686, 766, 846];
const PT_ROW_H = 62;
const PT_BLOCKS = [
  { name: 200,  nameW: 178, matches: 430,  booyah: 588,  finishes: 760,  total: 902  },
  { name: 1072, nameW: 178, matches: 1302, booyah: 1460, finishes: 1632, total: 1773 },
];
const PT_PER_BLOCK = PT_ROW_CENTRE.length;

const ptStage = document.getElementById("pt-stage");
PT_BLOCKS.forEach((col, b) => {
  PT_ROW_CENTRE.forEach((cy, r) => {
    const i = b * PT_PER_BLOCK + r;
    const top = cy - PT_ROW_H / 2;
    const mk = (field, left, width, cls) => {
      const el = document.createElement("div");
      el.id = "pt-" + i + "-" + field;
      el.className = "cell" + (cls ? " " + cls : "");
      el.style.left = left + "px";
      el.style.top = top + "px";
      el.style.width = width + "px";
      el.style.height = PT_ROW_H + "px";
      ptStage.appendChild(el);
    };
    // Reserved width = left padding + logo + gap before the text, so a
    // long team name still starts clear of the logo instead of the two
    // fighting for the same pixels.
    // Same tightening as the scoreboard's logo above.
    const logoSize = 46, logoPad = 4, logoGap = 6;
    const logoReserve = logoPad + logoSize + logoGap;
    mk("name", col.name + logoReserve, col.nameW - logoReserve, "name");
    ["matches", "booyah", "finishes", "total"].forEach(f => {
      mk(f, col[f] - NUM_W / 2, NUM_W);
    });
    const logo = document.createElement("img");
    logo.className = "team-logo";
    logo.id = "pt-" + i + "-logo";
    logo.style.left = (col.name + logoPad) + "px";
    logo.style.top = (cy - logoSize / 2) + "px";
    logo.style.width = logoSize + "px";
    logo.style.height = logoSize + "px";
    ptStage.appendChild(logo);
    const badge = document.createElement("img");
    badge.className = "badge";
    badge.id = "pt-" + i + "-badge";
    badge.style.left = (col.name - 32) + "px";
    badge.style.top = (cy - 13) + "px";
    ptStage.appendChild(badge);
  });
});

function setText(prefix, i, field, value){
  const el = document.getElementById(prefix + "-" + i + "-" + field);
  if(el) el.textContent = value;
}

// A one-word team name (NEVERMORE, TSGARMY) can't wrap onto a second line
// the way "BRUTAL BIHARIZZ" does, so a tight name column just clips it.
// Shrinking to fit keeps the whole name on one line instead -- same
// approach freefire_team_eliminated.html already uses for its title.
function fitNameCell(el, maxSize){
  el.style.fontSize = maxSize + "px";
  for(let size = maxSize; size > 13 && el.scrollWidth > el.clientWidth; size -= 1){
    el.style.fontSize = size + "px";
  }
}

function applyScoreboard(ff){
  const mode = (ff.display && ff.display.scoreboardMode) || "match";
  const latest = ff.matches && ff.matches.length ? ff.matches[ff.matches.length - 1] : null;

  let rows;
  if(mode === "overall"){
    rows = (ff.standings || []).map((r, i) => ({
      rank: i + 1,
      name: r.shortName || r.teamName,
      fullName: r.teamName,
      kills: r.totalKills,
      total: r.totalPoints,
    }));
  } else {
    // Sorted by the game's own rank rather than trusting file order --
    // the result file lists teams in an order that doesn't always match
    // their placement.
    // (latest.teams || []) -- a committed entry without a teams array
    // would otherwise throw here and blank the whole graphic.
    rows = latest ? (latest.teams || []).slice()
      .sort((a, b) => (a.rank || 99) - (b.rank || 99))
      .map(t => ({
        rank: t.rank,
        name: t.shortName || t.teamName,
        fullName: t.teamName,
        kills: t.killScore,
        total: t.totalScore,
      })) : [];
  }

  for(let i = 0; i < TEAMS; i++){
    const row = rows[i];
    if(!row){
      // Blank, not zeros -- an unused slot means "no team here", and 0s
      // would read as a team that played and scored nothing.
      ["rank", "name", "kills", "total"].forEach(f => setText("sb", i, f, ""));
      continue;
    }
    setText("sb", i, "rank", String(row.rank == null ? i + 1 : row.rank).padStart(2, "0"));
    setText("sb", i, "name", (row.name || "").toUpperCase());
    fitNameCell(document.getElementById("sb-" + i + "-name"), 25);
    setText("sb", i, "kills", row.kills == null ? 0 : row.kills);
    setText("sb", i, "total", row.total == null ? 0 : row.total);
  }
  const sbNames = rows.map(r => (r && r.fullName) || (r && r.name) || "");
  paintBadges("sb", sbNames, TEAMS, ff);
  paintLogos("sb", sbNames, TEAMS, ff);
  applyLogoOverride("sb", TEAMS, "scoreboardLogo", ff);

  // Nothing is drawn on the left-hand BOOYAH plate: the artwork already
  // has "BOOYAH" printed there, and overlaying the winning team's name on
  // top of it just collides with the baked text. If that plate is meant to
  // carry the winner's name, the word needs removing from the PNG first --
  // that's an artwork decision, not something to paper over here.
}

function applyPointsTable(ff){
  const folder = (ff.event && ff.event.assetFolder) || "CLT";
  const src = "assets/freefire/" + folder + "/overall standings.png";
  const bg = document.getElementById("pt-bg");
  if(bg.getAttribute("src") !== src) bg.src = src;

  // How many games these standings cover. Taken from the committed
  // matches rather than the event's "current game", which is the game
  // being captured -- during game 4 the table on screen still only
  // contains the three that have been committed, and saying otherwise
  // would misdate it on air. An explicit override (event.afterGameLabel)
  // wins when set -- for the case the count itself is right but the
  // operator wants different wording, or a game was played but entered
  // outside this system and the auto count would read low.
  const override = (ff.event && ff.event.afterGameLabel || "").trim();
  const played = (ff.matches || []).length;
  document.getElementById("pt-after").textContent =
    override || (played ? "AFTER GAME " + played : "");

  const standings = ff.standings || [];
  for(let i = 0; i < PT_PER_BLOCK * PT_BLOCKS.length; i++){
    const row = standings[i];
    if(!row){
      ["name", "matches", "booyah", "finishes", "total"]
        .forEach(f => setText("pt", i, f, ""));
      continue;
    }
    setText("pt", i, "name", (row.teamName || row.shortName || "").toUpperCase());
    fitNameCell(document.getElementById("pt-" + i + "-name"), 23);
    setText("pt", i, "matches", row.matches || 0);
    setText("pt", i, "booyah", row.booyahs || 0);
    // "Finishes" on this design is the kill total -- the artwork's own
    // wording. Placement points are folded into TOTAL beside it.
    setText("pt", i, "finishes", row.totalKills || 0);
    setText("pt", i, "total", row.totalPoints || 0);
  }
  const ptCount = PT_PER_BLOCK * PT_BLOCKS.length;
  const ptNames = standings.map(r => (r && r.teamName) || "");
  paintBadges("pt", ptNames, ptCount, ff);
  paintLogos("pt", ptNames, ptCount, ff);
  applyLogoOverride("pt", ptCount, "pointsTableLogo", ff);

  renderMapStrip(ff);
}

/* Which map each game was on, and -- once that game has been committed --
   the Booyah team's logo beside it. A game not yet played shows the map
   name (if one was entered ahead of time) with no logo, rather than
   guessing a winner. Uses the SAME event.maps[]/matches[] the dashboard's
   Event tab and Match Review already write to, so nothing new has to be
   entered anywhere just for this strip to work. */
function renderMapStrip(ff){
  const totalGames = (ff.event && ff.event.totalGames) || 6;
  const maps = (ff.event && ff.event.maps) || [];
  const matches = ff.matches || [];
  const roster = ff.roster;

  const el = document.getElementById("pt-maps");
  el.innerHTML = Array.from({ length: totalGames }, (_, i) => {
    const mapName = (maps[i] || "").trim();
    const match = matches[i];
    const winner = match && (match.teams || []).slice()
      .sort((a, b) => (a.rank || 99) - (b.rank || 99))[0];
    const team = winner ? logoFor(winner.teamName, roster) : null;
    const logoSrc = team && team.logo;
    return `
      <div class="pt-map">
        <img class="mapLogo${logoSrc ? " on" : ""}" src="${logoSrc || ""}" alt="">
        <div class="mapName">${(mapName || "GAME " + (i + 1)).toUpperCase()}</div>
      </div>`;
  }).join("");
}

// Same lookup freefire_alive_status.html uses: joined by name against the
// CURRENT roster, not baked into the committed match or the standings
// aggregate. Standings have never carried a logo field at all, and a
// committed match freezes whatever the roster held at commit time -- so
// looking it up live is the only way an uploaded/changed logo shows up on
// an already-committed match without needing that match re-committed.
function logoFor(teamName, roster){
  const want = (teamName || "").trim().toUpperCase();
  const team = ((roster && roster.teams) || []).find(
    t => (t.name || "").trim().toUpperCase() === want);
  return team || null;
}

// Same transform trick the MOBA/Valorant graphic-fixing tab uses:
// translate/scale layered on top of the element's own base position, so
// nudging it doesn't require touching the geometry constants above.
function applyLogoOverride(prefix, count, key, ff){
  const o = (ff.graphicOverrides && ff.graphicOverrides[key]) || {};
  const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
  for(let i = 0; i < count; i++){
    const el = document.getElementById(prefix + "-" + i + "-logo");
    if(!el) continue;
    el.style.transform = "translate(" + dx + "px, " + dy + "px) scale(" + scale + ")";
    el.style.transformOrigin = "center";
  }
}

function paintLogos(prefix, names, count, ff){
  const roster = ff.roster;
  // Same reasoning as paintBadges -- iterate the fixed row count so a
  // shorter row set actually clears the slots it doesn't use.
  for(let i = 0; i < count; i++){
    const name = names[i] || "";
    const el = document.getElementById(prefix + "-" + i + "-logo");
    if(!el) continue;
    const team = name ? logoFor(name, roster) : null;
    const src = team && team.logo;
    if(src){
      if(el.getAttribute("src") !== src) el.src = src;
      el.classList.add("on");
    } else {
      el.classList.remove("on");
    }
  }
}

/* Which teams have activated Champion Rush, by the name they are shown
   under. Empty unless the operator has ticked the emblem on, so the badge
   never appears in an event that isn't running the format. */
function championSet(ff){
  const display = ff.display || {};
  if(!display.championRushBadgeVisible) return new Set();
  return new Set(((ff.championRush || {}).totals || [])
    .filter(t => t.activated)
    .map(t => (t.teamName || "").trim().toUpperCase()));
}

function paintBadges(prefix, names, count, ff){
  const active = championSet(ff);
  const folder = (ff.event && ff.event.assetFolder) || "CLT";
  const src = "assets/freefire/" + folder + "/champion_rush.png";
  // Iterates the row COUNT, not names.length -- a match with fewer teams
  // than the full grid (a real case: one of tonight's own games only had
  // 10 of 12) would otherwise leave the missing rows' badges showing
  // whatever the previous state_sync painted there instead of clearing.
  for(let i = 0; i < count; i++){
    const name = names[i] || "";
    const el = document.getElementById(prefix + "-" + i + "-badge");
    if(!el) return;
    const on = !!name && active.has(name.trim().toUpperCase());
    if(on && el.getAttribute("src") !== src) el.src = src;
    el.classList.toggle("on", on);
  }
}

function applyFreefire(ff){
  applyScoreboard(ff);
  applyPointsTable(ff);

  const display = ff.display || {};
  const pointsUp = !!display.pointsTableVisible;
  // The scoreboard defaults to VISIBLE: it had no push/pull control
  // originally, so gating it on a flag that isn't set yet would leave an
  // existing setup permanently blank. The points table, which does have
  // one, wins the source while it is up.
  const boardUp = display.scoreboardVisible !== false && !pointsUp;

  document.getElementById("pt-stage").classList.toggle("visible", pointsUp);
  document.getElementById("sb-stage").classList.toggle("visible", boardUp);
}

let ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") applyFreefire(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>

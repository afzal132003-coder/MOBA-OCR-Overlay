<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MOBA MVP Stats Overlay</title>
<style>
  /*
    Pixel positions read directly from assets/MVP.psd's layer bounding
    boxes (psd-tools), not eyeballed off the flattened PNGs -- exact.
    Static art (navy panel, gold divider, the big "MVP" watermark text,
    and all 4 stat LABELS) is all baked into assets/mvp_blank.png; only
    the character portrait, team logo, player name, and the 4 numbers are
    drawn here. "Photo" is a transparent character render picked from a
    small fixed library in assets/ (character1.png, character2.png, ...
    -- see mvp.characterImage), not the Prematch hero pick -- those wiki
    infobox images aren't transparent cutouts and looked wrong layered
    over the MVP watermark text.
  */
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-ExtraBold.ttf') format('truetype');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Black.ttf') format('truetype');
    font-weight: 900; font-style: normal;
  }

  :root{ --gold:#f0ca90; --white:#ffffff; }
  html,body{ margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px; font-family:'TT Supermolot Neue Trial', Arial, sans-serif; }

  #stage{ position:relative; width:1920px; height:1080px; display:none; }
  #stage.show{ display:block; }

  .bg-frame{ position:absolute; top:0; left:0; width:1920px; height:1080px; pointer-events:none; }

  /* Team logo watermark: sits behind the photo on purpose -- 40% of its
     own width tucked under the photo, 60% extending past the photo's
     right edge, per the requested "60% visible right of the character,
     40% behind the character" split. Low opacity so it reads as a
     background watermark rather than competing with the photo/stats. */
  .team-logo-watermark{ position:absolute; top:340px; width:400px; height:400px;
    left:664px; /* photoRight(880) - width(400)*0.4 */
    object-fit:contain; opacity:0.28; filter:drop-shadow(0 0 30px rgba(0,0,0,0.4)); display:none; }

  .photo-wrap{ position:absolute; left:116px; top:52px; width:764px; height:1028px; overflow:hidden; }
  /* contain, not cover -- character1.png/character2.png are wildly
     different aspect ratios (one tall, one wide), and cover was cropping
     the wide one badly to fill a tall box. Bottom-anchored so the
     character "stands" on the bottom edge regardless of its own
     proportions. Bottom mask fades it into the background instead of a
     hard box edge; the float/sway reuses the same idle animation the
     Prematch pick slots use, just without their extra scale(1.12) (no
     need to overfill a contain box the way a cover crop does). */
  .photo-wrap img{ width:100%; height:100%; object-fit:contain; object-position:50% 100%; display:none;
    -webkit-mask-image:linear-gradient(to bottom, black 0%, black 78%, transparent 98%);
    mask-image:linear-gradient(to bottom, black 0%, black 78%, transparent 98%);
    transform-origin:center center; animation:mvpPhotoFloat 5s ease-in-out infinite; }
  @keyframes mvpPhotoFloat{
    0%,100%{ transform:translateY(3px) rotate(-0.5deg) skewY(-0.6deg); }
    50%{ transform:translateY(-3px) rotate(0.5deg) skewY(0.6deg); }
  }

  /* The "MVP" watermark is also baked into mvp_blank.png behind the
     photo (so it still shows where the photo's own transparency/fade
     lets it through), but this repaints the exact same art on top so it
     reads clearly in front of the character too, not just around it. */
  .mvp-text-overlay{ position:absolute; left:179px; top:68px; width:209px; height:753px; pointer-events:none; }

  .player-name{ position:absolute; left:891px; top:110px; width:782px; height:70px;
    display:flex; align-items:center;
    color:var(--gold); font-weight:800; font-style:italic; font-size:52px;
    letter-spacing:1px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Centered on the LABEL's own horizontal midpoint (read from the PSD),
     not left-anchored to the demo value's bbox -- the demo text
     ("123456"/"1234"/etc.) happened to start at a specific x that has
     nothing to do with where a real value of different digit-length
     should sit, which is what made these look off-center before. */
  .stat-num{ position:absolute; display:flex; align-items:center; justify-content:center;
    color:var(--white); font-weight:700; }
  #dmg-taken{ left:1172px; top:337px; width:300px; height:72px; font-size:56px; }
  #dmg-dealt{ left:1459px; top:336px; width:250px; height:71px; font-size:56px; }
  #kill-participation{ left:1440px; top:515px; width:250px; height:72px; font-size:56px; }

  /* "KILL - DEATH - ASSIST" is one baked text run in the art (no per-word
     bbox to measure). space-between across the label's full bbox width
     stretched this way too far apart for short values -- the label's
     actual glyphs sit tighter than its bbox, so this is a compact
     centered group instead (small gap, not edge-to-edge), matching how
     close "0-0-5" sits under the label in the reference. */
  #kda{ position:absolute; left:1405px; top:672px; width:300px; height:71px;
    display:flex; align-items:center; justify-content:center; gap:14px;
    color:var(--white); font-weight:700; font-size:52px; }
  #kda .dash{ font-size:34px; opacity:0.7; }
</style>
</head>
<body>
<div id="stage">
  <img class="bg-frame" src="assets/mvp_blank.png" alt="">
  <img class="team-logo-watermark" id="mvp-team-logo" src="" alt="">
  <div class="photo-wrap" id="mvp-photo-wrap"><img id="mvp-photo" src="" alt=""></div>
  <img class="mvp-text-overlay" src="assets/mvp_text.png" alt="">
  <div class="player-name" id="mvp-name"></div>
  <div class="stat-num" id="dmg-taken">0</div>
  <div class="stat-num" id="dmg-dealt">0</div>
  <div class="stat-num" id="kill-participation">0%</div>
  <div id="kda">
    <span id="kda-k">0</span><span class="dash">-</span><span id="kda-d">0</span><span class="dash">-</span><span id="kda-a">0</span>
  </div>
</div>

<script>
const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=mvp_stats"
  : "ws://localhost:8765?page=mvp_stats";
let ws;

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") applyState(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function setLogo(id, src){
  const el = document.getElementById(id);
  if(src){ el.src = src; el.style.display = "block"; }
  else { el.style.display = "none"; }
}

// Same dx/dy/scale nudge mechanism as overlay.html/prematch.html/
// postmatch.html's Graphic Fixing tab. Targets "mvp-photo-wrap", NOT the
// "mvp-photo" img directly -- that img already has its own CSS
// @keyframes animation (the idle sway) constantly writing to its
// transform, which would silently fight/overwrite any dx/dy/scale set
// here via inline style. The wrapper has no animation of its own, so
// nudging it moves/scales the whole photo (sway included) cleanly.
function applyGraphicOverrides(overrides, elementIds){
  (elementIds || []).forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const o = (overrides && overrides[id]) || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    el.style.transformOrigin = "top left";
  });
}

function applyState(state){
  const mvp = state.mvp;
  const stage = document.getElementById("stage");
  if(!mvp || !mvp.team || mvp.playerIndex == null){
    stage.classList.remove("show");
    return;
  }
  stage.classList.add("show");

  const team = state[mvp.team];
  const name = (team.players && team.players[mvp.playerIndex]) || "";
  document.getElementById("mvp-name").textContent = name;

  setLogo("mvp-team-logo", team.logo);
  // Transparent character render picked from the dashboard's fixed
  // library (assets/character1.png, character2.png, ...) -- not derived
  // from the Prematch hero pick, since those wiki infobox images aren't
  // transparent cutouts and looked wrong layered over the MVP watermark.
  setLogo("mvp-photo", mvp.characterImage ? `assets/${encodeURIComponent(mvp.characterImage)}` : "");

  const p = (state.postMatch && state.postMatch.players[mvp.team][mvp.playerIndex]) || {};
  const teamKills = (state.postMatch && state.postMatch.stats[mvp.team].kills) || 0;
  // Player's own kills over the team's total kills -- explicitly NOT the
  // (kills+assists)/teamKills "kill participation" formula some MOBAs use;
  // kills-only, per the requested definition.
  const kp = teamKills > 0 ? Math.round((p.kills || 0) / teamKills * 100) : 0;

  document.getElementById("dmg-taken").textContent = (p.damageTaken || 0).toLocaleString();
  document.getElementById("dmg-dealt").textContent = (p.damageDealt || 0).toLocaleString();
  document.getElementById("kill-participation").textContent = `${kp}%`;
  document.getElementById("kda-k").textContent = p.kills || 0;
  document.getElementById("kda-d").textContent = p.deaths || 0;
  document.getElementById("kda-a").textContent = p.assists || 0;

  applyGraphicOverrides(state.graphicOverrides && state.graphicOverrides.mvp,
    ["mvp-photo-wrap", "mvp-team-logo", "mvp-name", "dmg-taken", "dmg-dealt", "kill-participation", "kda"]);
}

connect();
</script>
</body>
</html>

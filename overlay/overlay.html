<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MOBA Broadcast Overlay</title>
<style>
  /*
    All positions below are absolute pixel coordinates on a 1920x1080
    canvas, measured directly off assets/POPUPS - demo.png against the
    blank assets/POPUPS.png template. Set the OBS Browser Source to
    1920x1080 so this lines up exactly.
  */

  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Medium.ttf') format('truetype');
    font-weight: 500; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-ExtraBold.ttf') format('truetype');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Black.ttf') format('truetype');
    font-weight: 900; font-style: normal;
  }

  :root{
    --font-display: 'TT Supermolot Neue Trial', 'Arial Narrow', Arial, sans-serif;
    --value-color: #ffffff;
    --name-color: #0b193e;
  }

  html, body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px;
    font-family: var(--font-display);
  }

  #stage{
    position:relative; width:1920px; height:1080px;
    opacity:0; transform:translateY(-24px);
    animation: enter 0.7s ease forwards;
  }
  @keyframes enter{ to{ opacity:1; transform:translateY(0); } }

  .bg-frame{
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    pointer-events:none;
  }

  .team-logo{
    position:absolute; object-fit:contain; display:none;
  }
  #team1-logo{ left:368px; top:8px; width:65px; height:71px; }
  #team2-logo{ left:1485px; top:8px; width:65px; height:71px; }

  .team-name{
    position:absolute; height:25px; top:62px;
    display:flex; align-items:center; justify-content:center;
    color: var(--name-color);
    font-weight:800; font-size:18px; letter-spacing:0.5px;
    text-transform:uppercase; white-space:nowrap;
    transition:background 0.2s;
  }
  #team1-name{ left:510px; width:199px; }
  #team2-name{ left:1218px; width:191px; }

  .stat{
    position:absolute; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start; gap:6px;
  }
  .stat img{ display:block; }
  .stat .value{
    color: var(--value-color); font-weight:700; font-size:15px;
    line-height:1; white-space:nowrap; border-radius:3px;
    transition:background 0.2s;
  }

  /* Team 1: gold -> structures -> kills (left to right) */
  #t1-gold{  left:509px; top:8px;  width:70px; }
  #t1-tower{ left:578px; top:9px;  width:40px; }
  #t1-kill{  left:633px; top:7px;  width:40px; }

  /* Team 2: gold -> structures -> kills (same reading order, mirrored side) */
  #t2-gold{  left:1183px; top:8px; width:70px; }
  #t2-tower{ left:1252px; top:9px; width:40px; }
  #t2-kill{  left:1307px; top:7px; width:40px; }

  .score{
    position:absolute; top:15px; width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    color:#ffffff; font-weight:900; font-size:40px;
    transition:background 0.2s;
  }
  #score-team1{ left:814px; }
  #score-team2{ left:1063px; }

  /* No baked slot for this on the old background art (unlike the PSD
     rebuild this replaced) -- sits in the dark empty space above the
     center shield logo. Nudge via Graphic Fixing if it's off. */
  .match-clock{
    position:absolute; left:960px; top:4px; width:80px; height:14px;
    display:flex; align-items:center; justify-content:center;
    color:#ffffff; font-weight:700; font-size:13px; letter-spacing:1px;
    font-variant-numeric:tabular-nums;
    transform:translateX(-50%);
  }

  .flash{ background:#f2c14e88 !important; }

  /* ---- turtle announcement ----
     Both graphics are full 1920x1080 transparent PNGs with the actual
     banner already drawn at its final position (top-right) — same pattern
     as .bg-frame, not a small image to be placed via CSS. */
  .turtle-popup{
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    display:none; pointer-events:none;
  }
  .turtle-popup img{ position:absolute; top:0; left:0; width:1920px; height:1080px; }
  /* Broadcast-style entrance/exit: flies in from off-canvas with a slight
     overshoot ("back ease"), flies back out on the way down — snappier
     than the entrance, typical of on-air graphic stingers. Replayed each
     time via showTurtlePopup/hideTurtlePopup in the script. */
  @keyframes turtleFlyIn{
    0%{ transform:translateX(160px); opacity:0; }
    100%{ transform:translateX(0); opacity:1; }
  }
  @keyframes turtleFlyOut{
    0%{ transform:translateX(0); opacity:1; }
    100%{ transform:translateX(160px); opacity:0; }
  }
  .turtle-popup.turtle-anim-enter{
    animation: turtleFlyIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .turtle-popup.turtle-anim-exit{
    animation: turtleFlyOut 0.4s cubic-bezier(0.55, 0, 0.85, 0.35) both;
  }
  /* Countdown number, measured directly off the empty navy space to the
     right of the turtle icon on the TURTLE TIME graphic (box: x1675-1919,
     y223-322; icon occupies roughly x1675-1773 of that) — centered in the
     remaining space (x1775-1919), not eyeballed. Bright gold so it reads
     against the dark banner. */
  .turtle-popup .turtle-countdown{
    position:absolute; left:1847px; top:272px; transform:translate(-50%,-50%);
    color:#f0ca90; font-weight:900; font-size:42px;
    text-shadow:0 2px 6px rgba(0,0,0,0.7);
  }
</style>
</head>
<body>
<div id="stage">
  <img class="bg-frame" src="assets/POPUPS.png" alt="">

  <img class="team-logo" id="team1-logo" alt="">
  <img class="team-logo" id="team2-logo" alt="">

  <div class="team-name" id="team1-name">TEAM 1</div>
  <div class="team-name" id="team2-name">TEAM 2</div>

  <div class="stat" id="t1-gold">
    <img src="assets/gold.png" width="24" height="24" alt="">
    <span class="value" id="team1-gold">0</span>
  </div>
  <div class="stat" id="t1-tower">
    <img src="assets/structures.png" width="18" height="22" alt="">
    <span class="value" id="team1-objectives">0</span>
  </div>
  <div class="stat" id="t1-kill">
    <img src="assets/kill.png" width="19" height="25" alt="">
    <span class="value" id="team1-kills">0</span>
  </div>

  <div class="stat" id="t2-gold">
    <img src="assets/gold.png" width="24" height="24" alt="">
    <span class="value" id="team2-gold">0</span>
  </div>
  <div class="stat" id="t2-tower">
    <img src="assets/structures.png" width="18" height="22" alt="">
    <span class="value" id="team2-objectives">0</span>
  </div>
  <div class="stat" id="t2-kill">
    <img src="assets/kill.png" width="19" height="25" alt="">
    <span class="value" id="team2-kills">0</span>
  </div>

  <div class="score" id="score-team1">0</div>
  <div class="score" id="score-team2">0</div>

  <div class="match-clock" id="match-clock">00:00</div>

  <div class="turtle-popup" id="turtle-time">
    <img src="assets/turtle_time.png" alt="">
    <span class="turtle-countdown" id="turtle-countdown">0</span>
  </div>
  <div class="turtle-popup" id="turtle-spawned">
    <img src="assets/turtle_spawned.png" alt="">
  </div>
  <div class="turtle-popup" id="lord-spawned">
    <img src="assets/lord_spawned.png" alt="">
  </div>
</div>

<script>
// Defaults to local (works as-is when the OCR engine is on the same PC as
// this browser source). To read from the cloud relay instead — e.g. this
// is running in vMix/OBS on a different PC/network than wherever OCR is
// happening — set this Browser Source's URL once to:
//   overlay.html?relay=wss://your-relay-host&token=yourViewerToken
// Remembered in this browser's localStorage after that, so a plain reload
// of the source still works even without the query string.
const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=overlay"
  : "ws://localhost:8765?page=overlay";
let ws;

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync"){
      applyState(msg.data);
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function setValue(id, value){
  const el = document.getElementById(id);
  if(!el) return;
  if(el.textContent !== String(value)){
    el.textContent = value;
    el.classList.add("flash");
    setTimeout(()=>el.classList.remove("flash"), 400);
  }
}

function formatGold(v){
  v = Number(v) || 0;
  if(v >= 1000) return (v/1000).toFixed(1).replace(/\.0$/,'') + "K";
  return String(v);
}

function setLogo(id, src){
  const el = document.getElementById(id);
  if(src){
    el.src = src;
    el.style.display = "block";
  } else {
    el.style.display = "none";
  }
}

let turtleTickHandle = null;
let lastTurtleStatus = "idle";

// Slides an already-hidden popup in. Forces a reflow before adding the
// class -- re-adding the same class name without that is a no-op if it's
// already applied (wouldn't replay on back-to-back triggers).
function showTurtlePopup(el){
  el.classList.remove("turtle-anim-exit");
  el.style.display = "block";
  el.classList.remove("turtle-anim-enter");
  void el.offsetWidth;
  el.classList.add("turtle-anim-enter");
}

// Slides a visible popup out, THEN hides it once the animation finishes --
// unlike the old version, this doesn't just cut straight to display:none.
function hideTurtlePopup(el){
  if(el.style.display === "none") return; // already hidden, nothing to animate
  el.classList.remove("turtle-anim-enter");
  void el.offsetWidth;
  el.classList.add("turtle-anim-exit");
  el.addEventListener("animationend", () => {
    el.style.display = "none";
    el.classList.remove("turtle-anim-exit");
  }, { once: true });
}

// endsAt is an absolute timestamp (ms), so the countdown number just ticks
// locally against it rather than waiting for a fresh broadcast every
// second — the server only broadcasts on actual status transitions.
function updateTurtleDisplay(tt){
  const timeEl = document.getElementById("turtle-time");
  const spawnedEl = document.getElementById("turtle-spawned");
  const countdownEl = document.getElementById("turtle-countdown");

  if(turtleTickHandle){ clearInterval(turtleTickHandle); turtleTickHandle = null; }

  if(tt.status === "countdown" && tt.endsAt){
    if(lastTurtleStatus === "spawned") hideTurtlePopup(spawnedEl); // cross-transition
    if(lastTurtleStatus !== "countdown") showTurtlePopup(timeEl);
    const tick = () => {
      const remainingMs = Math.max(0, tt.endsAt - Date.now());
      countdownEl.textContent = String(Math.ceil(remainingMs / 1000));
    };
    tick();
    turtleTickHandle = setInterval(tick, 250);
  } else if(tt.status === "spawned"){
    if(lastTurtleStatus === "countdown") hideTurtlePopup(timeEl); // cross-transition
    if(lastTurtleStatus !== "spawned") showTurtlePopup(spawnedEl);
  } else {
    if(lastTurtleStatus === "countdown") hideTurtlePopup(timeEl);
    if(lastTurtleStatus === "spawned") hideTurtlePopup(spawnedEl);
  }
  lastTurtleStatus = tt.status;
}

// Lord is spawned-only (no countdown phase) so this is a simpler version
// of updateTurtleDisplay above — one popup, one status transition.
let lastLordStatus = "idle";
function updateLordDisplay(lt){
  const spawnedEl = document.getElementById("lord-spawned");
  if(lt.status === "spawned"){
    if(lastLordStatus !== "spawned") showTurtlePopup(spawnedEl);
  } else {
    if(lastLordStatus === "spawned") hideTurtlePopup(spawnedEl);
  }
  lastLordStatus = lt.status;
}

// Counts UP (elapsed match time). While OCR is calibrated and reading the
// in-game clock, matchClock.elapsedMs gets overwritten every confirmed
// read and status stays "idle" (a frozen display value refreshed often
// enough not to need local ticking); the dashboard's manual Start/Pause
// still works as a fallback when OCR isn't calibrated/visible, in which
// case this ticks locally off "startedAt" same as the turtle countdown.
let matchClockTickHandle = null;
function updateMatchClock(mc){
  const el = document.getElementById("match-clock");
  if(matchClockTickHandle){ clearInterval(matchClockTickHandle); matchClockTickHandle = null; }
  const format = (ms) => {
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(totalSec / 60), s = totalSec % 60;
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  };
  if(mc.status === "running" && mc.startedAt){
    const tick = () => { el.textContent = format(Date.now() - mc.startedAt); };
    tick();
    matchClockTickHandle = setInterval(tick, 1000);
  } else {
    el.textContent = format(mc.elapsedMs || 0);
  }
}

// Per-element position/scale nudges saved from the dashboard's Graphic
// Fixing tab — purely additive on top of each element's base CSS
// position/size, applied as a transform so it never disturbs the
// underlying layout math those positions rely on. baseTransforms lets a
// specific element (e.g. the turtle countdown, which self-centers via its
// own translate(-50%,-50%)) keep that transform instead of losing it.
function applyGraphicOverrides(overrides, elementIds, baseTransforms){
  (elementIds || []).forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const o = (overrides && overrides[id]) || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    const base = (baseTransforms && baseTransforms[id]) || "";
    el.style.transform = `${base} translate(${dx}px, ${dy}px) scale(${scale})`.trim();
    el.style.transformOrigin = "top left";
  });
}

function applyState(state){
  document.getElementById("team1-name").textContent = state.team1.name || "TEAM 1";
  document.getElementById("team2-name").textContent = state.team2.name || "TEAM 2";
  setLogo("team1-logo", state.team1.logo);
  setLogo("team2-logo", state.team2.logo);

  setValue("team1-kills", state.team1.kills);
  setValue("team1-objectives", state.team1.objectives);
  setValue("team1-gold", formatGold(state.team1.gold));
  setValue("team2-kills", state.team2.kills);
  setValue("team2-objectives", state.team2.objectives);
  setValue("team2-gold", formatGold(state.team2.gold));
  setValue("score-team1", state.seriesScore.team1);
  setValue("score-team2", state.seriesScore.team2);

  if(state.turtleTimer) updateTurtleDisplay(state.turtleTimer);
  if(state.lordTimer) updateLordDisplay(state.lordTimer);
  if(state.matchClock) updateMatchClock(state.matchClock);

  applyGraphicOverrides(state.graphicOverrides && state.graphicOverrides.overlay,
    ["team1-logo", "team2-logo", "team1-name", "team2-name", "match-clock"],
    { "match-clock": "translateX(-50%)" });
  applyGraphicOverrides(state.graphicOverrides && state.graphicOverrides.turtle,
    ["turtle-time", "turtle-spawned", "turtle-countdown"],
    { "turtle-countdown": "translate(-50%,-50%)" });
  applyGraphicOverrides(state.graphicOverrides && state.graphicOverrides.lord,
    ["lord-spawned"]);
}

connect();
</script>
</body>
</html>

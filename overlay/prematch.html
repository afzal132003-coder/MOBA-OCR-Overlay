<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MOBA Prematch Overlay</title>
<style>
  /*
    Pixel positions measured directly off assets/prematch_demo.png against
    the blank assets/prematch_blank.png template (same technique as the
    in-game overlay). Canvas is 1920x1080 — set the OBS Browser Source to
    match.
  */
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-ExtraBold.ttf') format('truetype');
    font-weight: 800; font-style: normal;
  }

  :root{ --gold:#f0ca90; --navy-text:#0b193e; }
  html,body{ margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px; font-family:'TT Supermolot Neue Trial', Arial, sans-serif; }

  #stage{ position:relative; width:1920px; height:1080px; opacity:0;
    transform:translateY(-16px); animation: enter 0.6s ease forwards; }
  @keyframes enter{ to{ opacity:1; transform:translateY(0);} }

  .bg-frame{ position:absolute; top:0; left:0; width:1920px; height:1080px; pointer-events:none; }

  /* ---- ban row: true parallelograms (129px wide, sheared 33px over the
     54px height). Each .ban-slot is sized to the WIDER bounding box that
     contains both the top and bottom edges, then clip-path carves out the
     actual slanted shape — image and caption are children of that same
     clipped box, so both automatically follow the slant with no extra math. ---- */
  .ban-slot{ position:absolute; top:691px; width:162px; height:54px; overflow:hidden;
    clip-path: polygon(0% 0%, 79.63% 0%, 100% 100%, 20.37% 100%); }
  /* Right-side (team2) slots shear the opposite way — the whole ban row
     fans outward from the center, mirrored left/right. */
  .ban-slot.mirror{ clip-path: polygon(20.37% 0%, 100% 0%, 79.63% 100%, 0% 100%); }
  .ban-slot img{ position:absolute; top:0; left:0; width:100%; height:37px; object-fit:cover; object-position:50% 15%; display:none; }
  .ban-slot .ban-caption{ position:absolute; left:0; right:0; bottom:0; height:17px;
    display:flex; align-items:center; justify-content:center;
    color:#0b193e; font-weight:800; font-size:10px; text-transform:uppercase; letter-spacing:0.3px;
    overflow:hidden; white-space:nowrap; padding:0 3px; box-sizing:border-box; }

  /* Glows an empty pick/ban box to flag "pick or ban here next" — driven
     by prematch.highlight from the dashboard, always pointing at whichever
     slot(s) are actually still empty (see updateHighlight()), so it keeps
     advancing on its own as the draft fills in. Pick and ban get their own
     colors (blue / light red) and a tight, contained glow rather than a
     wide bloom that washes into neighboring boxes. */
  .pick-slot.highlight{
    animation: pickHighlightPulse 1.4s ease-in-out infinite;
  }
  @keyframes pickHighlightPulse{
    0%,100%{ box-shadow: inset 0 0 0 3px rgba(90,160,255,0.9), 0 0 5px 0px rgba(90,160,255,0.5); }
    50%{ box-shadow: inset 0 0 0 3px rgba(90,160,255,0.55), 0 0 9px 2px rgba(90,160,255,0.75); }
  }
  /* ban-slot is a sheared parallelogram via clip-path — and clip-path hard-
     clips EVERYTHING an element paints, including box-shadow/filter bleed,
     to the path itself. No glow technique on the ban-slot element itself
     can ever paint outside that silhouette. The only way around it is a
     separate, unclipped overlay: a plain wrapper (no clip-path/overflow of
     its own) holding an inner shape that recreates the same parallelogram,
     with the actual glow filter on the wrapper so it's free to bleed. JS
     positions/mirrors/shows this one reusable overlay to match whichever
     ban slot needs it — see updateHighlight(). */
  .ban-highlight-wrap{
    position:absolute; top:691px; width:162px; height:54px; pointer-events:none;
    display:none; animation: banHighlightPulse 1.4s ease-in-out infinite;
  }
  .ban-highlight-shape{
    width:100%; height:100%; box-sizing:border-box;
    border:3px solid rgba(255,90,90,0.9);
    clip-path: polygon(0% 0%, 79.63% 0%, 100% 100%, 20.37% 100%);
  }
  .ban-highlight-wrap.mirror .ban-highlight-shape{
    clip-path: polygon(20.37% 0%, 100% 0%, 79.63% 100%, 0% 100%);
  }
  @keyframes banHighlightPulse{
    0%,100%{ filter: drop-shadow(0 0 2px rgba(255,90,90,0.95)) drop-shadow(0 0 4px rgba(255,90,90,0.6)); }
    50%{ filter: drop-shadow(0 0 3px rgba(255,90,90,0.7)) drop-shadow(0 0 7px rgba(255,90,90,0.9)); }
  }

  /* ---- pick row (navy body 766-1004, gold footer 1006-1044) ---- */
  .pick-slot{ position:absolute; top:766px; height:238px; overflow:hidden; }
  /* Oversized from its CENTER (not an edge) so the drift never runs out of
     overhang on either side — a bottom-anchored scale only added margin
     above, so an upward drift could shift the actual bottom edge past the
     slot's own bottom and expose a gap there (seen live: a blank strip
     under Gatotkaca/Diggie/Freya's portraits). Center-anchored scale adds
     margin on every side equally, comfortably covering the small drift. */
  /* A whole flat portrait can't isolate "just the hair" or move individual
     limbs independently without a per-hero masked/rigged layer (impractical
     for the full roster) — but adding skewY on top of the sway makes the
     top and bottom of the SAME image shift in opposite directions relative
     to the center (that's what a shear does), so the head/shoulders read as
     leaning a little differently than the legs instead of the whole
     silhouette moving as one rigid block. Still small enough that the 1.12
     scale overhang comfortably covers it (a sub-degree skew/rotate only
     shifts things by ~1-2px on a box this size). */
  .pick-slot img{ width:100%; height:100%; object-fit:cover; object-position:50% 15%; display:none;
    transform-origin:center center; animation:pickFloat 5s ease-in-out infinite; }
  @keyframes pickFloat{
    0%,100%{ transform:scale(1.12) translateY(2px) rotate(-0.5deg) skewY(-0.6deg); }
    50%{ transform:scale(1.12) translateY(-2px) rotate(0.5deg) skewY(0.6deg); }
  }
  /* Small embers drifting up from the footer, only while a slot actually
     has a hero in it — matches the ambient fire/energy look used on the
     pick cards in past broadcasts, kept subtle rather than a big effect. */
  .pick-slot .ember{
    position:absolute; bottom:-6px; width:4px; height:4px; border-radius:50%;
    /* --ember-color/--ember-glow are set per-slot in JS, sampled from that
       hero's own portrait, so the embers read as matching their theme
       (icy blue, purple, gold, etc.) instead of one fixed fire color. */
    background:radial-gradient(circle, #fff 0%, var(--ember-color, #ff9d3c) 55%, transparent 100%);
    box-shadow:0 0 6px 2px var(--ember-glow, rgba(255,159,60,0.55));
    opacity:0; pointer-events:none; animation:emberRise 3.4s ease-in infinite;
  }
  .pick-slot:not(.filled) .ember{ display:none; }
  @keyframes emberRise{
    0%{ transform:translate(0,0) scale(0.6); opacity:0; }
    12%{ opacity:0.9; }
    75%{ opacity:0.45; }
    100%{ transform:translate(var(--drift,6px),-190px) scale(1.1); opacity:0; }
  }
  .pick-name{ position:absolute; top:1006px; height:38px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:var(--navy-text);
    overflow:hidden; padding:2px 4px; box-sizing:border-box; }
  .pick-name .player{ font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:0.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .pick-name .hero{ font-weight:600; font-size:10px; opacity:0.8; text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

  /* ---- timer pill ---- */
  .timer-pill{ position:absolute; left:757px; top:695px; width:405px; height:50px;
    display:flex; align-items:center; justify-content:center; gap:10px; }
  .timer-pill .phase{ color:var(--gold); font-weight:800; font-size:20px; font-style:italic; text-transform:uppercase; }
  .timer-pill .dash{ color:var(--gold); font-weight:800; font-size:20px; }
  .timer-pill .clock{ color:#ffffff; font-weight:800; font-size:26px; letter-spacing:1px; }

  /* ---- center match info ---- */
  .title{ position:absolute; left:750px; width:420px; top:854px; height:24px;
    text-align:center; color:var(--gold); font-weight:800; font-size:24px; font-style:italic;
    text-transform:uppercase; letter-spacing:1px; }
  .subtitle{ position:absolute; left:750px; width:420px; top:887px; height:18px;
    text-align:center; color:#ffffff; font-weight:600; font-size:15px; font-style:italic;
    text-transform:uppercase; letter-spacing:0.5px; }

  /* Logo + name form one centered unit per team: team1 centered on x=832,
     team2 on x=1082. Top/height kept below the subtitle (ends y=905) and
     the template's own connector-dot line (y=920-926) so nothing overlaps
     the "INVITED / SEMI FINALS" text baked above — measured directly off
     the current prematch_blank.png template, not the older art it used to
     be tuned against.
     Name box width/font measured against the ACTUAL custom font (not a
     fallback) so "GODLIKE ESPORTS" — a genuinely long team name — doesn't
     silently clip: at 14px it renders ~126px, so 140px leaves real margin
     without the box reaching the score-row (which starts at x=903). */
  .team-logo{ position:absolute; top:908px; width:140px; height:110px; object-fit:contain; display:none; }
  #logo-team1{ left:762px; }
  #logo-team2{ left:1012px; }

  /* Shows which team is currently on the clock: a green arrow pointing at
     that team's logo. Vertically centered on the (now shorter) logo box
     above. Nothing is shown at all for the inactive side (not dimmed —
     hidden). */
  .active-arrow{ position:absolute; top:951px; width:0; height:0;
    border-top:12px solid transparent; border-bottom:12px solid transparent;
    filter:drop-shadow(0 0 6px #3ddc6a); display:none; }
  #arrow-team1{ left:758px; border-left:18px solid #3ddc6a; }
  #arrow-team2{ left:1134px; border-right:18px solid #3ddc6a; }

  .team-name{ position:absolute; top:1020px; width:140px; height:18px; text-align:center;
    color:#ffffff; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:0.5px;
    overflow:hidden; white-space:nowrap; }
  #name-team1{ left:762px; }
  #name-team2{ left:1012px; }

  .score-row{ position:absolute; left:903px; top:955px; width:118px; height:52px;
    display:flex; align-items:center; justify-content:center; gap:6px; }
  .score-row .score{ color:var(--gold); font-weight:900; font-size:44px; }
  .score-row .dash{ color:var(--gold); font-weight:900; font-size:32px; }

  .flash{ background:#ffffff33 !important; border-radius:4px; }
</style>
</head>
<body>

  <div class="ban-slot" style="left:184px;" id="ban_team1_1"><img><div class="ban-caption"></div></div>

  <div class="pick-name" style="left:470px;width:136px;" id="pickname_team1_3"><span class="player"></span><span class="hero"></span></div>
  <div class="pick-name" style="left:609px;width:137px;" id="pickname_team1_4"><span class="player"></span><span class="hero"></span></div>

  <div class="title" id="pm-line1">LEAGUE STAGE</div>

  <img class="team-logo" id="logo-team1" alt="">

  <!-- Same mirrored reversal as the ban slots above. -->
  <div class="pick-slot" style="left:1726px;width:137px;" id="pick_team2_0"><img></div>
  <div class="pick-slot" style="left:1587px;width:136px;" id="pick_team2_1"><img></div>
  <div class="pick-slot" style="left:1447px;width:137px;" id="pick_team2_2"><img></div>

  <div class="pick-slot" style="left:1169px;width:137px;" id="pick_team2_4"><img></div>

  <div class="pick-name" style="left:1447px;width:137px;" id="pickname_team2_2"><span class="player"></span><span class="hero"></span></div>

  <div class="ban-highlight-wrap" id="ban-highlight-wrap"><div class="ban-highlight-shape"></div></div>

<script>
// Defaults to local (works as-is when the OCR engine is on the same PC as
// this browser source). To read from the cloud relay instead — e.g. this
// is running in vMix/OBS on a different PC/network than wherever OCR is
// happening — set this Browser Source's URL once to:
//   prematch.html?relay=wss://your-relay-host&token=yourViewerToken
// Remembered in this browser's localStorage after that, so a plain reload
// of the source still works even without the query string.
const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=prematch"
  : "ws://localhost:8765?page=prematch";
let ws;
let timerEndsAt = null;
let timerRemainingMs = 0;
let timerTickHandle = null;

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") applyState(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function setText(id, value){
  const el = document.getElementById(id);
  if(el && el.textContent !== String(value)) el.textContent = value;
}

function fillBanSlot(id, slot){
  const img = document.querySelector(`#${id} img`);
  const caption = document.querySelector(`#${id} .ban-caption`);
  if(slot && slot.image){
    img.src = `../dashboard/assets/heroes/${encodeURIComponent(slot.image)}`;
    img.style.display = "block";
    img.onerror = () => { img.style.display = "none"; };
  } else {
    img.style.display = "none";
  }
  caption.textContent = (slot && slot.name) || "";
}

function rgbToHsl(r, g, b){
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0; const l = (max + min) / 2;
  const d = max - min;
  if(d !== 0){
    s = d / (1 - Math.abs(2 * l - 1));
    switch(max){
      case r: h = ((g - b) / d) % 6; break;
      case g: h = (b - r) / d + 2; break;
      default: h = (r - g) / d + 4;
    }
    h *= 60;
    if(h < 0) h += 360;
  }
  return { h, s, l };
}
function hslToRgb(h, s, l){
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r1, g1, b1;
  if(h < 60){ [r1,g1,b1] = [c,x,0]; }
  else if(h < 120){ [r1,g1,b1] = [x,c,0]; }
  else if(h < 180){ [r1,g1,b1] = [0,c,x]; }
  else if(h < 240){ [r1,g1,b1] = [0,x,c]; }
  else if(h < 300){ [r1,g1,b1] = [x,0,c]; }
  else{ [r1,g1,b1] = [c,0,x]; }
  return [Math.round((r1+m)*255), Math.round((g1+m)*255), Math.round((b1+m)*255)];
}

// Samples this hero's own portrait to tint its embers — averages the
// whole (downsampled) image so the hero's own dominant coloring drives
// the result (icy blue/white for an ice-themed hero, purple for Yve, gold
// for Gatotkaca, etc.), then pushes saturation/lightness up a bit so it
// reads as a vivid glowing ember rather than a muddy true-average.
// Silently keeps the default orange fallback (already in CSS) if the
// canvas read fails for any reason (e.g. opened as a bare local file,
// where cross-file canvas reads are blocked by the browser).
function sampleThemeColor(img, slotEl){
  try{
    const size = 16;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, size, size);
    const data = ctx.getImageData(0, 0, size, size).data;
    let r = 0, g = 0, b = 0, n = 0;
    for(let i = 0; i < data.length; i += 4){ r += data[i]; g += data[i+1]; b += data[i+2]; n++; }
    r /= n; g /= n; b /= n;

    let { h, s, l } = rgbToHsl(r, g, b);
    s = Math.min(1, s * 1.9 + 0.2);
    l = Math.min(0.74, Math.max(0.48, l * 1.15));
    const [vr, vg, vb] = hslToRgb(h, s, l);

    slotEl.style.setProperty("--ember-color", `rgb(${vr},${vg},${vb})`);
    slotEl.style.setProperty("--ember-glow", `rgba(${vr},${vg},${vb},0.6)`);
  } catch(e) {
    slotEl.style.removeProperty("--ember-color");
    slotEl.style.removeProperty("--ember-glow");
  }
}

function fillPickSlot(id, nameId, slot, playerName){
  const slotEl = document.getElementById(id);
  const img = slotEl.querySelector("img");
  const hasPick = !!(slot && slot.image);
  slotEl.classList.toggle("filled", hasPick);
  if(hasPick){
    img.src = `../dashboard/assets/heroes/${encodeURIComponent(slot.image)}`;
    img.style.display = "block";
    img.onload = () => sampleThemeColor(img, slotEl);
    img.onerror = () => { img.style.display = "none"; slotEl.classList.remove("filled"); };
  } else {
    img.style.display = "none";
  }
  const nameEl = document.getElementById(nameId);
  nameEl.querySelector(".player").textContent = playerName || "";
  nameEl.querySelector(".hero").textContent = (slot && slot.name) || "";
}

function updateTimer(){
  const el = document.getElementById("pm-timer");
  // Running: count down live from timerEndsAt. Paused/stopped: show the
  // frozen timerRemainingMs value, no ticking.
  const remainingMs = timerEndsAt ? Math.max(0, timerEndsAt - Date.now()) : timerRemainingMs;
  const remaining = Math.ceil(remainingMs / 1000);
  const mm = String(Math.floor(remaining/60)).padStart(2,"0");
  const ss = String(remaining%60).padStart(2,"0");
  el.textContent = `${mm}:${ss}`;
}

// Per-element position/scale nudges saved from the dashboard's Graphic
// Fixing tab — purely additive on top of each element's base CSS
// position/size, applied as a transform so it never disturbs the
// underlying layout math (centering, etc.) those positions rely on.
function applyGraphicOverrides(overrides, elementIds){
  (elementIds || []).forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const o = (overrides && overrides[id]) || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    el.style.transformOrigin = "top left";
  });
}

// left-position (px) of each ban slot, in index order, matching the fixed
// inline styles above — needed to place the unclipped ban-highlight-wrap
// overlay (see the CSS comment on .ban-highlight-wrap for why this can't
// just be a class toggled on the ban-slot element itself).
const BAN_SLOT_LEFT = {
  team1: [53, 184, 316, 447, 579],
  team2: [1701, 1570, 1438, 1306, 1175],
};

// Glows whichever empty pick/ban slot(s) come next for pm.highlight.team,
// recomputed fresh from the current bans/picks every call — so once the
// highlighted slot actually gets filled, the very next state_sync just
// naturally finds the FOLLOWING empty one instead, with no extra logic
// needed to "advance" it manually.
function updateHighlight(pm){
  document.querySelectorAll(".pick-slot.highlight")
    .forEach(el => el.classList.remove("highlight"));
  const banWrap = document.getElementById("ban-highlight-wrap");
  banWrap.style.display = "none";

  const hl = pm.highlight;
  if(!hl || !hl.team || !hl.type) return;
  const team = hl.team;

  if(hl.type === "ban"){
    const idx = pm.bans[team].findIndex(slot => !slot || !slot.image);
    if(idx !== -1){
      banWrap.style.left = BAN_SLOT_LEFT[team][idx] + "px";
      banWrap.classList.toggle("mirror", team === "team2");
      banWrap.style.display = "block";
    }
  } else {
    const wantCount = hl.type === "pick2" ? 2 : 1;
    let found = 0;
    for(let i = 0; i < pm.picks[team].length && found < wantCount; i++){
      const slot = pm.picks[team][i];
      if(!slot || !slot.image){
        const el = document.getElementById(`pick_${team}_${i}`);
        if(el) el.classList.add("highlight");
        found++;
      }
    }
  }
}

function applyState(state){
  const pm = state.prematch;
  if(!pm) return;

  setText("pm-line1", pm.context.line1 || "");
  setText("pm-line2", pm.context.line2 || "");
  setText("pm-phase", pm.phase || "");
  setText("name-team1", state.team1.name || "TEAM 1");
  setText("name-team2", state.team2.name || "TEAM 2");
  if(state.team1.logo){
    const el = document.getElementById("logo-team1");
    el.src = state.team1.logo; el.style.display = "block";
  }
  if(state.team2.logo){
    const el = document.getElementById("logo-team2");
    el.src = state.team2.logo; el.style.display = "block";
  }
  const pmSeries = pm.seriesScore || {team1:0, team2:0};
  setText("pm-score1", pmSeries.team1);
  setText("pm-score2", pmSeries.team2);

  ["team1","team2"].forEach(team => {
    const players = state[team].players || [];
    pm.bans[team].forEach((slot, i) => fillBanSlot(`ban_${team}_${i}`, slot));
    pm.picks[team].forEach((slot, i) => fillPickSlot(`pick_${team}_${i}`, `pickname_${team}_${i}`, slot, players[i]));
  });
  updateHighlight(pm);

  document.getElementById("arrow-team1").style.display = pm.activeTeam === "team1" ? "block" : "none";
  document.getElementById("arrow-team2").style.display = pm.activeTeam === "team2" ? "block" : "none";

  timerEndsAt = pm.timerEndsAt;
  timerRemainingMs = pm.timerRemainingMs != null ? pm.timerRemainingMs : (pm.timerDuration || 30) * 1000;
  if(timerTickHandle) clearInterval(timerTickHandle);
  updateTimer();
  if(timerEndsAt) timerTickHandle = setInterval(updateTimer, 250);

  applyGraphicOverrides(state.graphicOverrides && state.graphicOverrides.prematch,
    ["logo-team1", "logo-team2", "name-team1", "name-team2", "arrow-team1", "arrow-team2"]);
}

// Ambient ember particles for each pick slot — a handful of staggered
// divs per slot so they don't all rise in lockstep. Purely decorative,
// generated once since the slot boxes themselves never move.
document.querySelectorAll(".pick-slot").forEach(slot => {
  const emberCount = 4;
  for(let i = 0; i < emberCount; i++){
    const ember = document.createElement("div");
    ember.className = "ember";
    const leftPct = 15 + Math.random() * 70;
    const drift = (Math.random() * 16 - 8).toFixed(1);
    const delay = (Math.random() * 3.4).toFixed(2);
    const duration = (2.8 + Math.random() * 1.2).toFixed(2);
    ember.style.cssText = `left:${leftPct}%; --drift:${drift}px; animation-delay:${delay}s; animation-duration:${duration}s;`;
    slot.appendChild(ember);
  }
});

connect();
</script>
</body>
</html>

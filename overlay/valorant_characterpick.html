<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Valorant Character Pick Overlay</title>
<style>
  /*
    Absolute pixel coordinates on a 1920x1080 canvas, measured directly off
    "character-pick-valorant.psd"'s layer boxes (10 player-slot layers,
    the map-slot frame, the gold VS bar). Team logo/name at the bar's ends
    and each slot's player-name label aren't separate layers in that PSD
    (added per an explicit request this session) -- positions there are a
    reasonable estimate, nudge with Graphic Fixing as needed. Background is
    overlay/assets/valorant_characterpick_blank.png, rendered from that PSD
    with the Background fill AND the baked reference map screenshot both
    hidden (map is dynamic here, not baked in).
  */

  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-ExtraBold.ttf') format('truetype');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Black.ttf') format('truetype');
    font-weight: 900; font-style: normal;
  }

  :root{ --font-display: 'TT Supermolot Neue Trial', 'Arial Narrow', Arial, sans-serif; }

  html, body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px;
    font-family: var(--font-display);
  }

  #stage{
    position:relative; width:1920px; height:1080px;
    opacity:0; transform:translateY(-16px);
    animation: enter 0.6s ease forwards;
  }
  @keyframes enter{ to{ opacity:1; transform:translateY(0); } }

  .bg-frame{ position:absolute; top:0; left:0; width:1920px; height:1080px; pointer-events:none; }

  /* Same zoom/swivel/ember treatment as MOBA's pick-slot portraits
     (overlay/prematch.html) -- a tight cover crop scaled up past the frame
     edge so the constant micro-rotate/skew sway never reveals empty space
     at the corners, plus a handful of theme-colored embers (sampled from
     each portrait's own dominant color) drifting up from the bottom while
     a slot is filled. */
  .slot-wrap{
    position:absolute; width:159px; height:179px; top:826px;
    overflow:hidden; display:none;
  }
  .slot-wrap.filled{ display:block; }
  .slot-wrap img{
    width:100%; height:100%; object-fit:cover; object-position:50% 0%;
    transform-origin:center top; animation:slotFloat 5s ease-in-out infinite;
  }
  @keyframes slotFloat{
    0%,100%{ transform:scale(2.5) translateY(2px) rotate(-0.5deg) skewY(-0.6deg); }
    50%{ transform:scale(2.5) translateY(-2px) rotate(0.5deg) skewY(0.6deg); }
  }
  .slot-wrap .ember{
    position:absolute; bottom:-6px; width:4px; height:4px; border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--ember-color, #ff9d3c) 55%, transparent 100%);
    box-shadow:0 0 6px 2px var(--ember-glow, rgba(255,159,60,0.55));
    opacity:0; pointer-events:none; animation:emberRise 3.2s ease-in infinite;
  }
  @keyframes emberRise{
    0%{ transform:translate(0,0) scale(0.6); opacity:0; }
    12%{ opacity:0.9; }
    75%{ opacity:0.45; }
    100%{ transform:translate(var(--drift,6px),-150px) scale(1.1); opacity:0; }
  }
  .slot-name{
    position:absolute; width:159px; height:34px; top:1006px;
    display:flex; align-items:center; justify-content:center;
    color:#ffffff; font-weight:700; font-style:italic; font-size:13px;
    text-transform:uppercase; letter-spacing:0.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  #map-thumb{
    position:absolute; left:880px; top:826px; width:159px; height:179px;
    object-fit:cover; display:none;
  }
  #map-name{
    position:absolute; left:880px; top:1006px; width:159px; height:34px;
    display:flex; align-items:center; justify-content:center;
    color:#ffffff; font-weight:800; font-style:italic; font-size:14px;
    text-transform:uppercase; letter-spacing:0.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .team-logo{ position:absolute; top:735px; width:60px; height:55px; object-fit:contain; display:none; }
  #team1-logo{ left:40px; }
  #team2-logo{ left:1820px; }

  .team-name{
    position:absolute; top:745px; width:250px; height:36px;
    display:flex; align-items:center;
    color:#12193a; font-weight:900; font-style:italic; font-size:24px;
    text-transform:uppercase; white-space:nowrap; overflow:hidden;
  }
  #team1-name{ left:110px; justify-content:flex-start; }
  #team2-name{ left:1560px; justify-content:flex-end; }
</style>
</head>
<body>

<div id="stage">
  <img class="bg-frame" src="assets/valorant_characterpick_blank.png" alt="">

  <img id="map-thumb" alt="">
  <div id="map-name"></div>

  <img class="team-logo" id="team1-logo" alt="">
  <div class="team-name" id="team1-name"></div>
  <div class="team-name" id="team2-name"></div>
  <img class="team-logo" id="team2-logo" alt="">

  <div id="slots"></div>
</div>

<script>
// Same lookup tables as dashboard.html's Agent Pick / other Valorant
// overlays -- duplicated per standalone-file convention.
const VAL_AGENT_MAP = {};
[
  ["Astra","Astra.png"], ["Breach","Breach.png"], ["Brimstone","Brimstone.png"],
  ["Chamber","Chamber.png"], ["Fade","Fade.png"], ["Harbor","Harbor.png"],
  ["Jett","Jett.png"], ["KAY/O","Kayo.png"], ["Killjoy","KillJoy.png"],
  ["Neon","Neon.png"], ["Omen","Omen.png"], ["Phoenix","Phoenix.png"],
  ["Raze","Raze.png"], ["Reyna","Reyna.png"], ["Sage","Sage.png"],
  ["Skye","Skye.png"], ["Sova","Sova.png"], ["Cypher","Sypher.png"],
  ["Viper","Viper.png"], ["Yoru","Yoru.png"],
  ["Iso","Iso.png"], ["Waylay","Waylay.png"], ["Gekko","Gekko.png"], ["Tejo","Tejo.png"],
  ["Clove","Clove.png"], ["Deadlock","Deadlock.png"], ["Vyse","Vyse.png"],
].forEach(([name, file]) => { VAL_AGENT_MAP[name.toLowerCase()] = file; });

function agentPortraitUrl(agentName){
  const file = VAL_AGENT_MAP[(agentName || "").toLowerCase()];
  return file ? `assets/Valorant Agents/${file}` : "";
}

// Per-agent head/face focus point (as % of the portrait's own width/height),
// measured directly off each trimmed portrait -- these are full-body art at
// wildly different poses (standing straight vs. leaning/jumping/turned),
// so a single fixed object-position doesn't land on the face for every
// agent (e.g. Waylay/Neon/Gekko lean hard to one side). Drives both
// object-position (so object-fit:cover's own crop is already biased toward
// the head) and transform-origin (so the extra CSS zoom keyframe stays
// pinned on that same point instead of drifting off toward center-top).
const VAL_AGENT_FOCUS = {
  astra:{x:57,y:15}, breach:{x:45,y:6}, brimstone:{x:50,y:8}, chamber:{x:42,y:6},
  fade:{x:57,y:8}, harbor:{x:55,y:7}, jett:{x:25,y:8}, "kay/o":{x:48,y:10},
  killjoy:{x:62,y:10}, neon:{x:40,y:13}, omen:{x:53,y:13}, phoenix:{x:50,y:6},
  raze:{x:45,y:10}, reyna:{x:53,y:15}, sage:{x:57,y:8}, skye:{x:50,y:5},
  sova:{x:53,y:6}, cypher:{x:48,y:6}, viper:{x:40,y:5}, yoru:{x:48,y:6},
  iso:{x:52,y:7}, waylay:{x:32,y:8}, gekko:{x:45,y:6}, tejo:{x:45,y:10},
  clove:{x:62,y:10}, deadlock:{x:25,y:8}, vyse:{x:48,y:8},
};
function agentFocus(agentName){
  return VAL_AGENT_FOCUS[(agentName || "").toLowerCase()] || { x:50, y:8 };
}

const VAL_MAP_MAP = {};
[
  "Ascent","Bind","Haven","Split","Icebox","Breeze",
  "Fracture","Pearl","Lotus","Sunset","Abyss","Corrode",
].forEach(name => { VAL_MAP_MAP[name.toLowerCase()] = `${name}.webp`; });

function mapThumbUrl(mapName){
  const file = VAL_MAP_MAP[(mapName || "").toLowerCase()];
  return file ? `assets/Valorant Maps/${file}` : "";
}

// Slot x-starts measured off the PSD's Layer 2/Layer 2 copy.../Layer 2
// copy 9 boxes -- 5 team1 slots, a gap for the map frame, then 5 team2
// slots, all 159px wide.
const SLOT_DEFS = [
  {n:1, team:"team1", idx:0, x:25},
  {n:2, team:"team1", idx:1, x:194},
  {n:3, team:"team1", idx:2, x:363},
  {n:4, team:"team1", idx:3, x:533},
  {n:5, team:"team1", idx:4, x:702},
  {n:6, team:"team2", idx:0, x:1036},
  {n:7, team:"team2", idx:1, x:1205},
  {n:8, team:"team2", idx:2, x:1374},
  {n:9, team:"team2", idx:3, x:1544},
  {n:10, team:"team2", idx:4, x:1713},
];

const GFX_ELEMENT_IDS = ["team1-logo","team1-name","team2-name","team2-logo","map-thumb","map-name"];

(function buildSlots(){
  const container = document.getElementById("slots");
  SLOT_DEFS.forEach(slot => {
    // Outer wrap is what Graphic Fixing's dx/dy/scale transform targets
    // (and what clips the zoomed portrait to the frame) -- the inner img
    // has its OWN separate transform for the float/sway animation, same
    // split used for the In-Game HUD's spike badge, so the two transforms
    // never fight each other.
    const wrap = document.createElement("div");
    wrap.className = "slot-wrap";
    wrap.id = `slot${slot.n}-wrap`;
    wrap.style.left = slot.x + "px";
    const portrait = document.createElement("img");
    portrait.id = `slot${slot.n}-portrait`;
    wrap.appendChild(portrait);
    container.appendChild(wrap);
    GFX_ELEMENT_IDS.push(wrap.id);

    const name = document.createElement("div");
    name.className = "slot-name";
    name.id = `slot${slot.n}-name`;
    name.style.left = slot.x + "px";
    container.appendChild(name);
    GFX_ELEMENT_IDS.push(name.id);
  });
})();

const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=valorant_characterpick"
  : "ws://localhost:8765?page=valorant_characterpick";
let ws;

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") applyState(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function setImg(id, src){
  const el = document.getElementById(id);
  if(!el) return;
  if(src){ el.src = src; el.style.display = "block"; }
  else { el.style.display = "none"; }
}

// Same theme-color sampling as MOBA's pick slots (overlay/prematch.html) --
// duplicated per standalone-file convention.
function rgbToHsl(r, g, b){
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0; const l = (max + min) / 2;
  const d = max - min;
  if(d !== 0){
    s = d / (1 - Math.abs(2 * l - 1));
    switch(max){
      case r: h = ((g - b) / d) % 6; break;
      case g: h = (b - r) / d + 2; break;
      default: h = (r - g) / d + 4;
    }
    h *= 60;
    if(h < 0) h += 360;
  }
  return { h, s, l };
}
function hslToRgb(h, s, l){
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r1, g1, b1;
  if(h < 60){ [r1,g1,b1] = [c,x,0]; }
  else if(h < 120){ [r1,g1,b1] = [x,c,0]; }
  else if(h < 180){ [r1,g1,b1] = [0,c,x]; }
  else if(h < 240){ [r1,g1,b1] = [0,x,c]; }
  else if(h < 300){ [r1,g1,b1] = [x,0,c]; }
  else{ [r1,g1,b1] = [c,0,x]; }
  return [Math.round((r1+m)*255), Math.round((g1+m)*255), Math.round((b1+m)*255)];
}
function sampleThemeColor(img, wrapEl){
  try{
    const size = 16;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, size, size);
    const data = ctx.getImageData(0, 0, size, size).data;
    let r = 0, g = 0, b = 0, n = 0;
    for(let i = 0; i < data.length; i += 4){ r += data[i]; g += data[i+1]; b += data[i+2]; n++; }
    r /= n; g /= n; b /= n;
    let { h, s, l } = rgbToHsl(r, g, b);
    s = Math.min(1, s * 1.9 + 0.2);
    l = Math.min(0.74, Math.max(0.48, l * 1.15));
    const [vr, vg, vb] = hslToRgb(h, s, l);
    wrapEl.style.setProperty("--ember-color", `rgb(${vr},${vg},${vb})`);
    wrapEl.style.setProperty("--ember-glow", `rgba(${vr},${vg},${vb},0.6)`);
  } catch(e) {
    wrapEl.style.removeProperty("--ember-color");
    wrapEl.style.removeProperty("--ember-glow");
  }
}

function fillSlotPortrait(n, agentName){
  const wrap = document.getElementById(`slot${n}-wrap`);
  const img = document.getElementById(`slot${n}-portrait`);
  const src = agentPortraitUrl(agentName);
  wrap.classList.toggle("filled", !!src);
  if(src){
    img.src = src;
    const focus = agentFocus(agentName);
    img.style.objectPosition = `${focus.x}% ${focus.y}%`;
    img.style.transformOrigin = `${focus.x}% ${focus.y}%`;
    img.onload = () => sampleThemeColor(img, wrap);
    img.onerror = () => wrap.classList.remove("filled");
  }
}

function applyGraphicOverrides(overrides){
  GFX_ELEMENT_IDS.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const o = (overrides && overrides[id]) || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    el.style.transformOrigin = "top left";
  });
}

function applyState(state){
  document.getElementById("team1-name").textContent = state.team1.name || "";
  document.getElementById("team2-name").textContent = state.team2.name || "";
  setImg("team1-logo", state.team1.logo);
  setImg("team2-logo", state.team2.logo);
  setImg("map-thumb", mapThumbUrl(state.prematch && state.prematch.map));
  document.getElementById("map-name").textContent = (state.prematch && state.prematch.map) || "";

  SLOT_DEFS.forEach(slot => {
    const playerName = (state[slot.team] && state[slot.team].players && state[slot.team].players[slot.idx]) || "";
    const agent = state.postMatch && state.postMatch.players && state.postMatch.players[slot.team] &&
      state.postMatch.players[slot.team][slot.idx] && state.postMatch.players[slot.team][slot.idx].agent;
    document.getElementById(`slot${slot.n}-name`).textContent = playerName;
    fillSlotPortrait(slot.n, agent);
  });

  applyGraphicOverrides(state.graphicOverrides && state.graphicOverrides.characterpick);
}

// Ambient ember particles per slot, same as MOBA's pick slots -- generated
// once since the slot boxes themselves never move.
document.querySelectorAll(".slot-wrap").forEach(wrap => {
  const emberCount = 4;
  for(let i = 0; i < emberCount; i++){
    const ember = document.createElement("div");
    ember.className = "ember";
    const leftPct = 15 + Math.random() * 70;
    const drift = (Math.random() * 16 - 8).toFixed(1);
    const delay = (Math.random() * 3.2).toFixed(2);
    const duration = (2.6 + Math.random() * 1.1).toFixed(2);
    ember.style.cssText = `left:${leftPct}%; --drift:${drift}px; animation-delay:${delay}s; animation-duration:${duration}s;`;
    wrap.appendChild(ember);
  }
});

connect();
</script>
</body>
</html>

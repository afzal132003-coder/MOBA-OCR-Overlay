<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Valorant Hoax Overlay</title>
<style>
  /*
    A SEPARATE, standalone overlay from valorant_ingame.html -- not merged
    into it. Add as its own OBS Browser Source layered above/instead of the
    main In-Game HUD, shown/hidden on demand via the dashboard's Push/Pull
    buttons (hoaxOverlay.visible), independent of the main HUD's own
    visibility.

    Background is assets/valorant_hoax_blank.png -- chroma-keyed from
    hoax-overlay.png's own flat RGB(103,103,103) fill (no PSD/alpha channel
    was available for this one, but that gray was perfectly uniform, so a
    straight color-key extraction came out clean).

    Positions measured directly off that blank template's crop -- no PSD,
    best-estimate only, nudge with Graphic Fixing as needed.

    The spike badge now lives on the main In-Game HUD instead
    (overlay/valorant_ingame.html) -- moved there per explicit request, so
    it isn't duplicated here too (both would react to the same Push Spike
    Badge Up/Down buttons, showing two badges at once if this page and the
    main HUD were both live in OBS simultaneously). This page is team
    plates + score, PLUS the map veto banner below (added later, still the
    same OBS source/file, its own independent push/pull toggle).

    Score here reads state.ocrRoundScore, NOT state.liveScore -- an
    explicit request. liveScore is the main In-Game HUD's own manual/
    editorial round score; this overlay is meant to track the real
    on-screen score instead, fed by a separate, reintroduced OCR reading
    (see OCR_SCORE_TEAM1_KEY/OCR_SCORE_TEAM2_KEY in valorant_engine.py).

    Map veto banner (assets/mapcurrentnextdecider.png) -- CURRENT:/NEXT:/
    DECIDER: labels and the trapezoid/sponsor art are baked into that flat
    1920x1080 PNG already (confirmed via its own alpha channel: real
    content only occupies a thin y:0-28px strip, x:370-1541px -- everything
    else on the canvas is transparent), only the map NAME text and the
    picking team's LOGO per slot are dynamic here. Positions for those six
    dynamic elements are a rough estimate from that same alpha-channel
    analysis (no PSD, no annotated reference coordinates were available) --
    nudge with Graphic Fixing -> Hoax Overlay as needed, same as everything
    else on this page. Independent visibility (#veto-stage.visible) from
    #stage above -- an explicit request, since the two are pushed at
    different points in a broadcast (map veto vs mid-match score) even
    though they live on the same OBS source.
  */

  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-ExtraBold.ttf') format('truetype');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Black.ttf') format('truetype');
    font-weight: 900; font-style: normal;
  }

  :root{ --font-display: 'TT Supermolot Neue Trial', 'Arial Narrow', Arial, sans-serif; }

  html, body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px;
    font-family: var(--font-display);
  }

  #stage{
    position:relative; width:1920px; height:1080px;
    opacity:0;
    transition:opacity 0.4s ease;
  }
  #stage.visible{ opacity:1; }

  .bg-frame{ position:absolute; top:0; left:0; width:1920px; height:1080px; pointer-events:none; }

  .team-logo{ position:absolute; top:3px; width:60px; height:55px; object-fit:contain; display:none; }
  #team1-logo{ left:635px; }
  #team2-logo{ left:1225px; }

  /* This flat PNG has no PSD/layers, so "TEAM"/"0" are permanently baked
     into the art with no way to remove them (unlike valo-overlay.png,
     which had a togglable Background layer) -- these get a solid navy
     backdrop (sampled from the plate's own fill color) sized to fully
     cover the baked placeholder before the real text draws on top,
     instead of the two visibly overlapping. */
  .team-name{
    position:absolute; top:12px; width:100px; height:34px;
    display:flex; align-items:center;
    background:#06133a;
    color:#ffffff; font-weight:800; font-style:italic;
    font-size:15px; letter-spacing:0.3px; text-transform:uppercase;
    white-space:nowrap; overflow:hidden;
  }
  #team1-name{ left:700px; justify-content:flex-start; padding-left:4px; }
  #team2-name{ left:1120px; justify-content:flex-end; padding-right:4px; }

  .team-score{
    position:absolute; top:2px; width:60px; height:50px;
    display:flex; align-items:center; justify-content:center;
    background:#06133a;
    color:#ffffff; font-weight:900; font-style:italic; font-size:26px;
  }
  #team1-score{ left:797px; }
  #team2-score{ left:1063px; }

  /* ---- Map Veto banner (assets/mapcurrentnextdecider.png) ---- */
  #veto-stage{
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    opacity:0; pointer-events:none;
    transition:opacity 0.4s ease;
  }
  #veto-stage.visible{ opacity:1; }

  .veto-map-name{
    position:absolute; top:4px; height:20px;
    display:flex; align-items:center;
    color:#ffffff; font-weight:800; font-style:italic;
    font-size:12px; letter-spacing:0.3px; text-transform:uppercase;
    white-space:nowrap; overflow:hidden;
  }
  #veto-current-map{ left:452px; width:65px; }
  #veto-next-map{ left:589px; width:70px; }
  #veto-decider-map{ left:750px; width:55px; }

  .veto-team-logo{
    position:absolute; top:5px; width:18px; height:18px;
    object-fit:contain; display:none;
  }
  #veto-current-logo{ left:522px; }
  #veto-next-logo{ left:664px; }
  #veto-decider-logo{ left:810px; }
</style>
</head>
<body>

<div id="stage">
  <img class="bg-frame" src="assets/valorant_hoax_blank.png" alt="">

  <img class="team-logo" id="team1-logo" alt="">
  <div class="team-name" id="team1-name"></div>
  <div class="team-score" id="team1-score">0</div>

  <div class="team-score" id="team2-score">0</div>
  <div class="team-name" id="team2-name"></div>
  <img class="team-logo" id="team2-logo" alt="">
</div>

<div id="veto-stage">
  <img class="bg-frame" src="assets/mapcurrentnextdecider.png" alt="">

  <div class="veto-map-name" id="veto-current-map"></div>
  <img class="veto-team-logo" id="veto-current-logo" alt="">

  <div class="veto-map-name" id="veto-next-map"></div>
  <img class="veto-team-logo" id="veto-next-logo" alt="">

  <div class="veto-map-name" id="veto-decider-map"></div>
  <img class="veto-team-logo" id="veto-decider-logo" alt="">
</div>

<script>
const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=valorant_hoax"
  : "ws://localhost:8765?page=valorant_hoax";
let ws;

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") applyState(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function setImg(id, src){
  const el = document.getElementById(id);
  if(src){ el.src = src; el.style.display = "block"; }
  else { el.style.display = "none"; }
}

const GFX_ELEMENT_IDS = [
  "team1-logo","team1-name","team1-score","team2-logo","team2-name","team2-score",
  "veto-current-map","veto-current-logo","veto-next-map","veto-next-logo","veto-decider-map","veto-decider-logo",
];

function applyGraphicOverrides(overrides){
  GFX_ELEMENT_IDS.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const o = (overrides && overrides[id]) || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    el.style.transformOrigin = "top left";
  });
}

function applyState(state){
  document.getElementById("stage").classList.toggle(
    "visible", !!(state.hoaxOverlay && state.hoaxOverlay.visible)
  );

  document.getElementById("team1-name").textContent = state.team1.name || "";
  document.getElementById("team2-name").textContent = state.team2.name || "";
  setImg("team1-logo", state.team1.logo);
  setImg("team2-logo", state.team2.logo);
  // ocrRoundScore, NOT liveScore -- see the file-level comment above for
  // why this overlay tracks a separate, OCR-fed score.
  const ocrScore = state.ocrRoundScore || { team1: 0, team2: 0 };
  document.getElementById("team1-score").textContent = ocrScore.team1;
  document.getElementById("team2-score").textContent = ocrScore.team2;

  document.getElementById("veto-stage").classList.toggle(
    "visible", !!(state.mapVetoOverlay && state.mapVetoOverlay.visible)
  );
  const veto = state.mapVeto || {};
  ["current", "next", "decider"].forEach(slotName => {
    const slot = veto[slotName] || {};
    document.getElementById(`veto-${slotName}-map`).textContent = slot.map || "";
    const teamData = slot.team === "team1" ? state.team1 : slot.team === "team2" ? state.team2 : null;
    setImg(`veto-${slotName}-logo`, teamData ? teamData.logo : "");
  });

  applyGraphicOverrides(state.graphicOverrides && state.graphicOverrides.hoax);
}

connect();
</script>
</body>
</html>

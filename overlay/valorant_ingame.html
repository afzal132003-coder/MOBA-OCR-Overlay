<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Valorant In-Game Overlay</title>
<style>
  /*
    Absolute pixel coordinates on a 1920x1080 canvas, positioned against
    overlay/assets/valorant_ingame_blank.png (rendered from valo-overlay.psd
    with its flat gray placeholder Background layer hidden -- the shapes
    there have no baked-in text/logo, this page supplies all of that live).
    Set the OBS Browser Source to 1920x1080 so this lines up exactly.
    Default positions here are a best estimate from the reference export
    (valo-overlay.png doesn't have real layers for name/logo/score to
    measure against) -- nudge with the Valorant Graphic Fixing tab as
    needed, same workflow as MOBA's overlay.

    This file is now BOTH the main In-Game HUD AND the Hoax Overlay (team
    plates + score + Map Veto banner, formerly valorant_hoax.html) -- an
    explicit request to merge them into a SINGLE OBS Browser Source, since
    the two are mutually exclusive during a broadcast (only one is ever on
    screen at once, see #stage/#hoax-stage below) and there was no reason
    to make the operator manage two separate sources for that. Same
    same-file/cross-fade approach valorant_mvp.html already uses for its
    own MVP/Head-to-Head modes. valorant_hoax.html has been deleted --
    remove that Browser Source from OBS if you still have it added, this
    file covers everything now.
  */

  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-ExtraBold.ttf') format('truetype');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Black.ttf') format('truetype');
    font-weight: 900; font-style: normal;
  }

  :root{
    --font-display: 'TT Supermolot Neue Trial', 'Arial Narrow', Arial, sans-serif;
  }

  html, body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px;
    font-family: var(--font-display);
  }

  /* Visibility is tied directly to the Hoax Overlay's own push/pull --
     an explicit request, the two are mutually exclusive (pushing Hoax
     Overlay up pulls this main HUD off, not stack on top of it). See
     applyState()'s use of state.hoaxOverlay.visible below -- no separate
     state field of its own needed for that. */
  #stage{
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    opacity:0; transform:translateY(-16px);
    transition:opacity 0.4s ease, transform 0.4s ease;
  }
  #stage.visible{ opacity:1; transform:translateY(0); }

  .bg-frame{ position:absolute; top:0; left:0; width:1920px; height:1080px; pointer-events:none; }

  /* Animated glow along the main HUD bar's own real shape -- explicit
     request ("whole top HUD bar" specifically, not the score plates or
     the center banner alone). A CSS drop-shadow pulse follows
     valorant_ingame_blank.png's actual alpha silhouette automatically
     (the diagonal-cut team plates, the notched center banner, all of
     it), so it traces the bar's real irregular outline without needing
     a hand-drawn path for a shape that isn't a plain rectangle -- same
     technique as Player Stats' own panel glow. Only applied via
     #ingame-bg-frame specifically, NOT the shared .bg-frame class alone
     -- #hoax-bg reuses that same class for the separate Hoax Overlay
     screen in this same file, which wasn't asked for here. Toggled by
     hudBoundaryAnimation (see applyState() below) -- rollback switch,
     same pattern as every other animation toggle in this project. */
  #ingame-bg-frame.boundary-glow{
    animation: hudBoundaryGlow 3.2s ease-in-out infinite;
  }
  @keyframes hudBoundaryGlow{
    0%, 100% { filter: drop-shadow(0 0 2px rgba(197,164,107,0.35)); }
    50%      { filter: drop-shadow(0 0 9px rgba(197,164,107,0.85)); }
  }

  .team-logo{ position:absolute; object-fit:contain; display:none; }
  #team1-logo{ left:6px; top:3px; width:50px; height:50px; }
  #team2-logo{ left:1864px; top:3px; width:50px; height:50px; }

  .team-name{
    position:absolute; top:9px; height:38px; width:190px;
    display:flex; align-items:center;
    color:#ffffff; font-weight:800; font-style:italic;
    font-size:22px; letter-spacing:0.5px; text-transform:uppercase;
    white-space:nowrap; overflow:hidden;
  }
  #team1-name{ left:64px; justify-content:flex-start; }
  #team2-name{ left:1666px; justify-content:flex-end; }

  .team-score{
    position:absolute; top:4px; width:112px; height:48px;
    display:flex; align-items:center; justify-content:center;
    color:#12193a; font-weight:900; font-style:italic; font-size:32px;
  }
  #team1-score{ left:266px; }
  #team2-score{ left:1542px; }

  #context-text{
    position:absolute; left:839px; top:80px; width:242px; height:38px;
    display:flex; align-items:center; justify-content:center;
    color:#ffffff; font-weight:700; font-size:15px; letter-spacing:0.5px;
    text-transform:uppercase; text-align:center; white-space:nowrap; overflow:hidden;
  }

  /* Spike badge (assets/spikebadge.png -- a flat white icon on
     transparent). Two independently Graphic-Fixing-adjustable positions
     rather than one element plus a hardcoded animation offset:
     "spike-badge-idle" (before planted) and "spike-badge-planted" (once
     planted) -- both editable in Graphic Fixing's In-Game HUD page, so the
     whole idle->planted travel path is under the operator's control.
     PERSISTENT (stays up until explicitly hidden, no auto-hide timer).
     A third state, "hidden", removes the badge entirely -- a
     manual-only operator override (OCR never sets it), for rounds where
     the badge shouldn't be competing for attention at all.
     Recolored via an inline SVG filter (#spikeRedFilter below), not
     mask-image or a CSS hue-rotate/sepia chain -- mask-image's url() is
     blocked by CORS when this page is opened as a local file, and an SVG
     feFlood+feComposite recolor hits an exact target red off the icon's
     own alpha shape instead of an approximated hue-rotated one. Pulses
     while planted -- Valorant broadcasts use a pulsing red spike icon as
     the "danger, spike is live" cue, so this echoes that instead of just
     sitting there as a static red badge. */
  #spike-badge{
    position:absolute; object-fit:contain;
    transition: left 0.5s cubic-bezier(.34,1.4,.64,1), top 0.5s cubic-bezier(.34,1.4,.64,1),
                width 0.5s ease, height 0.5s ease, opacity 0.3s ease;
  }
  #spike-badge.hidden{ opacity:0; pointer-events:none; }
  #spike-badge.planted{
    animation: spikePulse 1.1s ease-in-out infinite;
  }
  @keyframes spikePulse{
    0%, 100%{
      filter:url(#spikeRedFilter) drop-shadow(0 0 4px rgba(255,24,24,0.85));
      transform:scale(1);
    }
    50%{
      filter:url(#spikeRedFilter) drop-shadow(0 0 16px rgba(255,24,24,1));
      transform:scale(1.07);
    }
  }

  /* Two complete pre-made banner graphics (SPIKEPLANTED_BUG.png /
     spikedefused.png -- the latter replaced BOMBDEFUSED_BUG.png, an
     explicit asset update) supplied as full 1920x1080 canvases with the
     ribbon art at the same spot on both -- cropped down to just that
     ribbon (was 1920x1080, now 356x54 at the crop's original on-canvas
     position) so this element's own size matches every other Graphic
     Fixing box on this page instead of being an awkward stage-sized drag
     target. One <img> whose src toggles between the two covers both
     states. Fully manual -- no OCR, pushed/pulled from the dashboard only. */
  #bug-banner{
    position:absolute; left:783px; top:133px; width:356px; height:54px;
    object-fit:contain;
    opacity:0; pointer-events:none; transition:opacity 0.3s ease;
  }
  #bug-banner.visible{ opacity:1; }

  /* ---- Hoax Overlay -- formerly its own file/OBS source, now merged
     into this one (see the file-level comment above). All ids prefixed
     hoax- to avoid colliding with the main HUD's own team1-logo/team1-
     name/etc. above. Score here reads state.ocrRoundScore, NOT state.
     liveScore -- liveScore is the main HUD's own manual/editorial round
     score; this overlay tracks the real on-screen score instead, fed by a
     separate OCR reading (see OCR_SCORE_TEAM1_KEY/OCR_SCORE_TEAM2_KEY in
     valorant_engine.py).

     Background is one of TWO full-canvas graphics -- assets/leftattacker.
     png (left/team1 plate red, right/team2 plate teal) or assets/
     leftdefender.png (colors swapped the other way) -- picked by the
     operator's own manual leftSide toggle (hoaxOverlay.leftSide), NOT
     derived from attackingTeam. Both are pixel-identical aside from that
     color swap (leftattacker.png is leftdefender.png flipped
     horizontally) so team plate positions are the same regardless of
     which is showing -- only #hoax-bg's src changes, see applyState().
     ---- */
  #hoax-stage{
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    opacity:0;
    transition:opacity 0.4s ease;
  }
  #hoax-stage.visible{ opacity:1; }

  .hoax-team-logo{ position:absolute; top:3px; width:60px; height:55px; object-fit:contain; display:none; }
  #hoax-team1-logo{ left:635px; }
  #hoax-team2-logo{ left:1225px; }

  /* No covering backdrop needed here (unlike the old valorant_hoax_blank.
     png) -- leftattacker.png/leftdefender.png are clean, nothing baked in
     to hide, draw text directly. */
  .hoax-team-name{
    position:absolute; top:12px; width:100px; height:34px;
    display:flex; align-items:center;
    color:#ffffff; font-weight:800; font-style:italic;
    font-size:15px; letter-spacing:0.3px; text-transform:uppercase;
    white-space:nowrap; overflow:hidden;
  }
  #hoax-team1-name{ left:700px; justify-content:flex-start; padding-left:4px; }
  #hoax-team2-name{ left:1120px; justify-content:flex-end; padding-right:4px; }

  .hoax-team-score{
    position:absolute; top:2px; width:60px; height:50px;
    display:flex; align-items:center; justify-content:center;
    color:#ffffff; font-weight:900; font-style:italic; font-size:26px;
  }
  #hoax-team1-score{ left:797px; }
  #hoax-team2-score{ left:1063px; }

  /* ---- Map Veto banner -- lives on this same page too, its OWN
     independent push/pull (mapVetoOverlay.visible) separate from
     hoaxOverlay.visible above, shown TOGETHER with the Hoax Overlay's
     team plates (confirmed real usage). An explicit correction: the
     original single mapcurrentnextdecider.png had BOTH halves (CURRENT/
     NEXT/DECIDER on the left, BHARAT GAMING MASTERS on the right) baked
     into one 1920x1080 canvas at fixed positions ~370-1541px, nowhere
     near the true corners -- split into two separately-cropped assets
     (mapcurrentnextdecider_left.png / _right.png, each the tight alpha
     bbox of its half, 477x28) so each piece can be positioned
     independently flush against its own corner instead of wherever the
     original single image happened to bake them. This also incidentally
     clears the collision with the Hoax team plate row (hoax-team1-logo
     etc, x:635-1290ish) that the old centered single-image version had --
     the two pieces now sit in the corners, well outside that x-range. */
  #veto-stage{
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    opacity:0; pointer-events:none;
    transition:opacity 0.4s ease;
  }
  #veto-stage.visible{ opacity:1; }

  /* top:65 -- lower than the very top edge, on purpose (per a marked
     reference screenshot): sits just below the Hoax team plate row
     (y:2-58) instead of at the true top edge, roughly where a real
     broadcast's own equivalent bar sits above its player-icon rows. Best
     estimate from that reference, not a measured value -- nudge via
     Graphic Fixing if it needs to move further. */
  .veto-banner-piece{ position:absolute; top:65px; width:477px; height:28px; }
  #veto-banner-left{ left:24px; }
  #veto-banner-right{ right:24px; }

  .veto-map-name{
    position:absolute; top:69px; height:20px;
    display:flex; align-items:center;
    color:#ffffff; font-weight:800; font-style:italic;
    font-size:12px; letter-spacing:0.3px; text-transform:uppercase;
    white-space:nowrap; overflow:hidden;
  }
  #veto-current-map{ left:106px; width:65px; }
  #veto-next-map{ left:243px; width:70px; }
  #veto-decider-map{ left:404px; width:55px; }

  .veto-team-logo{
    position:absolute; top:70px; width:18px; height:18px;
    object-fit:contain; display:none;
  }
  #veto-current-logo{ left:176px; }
  #veto-next-logo{ left:318px; }
  #veto-decider-logo{ left:464px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="spikeRedFilter" x="-30%" y="-30%" width="160%" height="160%">
    <feFlood flood-color="#ff1414" result="flood"/>
    <feComposite in="flood" in2="SourceAlpha" operator="in"/>
  </filter>
</svg>

<div id="stage">
  <img class="bg-frame" id="ingame-bg-frame" src="assets/valorant_ingame_blank.png" alt="">

  <img class="team-logo" id="team1-logo" alt="">
  <div class="team-name" id="team1-name"></div>
  <div class="team-score" id="team1-score">0</div>

  <div class="team-score" id="team2-score">0</div>
  <div class="team-name" id="team2-name"></div>
  <img class="team-logo" id="team2-logo" alt="">

  <div id="context-text"></div>

  <img id="spike-badge" src="assets/spikebadge.png" alt="">

  <img id="bug-banner" alt="">
</div>

<div id="hoax-stage">
  <img class="bg-frame" id="hoax-bg" alt="">

  <img class="hoax-team-logo" id="hoax-team1-logo" alt="">
  <div class="hoax-team-name" id="hoax-team1-name"></div>
  <div class="hoax-team-score" id="hoax-team1-score">0</div>

  <div class="hoax-team-score" id="hoax-team2-score">0</div>
  <div class="hoax-team-name" id="hoax-team2-name"></div>
  <img class="hoax-team-logo" id="hoax-team2-logo" alt="">
</div>

<div id="veto-stage">
  <img class="veto-banner-piece" id="veto-banner-left" src="assets/mapcurrentnextdecider_left.png" alt="">
  <img class="veto-banner-piece" id="veto-banner-right" src="assets/mapcurrentnextdecider_right.png" alt="">

  <div class="veto-map-name" id="veto-current-map"></div>
  <img class="veto-team-logo" id="veto-current-logo" alt="">

  <div class="veto-map-name" id="veto-next-map"></div>
  <img class="veto-team-logo" id="veto-next-logo" alt="">

  <div class="veto-map-name" id="veto-decider-map"></div>
  <img class="veto-team-logo" id="veto-decider-logo" alt="">
</div>

<script>
const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=valorant_ingame"
  : "ws://localhost:8765?page=valorant_ingame";
let ws;

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") applyState(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function setLogo(id, src){
  const el = document.getElementById(id);
  if(src){ el.src = src; el.style.display = "block"; }
  else { el.style.display = "none"; }
}

const GFX_ELEMENT_IDS = ["team1-logo","team1-name","team1-score","team2-logo","team2-name","team2-score","context-text","bug-banner"];
const HOAX_GFX_ELEMENT_IDS = [
  "hoax-team1-logo","hoax-team1-name","hoax-team1-score","hoax-team2-logo","hoax-team2-name","hoax-team2-score",
  "veto-banner-left","veto-banner-right",
  "veto-current-map","veto-current-logo","veto-next-map","veto-next-logo","veto-decider-map","veto-decider-logo",
];

function setBugBanner(mode){
  const el = document.getElementById("bug-banner");
  if(mode === "planted"){
    el.src = "assets/SPIKEPLANTED_BUG.png";
    el.classList.add("visible");
  } else if(mode === "defused"){
    el.src = "assets/spikedefused.png";
    el.classList.add("visible");
  } else {
    el.classList.remove("visible");
  }
}

// Base (un-nudged) positions for the badge's two states -- Graphic
// Fixing's dx/dy/scale for "spike-badge-idle"/"spike-badge-planted" apply
// on top of these directly to left/top/width/height (not a transform), so
// the idle->planted travel is a real position change fully under the
// operator's control, not a fixed CSS keyframe offset.
// Idle sits BELOW the Group/Match Context badge (top:80, height:38 -- ends
// at y:118); planted travels UP to sit ABOVE it instead. Both are just
// starting points -- the operator marks the real positions in Graphic
// Fixing themselves.
const BADGE_IDLE_BASE = { left:905, top:160, width:110, height:95 };
const BADGE_PLANTED_BASE = { left:905, top:15, width:110, height:95 };

function effectiveBadgeRect(base, overrides, id){
  const o = (overrides && overrides[id]) || {};
  return {
    left: base.left + (o.dx || 0), top: base.top + (o.dy || 0),
    width: base.width * (o.scale || 1), height: base.height * (o.scale || 1),
  };
}

function applyGraphicOverridesTo(ids, overrides){
  ids.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const o = (overrides && overrides[id]) || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    el.style.transformOrigin = "top left";
  });
}

function applyState(state){
  // Mutually exclusive with the Hoax Overlay -- pushing that up pulls
  // this main HUD off, not a separate independent toggle.
  const hoaxVisible = !!(state.hoaxOverlay && state.hoaxOverlay.visible);
  document.getElementById("stage").classList.toggle("visible", !hoaxVisible);
  document.getElementById("hoax-stage").classList.toggle("visible", hoaxVisible);
  document.getElementById("ingame-bg-frame").classList.toggle(
    "boundary-glow", state.hudBoundaryAnimation !== false
  );

  document.getElementById("team1-name").textContent = state.team1.name || "";
  document.getElementById("team2-name").textContent = state.team2.name || "";
  setLogo("team1-logo", state.team1.logo);
  setLogo("team2-logo", state.team2.logo);
  document.getElementById("team1-score").textContent = state.liveScore.team1;
  document.getElementById("team2-score").textContent = state.liveScore.team2;

  const ctx = state.prematch && state.prematch.context;
  const line1 = (ctx && ctx.line1) || "";
  const line2 = (ctx && ctx.line2) || "";
  document.getElementById("context-text").textContent =
    [line1, line2].filter(Boolean).join(" - ");

  const overrides = state.graphicOverrides && state.graphicOverrides.ingame;
  const badgeMode = (state.spikeBadge && state.spikeBadge.mode) || "idle";
  const planted = badgeMode === "planted";
  const rect = effectiveBadgeRect(
    planted ? BADGE_PLANTED_BASE : BADGE_IDLE_BASE, overrides,
    planted ? "spike-badge-planted" : "spike-badge-idle",
  );
  const badge = document.getElementById("spike-badge");
  badge.style.left = rect.left + "px";
  badge.style.top = rect.top + "px";
  badge.style.width = rect.width + "px";
  badge.style.height = rect.height + "px";
  badge.classList.toggle("planted", planted);
  badge.classList.toggle("hidden", badgeMode === "hidden");

  setBugBanner((state.bugBanner && state.bugBanner.mode) || "hidden");

  applyGraphicOverridesTo(GFX_ELEMENT_IDS, overrides);

  // ---- Hoax Overlay + Map Veto ----
  // Manual operator toggle, NOT derived from attackingTeam -- see the CSS
  // comment above.
  const leftSide = (state.hoaxOverlay && state.hoaxOverlay.leftSide) || "attacker";
  document.getElementById("hoax-bg").src =
    leftSide === "defender" ? "assets/leftdefender.png" : "assets/leftattacker.png";
  document.getElementById("hoax-team1-name").textContent = state.team1.name || "";
  document.getElementById("hoax-team2-name").textContent = state.team2.name || "";
  setLogo("hoax-team1-logo", state.team1.logo);
  setLogo("hoax-team2-logo", state.team2.logo);
  // ocrRoundScore, NOT liveScore -- see the CSS comment above for why this
  // overlay tracks a separate, OCR-fed score.
  const ocrScore = state.ocrRoundScore || { team1: 0, team2: 0 };
  document.getElementById("hoax-team1-score").textContent = ocrScore.team1;
  document.getElementById("hoax-team2-score").textContent = ocrScore.team2;

  document.getElementById("veto-stage").classList.toggle(
    "visible", !!(state.mapVetoOverlay && state.mapVetoOverlay.visible)
  );
  const veto = state.mapVeto || {};
  ["current", "next", "decider"].forEach(slotName => {
    const slot = veto[slotName] || {};
    document.getElementById(`veto-${slotName}-map`).textContent = slot.map || "";
    const teamData = slot.team === "team1" ? state.team1 : slot.team === "team2" ? state.team2 : null;
    setLogo(`veto-${slotName}-logo`, teamData ? teamData.logo : "");
  });

  applyGraphicOverridesTo(HOAX_GFX_ELEMENT_IDS, state.graphicOverrides && state.graphicOverrides.hoax);
}

connect();
</script>
</body>
</html>

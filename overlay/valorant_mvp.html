<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Valorant MVP Overlay</title>
<style>
  /*
    Absolute pixel coordinates on a 1920x1080 canvas, measured against
    overlay/assets/playermvp-plain.png (the blank template -- KILLS/DEATH/
    ASSIST/F.BLOODS labels and the "CATALYST FOR CHANGE" tagline are baked
    into that background already, only the VALUES and identity fields here
    are dynamic). Cross-checked against playermvp.png (the filled
    reference) for team logo/name/player-name/photo positions, which
    aren't separate layers in either PNG -- best estimate, nudge with the
    Graphic Fixing tab as needed.

    Per an explicit instruction this session: the big art area on the
    right shows the player's PICKED AGENT portrait (from Agent Pick /
    Post-Match's Agent field), not an uploaded photo -- even though
    playermvp.png's own reference shows a real photo there.

    Head-to-Head lives in THIS SAME file/OBS source as a second display
    mode (state.mvpScreenMode: "mvp" | "headtohead"), not a separate page
    -- an explicit request. #mvp-content/#h2h-content each carry their own
    layout (own bg-frame, own dynamic elements) and cross-fade via the
    .screen-content/.visible classes below when the operator toggles mode
    from the dashboard. Head-to-Head's own positions are measured off
    overlay/assets/headtohead.png (no PSD, no obvious per-player value
    slots baked into that flat art either) -- best estimate, nudge with
    Graphic Fixing -> Head to Head as needed, same as every other PSD-less
    asset in this project. Head-to-Head's two agent portraits use the SAME
    full-body art + object-fit:contain/bottom + bottom-pivoted sway
    animation as MVP's own big art area (see #agent-portrait below) --
    just resized/repositioned to fit inside Head-to-Head's smaller chevron
    zones instead of MVP's big 700x940 area.
  */

  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-ExtraBold.ttf') format('truetype');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Black.ttf') format('truetype');
    font-weight: 900; font-style: normal;
  }

  :root{ --font-display: 'TT Supermolot Neue Trial', 'Arial Narrow', Arial, sans-serif; }

  html, body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px;
    font-family: var(--font-display);
  }

  #stage{
    position:relative; width:1920px; height:1080px;
    opacity:0; transform:translateY(-16px);
    animation: enter 0.6s ease forwards;
  }
  @keyframes enter{ to{ opacity:1; transform:translateY(0); } }

  .bg-frame{ position:absolute; top:0; left:0; width:1920px; height:1080px; pointer-events:none; }

  /* MVP and Head-to-Head each get their own wrap so the operator's mode
     toggle can cross-fade between them without touching the sponsor
     branding above. */
  .screen-content{
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    opacity:0; transform:translateY(20px) scale(0.98);
    pointer-events:none;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .screen-content.visible{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }

  #team-logo{ position:absolute; left:185px; top:188px; width:100px; height:90px; object-fit:contain; display:none; }

  #team-name{
    position:absolute; left:330px; top:197px; width:400px; height:32px;
    color:#c8cede; font-weight:800; font-style:italic; font-size:22px;
    letter-spacing:1px; text-transform:uppercase; white-space:nowrap; overflow:hidden;
  }
  #player-name{
    position:absolute; left:330px; top:230px; width:540px; height:60px;
    color:#f2c14e; font-weight:900; font-style:italic; font-size:46px;
    text-transform:uppercase; white-space:nowrap; overflow:hidden;
  }

  .stat-value{
    position:absolute; left:700px; width:250px; height:70px;
    display:flex; align-items:center;
    color:#12193a; font-weight:900; font-size:34px;
  }
  #stat-kills{ top:355px; }
  #stat-deaths{ top:465px; }
  #stat-assists{ top:578px; }
  #stat-firstbloods{ top:690px; }

  /* #agent-portrait (outer) is the Graphic-Fixing target -- static
     position/size, matches its old id so any already-saved Graphic Fixing
     position for it keeps working. #agent-portrait-img (inner) carries the
     "alive" sway on its own separate transform, same outer/inner split
     used everywhere else in this project so the two transforms don't
     fight each other. This is a flat single-image portrait (not a rigged
     character), so a real independent legs-still/torso-moves rig isn't
     possible -- instead the rotate/skew pivots from the very BOTTOM of the
     box (feet), same trick as a tree swaying from its trunk base: the
     pivot point itself barely moves while everything further from it
     (the head/shoulders) sways more, reading as "planted feet, live
     upper body" without needing the art itself split into layers. */
  #agent-portrait{
    position:absolute; left:1150px; top:90px; width:700px; height:940px;
    display:none;
  }
  #agent-portrait.visible{ display:block; }
  #agent-portrait-img{
    width:100%; height:100%; object-fit:contain; object-position:bottom;
    transform-origin:50% 100%;
    animation: agentSway 6s ease-in-out infinite;
  }
  @keyframes agentSway{
    0%, 100%{ transform:rotate(-0.6deg) skewX(-0.35deg); }
    50%{ transform:rotate(0.6deg) skewX(0.35deg); }
  }

  /* ---- Head to Head (assets/headtohead.png) ---- */
  /* Team logo sits OUTSIDE the name on each side -- left player's logo to
     the left of their IGN, right player's logo to the right of theirs
     (mirrored), per an explicit request. */
  .h2h-logo{ position:absolute; top:35px; width:50px; height:50px; object-fit:contain; display:none; }
  #h2h-team1-logo{ left:20px; }
  #h2h-team2-logo{ left:1850px; }

  .h2h-name{
    position:absolute; top:35px; width:600px; height:50px;
    /* Theme's dark blue -- same #12193a as .h2h-stat above, was gold
       (#f2c14e) which no longer matches the recolored header behind it. */
    color:#12193a; font-weight:900; font-style:italic; font-size:32px;
    text-transform:uppercase; white-space:nowrap; overflow:hidden;
  }
  #h2h-team1-name{ left:80px; text-align:right; }
  #h2h-team2-name{ left:1240px; text-align:left; }

  .h2h-stat{
    position:absolute; width:150px; height:40px;
    display:flex; align-items:center; justify-content:center;
    /* Theme's dark blue -- same #12193a used for the in-game HUD's round
       score numbers (valorant_ingame.html .team-score), the same "dark
       text on a gold/tan plate" situation as these K/D/A/FB values. */
    color:#12193a; font-weight:900; font-size:28px;
  }
  .h2h-stat.p1{ left:930px; }
  .h2h-stat.p2{ left:1110px; }
  #h2h-p1-kills, #h2h-p2-kills{ top:312px; }
  #h2h-p1-deaths, #h2h-p2-deaths{ top:432px; }
  #h2h-p1-assists, #h2h-p2-assists{ top:547px; }
  #h2h-p1-firstbloods, #h2h-p2-firstbloods{ top:667px; }

  /* Picked agent portrait, framed within each side's gold chevron cluster
     -- SAME treatment as MVP's own big art area (full-body art, contain,
     bottom-anchored, bottom-pivoted sway), not the tight headshot crop
     Character Pick/Team Chemistry Stats use -- object-fit:cover on a
     full-body image here was cropping off both the head and feet. Outer
     wrap (Graphic-Fixing target, static) / inner img (sway animation),
     same split as #agent-portrait / #agent-portrait-img above. */
  .h2h-portrait-wrap{ position:absolute; top:182px; width:380px; height:447px; display:none; }
  .h2h-portrait-wrap.visible{ display:block; }
  #h2h-p1-portrait-wrap{ left:80px; }
  #h2h-p2-portrait-wrap{ left:1460px; }
  .h2h-portrait-img{
    width:100%; height:100%; object-fit:contain; object-position:bottom;
    transform-origin:50% 100%;
    animation: agentSway 6s ease-in-out infinite;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="mvp-content" class="screen-content visible">
    <img class="bg-frame" src="assets/playermvp-plain.png" alt="">

    <img id="team-logo" alt="">
    <div id="team-name"></div>
    <div id="player-name"></div>

    <div class="stat-value" id="stat-kills">0</div>
    <div class="stat-value" id="stat-deaths">0</div>
    <div class="stat-value" id="stat-assists">0</div>
    <div class="stat-value" id="stat-firstbloods">0</div>

    <div id="agent-portrait">
      <img id="agent-portrait-img" alt="">
    </div>
  </div>

  <div id="h2h-content" class="screen-content">
    <img class="bg-frame" src="assets/headtohead.png" alt="">

    <div class="h2h-portrait-wrap" id="h2h-p1-portrait-wrap">
      <img class="h2h-portrait-img" id="h2h-p1-portrait-img" alt="">
    </div>
    <div class="h2h-portrait-wrap" id="h2h-p2-portrait-wrap">
      <img class="h2h-portrait-img" id="h2h-p2-portrait-img" alt="">
    </div>

    <img class="h2h-logo" id="h2h-team1-logo" alt="">
    <div class="h2h-name" id="h2h-team1-name"></div>
    <div class="h2h-name" id="h2h-team2-name"></div>
    <img class="h2h-logo" id="h2h-team2-logo" alt="">

    <div class="h2h-stat p1" id="h2h-p1-kills">0</div>
    <div class="h2h-stat p1" id="h2h-p1-deaths">0</div>
    <div class="h2h-stat p1" id="h2h-p1-assists">0</div>
    <div class="h2h-stat p1" id="h2h-p1-firstbloods">0</div>

    <div class="h2h-stat p2" id="h2h-p2-kills">0</div>
    <div class="h2h-stat p2" id="h2h-p2-deaths">0</div>
    <div class="h2h-stat p2" id="h2h-p2-assists">0</div>
    <div class="h2h-stat p2" id="h2h-p2-firstbloods">0</div>
  </div>
</div>

<script>
// Same agent name -> filename table as dashboard.html's Agent Pick /
// valorant_teamchemistry.html -- duplicated per standalone-file convention.
const VAL_AGENT_MAP = {};
[
  ["Astra","Astra.png"], ["Breach","Breach.png"], ["Brimstone","Brimstone.png"],
  ["Chamber","Chamber.png"], ["Fade","Fade.png"], ["Harbor","Harbor.png"],
  ["Jett","Jett.png"], ["KAY/O","Kayo.png"], ["Killjoy","KillJoy.png"],
  ["Neon","Neon.png"], ["Omen","Omen.png"], ["Phoenix","Phoenix.png"],
  ["Raze","Raze.png"], ["Reyna","Reyna.png"], ["Sage","Sage.png"],
  ["Skye","Skye.png"], ["Sova","Sova.png"], ["Cypher","Sypher.png"],
  ["Viper","Viper.png"], ["Yoru","Yoru.png"],
  ["Iso","Iso.png"], ["Waylay","Waylay.png"], ["Gekko","Gekko.png"], ["Tejo","Tejo.png"],
  ["Clove","Clove.png"], ["Deadlock","Deadlock.png"], ["Vyse","Vyse.png"],
].forEach(([name, file]) => { VAL_AGENT_MAP[name.toLowerCase()] = file; });

function agentPortraitUrl(agentName){
  const file = VAL_AGENT_MAP[(agentName || "").toLowerCase()];
  return file ? `assets/Valorant Agents/${file}` : "";
}

const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=valorant_mvp"
  : "ws://localhost:8765?page=valorant_mvp";
let ws;

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") applyState(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function setImg(id, src){
  const el = document.getElementById(id);
  if(src){ el.src = src; el.style.display = "block"; }
  else { el.style.display = "none"; }
}

// agent-portrait is a wrap(static, Graphic-Fixing target)/img(animated
// sway) pair -- see the outer/inner split note in the CSS above.
function setWrappedImg(wrapId, imgId, src){
  const wrap = document.getElementById(wrapId);
  const img = document.getElementById(imgId);
  wrap.classList.toggle("visible", !!src);
  if(src) img.src = src;
}

const GFX_ELEMENT_IDS = ["team-logo","team-name","player-name","stat-kills","stat-deaths","stat-assists","stat-firstbloods","agent-portrait"];
const H2H_GFX_ELEMENT_IDS = ["h2h-team1-logo","h2h-team1-name","h2h-team2-name","h2h-team2-logo","h2h-p1-portrait-wrap","h2h-p2-portrait-wrap","h2h-p1-kills","h2h-p1-deaths","h2h-p1-assists","h2h-p1-firstbloods","h2h-p2-kills","h2h-p2-deaths","h2h-p2-assists","h2h-p2-firstbloods"];

function applyGraphicOverridesTo(ids, overrides){
  ids.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const o = (overrides && overrides[id]) || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    el.style.transformOrigin = "top left";
  });
}

// Sequenced, not a simultaneous cross-fade -- an explicit request: the
// outgoing screen goes off COMPLETELY first, then the incoming one
// appears, rather than both fading through each other at once. Matches
// the .screen-content CSS transition duration (0.5s) plus a small buffer.
let mvpCurrentScreenMode = null;
const MVP_TRANSITION_MS = 550;

function mvpSetScreenMode(mode){
  const mvpEl = document.getElementById("mvp-content");
  const h2hEl = document.getElementById("h2h-content");
  if(mvpCurrentScreenMode === null){
    // First state_sync after page load -- show directly, no off/on dance.
    mvpCurrentScreenMode = mode;
    mvpEl.classList.toggle("visible", mode === "mvp");
    h2hEl.classList.toggle("visible", mode === "headtohead");
    return;
  }
  if(mode === mvpCurrentScreenMode) return;
  mvpCurrentScreenMode = mode;
  mvpEl.classList.remove("visible");
  h2hEl.classList.remove("visible");
  setTimeout(() => {
    if(mvpCurrentScreenMode !== mode) return; // superseded by a newer change
    if(mode === "mvp") mvpEl.classList.add("visible");
    else if(mode === "headtohead") h2hEl.classList.add("visible");
  }, MVP_TRANSITION_MS);
}

function h2hPlayerStats(state, team, idx){
  const hasSelection = (team === "team1" || team === "team2") && idx !== null && idx !== undefined;
  const teamState = hasSelection ? state[team] : null;
  const playerStats = hasSelection && state.postMatch && state.postMatch.players &&
    state.postMatch.players[team] && state.postMatch.players[team][idx];
  return {
    name: (teamState && teamState.players && teamState.players[idx]) || "",
    logo: teamState && teamState.logo,
    agent: playerStats && playerStats.agent,
    kills: (playerStats && playerStats.kills) || 0,
    deaths: (playerStats && playerStats.deaths) || 0,
    assists: (playerStats && playerStats.assists) || 0,
    firstBloods: (playerStats && playerStats.firstBloods) || 0,
  };
}

function applyState(state){
  const mvp = state.mvp || {};
  const team = mvp.team;
  const idx = mvp.playerIndex;
  const hasSelection = team === "team1" || team === "team2";
  const teamState = hasSelection ? state[team] : null;
  const playerStats = hasSelection && state.postMatch && state.postMatch.players &&
    state.postMatch.players[team] && state.postMatch.players[team][idx];

  setImg("team-logo", teamState && teamState.logo);
  document.getElementById("team-name").textContent = (teamState && teamState.name) || "";
  document.getElementById("player-name").textContent = (teamState && teamState.players && teamState.players[idx]) || "";

  document.getElementById("stat-kills").textContent = (playerStats && playerStats.kills) || 0;
  document.getElementById("stat-deaths").textContent = (playerStats && playerStats.deaths) || 0;
  document.getElementById("stat-assists").textContent = (playerStats && playerStats.assists) || 0;
  document.getElementById("stat-firstbloods").textContent = (playerStats && playerStats.firstBloods) || 0;

  setWrappedImg("agent-portrait", "agent-portrait-img", agentPortraitUrl(playerStats && playerStats.agent));

  applyGraphicOverridesTo(GFX_ELEMENT_IDS, state.graphicOverrides && state.graphicOverrides.mvp);

  const h2h = state.headToHead || {};
  const p1 = h2hPlayerStats(state, "team1", h2h.team1 && h2h.team1.playerIndex);
  const p2 = h2hPlayerStats(state, "team2", h2h.team2 && h2h.team2.playerIndex);
  document.getElementById("h2h-team1-name").textContent = p1.name;
  document.getElementById("h2h-team2-name").textContent = p2.name;
  setImg("h2h-team1-logo", p1.logo);
  setImg("h2h-team2-logo", p2.logo);
  setWrappedImg("h2h-p1-portrait-wrap", "h2h-p1-portrait-img", agentPortraitUrl(p1.agent));
  setWrappedImg("h2h-p2-portrait-wrap", "h2h-p2-portrait-img", agentPortraitUrl(p2.agent));
  document.getElementById("h2h-p1-kills").textContent = p1.kills;
  document.getElementById("h2h-p1-deaths").textContent = p1.deaths;
  document.getElementById("h2h-p1-assists").textContent = p1.assists;
  document.getElementById("h2h-p1-firstbloods").textContent = p1.firstBloods;
  document.getElementById("h2h-p2-kills").textContent = p2.kills;
  document.getElementById("h2h-p2-deaths").textContent = p2.deaths;
  document.getElementById("h2h-p2-assists").textContent = p2.assists;
  document.getElementById("h2h-p2-firstbloods").textContent = p2.firstBloods;

  applyGraphicOverridesTo(H2H_GFX_ELEMENT_IDS, state.graphicOverrides && state.graphicOverrides.headtohead);

  mvpSetScreenMode(state.mvpScreenMode || "mvp");
}

connect();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Valorant Team Chemistry Stats Overlay</title>
<style>
  /*
    Absolute pixel coordinates on a 1920x1080 canvas, measured directly off
    the layer boxes inside "teamchemistrystats - removed bg.psd" (P1-P10
    row groups, K/D/A/ACS/KD/FB/PLANTS header labels) -- see that PSD if
    these ever need re-measuring. Header team name/logo/score positions are
    estimated from the flattened teamchemistrystats.png reference since
    those aren't separate layers in the removed-bg PSD; nudge with the
    Valorant Graphic Fixing tab as needed.
  */

  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-ExtraBold.ttf') format('truetype');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'TT Supermolot Neue Trial';
    src: url('assets/fonts/TTSupermolotNeueTrial-Black.ttf') format('truetype');
    font-weight: 900; font-style: normal;
  }

  :root{ --font-display: 'TT Supermolot Neue Trial', 'Arial Narrow', Arial, sans-serif; }

  html, body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    width:1920px; height:1080px;
    font-family: var(--font-display);
  }

  #stage{
    position:relative; width:1920px; height:1080px;
    opacity:0; transform:translateY(-16px);
    animation: enter 0.6s ease forwards;
  }
  @keyframes enter{ to{ opacity:1; transform:translateY(0); } }

  .bg-frame{ position:absolute; top:0; left:0; width:1920px; height:1080px; pointer-events:none; }

  .team-logo{ position:absolute; object-fit:contain; display:none; }
  #team1-logo{ left:660px; top:358px; width:95px; height:85px; }
  #team2-logo{ left:1165px; top:358px; width:95px; height:85px; }

  .team-name{
    position:absolute; top:378px; width:270px; height:46px;
    display:flex; align-items:center;
    color:#ffffff; font-weight:800; font-style:italic;
    font-size:26px; letter-spacing:0.5px; text-transform:uppercase;
    white-space:nowrap; overflow:hidden;
  }
  #team1-name{ left:280px; justify-content:flex-end; text-align:right; }
  #team2-name{ left:1370px; justify-content:flex-start; text-align:left; }

  #series-score{
    position:absolute; left:827px; top:378px; width:267px; height:46px;
    display:flex; align-items:center; justify-content:center;
    color:#1a1a2e; font-weight:900; font-size:34px;
  }

  .stat-cell{
    position:absolute; height:60px;
    display:flex; align-items:center;
    color:#12193a; font-weight:800; font-size:22px;
  }
  .stat-cell.name-cell{ color:#ffffff; font-style:italic; font-size:20px; text-transform:uppercase; overflow:hidden; white-space:nowrap; }
  .stat-cell.center{ justify-content:center; text-align:center; }

  /* background-color is a fallback backdrop, matching the team-color tag
     this box replaces -- shows through if the uploaded photo has its own
     transparent background (a cutout headshot), instead of the photo
     looking like it didn't load at all. Border keeps the box visible and
     framed even then. */
  .row-photo{ position:absolute; width:99px; height:76px; object-fit:cover; object-position:center 15%; display:none; box-sizing:border-box; border:2px solid #d4af6a; }
  /* Fixed per screen side, NOT win/loss -- left (team1) is always the
     defender color (green), right (team2) is always the attacker color
     (red), same convention Valorant's own UI uses throughout. Explicitly
     NOT tied to postMatch.result or attackingTeam -- always this side. */
  .row-photo.team1{ background-color:#3ddc6a; }
  .row-photo.team2{ background-color:#fa4e5e; }
</style>
</head>
<body>

<div id="stage">
  <img class="bg-frame" src="assets/valorant_teamchemistry_blank.png" alt="">

  <img class="team-logo" id="team1-logo" alt="">
  <div class="team-name" id="team1-name"></div>
  <div id="series-score">0-0</div>
  <div class="team-name" id="team2-name"></div>
  <img class="team-logo" id="team2-logo" alt="">

  <div id="rows"></div>
</div>

<script>
// Row anchor = top-left of the PSD's P1-P10 group boxes; column dx/width
// are each column's left edge minus the row's x, taken from the K/D/A,
// ACS, KD, FB, PLANTS header label boxes (and the Line-separator boxes in
// between) in "teamchemistrystats - removed bg.psd".

// Same agent name -> filename table as dashboard.html's Agent Pick --
// duplicated here rather than shared since this is a standalone page (same
// reasoning as every other overlay file in this project). A null file
// means the agent is real but has no portrait image yet -- the box just
// stays on its win/loss color with nothing on top of it instead of a
// broken image, same graceful-degradation behavior as the picker.
const VAL_AGENT_MAP = {};
[
  ["Astra","Astra.png"], ["Breach","Breach.png"], ["Brimstone","Brimstone.png"],
  ["Chamber","Chamber.png"], ["Fade","Fade.png"], ["Harbor","Harbor.png"],
  ["Jett","Jett.png"], ["KAY/O","Kayo.png"], ["Killjoy","KillJoy.png"],
  ["Neon","Neon.png"], ["Omen","Omen.png"], ["Phoenix","Phoenix.png"],
  ["Raze","Raze.png"], ["Reyna","Reyna.png"], ["Sage","Sage.png"],
  ["Skye","Skye.png"], ["Sova","Sova.png"], ["Cypher","Sypher.png"],
  ["Viper","Viper.png"], ["Yoru","Yoru.png"],
  ["Iso","Iso.webp"], ["Waylay","Waylay.webp"], ["Gekko","Gekko.webp"], ["Tejo","Tejo.webp"],
  ["Clove","Clove.webp"], ["Deadlock","Deadlock.webp"], ["Vyse","Vyse.webp"],
].forEach(([name, file]) => { VAL_AGENT_MAP[name.toLowerCase()] = file; });

function agentPortraitUrl(agentName){
  const file = VAL_AGENT_MAP[(agentName || "").toLowerCase()];
  return file ? `assets/Valorant Agents/${file}` : "";
}

const ROW_DEFS = [
  {n:1, team:"team1", idx:0, x:137, y:507},
  {n:2, team:"team1", idx:1, x:137, y:595},
  {n:3, team:"team1", idx:2, x:137, y:682},
  {n:4, team:"team1", idx:3, x:137, y:770},
  {n:5, team:"team1", idx:4, x:137, y:857},
  {n:6, team:"team2", idx:0, x:989, y:507},
  {n:7, team:"team2", idx:1, x:989, y:595},
  {n:8, team:"team2", idx:2, x:989, y:682},
  {n:9, team:"team2", idx:3, x:989, y:770},
  {n:10, team:"team2", idx:4, x:989, y:857},
];
const COLS = [
  {key:"name",   dx:108, w:275, cls:"name-cell"},
  {key:"kda",    dx:409, w:74,  cls:"center"},
  {key:"acs",    dx:504, w:59,  cls:"center"},
  {key:"kd",     dx:578, w:40,  cls:"center"},
  {key:"fb",     dx:657, w:36,  cls:"center"},
  {key:"plants", dx:714, w:72,  cls:"center"},
];

const GFX_ELEMENT_IDS = ["team1-logo","team1-name","series-score","team2-logo","team2-name"];

(function buildRows(){
  const container = document.getElementById("rows");
  ROW_DEFS.forEach(row => {
    // The colored tag box at the very left of each row (PSD's "Layer 18",
    // team-color block) had nothing dynamic in it -- that's the box the
    // player's own uploaded photo (set in Team Setup, not a hero/agent
    // render -- Valorant has no fixed pick art) belongs in.
    const photo = document.createElement("img");
    photo.className = `row-photo ${row.team}`;
    photo.id = `p${row.n}-photo`;
    photo.style.left = (row.x + 1) + "px";
    photo.style.top = row.y + "px";
    photo.alt = "";
    container.appendChild(photo);
    GFX_ELEMENT_IDS.push(photo.id);

    COLS.forEach(col => {
      const el = document.createElement("div");
      el.className = `stat-cell ${col.cls}`;
      el.id = `p${row.n}-${col.key}`;
      el.style.left = (row.x + col.dx) + "px";
      el.style.top = (row.y + 8) + "px";
      el.style.width = col.w + "px";
      container.appendChild(el);
      GFX_ELEMENT_IDS.push(el.id);
    });
  });
})();

const _params = new URLSearchParams(location.search);
if (_params.get("relay")) { try { localStorage.setItem("moba_relay", _params.get("relay")); } catch(e) {} }
if (_params.get("token")) { try { localStorage.setItem("moba_token", _params.get("token")); } catch(e) {} }
const _relay = _params.get("relay") || localStorage.getItem("moba_relay") || "";
const _token = _params.get("token") || localStorage.getItem("moba_token") || "";
const WS_URL = _relay
  ? _relay + (_relay.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(_token) + "&page=valorant_teamchemistry"
  : "ws://localhost:8765?page=valorant_teamchemistry";
let ws;

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "state_sync") applyState(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

function setLogo(id, src){
  const el = document.getElementById(id);
  if(src){ el.src = src; el.style.display = "block"; }
  else { el.style.display = "none"; }
}

function kdRatio(kills, deaths){
  kills = Number(kills) || 0; deaths = Number(deaths) || 0;
  return (deaths > 0 ? kills / deaths : kills).toFixed(1);
}

function applyGraphicOverrides(overrides){
  GFX_ELEMENT_IDS.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const o = (overrides && overrides[id]) || {};
    const dx = o.dx || 0, dy = o.dy || 0, scale = o.scale || 1;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    el.style.transformOrigin = "top left";
  });
}

function applyState(state){
  document.getElementById("team1-name").textContent = state.team1.name || "";
  document.getElementById("team2-name").textContent = state.team2.name || "";
  setLogo("team1-logo", state.team1.logo);
  setLogo("team2-logo", state.team2.logo);
  document.getElementById("series-score").textContent =
    `${state.seriesScore.team1}-${state.seriesScore.team2}`;

  ROW_DEFS.forEach(row => {
    const players = (state.postMatch && state.postMatch.players && state.postMatch.players[row.team]) || [];
    const p = players[row.idx] || {};
    const nameSrc = (state[row.team] && state[row.team].players && state[row.team].players[row.idx]) || "";
    document.getElementById(`p${row.n}-name`).textContent = nameSrc;
    document.getElementById(`p${row.n}-kda`).textContent = `${p.kills||0}/${p.deaths||0}/${p.assists||0}`;
    document.getElementById(`p${row.n}-acs`).textContent = p.acs || 0;
    document.getElementById(`p${row.n}-kd`).textContent = kdRatio(p.kills, p.deaths);
    document.getElementById(`p${row.n}-fb`).textContent = p.firstBloods || 0;
    document.getElementById(`p${row.n}-plants`).textContent = p.plants || 0;

    setLogo(`p${row.n}-photo`, agentPortraitUrl(p.agent));
  });

  applyGraphicOverrides(state.graphicOverrides && state.graphicOverrides.teamchemistry);
}

connect();
</script>
</body>
</html>
